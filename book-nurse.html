<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book Nurse</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
import { getDatabase, ref as dbRef, set, push, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyYOUR_API_KEY_REPLACE_ME",
  authDomain: "love-care-global.firebaseapp.com",
  databaseURL: "https://love-care-global-default-rtdb.firebaseio.com",
  projectId: "love-care-global",
  storageBucket: "love-care-global.appspot.com",
  messagingSenderId: "123456789012",
  appId: "1:123456789012:web:abcdef123456"
};
const app = initializeApp(firebaseConfig);
const storage = getStorage(app);
const realtimeDB = getDatabase(app);
const firestore = getFirestore(app);
window.st=storage; window.db=realtimeDB; window.fs=firestore;

window.saveBooking=async function(booking, audioBlob){
  let audioUrl=null;
  if(audioBlob){
    let path=`bookings/${booking.id}/audio_${Date.now()}.webm`;
    let r=sRef(storage, path);
    await uploadBytes(r, audioBlob);
    audioUrl=await getDownloadURL(r);
    booking.audioUrl=audioUrl;
  }
  let mainRef=push(dbRef(realtimeDB, 'bookings'));
  await set(mainRef, {...booking, firebaseId:mainRef.key, audioUrl});
  await set(push(dbRef(realtimeDB, `nurse_bookings/${booking.nurseId}`)), {...booking, firebaseId:mainRef.key, audioUrl});
  await set(push(dbRef(realtimeDB, `client_bookings/${booking.clientId}`)), {...booking, firebaseId:mainRef.key, audioUrl});
  await setDoc(doc(firestore, 'bookings', mainRef.key), {...booking, firebaseId:mainRef.key, audioUrl, createdAt:serverTimestamp()});
  return mainRef.key;
}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#f8fafc}
.header{padding:12px;background:#111827;color:white;display:flex;justify-content:space-between}
.content{max-width:700px;margin:auto;padding:10px}
.card{background:white;border-radius:12px;padding:12px;border:1px solid #e5e7eb;margin-bottom:10px}
label{font-size:11px;font-weight:700;margin:6px 0 3px;display:block}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #d1d5db;font-size:12px}
.btn{width:100%;padding:12px;border-radius:10px;font-weight:800;border:none;cursor:pointer;margin-top:8px}
.btnBlue{background:#3b82f6;color:white}
.btnGreen{background:#16a34a;color:white}
.btnLight{background:#f3f4f6;border:1px solid #e5e7eb}
.map{width:100%;height:200px;background:#e0f2fe;border-radius:10px;border:1px solid #bae6fd;display:flex;align-items:center;justify-content:center;font-size:12px}
.nurseCard{border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin:6px 0;cursor:pointer}
.nurseCard.sel{border-color:#16a34a;background:#f0fdf4}
.blocker{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.98);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
</style>
</head>
<body>

<div id="loginBlocker" class="blocker">
<div style="background:white;border-radius:16px;padding:20px;max-width:360px;width:100%;text-align:center;border:2px solid #3b82f6">
<h2 style="color:#1d4ed8;font-size:18px">Must Register & Login Before Booking</h2>
<div style="margin-top:16px;display:grid;gap:8px">
<button class="btn btnBlue" onclick="location.href='client-registration.html'">Register as Client</button>
<button class="btn btnGreen" onclick="location.href='client-login.html'">Login as Client → Book</button>
<button class="btn btnLight" onclick="location.href='index.html'">Home</button>
</div>
</div>
</div>

<div class="header"><b>Book Nurse</b><button style="background:white;color:#111827;border:none;padding:6px 12px;border-radius:8px;font-weight:800" onclick="logout()">Logout</button></div>

<div class="content">

<div class="card">
<h3>Select Nurse From Map</h3>
<div class="map" id="mapArea">Map</div>
<button class="btn btnLight" onclick="loadNurses()">Load Nurses</button>
<div id="nurseList"></div>
<div id="selectedInfo" style="display:none;padding:8px;background:#f0fdf4;border-radius:8px;margin-top:8px;font-size:11px;border:1px solid #bbf7d0"></div>
</div>

<div class="card">
<label>Service Type</label><select id="serviceType"><option value="live-out">Live-out</option><option value="live-in">Live-in</option><option value="hourly">Hourly</option></select>
<label>Service</label><select id="service"><option>Elderly Care</option><option>Pediatric Care</option><option>Disability Care</option><option>General Nursing</option></select>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<div><label>Start Date</label><input type="date" id="sDate"></div>
<div><label>End Date</label><input type="date" id="eDate"></div>
</div>
</div>

<div class="card">
<label>Home Address</label><input id="address" placeholder="Home Address">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
<div><label>Lat</label><input id="lat" readonly></div>
<div><label>Lng</label><input id="lng" readonly></div>
</div>
<button class="btn btnLight" onclick="getGPS()">Use My GPS</button>
<div id="mapPreview" style="display:none;margin-top:8px"><iframe id="mapFrame" style="width:100%;height:160px;border:none;border-radius:8px"></iframe></div>
<label>Written Concerns</label><textarea id="written" rows="3"></textarea>
<label>Audio Concerns</label>
<div style="display:flex;gap:6px"><button class="btn btnLight" style="width:auto" id="recordBtn" onclick="toggleRecord()">Start Recording</button><span id="recordStatus" style="font-size:11px;padding:8px"></span></div>
<audio id="audioPlayer" controls style="width:100%;margin-top:6px;display:none"></audio>
</div>

<div class="card">
<button class="btn btnGreen" id="payBtn" onclick="pay()">Pay with Paystack</button>
</div>

</div>

<script>
let selNurse=null; let audioBlob=null; let mediaRecorder=null; let isRecording=false;

function checkLogin(){
  let id=localStorage.getItem('currentClientId');
  let blocker=document.getElementById('loginBlocker');
  if(!id){ blocker.style.display='flex'; return false; }
  blocker.style.display='none';
  return true;
}
function logout(){ localStorage.clear(); location.href='client-login.html'; }

function getGPS(){
  navigator.geolocation.getCurrentPosition((pos)=>{
    document.getElementById('lat').value=pos.coords.latitude;
    document.getElementById('lng').value=pos.coords.longitude;
    document.getElementById('mapPreview').style.display='block';
    document.getElementById('mapFrame').src=`https://maps.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}&z=15&output=embed`;
  });
}
function loadNurses(){
  let nurses=[
    {id:'1',name:'Grace Mensah',country:'GH',city:'Accra'},
    {id:'2',name:'Ngozi Okafor',country:'NG',city:'Lagos'},
    {id:'3',name:'Thandi Nkosi',country:'ZA',city:'Johannesburg'},
    {id:'4',name:'Sarah Johnson',country:'US',city:'New York'},
    {id:'5',name:'Emma Smith',country:'GB',city:'London'}
  ];
  let h=''; nurses.forEach(n=>{ h+=`<div class="nurseCard" id="nurse_${n.id}" onclick="selectNurse('${n.id}')"><b>${n.name} - ${n.country} - ${n.city}</b></div>`; });
  document.getElementById('nurseList').innerHTML=h;
  window.demoNurses=nurses;
}
function selectNurse(id){
  document.querySelectorAll('.nurseCard').forEach(c=>c.classList.remove('sel'));
  document.getElementById('nurse_'+id).classList.add('sel');
  selNurse=window.demoNurses.find(n=>n.id===id);
  let info=document.getElementById('selectedInfo');
  info.style.display='block'; info.innerHTML=`Selected: <b>${selNurse.name}</b>`;
}
function toggleRecord(){
  if(!isRecording){
    navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
      mediaRecorder=new MediaRecorder(stream); let chunks=[];
      mediaRecorder.ondataavailable=e=>chunks.push(e.data);
      mediaRecorder.onstop=()=>{ audioBlob=new Blob(chunks,{type:'audio/webm'}); let url=URL.createObjectURL(audioBlob); let p=document.getElementById('audioPlayer'); p.src=url; p.style.display='block'; document.getElementById('recordStatus').innerText='Recorded'; };
      mediaRecorder.start(); isRecording=true; document.getElementById('recordBtn').innerText='Stop';
    });
  }else{ mediaRecorder.stop(); isRecording=false; document.getElementById('recordBtn').innerText='Start Recording'; }
}
async function pay(){
  if(!checkLogin()){ location.href='client-registration.html'; return; }
  if(!selNurse){ alert('Select nurse'); return; }
  let sDate=document.getElementById('sDate').value; let eDate=document.getElementById('eDate').value;
  if(!sDate||!eDate){ alert('Select dates'); return; }
  let address=document.getElementById('address').value; let lat=document.getElementById('lat').value; let lng=document.getElementById('lng').value;
  if(!address||!lat||!lng){ alert('Address + GPS required'); return; }
  let booking={
    id:'BK'+Date.now(),
    clientId:localStorage.getItem('currentClientId'),
    clientName:localStorage.getItem('currentClientName'),
    clientEmail:localStorage.getItem('currentClientEmail'),
    clientCountry:localStorage.getItem('currentClientCountry')||'GH',
    nurseId:selNurse.id, nurseName:selNurse.name,
    service:document.getElementById('service').value,
    serviceType:document.getElementById('serviceType').value,
    sDate, eDate, address, lat:parseFloat(lat), lng:parseFloat(lng),
    written:document.getElementById('written').value,
    status:'PAID', nurseStatus:'NEW',
    timestamp:new Date().toISOString()
  };
  let handler=PaystackPop.setup({
    key:'pk_live_f17ae09b07fba36d1d6d565d0d5d0d7e6cddaa0e8',
    email:booking.clientEmail,
    amount:76000,
    currency:'GHS',
    ref:'BK'+Date.now(),
    callback: async function(res){
      booking.payRef=res.reference;
      try{
        await window.saveBooking(booking, audioBlob);
        alert('Payment success - Booking saved');
        location.href='client-bookings.html';
      }catch(e){ alert('Save failed: '+e.message); }
    },
    onClose:function(){ alert('Payment closed'); }
  });
  handler.openIframe();
}
window.addEventListener('DOMContentLoaded', ()=>{ checkLogin(); loadNurses(); getGPS(); });
</script>
</body>
</html>
