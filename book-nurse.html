<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book a Nurse - LOVE CARE GLOBAL HOME NURSING</title>
<style>body{font-family:Inter,sans-serif;margin:0;background:#f8f9ff}.header{background:linear-gradient(90deg,#16a34a,#7c3aed);color:white;padding:14px;position:sticky;top:0;display:flex;justify-content:space-between}.container{max-width:600px;margin:0 auto;padding:16px}.card{background:white;padding:20px;border-radius:16px;border:1px solid #e5e7eb;margin:12px 0}input,select,textarea{width:100%;padding:12px;margin:6px 0;border:2px solid #e5e7eb;border-radius:10px;box-sizing:border-box}.btn{width:100%;padding:14px;background:linear-gradient(90deg,#16a34a,#7c3aed);color:white;border:none;border-radius:10px;font-weight:900;cursor:pointer}a{color:#7c3aed;font-weight:800}</style>
</head>
<body>
<div class="header"><strong>Book a Nurse - LOVE CARE GLOBAL HOME NURSING</strong><a href="index.html" style="color:white">Home</a></div>
<div class="container">
<div class="card">
<h2>Book Verified Nurse</h2>
<select id="service"><option>Elderly Care</option><option>Post-Surgery Care</option><option>Baby & Mother Care</option><option>Disability Support</option><option>Wound Dressing</option><option>Injection Service</option></select>
<input type="text" id="loc" placeholder="Your Location">
<input type="date" id="date"><input type="time" id="time">
<textarea id="notes" placeholder="Describe care needed..."></textarea>
<button class="btn" onclick="book()">Confirm Booking</button>
<p style="text-align:center"><a href="client-dashboard.html">Dashboard</a> | <a href="my-bookings.html">My Bookings</a></p>
<p style="font-size:11px;text-align:center;color:#666">Official: https://asaberepeter204.github.io/LOVE-CARE-GLOBAL-HOME-NURSING-/</p>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
const app=initializeApp({databaseURL:"https://love-care-global-default-rtdb.firebaseio.com"}); const db=getDatabase(app);
window.book=async function(){
 const phone=localStorage.getItem('clientPhone')||prompt('Enter your phone');
 const data={service:document.getElementById('service').value,location:document.getElementById('loc').value,date:document.getElementById('date').value,time:document.getElementById('time').value,notes:document.getElementById('notes').value,clientPhone:phone,status:'pending',created:Date.now()};
 await push(ref(db,'bookings'),data);
 alert('Booking sent!'); window.location.href='my-bookings.html';
}
</script>
</body>
</html>
