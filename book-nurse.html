<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book Nurse - Fixed One Login</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-storage.js";
import { getDatabase, ref as dbRef, set, push } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",
  authDomain: "web-care-618e8.firebaseapp.com",
  databaseURL: "https://web-care-618e8-default-rtdb.firebaseio.com",
  projectId: "web-care-618e8",
  storageBucket: "web-care-618e8.firebasestorage.app",
  messagingSenderId: "1062578660694",
  appId: "1:1062578660694:web:f94dfe12c929df05bce2f7"
};
const app = initializeApp(firebaseConfig);
const storage = getStorage(app);
const realtimeDB = getDatabase(app);
const firestore = getFirestore(app);

window.saveBooking=async function(booking, audioBlob){
  let audioUrl=null;
  if(audioBlob){
    let r=sRef(storage, `bookings/${booking.id}/audio_${Date.now()}.webm`);
    await uploadBytes(r, audioBlob);
    audioUrl=await getDownloadURL(r);
    booking.audioUrl=audioUrl;
  }
  let mainRef=push(dbRef(realtimeDB, 'bookings'));
  await set(mainRef, {...booking, firebaseId:mainRef.key, audioUrl});
  await set(push(dbRef(realtimeDB, `nurse_bookings/${booking.nurseId}`)), {...booking, firebaseId:mainRef.key, audioUrl});
  await set(push(dbRef(realtimeDB, `client_bookings/${booking.clientId}`)), {...booking, firebaseId:mainRef.key, audioUrl});
  await setDoc(doc(firestore, 'bookings', mainRef.key), {...booking, firebaseId:mainRef.key, audioUrl, createdAt:serverTimestamp()});
  return mainRef.key;
}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#f8fafc}
.header{padding:12px;background:#111827;color:white;display:flex;justify-content:space-between}
.content{max-width:700px;margin:auto;padding:10px}
.card{background:white;border-radius:12px;padding:12px;border:1px solid #e5e7eb;margin-bottom:10px}
label{font-size:11px;font-weight:700;margin:6px 0 3px;display:block}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #d1d5db;font-size:12px}
.btn{width:100%;padding:12px;border-radius:10px;font-weight:800;border:none;cursor:pointer;margin-top:8px}
.btnBlue{background:#3b82f6;color:white}.btnGreen{background:#16a34a;color:white}.btnLight{background:#f3f4f6;border:1px solid #e5e7eb}
.nurseCard{border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin:6px 0;cursor:pointer}
.nurseCard.sel{border-color:#16a34a;background:#f0fdf4}
.blocker{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.98);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
</style>
</head>
<body>
<div id="loginBlocker" class="blocker" style="display:none">
<div style="background:white;border-radius:16px;padding:20px;max-width:360px;width:100%;text-align:center;border:2px solid #3b82f6">
<h2 style="color:#1d4ed8">Login Required</h2>
<div style="margin-top:16px;display:grid;gap:8px">
<button class="btn btnBlue" onclick="location.href='client-registration.html'">Register as Client</button>
<button class="btn btnGreen" onclick="location.href='client-login.html'">Login as Client → Book</button>
<button class="btn btnLight" onclick="location.href='index.html'">Home</button>
</div>
</div>
</div>

<div class="header"><b>Book Nurse - Client Access</b><div><span id="clientBadge" style="font-size:11px;margin-right:8px"></span><button style="background:white;color:#111827;border:none;padding:6px 12px;border-radius:8px;font-weight:800" onclick="logout()">Logout</button></div></div>

<div class="content" id="mainContent">
<div class="card" id="welcomeCard" style="display:none;background:#f0fdf4;border-color:#bbf7d0"><div id="welcomeText" style="font-size:12px;font-weight:700;color:#15803d"></div></div>

<div class="card">
<h3>Select Nurse</h3>
<button class="btn btnLight" onclick="loadNurses()">Load Nurses</button>
<div id="nurseList"></div>
<div id="selectedInfo" style="display:none;padding:8px;background:#f0fdf4;border-radius:8px;margin-top:8px;font-size:11px"></div>
</div>

<div class="card">
<label>Service Type</label><select id="serviceType"><option value="live-out">Live-out</option><option value="live-in">Live-in</option><option value="hourly">Hourly</option></select>
<label>Service</label><select id="service"><option>Elderly Care</option><option>Pediatric Care</option><option>Disability Care</option><option>General Nursing</option></select>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>Start Date</label><input type="date" id="sDate"></div><div><label>End Date</label><input type="date" id="eDate"></div></div>
</div>

<div class="card">
<label>Home Address</label><input id="address" placeholder="Home Address">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div><label>Lat</label><input id="lat" readonly></div><div><label>Lng</label><input id="lng" readonly></div></div>
<button class="btn btnLight" onclick="getGPS()">Use My GPS</button>
<div id="mapPreview" style="display:none;margin-top:8px"><iframe id="mapFrame" style="width:100%;height:160px;border:none;border-radius:8px"></iframe></div>
<label>Written Concerns</label><textarea id="written" rows="3"></textarea>
<label>Audio</label><div style="display:flex;gap:6px"><button class="btn btnLight" style="width:auto" id="recordBtn" onclick="toggleRecord()">Start Recording</button><span id="recordStatus" style="font-size:11px;padding:8px"></span></div>
<audio id="audioPlayer" controls style="width:100%;margin-top:6px;display:none"></audio>
</div>

<div class="card"><button class="btn btnGreen" onclick="pay()">Pay with Paystack</button></div>
</div>

<script>
let selNurse=null, audioBlob=null, mediaRecorder=null, isRecording=false, currentClient=null;

function getClientSession(){
  const oldId = localStorage.getItem('currentClientId');
  const newUid = localStorage.getItem('lcg_client_uid');
  const newLogged = localStorage.getItem('lcg_logged_in');
  const newRole = localStorage.getItem('lcg_role');
  const email = localStorage.getItem('currentClientEmail') || localStorage.getItem('lcg_client_email') || '';
  const name = localStorage.getItem('currentClientName') || email.split('@')[0] || 'Client';
  if(newLogged==='true' && newRole==='client' && newUid){ return {id:newUid,email,name,country:'GH'}; }
  if(oldId){ return {id:oldId,email,name,country:'GH'}; }
  return null;
}
function checkLogin(){
  const session = getClientSession();
  const blocker = document.getElementById('loginBlocker');
  const main = document.getElementById('mainContent');
  if(!session){ blocker.style.display='flex'; main.style.display='none'; return false; }
  blocker.style.display='none'; main.style.display='block';
  currentClient=session;
  document.getElementById('welcomeCard').style.display='block';
  document.getElementById('welcomeText').textContent=`✅ Logged in as ${session.name} (${session.email}) - You can now book`;
  document.getElementById('clientBadge').textContent=session.name;
  localStorage.setItem('currentClientId',session.id);
  return true;
}
function logout(){ localStorage.clear(); location.href='client-login.html'; }
function getGPS(){ navigator.geolocation.getCurrentPosition(pos=>{ document.getElementById('lat').value=pos.coords.latitude; document.getElementById('lng').value=pos.coords.longitude; document.getElementById('mapPreview').style.display='block'; document.getElementById('mapFrame').src=`https://maps.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}&z=15&output=embed`; }); }
function loadNurses(){ let nurses=[{id:'1',name:'Grace Mensah',country:'GH',city:'Accra'},{id:'2',name:'Ngozi Okafor',country:'NG',city:'Lagos'},{id:'3',name:'Thandi Nkosi',country:'ZA',city:'Johannesburg'}]; let h=''; nurses.forEach(n=>{ h+=`<div class="nurseCard" id="nurse_${n.id}" onclick="selectNurse('${n.id}')"><b>${n.name} - ${n.country} - ${n.city}</b></div>`; }); document.getElementById('nurseList').innerHTML=h; window.demoNurses=nurses; }
function selectNurse(id){ document.querySelectorAll('.nurseCard').forEach(c=>c.classList.remove('sel')); document.getElementById('nurse_'+id).classList.add('sel'); selNurse=window.demoNurses.find(n=>n.id===id); let info=document.getElementById('selectedInfo'); info.style.display='block'; info.innerHTML=`Selected: <b>${selNurse.name}</b>`; }
function toggleRecord(){
  if(!isRecording){ navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{ mediaRecorder=new MediaRecorder(stream); let chunks=[]; mediaRecorder.ondataavailable=e=>chunks.push(e.data); mediaRecorder.onstop=()=>{ audioBlob=new Blob(chunks,{type:'audio/webm'}); let url=URL.createObjectURL(audioBlob); let p=document.getElementById('audioPlayer'); p.src=url; p.style.display='block'; document.getElementById('recordStatus').innerText='Recorded ✅'; }; mediaRecorder.start(); isRecording=true; document.getElementById('recordBtn').innerText='Stop'; }); }
  else{ mediaRecorder.stop(); isRecording=false; document.getElementById('recordBtn').innerText='Start Recording'; }
}
async function pay(){
  if(!checkLogin()){ location.href='client-login.html'; return; }
  if(!selNurse){ alert('Select nurse'); return; }
  let sDate=document.getElementById('sDate').value, eDate=document.getElementById('eDate').value;
  if(!sDate||!eDate){ alert('Select dates'); return; }
  let address=document.getElementById('address').value, lat=document.getElementById('lat').value, lng=document.getElementById('lng').value;
  if(!address||!lat||!lng){ alert('Address + GPS required'); return; }
  let booking={ id:'BK'+Date.now(), clientId:currentClient.id, clientName:currentClient.name, clientEmail:currentClient.email, clientCountry:'GH', nurseId:selNurse.id, nurseName:selNurse.name, service:document.getElementById('service').value, serviceType:document.getElementById('serviceType').value, sDate, eDate, address, lat:parseFloat(lat), lng:parseFloat(lng), written:document.getElementById('written').value, status:'PAID', nurseStatus:'NEW', timestamp:new Date().toISOString() };
  let handler=PaystackPop.setup({ key:'pk_live_f17ae09b07fba36d1d6d565d0d5d0d7e6cddaa0e8', email:booking.clientEmail, amount:76000, currency:'GHS', ref:'BK'+Date.now(), callback: async function(res){ booking.payRef=res.reference; try{ await window.saveBooking(booking, audioBlob); alert('Payment success'); location.href='client-bookings.html'; }catch(e){ alert('Save failed: '+e.message); } }, onClose:function(){ alert('Payment closed'); } }); handler.openIframe();
}
window.addEventListener('DOMContentLoaded', ()=>{ checkLogin(); loadNurses(); });
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",
  authDomain: "web-care-618e8.firebaseapp.com",
  databaseURL: "https://web-care-618e8-default-rtdb.firebaseio.com",
  projectId: "web-care-618e8",
  storageBucket: "web-care-618e8.firebasestorage.app",
  messagingSenderId: "1062578660694",
  appId: "1:1062578660694:web:f94dfe12c929df05bce2f7"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
onAuthStateChanged(auth, async(user)=>{
  if(!user) return;
  if(localStorage.getItem('lcg_logged_in')==='true') return;
  try{
    const snap = await getDoc(doc(db,'clients', user.uid));
    if(snap.exists()){
      localStorage.setItem('lcg_client_uid', user.uid);
      localStorage.setItem('lcg_client_email', user.email);
      localStorage.setItem('lcg_client_name', snap.data().fullName || user.email);
      localStorage.setItem('lcg_role', 'client');
      localStorage.setItem('lcg_logged_in', 'true');
      localStorage.setItem('lcg_login_time', Date.now().toString());
      localStorage.setItem('currentClientId', user.uid);
      localStorage.setItem('currentClientEmail', user.email);
      document.getElementById('loginBlocker').style.display='none';
      document.getElementById('mainContent').style.display='block';
      document.getElementById('welcomeCard').style.display='block';
      document.getElementById('welcomeText').textContent=`✅ Auto-logged in as ${user.email}`;
    }
  }catch(e){ console.log(e); }
});
</script>
</body>
</html>
