<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book Nurse - LOVE CARE GLOBAL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#f8fafc;color:#111;padding-bottom:30px}
.header{position:sticky;top:0;z-index:1000;background:linear-gradient(90deg,#16a34a,#eab308);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;border-radius:16px;padding:14px;margin:10px 12px;border:2px solid #e5e7eb;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.btnSmall{padding:12px 14px;border:none;border-radius:12px;font-weight:900;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.step{display:none}.step.active{display:block}
.menuOverlay{position:fixed;top:0;left:-100%;width:290px;height:100%;background:#fff;z-index:3000;transition:.35s;overflow:auto}.menuOverlay.open{left:0}.menuBg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:2999;display:none}.menuBg.show{display:block}
.serviceBtn{padding:10px;border:2px solid #e5e7eb;border-radius:12px;background:#fff;cursor:pointer;font-size:12px;font-weight:700;text-align:left}.serviceBtn.selected{border-color:#16a34a;background:#f0fdf4}
input,select,textarea{width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:10px;margin:6px 0;font-size:13px}
</style>
</head>
<body>

<div class="header">
<div style="display:flex;align-items:center;gap:8px">
<button class="btnSmall" style="background:#facc15;color:#111;font-size:20px" onclick="toggleMenu()">☰</button>
<div style="font-weight:900;font-size:13px;line-height:1.1">BOOK NURSE<br><span style="background:white;color:#16a34a;padding:2px 8px;border-radius:20px;font-size:10px">13 SERVICES</span></div>
</div>
<div style="display:flex;gap:6px">
<a href="index.html" class="btnSmall" style="background:white;color:#16a34a">🏠 Home</a>
<a href="sos.html" class="btnSmall" style="background:#ef4444;color:white">SOS</a>
</div>
</div>

<!-- ✅ SELECTED NURSE FROM MAP - FIXED, 1 LINE ONLY -->
<div id="selectedNurseTopDisplay" style="display:none;background:#f0fdf4;border:3px solid #16a34a;padding:12px;border-radius:12px;margin:10px 12px;box-shadow:0 4px 12px rgba(22,163,74,.2)"></div>

<div id="menuBg" class="menuBg" onclick="toggleMenu()"></div>
<div id="menuOverlay" class="menuOverlay">
<div style="padding:14px">
<h3>LOVE CARE GLOBAL</h3>
<button class="btnSmall" style="background:#f0fdf4;width:100%;margin:4px 0;border:2px solid #16a34a;justify-content:flex-start" onclick="window.location.href='./index.html'">🏠 Home</button>
<button class="btnSmall" style="background:#eff6ff;width:100%;margin:4px 0;border:2px solid #2563eb;justify-content:flex-start" onclick="window.location.href='./book-nurse.html'">📅 Book Nurse</button>
<button class="btnSmall" style="background:#fef2f2;width:100%;margin:4px 0;border:2px solid #ef4444;justify-content:flex-start" onclick="window.location.href='./sos.html'">🚨 SOS</button>
<button class="btnSmall" style="background:#f9fafb;width:100%;margin:4px 0;justify-content:flex-start" onclick="window.location.href='./contact.html'">💬 Contact Support</button>
<button onclick="toggleMenu()" class="btnSmall" style="width:100%;background:#6b7280;color:white;margin-top:10px">✕ Close</button>
</div>
</div>

<!-- STEPS -->
<div class="card">
<div style="display:flex;justify-content:space-between;font-size:11px;font-weight:900">
<span id="s1" style="color:#16a34a">● Step 1 Service</span><span id="s2" style="color:#999">○ Step 2 Details</span><span id="s3" style="color:#999">○ Step 3 Confirm</span>
</div>
</div>

<!-- STEP 1 -->
<div id="step1" class="step active">
<div class="card" style="border-left:4px solid #16a34a">
<h3 style="font-size:14px">Step 1: Choose Service (13 Services)</h3>
<p style="font-size:11px;color:#6b7280">Select one service you need</p>
<div id="servicesGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"></div>
<button class="btnSmall" style="background:#16a34a;color:white;width:100%;margin-top:12px;padding:14px" onclick="nextStep(2)">Continue →</button>
</div>
</div>

<!-- STEP 2 -->
<div id="step2" class="step">
<div class="card" style="border-left:4px solid #2563eb">
<h3 style="font-size:14px">Step 2: Booking Details</h3>
<label style="font-size:11px;font-weight:800">Client Full Name</label>
<input id="clientName" placeholder="John Doe">
<label style="font-size:11px;font-weight:800">Phone (Login Phone)</label>
<input id="clientPhone" placeholder="0544121814">
<label style="font-size:11px;font-weight:800">Service Date</label>
<input id="serviceDate" type="date">
<label style="font-size:11px;font-weight:800">Service Time</label>
<input id="serviceTime" type="time">
<label style="font-size:11px;font-weight:800">Duration</label>
<select id="duration"><option value="1">1 Hour</option><option value="2">2 Hours</option><option value="4">4 Hours</option><option value="8">8 Hours (Day)</option><option value="12">12 Hours</option><option value="24">24 Hours (Full Day)</option></select>
<label style="font-size:11px;font-weight:800">Patient Condition / Notes</label>
<textarea id="notes" placeholder="Elderly care, diabetes, needs wheelchair support..."></textarea>
<label style="font-size:11px;font-weight:800">Your Location (Auto GPS)</label>
<div style="display:flex;gap:6px">
<input id="locationText" placeholder="Accra, Ghana - GPS will auto fill" readonly>
<button class="btnSmall" style="background:#16a34a;color:white" onclick="getGPS()">📍 GPS</button>
</div>
<p id="gpsStatus2" style="font-size:10px;color:#16a34a;margin-top:4px">Tap GPS to auto fill</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
<button class="btnSmall" style="background:#e5e7eb" onclick="nextStep(1)">← Back</button>
<button class="btnSmall" style="background:#2563eb;color:white" onclick="nextStep(3)">Continue →</button>
</div>
</div>
</div>

<!-- STEP 3 -->
<div id="step3" class="step">
<div class="card" style="border-left:4px solid #eab308">
<h3 style="font-size:14px">Step 3: Confirm & Book</h3>
<div id="summaryBox" style="background:#f8fafc;padding:12px;border-radius:12px;font-size:12px;line-height:1.6;margin-top:8px"></div>
<button class="btnSmall" style="background:#16a34a;color:white;width:100%;margin-top:12px;padding:14px;font-size:14px" onclick="confirmBooking()">✅ Confirm Booking - Pay on Arrival</button>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
<button class="btnSmall" style="background:#e5e7eb" onclick="nextStep(2)">← Back</button>
<button class="btnSmall" style="background:#ef4444;color:white" onclick="window.location.href='./index.html'">Cancel</button>
</div>
</div>
</div>

<script>
let selectedService=null, clientLat=5.6037, clientLng=-0.1870, selectedNurseFromMap=null;

// SHOW SELECTED NURSE FROM MAP - TOP
window.addEventListener('DOMContentLoaded',()=>{
  selectedNurseFromMap=JSON.parse(localStorage.getItem('selectedNurseForBooking')||'null');
  const d=document.getElementById('selectedNurseTopDisplay');
  if(selectedNurseFromMap && d){
    d.style.display='block';
    d.innerHTML=`<div style="display:flex;gap:10px;align-items:center">
      <div style="font-size:28px;background:white;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center">${selectedNurseFromMap.photo||'👩‍⚕️'}</div>
      <div style="flex:1">
        <div style="font-weight:900;font-size:13px;color:#16a34a">✅ Selected Nurse from Map - ${selectedNurseFromMap.name} ✅</div>
        <div style="font-size:11px">${selectedNurseFromMap.specialty} • ⭐${selectedNurseFromMap.rating} • 📍 ${selectedNurseFromMap.distance.toFixed(1)}km away</div>
        <div style="font-size:10px;color:#6b7280">License: ${selectedNurseFromMap.license} • ${selectedNurseFromMap.hourly} GHS/hr • <a href="https://www.google.com/maps?q=${selectedNurseFromMap.lat},${selectedNurseFromMap.lng}" target="_blank" style="color:#16a34a">View on Map</a></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
      <button class="btnSmall" style="background:#16a34a;color:white;padding:12px">✅ Proceed to Book ${selectedNurseFromMap.name}</button>
      <button class="btnSmall" style="background:#ef4444;color:white;padding:12px" onclick="localStorage.removeItem('selectedNurseForBooking');document.getElementById('selectedNurseTopDisplay').style.display='none';selectedNurseFromMap=null;">❌ Reject / Choose Another</button>
    </div>`;
  }
});

const services=["Elderly Care","Post-Surgery Care","Baby / Nanny Care","Physiotherapy","Diabetes Care","Hypertension Care","Wound Dressing","Injection / IV","Maternity Care","Palliative Care","Companion Care","Lab Sample Collection","General Nursing"];
function loadServices(){
  const grid=document.getElementById('servicesGrid');
  grid.innerHTML=services.map(s=>`<button class="serviceBtn" onclick="selectService(this,'${s}')">${s}</button>`).join('');
}
function selectService(el,name){
  document.querySelectorAll('.serviceBtn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');selectedService=name;
}
function toggleMenu(){document.getElementById('menuOverlay').classList.toggle('open');document.getElementById('menuBg').classList.toggle('show')}
function nextStep(n){
  if(n===2 && !selectedService){alert('Please select a service first');return;}
  if(n===3){
    const name=document.getElementById('clientName').value, phone=document.getElementById('clientPhone').value, date=document.getElementById('serviceDate').value;
    if(!name||!phone||!date){alert('Fill Name, Phone, Date');return;}
  }
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
  document.getElementById('step'+n).classList.add('active');
  document.getElementById('s1').style.color=n>=1?'#16a34a':'#999';
  document.getElementById('s2').style.color=n>=2?'#16a34a':'#999';
  document.getElementById('s3').style.color=n>=3?'#16a34a':'#999';
  if(n===3){buildSummary();}
}
function buildSummary(){
  const nursePart=selectedNurseFromMap?`<b>Selected Nurse from Map:</b> ${selectedNurseFromMap.name} - ${selectedNurseFromMap.specialty} - ⭐${selectedNurseFromMap.rating} - ${selectedNurseFromMap.distance.toFixed(1)}km - ${selectedNurseFromMap.hourly} GHS/hr<br>`:`<b>Nurse:</b> Auto-assign nearest online nurse<br>`;
  document.getElementById('summaryBox').innerHTML=`
  ${nursePart}
  <b>Service:</b> ${selectedService}<br>
  <b>Client:</b> ${document.getElementById('clientName').value} - ${document.getElementById('clientPhone').value}<br>
  <b>Date:</b> ${document.getElementById('serviceDate').value} ${document.getElementById('serviceTime').value}<br>
  <b>Duration:</b> ${document.getElementById('duration').value} hours<br>
  <b>Location:</b> ${document.getElementById('locationText').value||clientLat.toFixed(5)+','+clientLng.toFixed(5)}<br>
  <b>Notes:</b> ${document.getElementById('notes').value||'None'}<br><br>
  <span style="color:#16a34a;font-weight:900">Pay on arrival - Cash / MoMo</span>
  `;
}
function getGPS(){
  const st=document.getElementById('gpsStatus2');
  st.innerText='📍 Getting GPS...';
  if(!navigator.geolocation){st.innerText='GPS not supported';return;}
  navigator.geolocation.getCurrentPosition(p=>{
    clientLat=p.coords.latitude;clientLng=p.coords.longitude;
    document.getElementById('locationText').value=`${clientLat.toFixed(5)}, ${clientLng.toFixed(5)} - Accra, Ghana`;
    st.innerText=`✅ GPS Locked: ${clientLat.toFixed(5)}, ${clientLng.toFixed(5)}`;
  },()=>{st.innerText='❌ GPS denied - type manually';document.getElementById('locationText').readOnly=false;},{enableHighAccuracy:true,timeout:8000});
}
function confirmBooking(){
  const bookings=JSON.parse(localStorage.getItem('loveCareBookings')||'[]');
  bookings.push({
    id:'BK'+Date.now(),service:selectedService,name:document.getElementById('clientName').value,
    phone:document.getElementById('clientPhone').value,date:document.getElementById('serviceDate').value,
    time:document.getElementById('serviceTime').value,duration:document.getElementById('duration').value,
    location:document.getElementById('locationText').value||clientLat+','+clientLng,
    lat:clientLat,lng:clientLng,notes:document.getElementById('notes').value,
    nurse:selectedNurseFromMap||null,status:'Pending',created:new Date().toISOString()
  });
  localStorage.setItem('loveCareBookings',JSON.stringify(bookings));
  localStorage.removeItem('selectedNurseForBooking');
  alert('✅ Booking Confirmed! Nurse will contact you soon. Check My Bookings');
  window.location.href='./my-bookings.html';
}
loadServices();
</script>
</body>
</html>
