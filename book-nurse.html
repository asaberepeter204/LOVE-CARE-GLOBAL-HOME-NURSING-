<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book Nurse — Full Payment — MAP + PAYSTACK FIXED</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:sans-serif;background:#0e0a1c;color:#e8e0ff;padding:0}
.topbar{background:#1c1238;padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #a855f7}
.card{background:#21144a;margin:12px;border-radius:16px;padding:16px;border:1px solid #a855f733}
.btnYellow{padding:10px 18px;border-radius:999px;background:#facc15;color:#1e0a3a;font-weight:900;text-decoration:none;display:inline-block}
.btnPay{width:100%;padding:18px;border-radius:14px;border:none;background:linear-gradient(135deg,#a855f7,#d8b4fe);color:#1e0a3a;font-weight:900;font-size:16px;cursor:pointer;margin-top:12px}
.mapWrap{width:100%;height:350px;background:#111;border-radius:12px;overflow:hidden;margin-top:10px;border:1px solid #a855f7}
#map{width:100%;height:100%}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #a855f744;background:#0e0a1c;color:white;margin-top:6px}
label{font-size:10px;color:#c4b5fd;font-weight:800;margin-top:10px;display:block}
</style>
</head>
<body>
<div class="topbar">
<div><b>BOOK NURSE — FULL PAYMENT</b><br><small style="color:#4ade80">✅ Map + Paystack Fixed</small></div>
<div style="display:flex;gap:8px">
<a href="book-nurse-50-percent.html" class="btnYellow">📦 50% Page →</a>
<a href="index.html" style="color:white;text-decoration:none;font-size:12px">Home</a>
</div>
</div>

<div class="card">
<h3>📍 STEP 1: Map — Tap nurse to select</h3>
<div class="mapWrap"><div id="map"></div></div>
<div id="nurseGrid" style="margin-top:10px"></div>
<div id="selectedNurseInfo" style="margin-top:10px;padding:10px;background:#0e0a1c;border-radius:10px">No nurse selected — Click a nurse below</div>
</div>

<div class="card">
<h3>⏱️ STEP 2: Booking</h3>
<label>Start</label><input id="startTime" type="time" value="08:00" onchange="calc()">
<label>End</label><input id="endTime" type="time" value="17:00" onchange="calc()">
<label>Transport</label><input id="transport" type="number" value="100" oninput="calc()">
<label>Client Name</label><input id="clientFullName" value="ASABERE PETER">
<label>Phone</label><input id="clientPhone" value="+233544121814">
<div id="calcDisplay" style="margin-top:10px;font-size:12px;color:#a78bfa"></div>
<div id="totalDisplay" style="margin-top:10px;padding:12px;background:#a855f7;color:white;border-radius:10px;font-weight:900;text-align:center;font-size:20px">GHS 190.00</div>

<button id="paystackBtn" class="btnPay" onclick="payWithPaystack()">💳 Paystack Full — GHS 190.00 — Tap to Pay with Paystack</button>
<div id="bookResult" style="margin-top:10px"></div>
<small style="color:#4ade80">Live Key: pk_live_f17ae09bf...747b — Allow popups</small>
</div>

<script>
// --- CONFIG ---
const PAYSTACK_KEY='pk_live_f17ae09bf855010825cbfccdda8e724553ab747b';
let selectedNurseId='demo1', selectedNurseName='Ama Osei';
let map, hourlyRate=10;

function calc(){
  const s=document.getElementById('startTime').value, e=document.getElementById('endTime').value;
  const sh=parseInt(s.split(':')[0]), sm=parseInt(s.split(':')[1]||0);
  const eh=parseInt(e.split(':')[0]), em=parseInt(e.split(':')[1]||0);
  let sd=sh*60+sm, ed=eh*60+em, d=ed-sd; if(d<=0) d+=1440;
  const hrs=d/60, transport=parseFloat(document.getElementById('transport').value)||0;
  const total=hrs*10+transport;
  document.getElementById('totalDisplay').textContent='GHS '+total.toFixed(2);
  document.getElementById('paystackBtn').textContent='💳 Paystack Full — GHS '+total.toFixed(2)+' — Tap to Pay with Paystack';
  document.getElementById('calcDisplay').innerHTML=hrs.toFixed(1)+' hrs/day × GHS 10 + Transport '+transport+' = GHS '+total.toFixed(2);
  return total;
}

function payWithPaystack(){
  alert('Button clicked! Opening Paystack...');
  const total=calc();
  const result=document.getElementById('bookResult');

  if(typeof PaystackPop==='undefined'){
    result.innerHTML='<b style="color:red">❌ Paystack script blocked — Disable adblocker, check internet</b>';
    alert('Paystack script not loaded — https://js.paystack.co/v1/inline.js blocked. Disable adblocker.');
    return;
  }

  result.innerHTML='✅ Opening Paystack popup...';

  try{
    var handler=PaystackPop.setup({
      key: PAYSTACK_KEY,
      email: 'lovecareglobal@gmail.com',
      amount: Math.round(total*100),
      currency: 'GHS',
      ref: 'LCG-'+Date.now(),
      callback: function(res){
        alert('Payment success! Ref: '+res.reference);
        result.innerHTML='✅ Success! Ref: '+res.reference;
      },
      onClose: function(){
        result.innerHTML='⚠️ Closed — Tap again';
      }
    });
    handler.openIframe();
  }catch(err){
    alert('Error: '+err.message);
    result.innerHTML='❌ '+err.message;
  }
}

function initMap(){
  try{
    if(typeof L==='undefined'){
      document.getElementById('map').innerHTML='<div style="padding:40px;text-align:center;color:red">❌ Leaflet not loaded — Check internet / Disable adblocker<br>https://unpkg.com/leaflet</div>';
      return;
    }
    map=L.map('map').setView([5.6037,-0.1870],13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(map);

    // Add blinking demo nurses
    const nurses=[
      {id:'demo1',name:'Ama Osei',lat:5.61,lng:-0.19},
      {id:'demo2',name:'Grace Mensah',lat:5.605,lng:-0.185},
      {id:'demo3',name:'Osei Yaw',lat:5.608,lng:-0.192}
    ];
    let html='';
    nurses.forEach(n=>{
      const m=L.marker([n.lat,n.lng]).addTo(map).bindPopup('<b>'+n.name+'</b><br><button onclick="selectNurse(\''+n.id+'\',\''+n.name+'\')">Select</button>');
      html+='<div onclick="selectNurse(\''+n.id+'\',\''+n.name+'\')" style="padding:10px;background:#0e0a1c;border:1px solid #a855f744;border-radius:10px;margin-bottom:8px;cursor:pointer"><b>'+n.name+'</b> — Tap to select — Will show on map</div>';
    });
    document.getElementById('nurseGrid').innerHTML=html;
    selectNurse('demo1','Ama Osei');
  }catch(e){
    document.getElementById('map').innerHTML='Map error: '+e.message;
  }
}

function selectNurse(id,name){
  selectedNurseId=id; selectedNurseName=name;
  document.getElementById('selectedNurseInfo').innerHTML='✅ Selected: <b>'+name+'</b> — Ready for Paystack';
}

window.onload=function(){
  calc();
  initMap();
  console.log('✅ Page loaded — Paystack key:',PAYSTACK_KEY);
  console.log('PaystackPop:',typeof PaystackPop);
  console.log('Leaflet L:',typeof L);
};
</script>
</body>
</html>
