<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEO Force Wipe Email — Fix Nurse/Client Loop</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>body{font-family:Inter,sans-serif;background:#0e0a1c;color:#fff;padding:20px} .card{background:#1a1633;border:1px solid rgba(168,85,247,.2);border-radius:18px;padding:20px;max-width:600px;margin:0 auto} input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(168,85,247,.3);background:rgba(14,10,28,.6);color:#fff;margin:10px 0} button{width:100%;padding:14px;border-radius:12px;border:none;font-weight:900;cursor:pointer;margin-top:10px} .delete{background:linear-gradient(135deg,#ef4444,#7f1d1d);color:#fff} .log{background:rgba(14,10,28,.8);border-radius:12px;padding:12px;margin-top:14px;max-height:300px;overflow:auto;font-size:11px;white-space:pre-wrap}</style>
</head><body>
<div class="card">
<h2>🗑️ CEO Force Wipe Email — Fix Loop</h2>
<p style="color:#a78bfa;font-size:12px;margin-top:8px">Enter email that says "You are nurse go to client / you are client go to nurse" — This wipes from ALL 25 paths + Firestore + localStorage — Then you can register as NEW</p>
<input id="email" placeholder="Enter email to wipe e.g., you@gmail.com">
<button class="delete" onclick="forceWipe()">🔥 WIPE FROM ALL PATHS FOREVER</button>
<div id="log" class="log">Logs will appear here...</div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database(); const fs=firebase.firestore();
function log(m){ document.getElementById('log').textContent+=m+'\n'; console.log(m); }

async function forceWipe(){
  const emailRaw=document.getElementById('email').value.trim().toLowerCase();
  if(!emailRaw) return alert('Enter email');
  if(!confirm(`WIPE ${emailRaw} FROM ALL PATHS? This makes it NEW email!`)) return;
  if(prompt('Type DELETE to confirm')!=='DELETE') return;
  log(`Starting wipe for ${emailRaw}...`);
  const rtPaths=['nurses','clients','users','googleClients','googleUsers','clientUsers','nurseUsers','client_registrations','nurse_registrations','clientRegistrations','nurseRegistrations','allClients','allNurses','pendingClientRegistrations','pendingNurseRegistrations','pendingNurses','pending_nurses','verifiedNurses','verified_nurses','blockedClients','blockedNurses','blockedUsers','suspendedClients','suspendedNurses','authUsers','clientsGoogle','googleLogins','clientGoogleLogins','googleSignInClients','nurseApplications','ceoRegistrationCenter'];
  for(const p of rtPaths){
    try{
      const snap=await db.ref(p).once('value');
      let c=0;
      snap.forEach(ch=>{
        const v=ch.val()||{}; const real=v.profile||v.data||v.clientData||v||{};
        const em=(real.email||real.clientEmail||v.email||'').toLowerCase();
        if(em===emailRaw){
          db.ref(p+'/'+ch.key).remove(); c++; log(`Removed RT ${p}/${ch.key}`);
        }
      });
      if(c===0) log(`No match in ${p}`);
    }catch(e){ log(`Error ${p}: ${e.message}`); }
  }
  // Firestore
  for(const col of ['users','clients','nurses','googleClients']){
    try{
      const q=await fs.collection(col).where('email','==',emailRaw).get();
      const batch=fs.batch(); q.forEach(d=>batch.delete(d.ref)); await batch.commit();
      log(`Wiped Firestore ${col}: ${q.size} docs`);
    }catch(e){ log(`FS ${col} error: ${e.message}`); }
  }
  // Clear browser storage
  localStorage.clear(); sessionStorage.clear();
  log('Cleared localStorage + sessionStorage');
  log(`✅ DONE! ${emailRaw} is now NEW email — Go register!`);
  alert(`✅ ${emailRaw} wiped! Now you can register as new!`);
}
</script></body></html>
