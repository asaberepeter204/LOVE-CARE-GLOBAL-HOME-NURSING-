<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nurses Group Chat - Nurses CEO Staff Only</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:#f3f4f6;min-height:100vh;display:flex;flex-direction:column}
.top{background:linear-gradient(90deg,#7c3aed,#16a34a);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
#chat{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px;background:#f8fafc;min-height:300px}
.msg{max-width:85%;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid #e5e7eb;font-size:13px;position:relative}
.msg.me{align-self:flex-end;background:#dcfce7;border-color:#bbf7d0}
.msg.ceo{border-color:#fde68a;background:#fefce8}
.msg.blocked{opacity:0.5}
.meta{font-size:10px;color:#6b7280;font-weight:800;margin-bottom:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{padding:2px 6px;border-radius:999px;font-size:9px;font-weight:900}
.badge-ceo{background:#fde68a;color:#92400e}.badge-nurse{background:#ede9fe;color:#5b21b6}.badge-staff{background:#dbeafe;color:#1e40af}.badge-blocked{background:#fee2e2;color:#dc2626}
.actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.actBtn{font-size:10px;font-weight:800;padding:4px 8px;border-radius:999px;border:1px solid #e5e7eb;background:#f9fafb;cursor:pointer}
.actBtn.del{color:#dc2626}.actBtn.edit{color:#2563eb}.actBtn.block{color:#fff;background:#ef4444;border-color:#ef4444}
.bar{background:#fff;border-top:1px solid #e5e7eb;padding:8px;display:flex;gap:4px;align-items:center;position:sticky;bottom:0}
.bar input{flex:1;min-width:60px;padding:10px 12px;border-radius:999px;border:1.5px solid #e5e7eb;outline:none}
.btn{width:38px;height:38px;border-radius:50%;border:none;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center}
.send{background:linear-gradient(135deg,#16a34a,#7c3aed);color:#fff}.media{background:#eff6ff;border:1px solid #e5e7eb}.cvBtn{background:#fef3c7;border:1px solid #fde68a}.micBtn{background:#f9fafb;border:1px solid #e5e7eb}.micBtn.rec{background:#fee2e2;animation:pulse 1s infinite}@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.ceoPanel{background:#fefce8;border:1px solid #fde68a;padding:8px 12px;display:none;gap:8px;align-items:center;flex-wrap:wrap}
.ceoPanel.show{display:flex}
.login{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;padding:20px;border-radius:16px;border:1px solid #e5e7eb;max-width:380px;width:100%;text-align:center}
.alert{padding:10px;border-radius:10px;font-size:12px;font-weight:700;margin:8px;background:#fef2f2;border:1px solid #fecaca;color:#dc2626;display:block}
img.chatImg{max-width:180px;border-radius:10px;margin-top:6px;cursor:pointer}video.chatVid{max-width:220px;border-radius:10px;margin-top:6px}.fileBox{margin-top:6px;padding:8px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;display:flex;gap:8px;align-items:center}.progress{height:5px;background:#e5e7eb;border-radius:999px;display:none}.progressBar{height:100%;background:linear-gradient(90deg,#7c3aed,#16a34a);width:0%}
</style>
</head>
<body>
<div class="top"><b>🔐 NURSES GROUP CHAT - CEO/STAFF/NURSES ONLY</b><div><button onclick="location.href='index.html'" style="padding:6px 10px;border-radius:999px;border:none;font-weight:900">🏠</button> <button onclick="location.reload()" style="padding:6px 10px;border-radius:999px;border:none">↻</button></div></div>

<div id="ceoPanel" class="ceoPanel">
<span style="font-weight:900;font-size:12px;color:#92400e">👑 CEO MASTER:</span>
<button onclick="ceoWipeAll()" style="padding:8px 12px;border-radius:10px;background:#dc2626;color:#fff;border:none;font-weight:900;font-size:11px;cursor:pointer">🗑️ WIPE ALL CHAT</button>
<button onclick="showBlocked()" style="padding:8px 12px;border-radius:10px;background:#f3f4f6;border:1px solid #e5e7eb;font-weight:900;font-size:11px;cursor:pointer">🚫 Blocked List</button>
<span id="userBadge" style="font-size:11px;font-weight:800;color:#6b7280;margin-left:auto"></span>
</div>

<div id="status"></div>
<div id="chat"><div id="loading" style="text-align:center;color:#9ca3af;padding:20px">Checking credentials...</div></div>

<div id="loginWall" class="login" style="display:none">
<div class="card">
<div style="font-size:40px">🔐</div>
<h3>Nurses • CEO • Staff Only</h3>
<p style="font-size:12px;color:#6b7280;margin:8px 0">Clients are NOT allowed. Login with nurse/staff credentials.</p>
<div id="loginErr"></div>
<button style="background:#7c3aed;color:#fff;width:100%;padding:12px;border-radius:10px;border:none;font-weight:900;margin-top:8px;cursor:pointer" onclick="location.href='nurse-login.html'">👩‍⚕️ Nurse/Staff Login</button>
<button style="background:#facc15;width:100%;padding:12px;border-radius:10px;border:none;font-weight:900;margin-top:8px;cursor:pointer" onclick="ceoLogin()">👑 CEO Login</button>
<button style="background:#f9fafb;border:1px solid #e5e7eb;width:100%;padding:12px;border-radius:10px;font-weight:900;margin-top:8px;cursor:pointer" onclick="location.href='index.html'">Home</button>
</div>
</div>

<div class="bar" id="inputBar" style="display:none">
<button class="btn media" onclick="photoIn.click()" title="Photo">📷</button>
<button class="btn media" onclick="videoIn.click()" title="Video">🎥</button>
<button class="btn cvBtn" onclick="cvIn.click()" title="CV">📄</button>
<button class="btn micBtn" id="micBtn" onclick="toggleVoice()" title="Voice">🎤</button>
<input type="file" id="photoIn" accept="image/*" style="display:none" onchange="uploadFile(this,'photo')">
<input type="file" id="videoIn" accept="video/*" style="display:none" onchange="uploadFile(this,'video')">
<input type="file" id="cvIn" accept=".pdf,.doc,.docx,.txt" style="display:none" onchange="uploadFile(this,'cv')">
<input id="msgInput" placeholder="Write message..." onkeypress="if(event.key==='Enter') sendText()">
<button class="btn send" onclick="sendText()">➤</button>
</div>
<div id="progressWrap" class="progress"><div id="progressBar" class="progressBar"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
import { getDatabase, ref, push, onChildAdded, onChildChanged, onChildRemoved, get, remove, update } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
import { getStorage, ref as sRef, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-storage.js";

const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);const db=getDatabase(app);const fs=getFirestore(app);const storage=getStorage(app);const provider=new GoogleAuthProvider();

const CEO_EMAILS=['lovecareglobal@gmail.com','ceo@lovecareglobal.com','asaberepeter204@gmail.com','asaberepeter204@lovecareglobal.com','lovecareglobalhome@gmail.com'];
let curUser=null,curRole=null,blockedUsers=[],mediaRecorder=null,audioChunks=[],isRecording=false;

onAuthStateChanged(auth, async(user)=>{
  const login=document.getElementById('loginWall');const bar=document.getElementById('inputBar');const ceoPanel=document.getElementById('ceoPanel');
  const chatBox=document.getElementById('chat');
  if(!user){
    document.getElementById('loading').textContent='Not logged in';
    login.style.display='flex';bar.style.display='none';ceoPanel.classList.remove('show');
    chatBox.innerHTML='<div style="text-align:center;color:#9ca3af;padding:20px">Please login with nurse/staff credentials</div>';
    return;
  }
  const email=(user.email||'').toLowerCase();

  // STEP 1: CEO check - always allow
  if(CEO_EMAILS.includes(email)){
    curUser={id:user.uid,name:user.displayName||'CEO',email:email,role:'ceo'};
    curRole='ceo';
    login.style.display='none';bar.style.display='flex';ceoPanel.classList.add('show');
    document.getElementById('userBadge').textContent=`👑 ${curUser.name} - CEO`;
    startChat();return;
  }

  // STEP 2: Block clients - check clients collection
  try{
    const clientSnap=await getDoc(doc(fs,'clients',user.uid));
    if(clientSnap.exists()){
      login.style.display='flex';bar.style.display='none';ceoPanel.classList.remove('show');
      document.getElementById('loginErr').innerHTML=`<div class=alert>❌ ACCESS DENIED - Clients not allowed in nurses group chat.<br>Your account ${email} is a CLIENT account.<br>Only Nurses, Staff and CEO allowed.</div>`;
      chatBox.innerHTML='';
      return;
    }
  }catch(e){}

  // STEP 3: Check nurse or staff
  try{
    let snap=await getDoc(doc(fs,'nurses',user.uid));
    let roleFound=null;let data=null;
    if(snap.exists()){roleFound='nurse';data=snap.data();}
    else{
      snap=await getDoc(doc(fs,'staff',user.uid));
      if(snap.exists()){roleFound='staff';data=snap.data();}
      else{
        snap=await getDoc(doc(fs,'users',user.uid));
        if(snap.exists() && (snap.data().role==='nurse' || snap.data().role==='staff')){
          roleFound=snap.data().role;data=snap.data();
        }
      }
    }

    if(!roleFound){
      login.style.display='flex';bar.style.display='none';
      document.getElementById('loginErr').innerHTML=`<div class=alert>❌ ACCESS DENIED<br>${email} is not registered as Nurse/Staff.<br>Please register as nurse or contact CEO.</div>`;
      chatBox.innerHTML='';return;
    }

    if(data.disabled){
      document.getElementById('loginErr').innerHTML=`<div class=alert>🚫 Account disabled by CEO.</div>`;
      login.style.display='flex';return;
    }

    curUser={id:user.uid,name:data.fullName||data.displayName||user.displayName||roleFound,email:email,role:roleFound};
    curRole=roleFound;
    login.style.display='none';bar.style.display='flex';ceoPanel.classList.remove('show');
    document.getElementById('userBadge').textContent=`${roleFound==='nurse'?'👩‍⚕️':'👨‍💼'} ${curUser.name}`;
    if(data.verificationStatus && data.verificationStatus!=='verified'){
      document.getElementById('status').innerHTML=`<div class=alert style="background:#fffbeb;border-color:#fde68a;color:#92400e">⚠️ Pending verification - you can chat</div>`;
    }
    startChat();
  }catch(e){
    document.getElementById('status').innerHTML=`<div class=alert>Error checking credentials: ${e.message}</div>`;
  }
});

window.ceoLogin=async()=>{try{await signInWithPopup(auth,provider);}catch(e){document.getElementById('loginErr').innerHTML=`<div class=alert>${e.message}</div>`;}}

function startChat(){
  const chatRef=ref(db,'nurses_group_chat/messages');
  const chatBox=document.getElementById('chat');
  chatBox.innerHTML='<div id="loading" style="text-align:center;color:#9ca3af;padding:10px">Loading secure chat...<br>Only Nurses CEO Staff</div>';

  get(ref(db,'nurses_group_chat/blocked_users')).then(s=>{if(s.exists()) blockedUsers=Object.values(s.val()).map(b=>b.userId);}).catch(()=>{});

  onChildAdded(chatRef, s=>{
    const el=document.getElementById('loading');if(el) el.remove();
    renderMsg(s.key,s.val());
  });

  onChildChanged(chatRef, s=>{
    const el=document.getElementById('msg_'+s.key);if(el) el.remove();
    renderMsg(s.key,s.val());
  });

  onChildRemoved(chatRef, s=>{
    const el=document.getElementById('msg_'+s.key);if(el) el.remove();
  });
}

function renderMsg(id,d){
  if(!d) return;
  if(blockedUsers.includes(d.userId) && curRole!=='ceo') return;
  const chatBox=document.getElementById('chat');
  const isMe=d.userId===curUser.id;
  const isBlocked=blockedUsers.includes(d.userId);
  const div=document.createElement('div');
  div.id='msg_'+id;
  div.className='msg '+(isMe?'me':'')+' '+d.role+(isBlocked?' blocked':'');

  let roleBadge=d.role==='ceo'?'<span class="badge badge-ceo">👑 CEO</span>':d.role==='staff'?'<span class="badge badge-staff">STAFF</span>':'<span class="badge badge-nurse">NURSE</span>';
  if(isBlocked) roleBadge+=`<span class="badge badge-blocked">BLOCKED</span>`;
  if(d.edited) roleBadge+=`<span style="font-size:9px;color:#9ca3af">(edited)</span>`;

  let media='';
  if(d.mediaURL){
    if(d.type==='photo') media=`<img class=chatImg src="${d.mediaURL}" onclick="window.open(this.src,'_blank')">`;
    else if(d.type==='video') media=`<video class=chatVid src="${d.mediaURL}" controls></video>`;
    else if(d.type==='cv') media=`<div class=fileBox><div>📄</div><div style="flex:1;font-size:12px;font-weight:800">${d.fileName}<br><small>${d.fileSize||''}</small></div><a href="${d.mediaURL}" target="_blank" style="padding:6px 10px;background:#16a34a;color:#fff;border-radius:8px;text-decoration:none;font-size:11px">Open</a></div>`;
    else if(d.type==='audio') media=`<audio controls style="width:100%;max-width:220px;margin-top:6px"><source src="${d.mediaURL}"></audio>`;
  }

  let actions='';
  if(isMe){
    actions=`<div class=actions>${d.type==='text'?`<button class=actBtn edit onclick="editMsg('${id}')">✏️ Edit</button>`:''}<button class=actBtn del onclick="deleteMsg('${id}')">🗑️ Delete</button></div>`;
  } else if(curRole==='ceo'){
    actions=`<div class=actions><button class=actBtn del onclick="deleteMsg('${id}')">🗑️ Delete</button><button class=actBtn block onclick="toggleBlock('${d.userId}','${d.userName.replace(/'/g,'')}')">${isBlocked?'✅ Unblock':'🚫 Block'}</button></div>`;
  }

  div.innerHTML=`<div class=meta><span style="font-weight:900">${d.userName}</span>${roleBadge}<span>${new Date(d.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div>${media}<div>${(d.text||'').replace(/</g,'&lt;')}</div>${actions}<div id="editArea_${id}" style="display:none"></div>`;
  chatBox.appendChild(div);chatBox.scrollTop=chatBox.scrollHeight;
}

window.sendText=async()=>{
  const input=document.getElementById('msgInput');const text=input.value.trim();
  if(!text||!curUser) return;
  if(blockedUsers.includes(curUser.id)){alert('🚫 You are blocked by CEO. Contact CEO to unblock.');return;}
  await push(ref(db,'nurses_group_chat/messages'),{userId:curUser.id,userName:curUser.name,userEmail:curUser.email,role:curRole,timestamp:Date.now(),type:'text',text:text});
  input.value='';
}

window.uploadFile=async(input,type)=>{
  const file=input.files[0];if(!file||!curUser) return;
  if(blockedUsers.includes(curUser.id)){alert('🚫 You are blocked.');return;}
  if(file.size>50*1024*1024){alert('Max 50MB');return;}
  const status=document.getElementById('status');const wrap=document.getElementById('progressWrap');const bar=document.getElementById('progressBar');
  wrap.style.display='block';status.innerHTML=`<div class=alert style="background:#eff6ff;border-color:#bfdbfe;color:#1e40af">Uploading ${file.name}...</div>`;
  try{
    const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const path=`group_chat/${type}/${Date.now()}_${safe}`;
    const storageRef=sRef(storage,path);
    const { ref: storageRef2, uploadBytesResumable: up, getDownloadURL: getUrl } = await import("https://www.gstatic.com/firebasejs/10.12.3/firebase-storage.js");
    // Use already imported
    const task=uploadBytesResumable(storageRef,file);
    task.on('state_changed', snap=>{bar.style.width=Math.round(snap.bytesTransferred/snap.totalBytes*100)+'%';});
    await task;const url=await getDownloadURL(storageRef);
    await push(ref(db,'nurses_group_chat/messages'),{userId:curUser.id,userName:curUser.name,userEmail:curUser.email,role:curRole,timestamp:Date.now(),type:type,mediaURL:url,fileName:file.name,fileSize:(file.size/1024/1024).toFixed(2)+'MB',text:document.getElementById('msgInput').value||`${type}: ${file.name}`});
    document.getElementById('msgInput').value='';status.innerHTML=`<div class=alert style="background:#f0fdf4;border-color:#bbf7d0;color:#15803d">✅ Uploaded!</div>`;setTimeout(()=>{status.innerHTML='';wrap.style.display='none';bar.style.width='0%';},3000);
  }catch(e){status.innerHTML=`<div class=alert>❌ ${e.message}</div>`;wrap.style.display='none';}
  input.value='';
}

window.editMsg=function(id){
  const cur=document.querySelector('#msg_'+id+' div:last-child')?.innerText||'';
  const area=document.getElementById('editArea_'+id);
  area.style.display='block';
  area.innerHTML=`<textarea id="editInput_${id}" style="width:100%;padding:8px;border-radius:10px;border:1.5px solid #7c3aed;margin-top:6px">${cur}</textarea><br><button onclick="saveEdit('${id}')" style="margin-top:6px;padding:6px 12px;border-radius:8px;background:#16a34a;color:#fff;border:none;font-weight:800">Save</button><button onclick="cancelEdit('${id}')" style="margin-left:6px;padding:6px 12px;border-radius:8px;background:#6b7280;color:#fff;border:none">Cancel</button>`;
}
window.cancelEdit=function(id){document.getElementById('editArea_'+id).style.display='none';}
window.saveEdit=function(id){
  const t=document.getElementById('editInput_'+id).value.trim();if(!t) return;
  update(ref(db,'nurses_group_chat/messages/'+id),{text:t,edited:true,editedAt:Date.now()});
  document.getElementById('editArea_'+id).style.display='none';
}
window.deleteMsg=function(id){
  if(!confirm('Delete this message?')) return;
  // Only allow delete own or CEO can delete any
  const el=document.getElementById('msg_'+id);
  remove(ref(db,'nurses_group_chat/messages/'+id));
}

window.toggleVoice=async()=>{
  const btn=document.getElementById('micBtn');
  if(!isRecording){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder=new MediaRecorder(stream);audioChunks=[];
      mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
      mediaRecorder.onstop=async()=>{
        const blob=new Blob(audioChunks,{type:'audio/webm'});
        if(blockedUsers.includes(curUser.id)){alert('You are blocked');return;}
        const wrap=document.getElementById('progressWrap');const bar=document.getElementById('progressBar');const status=document.getElementById('status');
        wrap.style.display='block';status.innerHTML=`<div class=alert style="background:#eff6ff;border-color:#bfdbfe;color:#1e40af">Uploading voice...</div>`;
        try{
          const path=`group_chat/audio/${Date.now()}_voice.webm`;
          const storageRef=sRef(storage,path);
          const task=uploadBytesResumable(storageRef,blob);
          task.on('state_changed', s=>{bar.style.width=Math.round(s.bytesTransferred/s.totalBytes*100)+'%';});
          await task;const url=await getDownloadURL(storageRef);
          await push(ref(db,'nurses_group_chat/messages'),{userId:curUser.id,userName:curUser.name,userEmail:curUser.email,role:curRole,timestamp:Date.now(),type:'audio',mediaURL:url,text:''});
          status.innerHTML='';wrap.style.display='none';bar.style.width='0%';
        }catch(e){status.innerHTML=`<div class=alert>Voice failed: ${e.message}</div>`;wrap.style.display='none';}
      };
      mediaRecorder.start();isRecording=true;btn.classList.add('rec');btn.textContent='⏹️';
      setTimeout(()=>{if(isRecording) toggleVoice();},120000);
    }catch(e){alert('Mic denied: '+e.message);}
  }else{mediaRecorder.stop();isRecording=false;btn.classList.remove('rec');btn.textContent='🎤';}
}

window.ceoWipeAll=function(){
  if(curRole!=='ceo'){alert('Only CEO can wipe');return;}
  const email=prompt('Enter CEO email to confirm WIPE ALL (lovecareglobal@gmail.com):');
  if(!email||!CEO_EMAILS.includes(email.toLowerCase())){alert('❌ Unauthorized');return;}
  const reason=prompt('Reason for wipe? (min 5 chars)');if(!reason||reason.length<5){alert('Reason required');return;}
  if(!confirm('FINAL CONFIRM: DELETE ALL MESSAGES FOREVER?\nReason: '+reason)) return;
  remove(ref(db,'nurses_group_chat/messages')).then(()=>{
    alert('✅ All messages wiped by CEO');
    push(ref(db,'nurses_group_chat/logs'),{action:'WIPE_ALL',by:curUser.name,email:email,reason:reason,timestamp:Date.now()});
  });
}

window.toggleBlock=function(userId,userName){
  if(curRole!=='ceo'){alert('Only CEO');return;}
  const isBlocked=blockedUsers.includes(userId);
  if(isBlocked){
    if(!confirm('Unblock '+userName+'? They will be able to chat again.')) return;
    get(ref(db,'nurses_group_chat/blocked_users')).then(s=>{
      if(s.exists()){
        for(const k in s.val()){if(s.val()[k].userId===userId) remove(ref(db,'nurses_group_chat/blocked_users/'+k));}
        blockedUsers=blockedUsers.filter(u=>u!==userId);
        alert('✅ Unblocked '+userName);
        location.reload();
      }
    });
  }else{
    const reason=prompt('Block '+userName+'? Reason for blocking:');if(!reason) return;
    push(ref(db,'nurses_group_chat/blocked_users'),{userId:userId,userName:userName,reason:reason,blockedBy:curUser.name,timestamp:Date.now()});
    blockedUsers.push(userId);
    alert('🚫 Blocked '+userName+' - They can no longer chat until unblocked');
  }
}

window.showBlocked=function(){
  get(ref(db,'nurses_group_chat/blocked_users')).then(s=>{
    if(!s.exists()){alert('No blocked users');return;}
    let list=Object.values(s.val()).map(b=>`• ${b.userName} - Reason: ${b.reason} (by ${b.blockedBy})`).join('\n');
    alert('🚫 Blocked Users:\n\n'+list);
  });
}
</script>
</body>
</html>
