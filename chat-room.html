<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEO Control Chat - LOVE CARE GLOBAL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0e0a1c;color:#e8e0ff;min-height:100vh}
.topbar{position:sticky;top:0;z-index:50;background:rgba(14,10,28,.95);border-bottom:1px solid rgba(168,85,247,.15);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.badge{padding:6px 10px;border-radius:99px;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.2);font-size:11px;font-weight:700}
.badge.google{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.2);color:#86efac}
.badge.time{background:rgba(250,204,21,.12);border-color:rgba(250,204,21,.25);color:#facc15}
.badge.client{background:rgba(168,85,247,.2);color:#d8b4fe}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.search{width:100%;padding:12px 16px;border-radius:12px;border:1px solid rgba(168,85,247,.15);background:rgba(28,18,56,.8);color:#fff;margin-bottom:12px;outline:none}
.client-card{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid rgba(168,85,247,.1);border-radius:14px;margin-bottom:10px;background:rgba(28,18,56,.6);cursor:pointer}
.avatar{width:48px;height:48px;border-radius:50%;background:#3b0f6e;display:grid;place-items:center;font-weight:800;flex-shrink:0;overflow:hidden}
.info{flex:1;min-width:0}.name{font-weight:800;font-size:14px}.email{font-size:12px;color:#a78bfa;word-break:break-all}.phone{font-size:11px;color:#9a95b8}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e1a3a;border:1px solid rgba(168,85,247,.2);padding:10px 16px;border-radius:99px;font-size:12px;z-index:9999;display:none}.toast.show{display:block}
</style>
</head>
<body>
<div class="topbar"><div style="font-weight:800">CEO Control Chat</div><div style="display:flex;gap:8px"><button onclick="loadAll()" style="padding:8px 12px;border-radius:99px;border:1px solid rgba(168,85,247,.2);background:rgba(168,85,247,.12);color:#d8b4fe;cursor:pointer;font-size:11px"> Refresh</button><button onclick="clearDuplicates()" style="padding:8px 12px;border-radius:99px;border:1px solid rgba(239,68,68,.2);background:rgba(239,68,68,.12);color:#fca5a5;cursor:pointer;font-size:11px"> Clean Dupes</button></div></div>
<div class="wrap"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><span class="badge" id="counts">Loading...</span><span class="badge" id="c_all">All: 0</span><span class="badge client" id="c_clients">Clients: 0</span><span class="badge google" id="c_google">Google: 0</span><span class="badge" id="c_nurses" style="background:rgba(59,130,246,.15);color:#93c5fd">Nurses: 0</span></div><input id="searchInput" class="search" placeholder="Search by name, email, phone..." oninput="renderList()"><div id="clientList"></div></div>
<div id="toast" class="toast"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();const dbFS=firebase.firestore();let allChats=[];
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
function formatActionTime(ts){if(!ts)return'time unknown';let date;if(typeof ts==='number'){date=new Date(ts);}else if(typeof ts==='string'){date=new Date(ts);if(isNaN(date.getTime())){const n=parseInt(ts);if(!isNaN(n))date=new Date(n);}}else if(ts&&ts.seconds){date=new Date(ts.seconds*1000);}else if(ts&&ts._seconds){date=new Date(ts._seconds*1000);}else return'time unknown';if(!date||isNaN(date.getTime()))return'time unknown';const now=new Date();const diffMs=now-date;const diffMins=Math.floor(diffMs/60000);const diffHours=Math.floor(diffMins/60);const diffDays=Math.floor(diffHours/24);const timeStr=date.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});const dateStr=date.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});const shortDate=date.toLocaleDateString('en-US',{month:'short',day:'numeric'});if(diffMins<1)return`Just now • ${timeStr}`;if(diffMins<60)return`${diffMins}m ago • ${timeStr} today`;if(diffHours<24)return`${diffHours}h ago • ${timeStr} today`;if(diffDays===1)return`Yesterday • ${timeStr}`;if(diffDays<7)return`${diffDays}d ago • ${shortDate} ${timeStr}`;return`${dateStr} • ${timeStr}`;}
function getTimestamp(v){if(!v)return 0;const candidates=[v.updatedAt,v.lastUpdate,v.lastLogin,v.lastLoginAt,v.lastSignInTime,v.createdAt,v.timestamp,v.registeredAt,v.time,v.date,v.created,v.metadata?.lastSignInTime,v.metadata?.creationTime];let max=0;for(let c of candidates){if(!c)continue;let ms=0;if(typeof c==='number'){ms=c;}else if(typeof c==='string'){const d=new Date(c);if(!isNaN(d.getTime()))ms=d.getTime();else{const n=parseInt(c);if(!isNaN(n))ms=n;}}else if(c.seconds){ms=c.seconds*1000;}else if(c._seconds){ms=c._seconds*1000;}if(ms>max)max=ms;}return max;}
function extractName(v){return(v.name||v.fullName||v.displayName||v.clientName||v.userName||'').trim()||(v.email?v.email.split('@')[0]:'Unknown');}
async function loadAll(){toast('Loading CEO chats — Deduplicating + Time...');const clientPaths=['clients','clientUsers','users','clientRegistrations','googleClients','clientGoogleLogins','authUsers','clientsGoogle','usersGoogle','clientAuthUsers','googleAuthClients','clientsByGoogle','googleSignInClients','clientGoogleUsers','allClients','ceoClientUpdates','client_registrations','pendingClientRegistrations','ceoBookingReceiverClients','googleUsers','googleLogins'];const nursePaths=['nurses','nurseUsers','allNurses','nurse_registrations','pendingNurseRegistrations'];let clientMapByEmail={};let nurseMap={};for(const p of clientPaths){try{const snap=await db.ref(p).once('value');if(snap.exists()){snap.forEach(ch=>{const id=ch.key;const v=ch.val();if(!v||typeof v!=='object')return;if(v.services||v.qualification||v.role==='nurse')return;const email=(v.email||v.clientEmail||v.userEmail||'').toLowerCase().trim();if(!email||email.indexOf('@')===-1)return;if(email.includes('anonymous')||email.includes('test@')||email.includes('no email'))return;const existing=clientMapByEmail[email];const newTs=getTimestamp(v);const oldTs=existing?getTimestamp(existing):0;if(!existing||newTs>=oldTs){if(existing){clientMapByEmail[email]={...existing,...v,_id:id,_path:p,_ts:Math.max(newTs,oldTs)};const oldPhone=existing.phone||existing.phoneNumber||'';const newPhone=v.phone||v.phoneNumber||'';if((!oldPhone||oldPhone==='no phone')&&newPhone&&newPhone!=='no phone'){clientMapByEmail[email].phone=newPhone;}}else{clientMapByEmail[email]={...v,_id:id,_path:p,_ts:newTs};}}});}}catch(e){}}for(const p of nursePaths){try{const snap=await db.ref(p).once('value');if(snap.exists()){snap.forEach(ch=>{const v=ch.val();if(!v||typeof v!=='object')return;const email=(v.email||v.nurseEmail||'').toLowerCase().trim();if(!email||email.indexOf('@')===-1)return;nurseMap[email]=v;});}}catch(e){}}try{const fsClients=await dbFS.collection('clients').get();fsClients.forEach(doc=>{const v=doc.data()||{};const email=(v.email||'').toLowerCase().trim();if(!email||email.indexOf('@')===-1)return;const ts=getTimestamp(v);if(!clientMapByEmail[email]||ts>getTimestamp(clientMapByEmail[email])){clientMapByEmail[email]={...v,_id:doc.id,_path:'firestore/clients',_ts:ts};}});}catch(e){}let chats=[];Object.values(clientMapByEmail).forEach(v=>{const name=extractName(v);if(!name||name.toLowerCase().includes('anonymous'))return;const email=v.email||v.clientEmail||'';if(!email)return;const isGoogle=v.provider==='google'||v.isGoogle===true||v.googleLogin===true||email.toLowerCase().includes('gmail.com')||v.photoURL?.includes('google');const phone=v.phone||v.phoneNumber||v.phone_number||'no phone';const photo=v.photo||v.photoURL||v.profilePhoto||'';const ts=v._ts||getTimestamp(v)||Date.now();const timeDisplay=formatActionTime(ts);const lastAction=v.lastAction||v.action||(isGoogle?'Google Login':'Registered');chats.push({id:v._id||email,type:'client',name,email,phone,photo,isGoogle,raw:v,updatedAt:ts,timeDisplay,lastAction,source:v._path||'clients'});});Object.values(nurseMap).forEach(v=>{const name=extractName(v);const email=v.email||'';const phone=v.phone||v.phoneNumber||'no phone';const ts=getTimestamp(v);chats.push({id:v._id||email,type:'nurse',name,email,phone,photo:v.photo||'',isGoogle:false,raw:v,updatedAt:ts,timeDisplay:formatActionTime(ts),lastAction:'Nurse',source:'nurses'});});chats.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));allChats=chats;const clientCount=chats.filter(c=>c.type==='client').length;const googleCount=chats.filter(c=>c.isGoogle).length;const nurseCount=chats.filter(c=>c.type==='nurse').length;document.getElementById('counts').textContent=`${clientCount} clients (${googleCount} Google) + ${nurseCount} nurses • Sorted by time`;document.getElementById('c_all').textContent=`All: ${chats.length}`;document.getElementById('c_clients').textContent=`Clients: ${clientCount}`;document.getElementById('c_google').textContent=`Google: ${googleCount}`;document.getElementById('c_nurses').textContent=`Nurses: ${nurseCount}`;renderList();toast(` Loaded ${chats.length} chats — DEDUPED + TIME`);}
function renderList(){const q=(document.getElementById('searchInput').value||'').toLowerCase().trim();const list=document.getElementById('clientList');let filtered=allChats;if(q){filtered=allChats.filter(c=>c.name.toLowerCase().includes(q)||c.email.toLowerCase().includes(q)||c.phone.toLowerCase().includes(q));}if(filtered.length===0){list.innerHTML=`<div style="text-align:center;padding:40px;color:#9a95b8">No clients found</div>`;return;}list.innerHTML=filtered.map(item=>{const initial=item.name?item.name[0].toUpperCase():'?';const googleBadge=item.isGoogle?`<span class="badge google">G Google Login — ${item.name}</span>`:'';const typeBadge=item.type==='client'?`<span class="badge client">Client</span>`:`<span class="badge" style="background:rgba(59,130,246,.15);color:#93c5fd">Nurse</span>`;const timeBadge=item.timeDisplay?`<span class="badge time"> ${item.timeDisplay}</span>`:'';const sourceBadge=`<span class="badge" style="background:rgba(255,255,255,.05);color:#6b7280">${item.source}</span>`;const actionBadge=`<span class="badge" style="background:rgba(250,204,21,.08);color:#facc15"> ${item.lastAction}</span>`;const avatarContent=item.photo?`<img src="${item.photo}" style="width:100%;height:100%;object-fit:cover" alt="">`:initial;return`<div class="client-card"><div class="avatar">${avatarContent}</div><div class="info"><div class="name">${item.name.toUpperCase()}</div><div class="email">${item.email}</div><div class="phone">${item.phone}</div><div class="meta">${typeBadge} ${googleBadge} ${timeBadge} ${actionBadge} ${sourceBadge}</div><div style="font-size:10px;color:#6b7280;margin-top:6px">Updated: ${item.timeDisplay} • ID: ${item.id.substring(0,12)}...</div></div></div>`;}).join('');}
async function clearDuplicates(){if(!confirm('Clean duplicate no-email entries?'))return;toast('Cleaning...');let deleted=0;const paths=['clients','clientUsers','clientRegistrations','googleClients'];for(const p of paths){try{const snap=await db.ref(p).once('value');if(snap.exists()){snap.forEach(ch=>{const v=ch.val();if(!v||typeof v!=='object')return;const email=(v.email||v.clientEmail||'').toLowerCase().trim();if(!email||email.indexOf('@')===-1||email.includes('no email')||email.includes('anonymous')){db.ref(p+'/'+ch.key).remove();deleted++;}});}}catch(e){}}toast(` Cleaned ${deleted} invalid entries`);setTimeout(loadAll,1000);}
document.addEventListener('DOMContentLoaded',loadAll);
</script>
</body>
</html>
