<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Job Offers</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0e0a1c;color:#e8e0ff}
.topbar{position:sticky;top:0;z-index:9999;background:rgba(14,10,28,.96);backdrop-filter:blur(18px);border-bottom:1px solid rgba(168,85,247,.15);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.card{background:rgba(28,18,56,.85);border:1px solid rgba(168,85,247,.15);border-radius:20px;padding:18px;margin:12px 0}
.btn{border:none;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}
.btnAccept{background:linear-gradient(135deg,#22c55e,#86efac);color:#0a1a0f;font-weight:900}
.btnReject{background:linear-gradient(135deg,#ef4444,#fca5a5);color:#1e0a0a;font-weight:900}
.btnView{background:rgba(76,29,149,.18);border:1px solid rgba(168,85,247,.2);color:#d8b4fe}
.badge{padding:4px 10px;border-radius:999px;font-size:10px;font-weight:900;display:inline-block}
.badge-pending{background:rgba(245,158,11,.15);color:#facc15;border:1px solid rgba(245,158,11,.25)}
.badge-accepted{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.25)}
.badge-rejected{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.25)}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
</style>
</head>
<body>
<div class="topbar">
<div style="display:flex;align-items:center;gap:8px"><div style="width:42px;height:42px;border-radius:12px;background:white;display:grid;place-items:center">👩‍⚕️</div><div style="font-size:10px;color:#22c55e"><span class="dot"></span> Live</div></div>
<div style="display:flex;gap:8px"><a href="./nurses-dashboard.html" style="padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.08);color:#e9d5ff;text-decoration:none;font-weight:800;font-size:12px">Dashboard</a><a href="./index.html" style="padding:10px 16px;border-radius:999px;background:rgba(168,85,247,.18);color:#e9d5ff;text-decoration:none;font-weight:800;font-size:12px">Home</a></div>
</div>

<div style="max-width:820px;margin:0 auto;padding:12px">
<div class="card" style="padding:12px">
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<button class="btn" style="background:rgba(76,29,149,.18);border:1px solid rgba(168,85,247,.2);color:#d8b4fe" onclick="loadBookings()">🔄</button>
<select id="filterStatus" onchange="renderFiltered()" style="padding:10px;border-radius:10px;background:rgba(14,10,28,.7);color:#d8b4fe;border:1px solid rgba(168,85,247,.2)"><option value="all">All</option><option value="pending" selected>Pending</option><option value="accepted">Accepted</option><option value="rejected">Rejected</option></select>
<span id="countInfo" style="font-size:10px;color:#6b7280"></span>
<span id="liveInfo" style="font-size:10px;color:#22c55e;margin-left:auto"><span class="dot"></span> Auto-refresh on</span>
</div>
<div id="jobGrid" style="margin-top:16px;display:grid;gap:12px"></div>
</div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);
const rtdb = firebase.database();
let nurseId = localStorage.getItem('lcg_nurse_uid') || localStorage.getItem('nurseId') || 'demo1';
let allJobs = [];

function getNurseId(){
  let id = localStorage.getItem('lcg_nurse_uid');
  if(!id) id = localStorage.getItem('nurseId');
  if(!id) {
    const urlParams = new URLSearchParams(location.search);
    id = urlParams.get('nurseId') || urlParams.get('id') || 'TyMqk6B7SncJoA9HsTNK3xIkHJD2';
  }
  return id;
}

function renderFiltered(){
  const filter = document.getElementById('filterStatus').value;
  const grid = document.getElementById('jobGrid');
  const countInfo = document.getElementById('countInfo');
  let filtered = allJobs;
  if(filter!=='all') filtered = allJobs.filter(j=>(j.status||'pending')===filter);
  countInfo.textContent = `${filtered.length} ${filter}`;
  if(!filtered.length){
    grid.innerHTML = `<div style="padding:20px;text-align:center;color:#6b7280">No ${filter}</div>`;
    return;
  }
  grid.innerHTML = filtered.map(job=>{
    const status = (job.status||'pending').toLowerCase();
    const isPending = status==='pending';
    const badgeClass = status==='accepted'?'badge-accepted':status==='rejected'?'badge-rejected':'badge-pending';
    const mapsLink = job.clientLat ? `https://www.google.com/maps?q=${job.clientLat},${job.clientLng}` : `https://www.google.com/maps?q=5.6037,-0.1870`;
    return `<div class="card" style="border-color:${isPending?'rgba(245,158,11,.3)':status==='accepted'?'rgba(34,197,94,.3)':'rgba(239,68,68,.3)'}">
      <div style="display:flex;justify-content:space-between;align-items:start;gap:10px">
        <div><b style="color:#f3e8ff;font-size:14px">${job.bookingId||job.id}</b><br><span class="badge ${badgeClass}" style="margin-top:6px">${status.toUpperCase()}</span></div>
        <div style="text-align:right"><small style="color:#86efac">GHS ${job.amount||0}</small><br><small style="color:#6b7280;font-size:9px">${new Date(job.time||Date.now()).toLocaleTimeString()}</small></div>
      </div>
      <div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11px;color:#c4b5fd">
        <div>${job.clientName||''}<br><a href="tel:${job.phone}" style="color:#4ade80">${job.phone||''}</a><br>${job.patientName||''}</div>
        <div>${job.totalHours||9} hrs<br>${job.startTime||'08:00'} → ${job.endTime||'17:00'}<br>${job.careMode||'Daily'}</div>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px">
        ${isPending?`<button class="btn btnAccept" style="flex:1" onclick="acceptJob('${job.id}')">✅</button><button class="btn btnReject" style="flex:1" onclick="rejectJob('${job.id}')">❌</button>`:`<button class="btn" style="flex:1;background:rgba(76,29,149,.18);color:#a78bfa" disabled>${status}</button>`}
        <a href="tel:${job.phone}" class="btn btnView" style="text-align:center">📞</a>
        <a href="${mapsLink}" target="_blank" class="btn btnView" style="text-align:center">🗺️</a>
      </div>
    </div>`;
  }).join('');
}

window.loadBookings = async function(){
  nurseId = getNurseId();
  const grid = document.getElementById('jobGrid');
  grid.innerHTML = '<div style="padding:20px;text-align:center;color:#6b7280">Loading...</div>';
  let jobs = [];
  try{
    const snap = await rtdb.ref('nurseBookings/'+nurseId).once('value');
    if(snap.exists()){
      snap.forEach(child=>{ const v = child.val(); v.id = child.key; jobs.push(v); });
    }
  }catch(e){}
  if(jobs.length===0){
    try{
      const snap2 = await rtdb.ref('jobOffers').once('value');
      if(snap2.exists()){
        snap2.forEach(child=>{ const v = child.val(); if(v.nurseId===nurseId || !v.nurseId){ v.id = child.key; jobs.push(v); } });
      }
    }catch(e){}
  }
  if(jobs.length===0){
    try{
      const snap3 = await rtdb.ref('bookings').once('value');
      if(snap3.exists()){
        snap3.forEach(child=>{ const v = child.val(); if(v.nurseId===nurseId || !v.nurseId){ v.id = child.key; jobs.push(v); } });
      }
    }catch(e){}
  }
  if(jobs.length===0){
    jobs = [
      {id:'LCG-20251016-ABC123', bookingId:'LCG-20251016-ABC123', clientName:'ASABERE PETER', phone:'+233544121814', patientName:'John Doe', nurseId:nurseId, amount:244, amountPaidNow:244, currency:'GHS', paymentMethod:'paystack_full', status:'pending', totalHours:9, startTime:'08:00', endTime:'17:00', careMode:'Daily', service:'Elderly Care', clientLat:5.6037, clientLng:-0.1870, time:Date.now()}
    ];
  }
  allJobs = jobs.sort((a,b)=>(b.time||0)-(a.time||0));
  renderFiltered();
}

// Real-time listener - auto refresh when new booking comes
function startRealtimeListener(){
  nurseId = getNurseId();
  try{
    // Listen to nurseBookings/{nurseId} - when client books, this triggers instantly
    rtdb.ref('nurseBookings/'+nurseId).on('value', (snap)=>{
      let jobs = [];
      if(snap.exists()){
        snap.forEach(child=>{ const v = child.val(); v.id = child.key; jobs.push(v); });
        allJobs = jobs.sort((a,b)=>(b.time||0)-(a.time||0));
        renderFiltered();
        document.getElementById('liveInfo').innerHTML = '<span class="dot"></span> Live — '+new Date().toLocaleTimeString();
        // Optional vibration/notification when new job
        if(jobs.length>0 && Notification && Notification.permission==='granted'){
          // Could notify
        }
      }
    });
    // Also listen to jobOffers as fallback
    rtdb.ref('jobOffers').on('value', (snap)=>{
      if(allJobs.length===0 && snap.exists()){
        let jobs = [];
        snap.forEach(child=>{ const v = child.val(); if(v.nurseId===nurseId){ v.id = child.key; jobs.push(v); } });
        if(jobs.length>0){
          allJobs = jobs.sort((a,b)=>(b.time||0)-(a.time||0));
          renderFiltered();
        }
      }
    });
  }catch(e){}
}

window.acceptJob = async function(bookingId){
  try{
    const updates = {};
    updates['bookings/'+bookingId+'/status'] = 'accepted';
    updates['nurseBookings/'+nurseId+'/'+bookingId+'/status'] = 'accepted';
    updates['jobOffers/'+bookingId+'/status'] = 'accepted';
    updates['bookings/'+bookingId+'/acceptedAt'] = Date.now();
    updates['nurseBookings/'+nurseId+'/'+bookingId+'/acceptedAt'] = Date.now();
    await rtdb.ref().update(updates);
  }catch(e){}
}
window.rejectJob = async function(bookingId){
  try{
    const updates = {};
    updates['bookings/'+bookingId+'/status'] = 'rejected';
    updates['nurseBookings/'+nurseId+'/'+bookingId+'/status'] = 'rejected';
    updates['jobOffers/'+bookingId+'/status'] = 'rejected';
    updates['bookings/'+bookingId+'/rejectedAt'] = Date.now();
    await rtdb.ref().update(updates);
  }catch(e){}
}
window.addEventListener('DOMContentLoaded', ()=>{
  const urlParams = new URLSearchParams(location.search);
  const idFromUrl = urlParams.get('nurseId') || urlParams.get('id');
  if(idFromUrl){ localStorage.setItem('lcg_nurse_uid', idFromUrl); }
  loadBookings();
  startRealtimeListener();
  // Also refresh every 15 seconds as backup
  setInterval(()=>{ loadBookings(); }, 15000);
  // Pull to refresh - if user pulls down, refresh
  let startY = 0;
  document.addEventListener('touchstart', e=>{ startY = e.touches[0].clientY; }, {passive:true});
  document.addEventListener('touchend', e=>{
    const endY = e.changedTouches[0].clientY;
    if(endY - startY > 100 && window.scrollY===0){
      loadBookings();
    }
  }, {passive:true});
});
</script>
</body>
</html>
