<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEO Refund Management - LOVE CARE GLOBAL</title>
<script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0c0a1e;color:#ece8ff;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:#16102a;border-bottom:1px solid rgba(168,85,247,.12);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.wrap{max-width:1300px;margin:0 auto;padding:18px 14px 80px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:12px 0}
.statCard{background:rgba(28,18,56,.85);border:1px solid rgba(168,85,247,.12);border-radius:16px;padding:16px}
.statCard b{font-size:22px}
.card{background:rgba(28,18,56,.85);border:1px solid rgba(168,85,247,.12);border-radius:18px;padding:16px;margin:12px 0}
.refundRow{border:1px solid rgba(168,85,247,.12);border-radius:14px;padding:14px;background:rgba(14,10,28,.6);margin:10px 0;display:grid;gap:10px}
.rowTop{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.badge{padding:4px 10px;border-radius:999px;font-size:10px;font-weight:800}
.b-pending{background:rgba(251,191,36,.15);color:#fde68a;border:1px solid rgba(251,191,36,.3)}
.b-approved{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.3)}
.b-rejected{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.btn{padding:8px 14px;border-radius:10px;border:none;font-weight:800;font-size:11px;cursor:pointer}
.btnApprove{background:linear-gradient(135deg,#22c55e,#16a34a);color:white}
.btnReject{background:linear-gradient(135deg,#ef4444,#dc2626);color:white}
.btnView{background:rgba(168,85,247,.15);color:#d8b4fe;border:1px solid rgba(168,85,247,.2)}
input,textarea,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(168,85,247,.15);background:rgba(14,10,28,.7);color:#ede9fe;font-size:12px}
.modalOverlay{position:fixed;inset:0;background:rgba(5,3,14,.9);backdrop-filter:blur(12px);z-index:5000;display:none;align-items:center;justify-content:center;padding:16px}
.modalOverlay.show{display:flex}
.modal{background:rgba(28,18,56,.98);border-radius:20px;padding:20px;max-width:520px;width:100%;border:1px solid rgba(168,85,247,.2);max-height:90vh;overflow-y:auto}
</style>
</head>
<body>
<div class="topbar">
<div style="display:flex;align-items:center;gap:10px"><a href="ceo-dashboard.html" style="text-decoration:none;color:#d8b4fe;font-size:12px">← CEO Dashboard</a><b style="color:#f3e8ff">💸 CEO Refund Management</b><span id="liveDot" style="width:10px;height:10px;background:#22c55e;border-radius:50%;display:inline-block;animation:pulse 1.5s infinite"></span></div>
<div style="display:flex;gap:6px">
<select id="filterStatus" onchange="renderList()"><option value="all">All</option><option value="pending" selected>Pending Only</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select>
<button class="btn btnView" onclick="loadRefunds()">🔄 Refresh</button>
</div>
</div>

<div class="wrap">
<div class="stats">
<div class="statCard"><small style="color:#9a95b8">Pending Requests</small><br><b id="sPending" style="color:#facc15">0</b></div>
<div class="statCard"><small style="color:#9a95b8">Approved</small><br><b id="sApproved" style="color:#22c55e">0</b></div>
<div class="statCard"><small style="color:#9a95b8">Rejected</small><br><b id="sRejected" style="color:#ef4444">0</b></div>
<div class="statCard"><small style="color:#9a95b8">Total Amount Pending</small><br><b id="sAmount">GHS 0</b></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><b>📋 Refund Requests — Real Payments Only</b><small style="color:#9a95b8" id="totalCount">0 requests</small></div>
<div id="refundList" style="margin-top:12px">Loading refund requests...</div>
</div>
</div>

<div id="detailModal" class="modalOverlay">
<div class="modal">
<div style="display:flex;justify-content:space-between"><b id="mTitle">Refund Detail</b><button class="btn btnView" onclick="closeModal()">✕</button></div>
<div id="mBody" style="margin-top:12px;font-size:12px;line-height:1.6"></div>
<label>CEO Action Note</label>
<textarea id="ceoNote" placeholder="Add reason for approval/rejection..."></textarea>
<div style="display:flex;gap:8px;margin-top:12px">
<button class="btn btnApprove" style="flex:1" onclick="updateStatus('approved')">✅ Approve Refund</button>
<button class="btn btnReject" style="flex:1" onclick="updateStatus('rejected')">❌ Reject</button>
</div>
<div style="margin-top:10px"><label>Manual Refund Amount (if partial)</label><input id="mRefundAmount" placeholder="e.g. 120.00"></div>
<button class="btn btnView" style="width:100%;margin-top:10px" onclick="updateStatus('pending')">↩️ Mark Pending Again</button>
</div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);
const rtdb=firebase.database();
const auth=firebase.auth();

let allRefunds=[];
let currentRefund=null;

function formatTime(ts){
  if(!ts) return 'N/A';
  const d=new Date(typeof ts==='number'? ts : Number(ts));
  if(isNaN(d.getTime())) return ts;
  return d.toLocaleString();
}

async function loadRefunds(){
  const listEl=document.getElementById('refundList');
  listEl.textContent='Loading...';
  try{
    const snap=await rtdb.ref('ceoRefundManagement').once('value');
    if(!snap.exists()){
      const snap2=await rtdb.ref('refundRequests').once('value');
      if(!snap2.exists()){ listEl.innerHTML='<div style="padding:20px;text-align:center;color:#9a95b8">No refund requests yet</div>'; updateStats([]); return; }
      allRefunds=Object.values(snap2.val());
    }else{
      allRefunds=Object.values(snap.val());
    }
    allRefunds.sort((a,b)=>(b.requestTime||0)-(a.requestTime||0));
    renderList();
    updateStats(allRefunds);
  }catch(e){
    listEl.innerHTML='Error: '+e.message;
  }
}

function updateStats(arr){
  const pending=arr.filter(r=>r.status==='pending').length;
  const approved=arr.filter(r=>r.status==='approved').length;
  const rejected=arr.filter(r=>r.status==='rejected').length;
  const totalAmt=arr.filter(r=>r.status==='pending').reduce((s,r)=>s+Number(r.amount||0),0);
  document.getElementById('sPending').textContent=pending;
  document.getElementById('sApproved').textContent=approved;
  document.getElementById('sRejected').textContent=rejected;
  document.getElementById('sAmount').textContent='GHS '+totalAmt.toFixed(2);
  document.getElementById('totalCount').textContent=arr.length+' requests';
}

function renderList(){
  const filter=document.getElementById('filterStatus').value;
  const listEl=document.getElementById('refundList');
  let filtered=allRefunds;
  if(filter!=='all') filtered=allRefunds.filter(r=>r.status===filter);
  if(filtered.length===0){ listEl.innerHTML='<div style="padding:20px;text-align:center;color:#9a95b8">No '+filter+' refunds</div>'; return; }
  listEl.innerHTML=filtered.map(r=>{
    const badgeClass=r.status==='pending'?'b-pending': r.status==='approved'?'b-approved':'b-rejected';
    return `<div class="refundRow">
      <div class="rowTop"><div><b style="font-size:12px">${r.refundId}</b> <span class="badge ${badgeClass}">${r.status.toUpperCase()}</span> <span style="font-size:10px;color:#9a95b8">${r.refundType||''}</span><br>
      <small style="color:#c4b5fd">Booking: ${r.bookingId} • Paid: ${formatTime(r.paymentTime||r.bookingTime)} • Requested: ${formatTime(r.requestTime)}</small></div>
      <div style="text-align:right"><b style="color:#facc15">${r.currency||'GHS'} ${Number(r.amount||0).toFixed(2)}</b><br><small style="color:#9a95b8">PayRef: ${r.paystackRef||'N/A'}</small></div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:11px">
        <div><b style="color:#d8b4fe">Client:</b> ${r.clientName}<br>${r.clientEmail}<br>${r.clientPhone||''}</div>
        <div><b style="color:#d8b4fe">Nurse:</b> ${r.nurseName} (${r.nurseId||''})<br>${r.nursePhone||''}<br><small>${r.paymentMethod||''}</small></div>
      </div>
      <div style="font-size:11px;background:rgba(14,10,28,.5);padding:10px;border-radius:10px"><b>Reason:</b> ${r.reason}</div>
      <div style="display:flex;gap:8px">
        <button class="btn btnView" onclick="openDetail('${r.refundId}')">👁️ View & Act</button>
        ${r.status==='pending'?`<button class="btn btnApprove" onclick="quickApprove('${r.refundId}')">✅ Approve</button><button class="btn btnReject" onclick="quickReject('${r.refundId}')">❌ Reject</button>`:''}
        <a href="ceo-booking-receiver.html" class="btn btnView" style="text-decoration:none;text-align:center">👑 Booking</a>
      </div>
    </div>`;
  }).join('');
}

window.openDetail=function(refundId){
  currentRefund=allRefunds.find(r=>r.refundId===refundId);
  if(!currentRefund) return;
  const r=currentRefund;
  document.getElementById('mTitle').textContent=r.refundId+' - '+r.status.toUpperCase();
  document.getElementById('mBody').innerHTML=`
    <div style="display:grid;gap:6px">
      <div><b>Booking ID:</b> ${r.bookingId}</div>
      <div><b>Booking Time / Payment Time:</b> ${formatTime(r.paymentTime||r.bookingTime)} <small>(${r.paymentTime||r.bookingTime})</small></div>
      <div><b>Client:</b> ${r.clientName} | ${r.clientEmail} | ${r.clientPhone}</div>
      <div><b>Nurse Selected:</b> ${r.nurseName} (${r.nurseId}) ${r.nursePhone}</div>
      <div><b>Amount Paid:</b> ${r.currency} ${r.amount} | PaidNow: ${r.amountPaidNow} | CashLater: ${r.amountCashLater||0}</div>
      <div><b>Payment:</b> ${r.paymentMethod} | Ref: ${r.paystackRef}</div>
      <div><b>Reason:</b> ${r.reason}</div>
      <div><b>Refund Type:</b> ${r.refundType}</div>
      <div><b>Request Time:</b> ${formatTime(r.requestTime)}</div>
      ${r.ceoNote?`<div style="background:rgba(34,197,94,.1);padding:8px;border-radius:8px"><b>CEO Note:</b> ${r.ceoNote}</div>`:''}
      ${r.originalBooking?`<details style="margin-top:8px"><summary>Original Booking JSON</summary><pre style="font-size:10px;overflow:auto;max-height:150px;background:#0e0a1c;padding:8px;border-radius:8px">${JSON.stringify(r.originalBooking,null,2)}</pre></details>`:''}
    </div>
  `;
  document.getElementById('ceoNote').value=r.ceoNote||'';
  document.getElementById('mRefundAmount').value=r.refundApprovedAmount||r.amount||'';
  document.getElementById('detailModal').classList.add('show');
}
window.closeModal=function(){ document.getElementById('detailModal').classList.remove('show'); currentRefund=null; }

window.updateStatus=async function(newStatus){
  if(!currentRefund) return;
  const note=document.getElementById('ceoNote').value.trim();
  const refundAmount=document.getElementById('mRefundAmount').value.trim();
  const updates={
    status:newStatus,
    ceoNote:note,
    refundApprovedAmount:refundAmount||currentRefund.amount,
    actionTime:Date.now(),
    actionTimeFormatted:new Date().toLocaleString(),
    ceoEmail:auth.currentUser?.email||localStorage.getItem('ceo_email')||'CEO'
  };
  try{
    await rtdb.ref('ceoRefundManagement/'+currentRefund.refundId).update(updates);
    await rtdb.ref('refundRequests/'+currentRefund.refundId).update(updates);
    await rtdb.ref('allRefundRequests/'+currentRefund.refundId).update(updates);
    const emailKey=(currentRefund.clientEmail||'').replace(/[.@]/g,'_');
    if(emailKey) await rtdb.ref('clientRefundRequests/'+emailKey+'/'+currentRefund.refundId).update(updates);
    // Also update booking status if approved
    if(newStatus==='approved'){
      try{ await rtdb.ref('allBookings/'+currentRefund.bookingId+'/refundStatus').set('approved'); }catch(e){}
    }
    alert('✅ Status updated to '+newStatus.toUpperCase());
    closeModal();
    loadRefunds();
  }catch(e){ alert('Failed: '+e.message); }
}

window.quickApprove=async function(refundId){
  currentRefund=allRefunds.find(r=>r.refundId===refundId);
  if(!currentRefund) return;
  if(!confirm('Approve refund '+refundId+' ?')) return;
  document.getElementById('ceoNote').value='Approved - Refund processed';
  await updateStatus('approved');
}
window.quickReject=async function(refundId){
  currentRefund=allRefunds.find(r=>r.refundId===refundId);
  if(!currentRefund) return;
  const reason=prompt('Reason for rejection:');
  if(reason===null) return;
  document.getElementById('ceoNote').value=reason;
  await updateStatus('rejected');
}

// Live listener
rtdb.ref('ceoRefundManagement').on('value', snap=>{
  if(!snap.exists()) return;
  allRefunds=Object.values(snap.val()).sort((a,b)=>(b.requestTime||0)-(a.requestTime||0));
  renderList();
  updateStats(allRefunds);
});

auth.onAuthStateChanged(user=>{
  if(!user){ auth.signInAnonymously().then(()=>loadRefunds()); }else{ loadRefunds(); }
});
</script>
</body>
</html>
