<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEO Refund Management</title>
<script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-database-compat.js"></script>
<style>body{font-family:Inter;background:#0e0a1c;color:#e8e0ff;padding:16px}
.card{background:rgba(28,18,56,.85);border:1px solid rgba(168,85,247,.12);border-radius:16px;padding:16px;margin:12px 0}
.badge{padding:4px 10px;border-radius:99px;font-size:10px;font-weight:800}
.time{color:#facc15;background:rgba(250,204,21,.12);border:1px solid rgba(250,204,21,.2)}
.btn{padding:10px 14px;border-radius:10px;border:none;font-weight:800;cursor:pointer;margin:4px}
.approve{background:#22c55e;color:white}.reject{background:#ef4444;color:white}</style>
</head><body>
<h2>💰 CEO Refund Management — With Time</h2>
<div id="counts"></div><div id="list">Loading...</div>
<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8"};firebase.initializeApp(firebaseConfig);const db=firebase.database();
function formatTime(ts){if(!ts)return'N/A';const d=new Date(ts);const now=new Date();const diff=Math.floor((now-d)/60000);const t=d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});const ds=d.toLocaleDateString();if(diff<1)return`Just now • ${t}`;if(diff<60)return`${diff}m ago • ${t} today`;if(diff<1440)return`${Math.floor(diff/60)}h ago • ${t} today`;return`${ds} • ${t}`;}
function load(){
  const nodes=['ceoRefundManagement','refundRequests','allRefundRequests','refunds','ceo-refund-management'];
  let all={};
  Promise.all(nodes.map(n=>db.ref(n).once('value').then(s=>{if(s.exists())Object.entries(s.val()).forEach(([k,v])=>{if(!all[k]|| (v.requestTime||0)>(all[k].requestTime||0)) all[k]=v;})}))).then(()=>{
    const arr=Object.values(all).sort((a,b)=>(b.requestTime||0)-(a.requestTime||0));
    document.getElementById('counts').innerHTML=`${arr.length} refund requests • ${arr.filter(r=>r.status==='pending').length} pending`;
    document.getElementById('list').innerHTML=arr.map(r=>`
      <div class="card">
        <div style="display:flex;justify-content:space-between"><b>${r.refundId}</b><span class="badge time">🕒 ${r.requestTimeDisplay||formatTime(r.requestTime)} • Request: ${r.requestTimeFormatted}</span></div>
        <div style="margin-top:8px;font-size:13px">📅 Booking: <b>${r.bookingId}</b> • Booked: ${r.bookingTimeFormatted||formatTime(r.bookingTime)} • Paid: ${r.paymentTimeFormatted||formatTime(r.paymentTime)}</div>
        <div style="font-size:12px;color:#c4b5fd">👤 Client: ${r.clientName} • ${r.clientEmail} • ${r.clientPhone}</div>
        <div style="font-size:12px;color:#93c5fd">👩‍⚕️ Nurse: ${r.nurseName} • ${r.nursePhone} • ID: ${r.nurseId}</div>
        <div style="font-size:12px">💰 Amount: ${r.currency} ${r.amount} • Method: ${r.paymentMethod} • Ref: ${r.paystackRef} • Type: ${r.refundType}</div>
        <div style="font-size:12px;margin-top:6px;background:rgba(14,10,28,.6);padding:8px;border-radius:8px">📝 Reason: ${r.reason}</div>
        <div style="margin-top:10px"><span class="badge" style="background:${r.status==='pending'?'rgba(250,204,21,.15)':r.status==='approved'?'rgba(34,197,94,.15)':'rgba(239,68,68,.15)'};color:${r.status==='pending'?'#fde68a':r.status==='approved'?'#86efac':'#fca5a5'}">${r.status.toUpperCase()}</span>
        ${r.status==='pending'?`<button class="btn approve" onclick="update('${r.refundId}','approved')">✅ Approve</button><button class="btn reject" onclick="update('${r.refundId}','rejected')">❌ Reject</button>`:''}</div>
      </div>`).join('')||'<p>No refunds</p>';
  });
}
function update(id,status){if(!confirm(status+' refund '+id+'?'))return;db.ref('ceoRefundManagement/'+id+'/status').set(status);db.ref('refundRequests/'+id+'/status').set(status);db.ref('allRefundRequests/'+id+'/status').set(status);db.ref('refunds/'+id+'/status').set(status);setTimeout(load,800);}
load();setInterval(load,10000);
</script></body></html>
