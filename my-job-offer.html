<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Jobs - Nurse | LOVE CARE GLOBAL</title><style>:root{--purple:#8b5cf6;--dark:#0f0b1f;--dark2:#1a1533;--card:#201b3a;--green:#22c55e;--red:#ef4444;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:var(--dark);color:white;padding-bottom:20px}.header{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--dark2);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2450}.card{background:var(--card);border:1px solid #2e2852;border-radius:20px;padding:14px;margin:12px 14px}.clientPhoto{width:75px;height:75px;border-radius:50%;object-fit:cover;border:3px solid var(--purple);background:#2a2450}.badge{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:800}.b-paid{background:#16a34a;color:white}.b-accept{background:var(--blue);color:white}.b-reject{background:var(--red);color:white}.b-wait{background:#eab308;color:#111}.btn{padding:11px 14px;border-radius:12px;border:none;font-weight:800;cursor:pointer;margin:4px 2px;font-size:13px}.btn-g{background:var(--green);color:white}.btn-p{background:linear-gradient(90deg,#c4a2ff,#a78bfa);color:#1a0f2f}.btn-d{background:#2a2450;color:#c7c3e6}.btn-r{background:var(--red);color:white}.detailBox{background:#1a1533;border:1px solid #2e2852;border-radius:12px;padding:10px;margin:6px 0;font-size:13px;color:#c7c3e6;line-height:1.6}.detailBox b{color:white}audio{width:100%;margin-top:8px}.mapBox{background:#0f1d0f;border:2px solid #22c55e;border-radius:14px;padding:10px;margin:8px 0}</style><script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import { getDatabase, ref, onValue, update, get, set, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};const app=initializeApp(firebaseConfig);const db=getDatabase(app);let myNurseId="", myNurseName="", myNursePhone="";window.onload=()=>{  myNurseId=localStorage.getItem('currentNurseId')||localStorage.getItem('nurseId')||localStorage.getItem('selectedNurseId')||localStorage.getItem('userId')||"";  myNurseName=localStorage.getItem('currentNurseName')||localStorage.getItem('nurseName')||"Nurse";  myNursePhone=localStorage.getItem('currentNursePhone')||localStorage.getItem('nursePhone')||"";  document.getElementById('nurseIdShow').innerText=myNurseId||"demo";  loadJobs();};async function getCurrentLocation(){  return new Promise(res=>{    if(!navigator.geolocation) return res(null);    navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),()=>res(null),{enableHighAccuracy:true,timeout:10000});  });}function loadJobs(){  onValue(ref(db,'bookings'), async snap=>{    const list=document.getElementById('list'); list.innerHTML=""; let count=0;    if(!snap.exists()){ list.innerHTML=`<div class="card">No bookings</div>`; return; }    const bookings=snap.val();    for(const key in bookings){      const b=bookings[key];      if(b.payment_status!=="paid") continue; // BLOCK UNPAID      const bookedNurseId=(b.nurseId||b.selectedNurseId||"").toString();      if(myNurseId && bookedNurseId && bookedNurseId!==myNurseId) continue;      count++;      let clientPhoto=b.clientPhoto||b.clientData?.photo||"https://via.placeholder.com/75/8b5cf6/ffffff?text=C";      if(!b.clientPhoto && b.clientId){        try{ const cs=await get(ref(db,'clients/'+b.clientId)); if(cs.exists()){ clientPhoto=cs.val().photo||clientPhoto; } }catch(e){}      }      const status=b.status||'pending';      let badge=status==="pending"?`<span class="badge b-paid">NEW BOOKING - Needs Accept</span>`:                status==="accepted"?`<span class="badge b-accept">Accepted ✅</span>`:                status==="rejected"?`<span class="badge b-reject">Rejected</span>`:                status==="in_progress"?`<span class="badge b-accept">In Progress</span>`:                `<span class="badge b-wait">${status}</span>`;      // Map links if accepted      let navBox="";      if(status==="accepted"||status==="in_progress"){        const clientLat=b.clientLat, clientLng=b.clientLng;        const nurseLat=b.nurseLat||b.acceptedNurseLat, nurseLng=b.nurseLng||b.acceptedNurseLng;        if(clientLat&&nurseLat){          const dirLink=`https://www.google.com/maps/dir/?api=1&origin=${nurseLat},${nurseLng}&destination=${clientLat},${clientLng}`;          navBox=`<div class="mapBox">            <b>🗺️ Auto Navigation Activated - Both Sides</b><br>            <small>Client Location: ${clientLat},${clientLng}<br>Nurse Location: ${nurseLat},${nurseLng}</small><br>            <a href="${dirLink}" target="_blank" style="color:#22c55e;font-weight:900">🧭 OPEN GOOGLE MAPS DIRECTIONS - Navigate to Client</a><br>            <small style="color:#8b8bb3">Client also sees navigation to you on his My Bookings page</small>          </div>`;        } else if(clientLat){          navBox=`<div class="mapBox"><a href="https://maps.google.com/?q=${clientLat},${clientLng}" target="_blank" style="color:#22c55e;font-weight:900">🗺️ Navigate to Client Location</a></div>`;        }      }      list.innerHTML+=`      <div class="card" style="border-left:4px solid #8b5cf6">        <div style="display:flex;justify-content:space-between"><b style="color:#a78bfa">${b.bookingId||key}</b>${badge}</div>        <div style="display:flex;gap:12px;align-items:center;margin:12px 0;background:#1a1533;padding:12px;border-radius:16px;border:1px solid #2e2852">          <img class="clientPhoto" src="${clientPhoto}" onerror="this.src='https://via.placeholder.com/75'">          <div><div style="font-weight:900;font-size:16px">${b.clientName||b.fullName||'Client'}</div><div style="font-size:12px;color:#a78bfa">📧 ${b.email||''} | 📞 ${b.clientPhone||b.phone||''}</div><div style="font-size:11px;color:#8b8bb3">📍 ${b.address||b.clientAddress||''}</div></div>        </div>        <div class="detailBox"><b>👤 Patient:</b> ${b.patientName||''} ${b.patientAge?`(${b.patientAge}y)`:''}<br><b>📝 Written Concerns:</b><br>${b.patientConcerns||b.notes||'No concerns'}<br><b>Extra:</b> ${b.notes||b.patientNotes||'None'}</div>        ${b.voiceNoteUrl?`<div class="detailBox"><b>🎤 Voice Note:</b><audio controls src="${b.voiceNoteUrl}"></audio></div>`:''}        <div class="detailBox"><b>🩺</b> ${b.service||''} | ${b.totalHours||''}h | <b style="color:#22c55e">${b.amount||b.clientOffer||''} ${b.currency||''}</b><br>💳 Ref: ${b.paystackRef||''} | ${b.timeStr||''}</div>        ${navBox}        <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">          ${status==="pending"?`<button class="btn btn-g" onclick="acceptJob('${key}')">✅ Accept - Send Success + Maps</button><button class="btn btn-r" onclick="rejectJob('${key}')">❌ Reject - Tell Client Find Another + Increase Amount</button>`:''}          ${status==="accepted"?`<button class="btn btn-g" onclick="startJob('${key}')">▶️ Start Job</button><button class="btn btn-d" onclick="window.open('https://www.google.com/maps/dir/?api=1&origin=${b.nurseLat||''},${b.nurseLng||''}&destination=${b.clientLat||''},${b.clientLng||''}','_blank')">🧭 Navigate</button>`:''}          ${status==="in_progress"?`<button class="btn btn-p" onclick="finishJob('${key}')">✅ Finish</button>`:''}          <button class="btn btn-d" onclick="window.open('tel:${b.clientPhone||b.phone}')">📞 Call</button>          <button class="btn btn-d" onclick="window.open('https://wa.me/${(b.clientPhone||b.phone||'').replace(/[^0-9]/g,'')}')">💬 WhatsApp</button>        </div>      </div>`;    }    document.getElementById('countShow').innerText=count+" PAID bookings for you";    if(count===0) list.innerHTML=`<div class="card" style="text-align:center;padding:30px">📭 No PAID bookings for you yet<br><small>When client pays at book-nurse and selects you, it appears here</small></div>`;  });}// ACCEPT = SEND SUCCESS TO CLIENT + AUTO MAP FOR BOTHwindow.acceptJob=async(id)=>{  if(!confirm('Accept? This will send SUCCESS to client and activate Google Maps navigation for BOTH')) return;  const loc=await getCurrentLocation();  const nurseLat=loc?.lat||localStorage.getItem('nurseLat')||null;  const nurseLng=loc?.lng||localStorage.getItem('nurseLng')||null;  const bookingSnap=await get(ref(db,'bookings/'+id));  if(!bookingSnap.exists()){ alert('Booking not found'); return; }  const b=bookingSnap.val();  // Update booking with acceptance + nurse location + map links  const clientLat=b.clientLat, clientLng=b.clientLng;  const dirForClient= clientLat&&nurseLat?`https://www.google.com/maps/dir/?api=1&origin=${clientLat},${clientLng}&destination=${nurseLat},${nurseLng}`:`https://maps.google.com/?q=${nurseLat||''},${nurseLng||''}`;  const dirForNurse= clientLat&&nurseLat?`https://www.google.com/maps/dir/?api=1&origin=${nurseLat},${nurseLng}&destination=${clientLat},${clientLng}`:`https://maps.google.com/?q=${clientLat},${clientLng}`;  await update(ref(db,'bookings/'+id),{    status:"accepted",    acceptedAt:new Date().toISOString(),    acceptedBy:myNurseId,    nurseId:myNurseId,    nurseName:myNurseName,    nursePhone:myNursePhone,    nurseLat:nurseLat,    nurseLng:nurseLng,    nurseMapLink: dirForNurse,    clientNavigationLink: dirForClient,    nurseNavigationLink: dirForNurse,    acceptanceMessage:"Your booking has been ACCEPTED by "+myNurseName+". Nurse is on the way! Google Maps navigation activated for both.",    clientNotified:true,    visible_to_client:true  });  // Also update clientBookings for client to see  if(b.clientPhone){    const phoneKey=b.clientPhone.replace(/[^0-9]/g,'');    await update(ref(db,'clientBookings/'+phoneKey+'/'+id),{      status:"accepted", nurseName:myNurseName, nursePhone:myNursePhone, nurseLat, nurseLng,      nurseMapLink:dirForNurse, clientNavigationLink:dirForClient,      acceptanceMessage:"ACCEPTED by "+myNurseName+" - Navigation active"    });  }  // Notification to client (push style)  const notifId=push(ref(db,'notifications')).key;  if(b.clientId){    await set(ref(db,'notifications/'+b.clientId+'/'+notifId),{      type:"booking_accepted",      bookingId:id,      title:"✅ Booking Accepted!",      message:`${myNurseName} accepted your booking ${b.bookingId}. Google Maps navigation activated for both you and nurse.`,      nurseName:myNurseName,      nursePhone:myNursePhone,      nurseLat, nurseLng,      clientLat, clientLng,      dirForClient, dirForNurse,      timestamp:Date.now(),      read:false    });  }  alert('✅ ACCEPTED! Success sent to client + Maps activated for BOTH\n\nClient will see:\n✅ Accepted by you\n🧭 Navigate to you\n\nYou see:\n🧭 Navigate to client');};// REJECT = SEND MESSAGE TO CLIENT TO FIND DIFFERENT NURSE + INCREASE AMOUNTwindow.rejectJob=async(id)=>{  const reason=prompt('Why rejecting? (This message will go to client)\nExample: Rate too low, not available etc.');  if(reason===null) return;  const bookingSnap=await get(ref(db,'bookings/'+id));  if(!bookingSnap.exists()) return;  const b=bookingSnap.val();  await update(ref(db,'bookings/'+id),{    status:"rejected",    rejectedAt:new Date().toISOString(),    rejectedBy:myNurseId,    rejectReason:reason,    rejectionMessage:`Sorry, Nurse ${myNurseName} rejected your booking. Reason: ${reason}. Please look for a different nurse and consider increasing your amount for faster acceptance.`,    clientNotified:true,    nurseId:myNurseId  });  // Update client side  if(b.clientPhone){    const phoneKey=b.clientPhone.replace(/[^0-9]/g,'');    await update(ref(db,'clientBookings/'+phoneKey+'/'+id),{      status:"rejected",      rejectionMessage:`Nurse ${myNurseName} rejected: ${reason}. Please try another nurse and increase your amount.`    });  }  // Notification to client  const notifId=push(ref(db,'notifications')).key;  if(b.clientId){    await set(ref(db,'notifications/'+b.clientId+'/'+notifId),{      type:"booking_rejected",      bookingId:id,      title:"❌ Booking Rejected",      message:`Nurse ${myNurseName} rejected your booking. Reason: ${reason}. Please look for a different nurse and increase your amount.`,      timestamp:Date.now(),      read:false    });  }  alert('❌ Rejected - Message sent to client: Look for different nurse + increase amount');};window.startJob=async(id)=>{ await update(ref(db,'bookings/'+id),{status:"in_progress",startedAt:new Date().toISOString()}); alert('Started'); };window.finishJob=async(id)=>{ if(!confirm('Mark finished?')) return; await update(ref(db,'bookings/'+id),{status:"awaiting_client_confirmation",finishedAt:new Date().toISOString()}); alert('Finished - Waiting client confirm'); };</script></head><body><div class="header"><div style="display:flex;align-items:center;gap:10px"><button class="btn" style="background:#2a2450;color:white" onclick="location.href='./index.html'">🏠</button><div><div style="font-weight:900;font-size:13px">My Jobs - Nurse</div><div style="font-size:10px;color:#8b8bb3">Accept / Reject + Auto Maps</div></div></div><div style="text-align:right"><div style="font-size:9px;color:#8b8bb3">ID</div><div style="font-size:11px;font-weight:800" id="nurseIdShow"></div></div></div><div style="margin:70px 14px 0;display:flex;justify-content:space-between"><b id="countShow">Loading...</b><button class="btn btn-d" onclick="location.reload()">🔄 Refresh</button></div><div id="list">Loading PAID bookings where client booked you...</div></body></html>
