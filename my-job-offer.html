<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Job Offer - Reject Flow</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0e0a1c;color:#e8e0ff;min-height:100vh}
.card{background:rgba(28,18,56,.92);border:1px solid rgba(168,85,247,.15);border-radius:20px;padding:16px;margin:12px 14px}
.btn{border:none;border-radius:14px;padding:12px;font-weight:800;cursor:pointer;font-size:11px;min-height:44px;flex:1}
.btnGreen{background:linear-gradient(135deg,#22c55e,#16a34a);color:white}
.btnRed{background:linear-gradient(135deg,#ef4444,#dc2626);color:white}
.btnBlue{background:linear-gradient(135deg,#2563eb,#60a5fa);color:white}
.btnGray{background:rgba(255,255,255,.07);border:1px solid rgba(168,85,247,.18);color:#d8b4fe}
.badge{padding:4px 10px;border-radius:999px;font-size:10px;font-weight:900;display:inline-block}
.badge-pending{background:rgba(245,158,11,.15);color:#fde68a;border:1px solid rgba(245,158,11,.3)}
.badge-rejected{background:rgba(239,68,68,.2);color:#fca5a5;border:1px solid rgba(239,68,68,.4)}
.badge-accepted{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.35)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#120a23;padding:12px 18px;border-radius:30px;z-index:9999;font-weight:700;font-size:12px;display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modalBox{background:#1c1238;border:1px solid rgba(168,85,247,.25);border-radius:20px;padding:20px;max-width:400px;width:100%}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head><body>
<div style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:rgba(14,10,28,.98);border-bottom:1px solid rgba(168,85,247,.12)"><b>3 Offers - Pending - When client books, shows as Pending</b><div style="display:flex;gap:6px"><a href="nurse-dashboard.html" style="padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.06);color:#d8b4fe;font-size:11px;text-decoration:none">Dashboard</a><a href="nurse-withdrawal.html" style="padding:8px 12px;border-radius:12px;background:#facc15;color:#000;font-size:11px;font-weight:800;text-decoration:none">Withdraw</a></div></div>
<div class="card" id="nurseHeader" style="background:linear-gradient(135deg,rgba(34,197,94,.15),rgba(16,185,129,.08));border:2px solid rgba(34,197,94,.3);display:flex;gap:14px;align-items:center;margin:12px 14px">
  <div id="nurseHeaderPhoto" style="width:64px;height:64px;border-radius:50%;background:#2a1a4a;overflow:hidden;flex-shrink:0;border:3px solid #22c55e;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px">N</div>
  <div>
    <div id="nurseHeaderName" style="font-weight:900;font-size:18px;color:#fff">Loading nurse...</div>
    <div id="nurseHeaderPhone" style="font-size:11px;color:#86efac;margin-top:2px"></div>
    <div style="font-size:9px;color:#22c55e;margin-top:4px;font-weight:800">VALIDATED: This page is for only you - Nurse Side - My Job Offer</div>
  </div>
</div>
<div style="padding:10px;max-width:800px;margin:0 auto">
<div id="debug" class="card" style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);font-size:11px"></div>
<div id="offers" style="display:grid;gap:12px"></div>
<div id="history" class="card" style="margin-top:20px"><b>History - Only ID when CEO paid - Click for details</b><div id="histList" style="margin-top:10px"></div></div>
</div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal" onclick="if(event.target===this) closeModal()"><div class="modalBox"><div style="display:flex;justify-content:space-between"><b id="modalTitle">Details</b><button class="btn btnGray" style="flex:none;padding:6px 10px" onclick="closeModal()">Close</button></div><div id="modalBody" style="margin-top:12px;font-size:12px;line-height:1.6"></div><div style="margin-top:12px;display:flex;gap:6px"><button id="modalReject" class="btn btnRed">Reject This</button><button id="modalAccept" class="btn btnGreen">Accept This</button></div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
let nurseUid='', nursePhone='', nurseEmail='', nurseName='', nursePhoto='', allOffers=[], clientPhotoCache={};
function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.style.display='block'; setTimeout(()=>el.style.display='none',4000); }
function fillNurseHeader(){
  const photo = nursePhoto || localStorage.getItem('nursePhoto') || localStorage.getItem('photoURL') || localStorage.getItem('photo') || '';
  const name = nurseName || localStorage.getItem('nurseName') || localStorage.getItem('fullName') || 'Nurse';
  const phone = nursePhone || localStorage.getItem('nursePhone') || '';
  document.getElementById('nurseHeaderName').textContent = name;
  document.getElementById('nurseHeaderPhone').textContent = phone + ' - ' + (nurseEmail||'');
  if(photo){
    document.getElementById('nurseHeaderPhoto').innerHTML = `<img src="${photo}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.textContent='${name.charAt(0).toUpperCase()}'">`;
  } else {
    document.getElementById('nurseHeaderPhoto').textContent = name.charAt(0).toUpperCase();
  }
  // Also try fetch from DB if not in localStorage
  if(nurseUid){
    db.ref('nurses/'+nurseUid).once('value').then(snap=>{
      if(snap.exists()){
        const v=snap.val();
        const p=v.photoURL||v.nursePhoto||v.avatar||v.photo||'';
        const n=v.fullName||v.name||v.nurseName||name;
        const ph=v.phone||phone;
        if(p && !photo){
          document.getElementById('nurseHeaderPhoto').innerHTML = `<img src="${p}" style="width:100%;height:100%;object-fit:cover">`;
          nursePhoto=p;
        }
        if(n) document.getElementById('nurseHeaderName').textContent=n;
        if(ph) document.getElementById('nurseHeaderPhone').textContent=ph;
      }
    });
  }
}
function getNurseKeys(){
  nurseUid=localStorage.getItem('nurseUid')||localStorage.getItem('uid')||localStorage.getItem('nurseId')||'';
  nursePhone=localStorage.getItem('nursePhone')||localStorage.getItem('phone')||'05441211814';
  nurseEmail=localStorage.getItem('nurseEmail')||localStorage.getItem('email')||'asaberepeter204@gmail.com';
  nurseName=localStorage.getItem('nurseName')||localStorage.getItem('fullName')||'Nurse';
  nursePhoto=localStorage.getItem('nursePhoto')||'';
  // Fallback from screenshot
  if(!nurseUid) nurseUid='oubgaWAk4sQRI1P0QcuLOoxFHkr1';
}
async async function fetchClientPhoto(clientId, clientPhone, clientUsername){
  const cacheKey=clientId||clientPhone||clientUsername;
  if(clientPhotoCache[cacheKey]) return clientPhotoCache[cacheKey];
  try{
    if(clientId){
      const snap=await db.ref('clients/'+clientId).once('value');
      if(snap.exists()){ const v=snap.val(); if(v.photoURL||v.clientPhoto||v.avatar){ clientPhotoCache[cacheKey]=v.photoURL||v.clientPhoto||v.avatar; return clientPhotoCache[cacheKey]; } }
    }
    if(clientPhone){
      const phone9=clientPhone.replace(/[^0-9]/g,'').slice(-9);
      const snap=await db.ref('clientAvatars').orderByChild('phone').equalTo(clientPhone).once('value').catch(()=>null);
      if(snap&&snap.exists()){ let found=''; snap.forEach(ch=>{ const v=ch.val(); if(v.photoURL) found=v.photoURL; }); if(found){ clientPhotoCache[cacheKey]=found; return found; } }
      const snap2=await db.ref('allowedClients').once('value').catch(()=>null);
      if(snap2&&snap2.exists()){
        let found=''; snap2.forEach(ch=>{ const v=ch.val(); const p=(v.phone||'').replace(/[^0-9]/g,'').slice(-9); if(p===phone9 && (v.photoURL||v.clientPhoto)){ found=v.photoURL||v.clientPhoto; } });
        if(found){ clientPhotoCache[cacheKey]=found; return found; }
      }
      const snap3=await db.ref('clientPhones/'+phone9).once('value').catch(()=>null);
      if(snap3&&snap3.exists()){ const v=snap3.val(); if(v.photoURL||v.clientPhoto){ clientPhotoCache[cacheKey]=v.photoURL||v.clientPhoto; return clientPhotoCache[cacheKey]; } }
    }
  }catch(e){}
  return '';
}
function loadOffers(){
  getNurseKeys();
  const phone9=nursePhone.replace(/[^0-9]/g,'').slice(-9);
  const debug=document.getElementById('debug');
  db.ref('bookings').on('value', async snap=>{
    const list=[]; let total=0;
    if(snap.exists()){
      snap.forEach(ch=>{
        total++;
        const v=ch.val();
        const bId=(v.nurseId||'').toString();
        const bPhone=(v.nursePhone||'').replace(/[^0-9]/g,'').slice(-9);
        const bEmail=(v.nurseEmail||'').toLowerCase();
        const matchUid=bId===nurseUid;
        const matchPhone=bPhone&&phone9&&bPhone===phone9;
        const matchEmail=bEmail&&nurseEmail&&bEmail===nurseEmail.toLowerCase();
        if(matchUid||matchPhone||matchEmail){
          const st=(v.status||'pending').toLowerCase();
          if(!st.includes('client_confirmed_finished') && !st.includes('paid')){
            list.push({...v, id:ch.key, bookingId:v.bookingId||ch.key});
          }
        }
      });
    }
    // Fetch client photos for each offer
    for(const b of list){
      if(!b.clientPhoto){
        b.clientPhoto = await fetchClientPhoto(b.clientId, b.clientPhone||b.phone, b.clientUsername);
      }
    }
    list.sort((a,b)=>(b.time||0)-(a.time||0));
    allOffers=list;
    const pending=list.filter(b=>{ const st=(b.status||'pending').toLowerCase(); return st==='pending'||st==='new'; }).length;
    const rejected=list.filter(b=>{ const st=(b.status||'').toLowerCase(); return st.includes('rejected'); }).length;
    debug.innerHTML=`Debug: Done<br>NurseId: ${nurseUid}<br>Phone: ${nursePhone} (9-digit: ${phone9}) Email: ${nurseEmail}<br>Total bookings found across all paths: ${total}<br>Matched for this nurse: ${list.length}<br>Pending (should show with Accept/Reject): ${pending}<br>Rejected: ${rejected}<br>History (really paid by CEO): 0<br>Paths checked: bookings`;
    render(list);
  });
}
function render(list){
  const area=document.getElementById('offers');
  if(list.length===0){ area.innerHTML='<div class="card">No offers yet - When client books, shows as Pending</div>'; return; }
  area.innerHTML=list.map(b=>{
    const st=(b.status||'pending').toLowerCase();
    let badge='badge-pending', txt='PENDING'; if(st.includes('accepted')){ badge='badge-accepted'; txt='ACCEPTED'; } else if(st.includes('rejected')){ badge='badge-rejected'; txt='REJECTED - Waiting CEO to clear'; }
    const isPending=st==='pending'||st==='new';
    let nursePhotoDisplay = nursePhoto || localStorage.getItem('nursePhoto') || localStorage.getItem('photoURL') || b.nursePhoto || '';
  return `<div class="card" style="border-left:3px solid ${st.includes('rejected')?'#ef4444':'#facc15'}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="display:flex;gap:10px;align-items:center">
          <div style="width:50px;height:50px;border-radius:50%;background:#2a1a4a;overflow:hidden;flex-shrink:0;border:2px solid #22c55e;display:flex;align-items:center;justify-content:center">
            ${nursePhotoDisplay ? `<img src="${nursePhotoDisplay}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='<div style=font-weight:900;font-size:20px>${(nurseName||'N').charAt(0).toUpperCase()}</div>'">` : `<div style="font-weight:900;font-size:20px">${(nurseName||'N').charAt(0).toUpperCase()}</div>`}
          </div>
          <div>
            <div style="font-weight:900;font-size:14px;color:#fff">${nurseName}</div>
            <div style="font-size:10px;color:#86efac">${nursePhone} - Validated: This page is for only you</div>
          </div>
        </div>
        <span class="badge ${badge}">${txt}</span>
      </div>
      <div style="margin-top:10px;font-size:11px;background:rgba(255,255,255,.04);padding:10px;border-radius:12px">
        <b>Booking ID ${b.bookingId||b.id} - ${st}</b><br>
        Client: ${b.clientName||''} - ${b.clientPhone||''}<br>
        Location: ${b.location||b.clientLocation||''}<br>
        Amount: ${b.currency||'GHS'} ${b.amount||b.totalAmount||''} - You get 80% = ${b.nurse80||Math.round((b.amount||20)*0.8)}
      </div>
      <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">
        ${isPending?`<button class="btn btnGreen" onclick="acceptOffer('${b.id}')">Accept</button><button class="btn btnRed" onclick="rejectOffer('${b.id}')">Reject</button>`:`<button class="btn btnGray" onclick="undoReject('${b.id}')">Undo Reject - Restore to Pending</button>`}
        <button class="btn btnBlue" onclick="viewDetails('${b.id}')">View Details</button>
      </div>
    </div>`;
  }).join('');
}
async function acceptOffer(id){
  if(!confirm('Accept booking '+id+'?')) return;
  const b=allOffers.find(x=>x.id===id);
  await db.ref('bookings/'+id).update({status:'accepted', acceptedAt:Date.now(), nurseAccepted:true});
  // Notify client + CEO
  const clientKey=(b.clientPhone||'').replace(/[^0-9]/g,'').slice(-9)||b.clientId;
  await db.ref('clientAlerts/'+clientKey+'/ACCEPTED-'+id+'-'+Date.now()).set({type:'accepted',title:`Nurse ${nurseName} accepted`,message:`Nurse ${nurseName} accepted your booking ID ${b.bookingId||id} - Nurse is on the way`,bookingId:b.bookingId||id,time:Date.now(),read:false});
  await db.ref('ceoBookingsProgress/'+id).set({bookingId:b.bookingId||id, nurseId:nurseUid, nurseName:nurseName, clientName:b.clientName, clientPhone:b.clientPhone, status:'accepted', type:'accepted', time:Date.now(), createdAt:Date.now()});
  toast('Accepted - Client notified - Auto nav');
}
async function rejectOffer(id){
  if(!confirm('Reject booking '+id+'? Client will be told to book another nurse or increase payment - After CEO sees rejected, will be deleted')) return;
  const b=allOffers.find(x=>x.id===id);
  const now=Date.now();
  const nowStr=new Date().toLocaleString('en-GH');
  // 1. Update booking as rejected
  await db.ref('bookings/'+id).update({status:'rejected', rejectedAt:now, rejectedAtStr:nowStr, rejectedBy:'nurse', rejectedByNurseId:nurseUid, rejectedByNurseName:nurseName});
  // 2. Client notification - tell client to book another nurse or increase payment
  const clientKey=(b.clientPhone||'').replace(/[^0-9]/g,'')||b.clientId||b.clientUsername;
  const clientPhone9=(b.clientPhone||'').replace(/[^0-9]/g,'').slice(-9);
  const clientKeysToTry=[clientKey, clientPhone9, b.clientId, b.clientUsername, b.clientPhone].filter(Boolean);
  for(const k of clientKeysToTry){
    await db.ref('clientAlerts/'+k+'/REJECTED-'+id+'-'+now).set({type:'rejected',title:`Nurse ${nurseName} rejected`,message:`Nurse ${nurseName} has rejected your offer - Please book another nurse or increase your payment rate - Booking ID: ${b.bookingId||id}`,bookingId:b.bookingId||id,nurseName:nurseName,time:now,read:false});
    await db.ref('bookingsProgress/'+id+'-'+k).set({type:'rejected', bookingId:b.bookingId||id, nurseName:nurseName, message:`Nurse ${nurseName} rejected - Book another or increase payment`, time:now, status:'rejected'});
  }
  // 3. CEO bookings progress - so CEO sees rejected
  await db.ref('ceoBookingsProgress/'+id).set({bookingId:b.bookingId||id, nurseId:nurseUid, nurseName:nurseName, nursePhone:nursePhone, clientName:b.clientName, clientPhone:b.clientPhone, clientUsername:b.clientUsername, amount:b.amount, status:'rejected', type:'rejected', rejectedAt:now, rejectedAtStr:nowStr, rejectedBy:'nurse', reason:'Nurse rejected', time:now, createdAt:now});
  await db.ref('ceoNotificationRoom/REJECTED-'+id+'-'+now).set({type:'rejected', title:`Booking ${b.bookingId||id} rejected by nurse`, message:`Nurse ${nurseName} rejected booking ${b.bookingId||id} for client ${b.clientName} - Amount GHS ${b.amount} - Client told to book another or increase payment - CEO can clear after seeing`, bookingId:b.bookingId||id, time:now, read:false});
  toast('Rejected - Client notified to book another or increase payment - CEO will see and clear');
}
async function undoReject(id){
  if(!confirm('Restore '+id+' back to pending?')) return;
  await db.ref('bookings/'+id).update({status:'pending', rejectedAt:null, rejectedBy:null});
  await db.ref('ceoBookingsProgress/'+id).remove().catch(()=>{});
  toast('Restored to pending');
}
function viewDetails(id){
  const b=allOffers.find(x=>x.id===id);
  document.getElementById('modalTitle').textContent='Booking '+(b.bookingId||b.id);
  document.getElementById('modalBody').innerHTML=`ID: ${b.bookingId||b.id}<br>Status: ${b.status}<br>Client: ${b.clientName}<br>Phone: ${b.clientPhone}<br>Amount: ${b.currency||'GHS'} ${b.amount}<br>Location: ${b.location||''}<br>Service: ${b.serviceType||''}<br>Time: ${new Date(b.time||Date.now()).toLocaleString('en-GH')}<br><br>If you reject, client sees: Nurse rejected your offer - Please book another nurse or increase your payment rate - Booking ID: ${b.bookingId||b.id}<br>After CEO sees rejected in ceo-bookings-progress, it will be deleted from both sides`;
  document.getElementById('modalReject').onclick=()=>{ closeModal(); rejectOffer(id); };
  document.getElementById('modalAccept').onclick=()=>{ closeModal(); acceptOffer(id); };
  document.getElementById('modal').style.display='flex';
}
function closeModal(){ document.getElementById('modal').style.display='none'; }
window.onload=()=>{ getNurseKeys(); fillNurseHeader(); loadOffers(); setTimeout(fillNurseHeader, 1500); };
</script>
</body></html>
