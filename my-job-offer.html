function playNursePreset(id){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended') ctx.resume().catch(()=>{});
    const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);

    else if(id==='afrobeat_nurse'){o.frequency.value=180;g.gain.value=.18;o.start();setTimeout(()=>{o.frequency.value=250;},100);setTimeout(()=>{o.frequency.value=180;},200);setTimeout(()=>{o.frequency.value=350;},300);setTimeout(()=>{o.stop();ctx.close();},700);}

async function sendSMSToNurse(toPhone,message,bookingData){

  if(!SMS_CONFIG_NURSE.enabled) return;
  let phone=toPhone.replace(/[^0-9+]/g,''); if(phone.startsWith('0')) phone='+233'+phone.slice(1); if(!phone.startsWith('+')) phone='+'+phone;
  try{
    if(SMS_CONFIG_NURSE.useCloudFunction){
      await fetch(SMS_CONFIG_NURSE.cloudFunctionUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:phone,message,nurseName:bookingData?.nurseName||'',nursePhone:toPhone,clientName:bookingData?.clientName||'',clientPhone:bookingData?.clientPhone||'',clientPhotoUrl:bookingData?.clientPhotoUrl||'',bookingId:bookingData?.bookingId||bookingData?.id||'',time:Date.now(),timeStr:new Date().toLocaleString('en-GH')})});

function ringNurseTone(booking, isRecentOld=false){
  const t=getSavedNurseTone();
  console.log('ðŸŽµ ringNurseTone called, tone:', t.name, 'type:', t.type, 'booking:', booking?.id);
  
  // Vibrate - works even if silent
  try{
    if(navigator.vibrate) {
      navigator.vibrate([500,200,500,200,800,200,500]);
      console.log('ðŸ“³ Vibrating');
    }
  }catch(e){console.log('Vibrate fail', e);}
  
  // Play tone - try custom first, then preset, with AudioContext unlock
  const playTone = async()=>{
    try{
      if(t.type==='custom' && t.base64){
        const p=document.getElementById('nurseCustomTonePlayer');
        if(p){
          p.src=t.base64;
          p.volume=1.0;
          p.loop=false;
          // Try to unlock audio context on first play
          try{
            const ctx=new (window.AudioContext||window.webkitAudioContext)();
            if(ctx.state==='suspended') await ctx.resume();
          }catch(e){}
          await p.play().catch((e)=>{
            console.log('Custom tone play failed, falling back to preset', e);
            playNursePreset(t.id);
          });
          console.log('ðŸŽµ Custom tone playing');
          // Play again after 2 sec for urgency
          setTimeout(()=>{ try{p.currentTime=0; p.play().catch(()=>{});}catch(e){} },2500);
        } else {
          playNursePreset(t.id);
        }
      }else{ 
        playNursePreset(t.id);
        // Play preset 3 times for urgency
        setTimeout(()=>playNursePreset(t.id), 1000);
        setTimeout(()=>playNursePreset(t.id), 2200);
      }
    }catch(e){
      console.log('Tone play error', e);
      try{ playNursePreset(t.id); }catch(e2){}
    }
  };
  
  playTone();
  
  // Notification - requires permission
  try{
    if(Notification && Notification.permission==='granted'){
      const notif = new Notification(isRecentOld ? 'ðŸ”” You have a recent PENDING booking!' : 'ðŸ”” NEW BOOKING! Client Booked You!',{
        body: `${booking?.clientName||'Client'} booked you! GHS ${booking?.amount||0}. Patient: ${booking?.patientName||''}. Tone: ${t.name} rang! ${t.smsEnabled==='true'?'SMS sent!':''} â€” Tap to open!`,
        icon:'icon-transparent-512.png',

      });
      notif.onclick = ()=>{ window.focus(); notif.close(); };
      console.log('ðŸ”” Notification shown');
    } else if(Notification && Notification.permission==='default'){
      Notification.requestPermission().then(p=>{
        if(p==='granted'){
          new Notification('ðŸ”” NEW BOOKING! Client Booked You!',{body:`Tone: ${t.name} rang!`});
        }
      });
    }
  }catch(e){console.log('Notification fail', e);}
  
  // Also flash title
  try{
    const origTitle=document.title;
    let flashCount=0;
    const flashInterval=setInterval(()=>{
      document.title = flashCount%2===0 ? 'ðŸ”” NEW BOOKING! CHECK NOW!' : origTitle;
      flashCount++;
      if(flashCount>12){ clearInterval(flashInterval); document.title=origTitle; }
    },800);
  }catch(e){}
}

function getNurse(){
  // FIX: Prioritize real UID from localStorage - this is why nurse gets no offers
  const directUidKeys=['lcg_nurse_uid','nurseUid','currentNurseId','currentNurseUid','nurseId','uid','nurse_uid','nurseUidBig'];
  let realUid=null;
  for(const store of [localStorage, sessionStorage]){
    for(const k of directUidKeys){
      try{
        const v=store.getItem(k);
        if(v && v.length>=10 && !v.includes(' ') && !v.includes('@')){ realUid=v; break; }
      }catch{}
    }
    if(realUid) break;
  }
  
  const KEYS=['nurse','nurseData','currentUser','user','auth_user','nurse_profile','nurseProfile','currentNurse','lcg_nurse_profile'];
  for(const store of [localStorage, sessionStorage]){
    for(const k of KEYS){
      try{
        const raw=store.getItem(k); if(!raw) continue;
        let d=null;
        try{ d=JSON.parse(raw); }catch{ continue; }
        const o=d.user||d.nurse||d.data||d.profile||d;
        const full=o.fullName||o.name||o.displayName||o.full_name;
        const uid=o.uid||o.id||o.nurseId||o.nurseUid||realUid;
        if(full || uid){
          const finalId = uid || realUid || (full?full.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,''):'nurse');
          // Try many photo keys
          let photo = o.photo||o.photoUrl||o.photoURL||o.image||o.avatar||o.profilePhoto||o.nursePhoto||o.nursePhotoUrl||null;
          // Also check localStorage for photo
          try{
            if(!photo){
              const photoKeys=['nursePhoto','nursePhotoUrl','photoUrl','lcg_nurse_photo','nurse_photo','profilePhoto','avatar','nursePhotoBig'];
              for(const pk of photoKeys){
                const pv=localStorage.getItem(pk)||sessionStorage.getItem(pk);
                if(pv && (pv.startsWith('http')||pv.startsWith('data:'))){ photo=pv; break; }
              }
            }
          }catch(e){}
          return {id:finalId, uid:uid||realUid, fullName:full||'Nurse', firstName:o.firstName||(full?full.split(' ')[0]:'Nurse'), location:o.location||'Accra', photo:photo, phone:o.phone||o.phoneNumber||''};
        }
      }catch{}
    }
  }
  
  if(realUid){
    const nameFromStorage = localStorage.getItem('nurseName')||localStorage.getItem('fullName')||localStorage.getItem('currentNurseName')||'Nurse';
    return {id:realUid, uid:realUid, fullName:nameFromStorage, firstName:nameFromStorage.split(' ')[0], location:'Accra', photo:null, phone:''};
  }
  
  const p=new URLSearchParams(location.search); const q=p.get('nurse')||p.get('name')||p.get('nurseId')||p.get('uid');
  if(q) {
    if(q.length>15) return {id:q, uid:q, fullName:q, firstName:q.split(' ')[0], location:'Accra', photo:null, phone:''};
    return {id:q.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,''), uid:q, fullName:q, firstName:q.split(' ')[0], location:'Accra', photo:null, phone:''};
  }
  return {id:realUid||'demo-nurse', uid:realUid||'demo-nurse', fullName:'Nurse', firstName:'Nurse', location:'Accra', photo:null, phone:''};
}
let nurseWatchId=null;let lastLat=null;let lastLng=null;let isTracking=false;
function calcDistance(lat1,lon1,lat2,lon2){if(!lat1||!lon1||!lat2||!lon2) return 0;const R=6371;const dLat=(lat2-lat1)*Math.PI/180;const dLon=(lon2-lon1)*Math.PI/180;const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));return R*c;}
function shareNurseLocation(pos, bookingId, nurse, status){
  const lat=pos.coords.latitude;const lng=pos.coords.longitude;
  if(lastLat&&lastLng){const dist=calcDistance(lastLat,lastLng,lat,lng)*1000;if(dist<5) return;}
  lastLat=lat; lastLng=lng;
  const locationData={lat,lng,nurseLat:lat,nurseLng:lng,lastUpdate:Date.now(),updatedAt:Date.now(),nurseId:nurse.id,nurseName:nurse.fullName,bookingId,isLive:true,status:status||'enRoute'};
  const updates={};updates[`nurseLocations/${nurse.id}`]=locationData;updates[`liveNurseLocations/${bookingId}`]=locationData;updates[`ceoBookings/${bookingId}/nurseLat`]=lat;updates[`ceoBookings/${bookingId}/nurseLng`]=lng;updates[`ceoBookings/${bookingId}/lastUpdate`]=Date.now();rtdb.ref().update(updates);
}
function startNurseGPSTracking(bookingId, nurse, status){
  if(!navigator.geolocation){return;}
  navigator.geolocation.getCurrentPosition((pos)=>{
    shareNurseLocation(pos, bookingId, nurse, status||'accepted');isTracking=true;
    if(nurseWatchId) navigator.geolocation.clearWatch(nurseWatchId);
    nurseWatchId=navigator.geolocation.watchPosition((pos)=>shareNurseLocation(pos, bookingId, nurse, 'enRoute'),()=>{}, {enableHighAccuracy:true,maximumAge:5000,timeout:10000});
    const bar=document.getElementById('gpsBar'); if(bar) bar.classList.add('active');
  },{},{enableHighAccuracy:true,timeout:10000});
}
function stopNurseGPSTracking(){if(nurseWatchId){navigator.geolocation.clearWatch(nurseWatchId);nurseWatchId=null;}isTracking=false;const bar=document.getElementById('gpsBar'); if(bar) bar.classList.remove('active');}
function updateNurseStatus(bookingId, newStatus, nurse){

  rtdb.ref(`myJobOffers/${nurse.id}/${bookingId}`).update(updates);rtdb.ref(`bookings/${bookingId}`).update(updates);rtdb.ref(`acceptedBookings/${bookingId}`).update(updates);rtdb.ref(`ceoBookings/${bookingId}`).update(updates);
}
