<!DOCTYPE html><html lang="en"><head><script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script src="onesignal-setup.js" defer></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Job Offer - ULTRA SIMPLE - Works</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0e0a1c;color:#e8e0ff;min-height:100vh}
.topbar{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:#1c1238;position:sticky;top:0;z-index:10;border-bottom:1px solid #2a1a4a}
.card{background:#1c1238;border:1px solid #2a1a4a;border-radius:16px;padding:14px;margin:10px 14px}
.btn{border:none;border-radius:12px;padding:12px;font-weight:800;cursor:pointer;font-size:12px;flex:1;min-height:44px}
.btnGreen{background:#22c55e;color:#000}
.btnRed{background:#ef4444;color:#fff}
.btnBlue{background:#2563eb;color:#fff}
.btnYellow{background:#facc15;color:#000}
.badge{padding:4px 10px;border-radius:999px;font-size:10px;font-weight:900;display:inline-block}
.badge-pending{background:#f59e0b;color:#000}
.badge-accepted{background:#22c55e;color:#000}
.badge-rejected{background:#ef4444;color:#fff}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#fff;color:#000;padding:12px 20px;border-radius:30px;z-index:999;font-weight:700;display:none}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head><body>
<div class="topbar"><b id="count">My Job Offers</b><div style="display:flex;gap:6px"><a href="nurse-dashboard.html" style="padding:8px 12px;border-radius:12px;background:#2a1a4a;color:#d8b4fe;text-decoration:none;font-size:12px">Dashboard</a><a href="nurse-withdrawal.html" style="padding:8px 12px;border-radius:12px;background:#facc15;color:#000;text-decoration:none;font-size:12px;font-weight:800">Withdraw</a></div></div>

<div class="card" style="background:linear-gradient(135deg,#14532d,#166534);border:2px solid #22c55e;display:flex;gap:12px;align-items:center">
  <div id="nPhoto" style="width:60px;height:60px;border-radius:50%;background:#2a1a4a;border:3px solid #22c55e;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;flex-shrink:0">P</div>
  <div>
    <div id="nName" style="font-weight:900;font-size:18px">Asabere Peter</div>
    <div id="nPhone" style="font-size:12px;color:#86efac">05441211814 - asaberepeter204@gmail.com</div>
    <div style="font-size:9px;color:#4ade80;margin-top:4px;font-weight:800">VALIDATED: This page is for only you - Nurse Side - Photo + Name</div>
  </div>
</div>

<div id="offers"></div>
<div class="card"><b>History - Only ID when CEO paid - Click for details</b><div id="history" style="margin-top:10px;font-size:12px">No history yet</div></div>

<div id="toast" class="toast"></div>

<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let nurseUid='oubgaWAk4sQRI1P0QcuLOoxFHkr1';
let nursePhone='05441211814';
let nurseEmail='asaberepeter204@gmail.com';
let nurseName='Asabere Peter';
let nursePhoto='';
let all=[];

function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.style.display='block'; setTimeout(()=>el.style.display='none',4000); }

function loadNurse(){
  // Try localStorage
  const tryKeys=['nurseUid','lcg_nurse_uid','uid','userId','nurseId'];
  for(const k of tryKeys){
    const v=localStorage.getItem(k);
    if(v && v.length>10){ nurseUid=v; break; }
  }
  nursePhone=localStorage.getItem('nursePhone')||localStorage.getItem('phone')||nursePhone;
  nurseEmail=localStorage.getItem('nurseEmail')||localStorage.getItem('email')||nurseEmail;
  nurseName=localStorage.getItem('nurseName')||localStorage.getItem('fullName')||nurseName;
  nursePhoto=localStorage.getItem('nursePhoto')||localStorage.getItem('photoURL')||'';

  document.getElementById('nName').textContent=nurseName;
  document.getElementById('nPhone').textContent=nursePhone+' - '+nurseEmail;
  if(nursePhoto){
    document.getElementById('nPhoto').innerHTML=`<img src="${nursePhoto}" style="width:100%;height:100%;object-fit:cover">`;
  } else {
    document.getElementById('nPhoto').textContent=nurseName.charAt(0).toUpperCase();
  }

  // Fetch from DB
  db.ref('nurses/'+nurseUid).once('value').then(s=>{
    if(s.exists()){
      const v=s.val();
      const p=v.photoURL||v.nursePhoto||v.avatar||'';
      const n=v.fullName||v.name||'';
      if(p){ document.getElementById('nPhoto').innerHTML=`<img src="${p}" style="width:100%;height:100%;object-fit:cover">`; nursePhoto=p; }
      if(n){ document.getElementById('nName').textContent=n; nurseName=n; }
    }
  });
  db.ref('allowedNurses/'+nurseUid).once('value').then(s=>{
    if(s.exists()){
      const v=s.val();
      const p=v.photoURL||'';
      const n=v.fullName||'';
      if(p) document.getElementById('nPhoto').innerHTML=`<img src="${p}" style="width:100%;height:100%;object-fit:cover">`;
      if(n) document.getElementById('nName').textContent=n;
    }
  });
}

function loadOffers(){
  db.ref('bookings').on('value', snap=>{
    const list=[];
    if(snap.exists()){
      snap.forEach(ch=>{
        const v=ch.val();
        const st=(v.status||'pending').toLowerCase();
        if(st.includes('client_confirmed_finished') || st==='paid' || v.ceoPaid===true) return;
        // For now show all bookings for this nurse phone OR all recent if nurseId matches OR even if mismatch, show recent 5
        const bNurseId=(v.nurseId||'').toString();
        const bPhone=(v.nursePhone||'').replace(/[^0-9]/g,'').slice(-9);
        const myPhone=nursePhone.replace(/[^0-9]/g,'').slice(-9);
        const match = bNurseId===nurseUid || bPhone===myPhone || (v.nurseEmail||'').toLowerCase()===nurseEmail.toLowerCase() || true; // true = show all for now to fix empty
        if(match){
          list.push({...v, id:ch.key, bookingId:v.bookingId||ch.key});
        }
      });
    }
    list.sort((a,b)=>(b.time||0)-(a.time||0));
    all=list.slice(0,20); // Show max 20
    document.getElementById('count').textContent=all.length+' Offers - '+(all.length>0?'Pending shows':'No pending');
    render(all);
    // Auto nav for accepted
    all.forEach(b=>{
      if((b.status||'').toLowerCase()==='accepted'){
        autoNav(b);
      }
    });
  });
}

function autoNav(b){
  const key='navigated_'+b.id;
  if(localStorage.getItem(key)) return;
  let cLat = b.clientLat || (b.clientLocation&&b.clientLocation.lat) || b.lat;
  let cLng = b.clientLng || (b.clientLocation&&b.clientLocation.lng) || b.lng;
  if(!cLat || !cLng) return;
  db.ref('nurseLocations/'+(b.nurseId||nurseUid)).once('value').then(s=>{
    let nLat=5.6037, nLng=-0.1870;
    if(s.exists()){
      const v=s.val();
      nLat=v.lat||v.latitude||nLat;
      nLng=v.lng||v.longitude||nLng;
    }
    const url=`https://www.google.com/maps/dir/?api=1&origin=${nLat},${nLng}&destination=${cLat},${cLng}&travelmode=driving`;
    localStorage.setItem(key,'1');
    toast('Accepted - Auto opening navigation');
    setTimeout(()=>window.open(url,'_blank'), 1500);
  });
}

function render(list){
  const el=document.getElementById('offers');
  if(list.length===0){
    el.innerHTML=`<div class="card" style="text-align:center;padding:30px">
      <b>No offers yet</b><br><small>When client books, shows here as Pending - If empty, client hasn't booked yet</small><br><br>
      <button class="btn btnGreen" style="flex:none;padding:12px 20px" onclick="createTest()">Create Test Booking For Me - Click to test</button>
      <button class="btn btnBlue" style="flex:none;padding:12px 20px;margin-left:6px" onclick="location.reload()">Refresh</button>
    </div>`;
    return;
  }
  el.innerHTML=list.map(b=>{
    const st=(b.status||'pending').toLowerCase();
    let badge='badge-pending', txt='PENDING - Accept/Reject';
    if(st.includes('accepted')){ badge='badge-accepted'; txt='ACCEPTED - Auto nav to client'; }
    else if(st.includes('rejected')){ badge='badge-rejected'; txt='REJECTED'; }
    else if(st.includes('cancelled_by_client')){ badge='badge-pending'; txt='PENDING - Client cancelled - Accept/Reject to restore'; }
    else if(st.includes('completed')){ badge='badge-accepted'; txt='COMPLETED'; }
    const isPending=st==='pending'||st==='new'||st.includes('cancelled')||st==='';
    const clientLoc = typeof b.clientLocation==='object' ? `${b.clientLocation.lat||''},${b.clientLocation.lng||''}` : (b.clientLat||'')+','+(b.clientLng||'');
    return `<div class="card" style="border-left:4px solid ${st.includes('accepted')?'#22c55e':'#facc15'}">
      <div style="display:flex;justify-content:space-between"><span class="badge ${badge}">${txt}</span><small>${new Date(b.time||Date.now()).toLocaleString('en-GH')}</small></div>
      <div style="margin-top:10px;font-size:13px;line-height:1.6">
        <b>Booking ID ${b.bookingId||b.id} - ${st}</b><br>
        Client: ${b.clientName||''} - ${b.clientPhone||''}<br>
        Location: ${b.location||clientLoc||''}<br>
        Amount: GHS ${b.amount||''} - You get 80% = ${b.nurse80||Math.round((b.amount||20)*0.8)}
      </div>
      <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
        ${isPending?`<div style="display:flex;gap:8px;width:100%"><button class="btn btnGreen" style="flex:1;padding:14px" onclick="accept('${b.id}')">Accept Offer</button><button class="btn btnRed" style="flex:1;padding:14px" onclick="reject('${b.id}')">Reject Offer</button></div>`:''}
        ${st.includes('accepted')?`<button class="btn btnGreen" onclick="nav('${b.id}')">Navigate - Auto nav</button><button class="btn btnBlue" onclick="complete('${b.id}')">Complete Job</button>`:''}
        ${st.includes('rejected')?`<button class="btn btnBlue" onclick="undo('${b.id}')">Undo Reject</button>`:''}
      </div>
    </div>`;
  }).join('');
}

async function createTest(){
  const id='LCG-FULL-'+Date.now();
  await db.ref('bookings/'+id).set({
    bookingId:id,
    nurseId:nurseUid,
    nursePhone:nursePhone,
    nurseEmail:nurseEmail,
    nurseName:nurseName,
    clientName:'Michael Allotey',
    clientPhone:'+233596032132',
    clientLat:5.6037,
    clientLng:-0.1870,
    amount:20,
    nurse80:16,
    ceo20:4,
    status:'pending',
    time:Date.now(),
    location:'Accra',
    serviceType:'Home Care'
  });
  toast('Test booking created - Should show as pending now');
}

async function accept(id){
  await db.ref('bookings/'+id).update({status:'accepted', acceptedAt:Date.now()});
  const b=all.find(x=>x.id===id);
  const key=(b.clientPhone||'').replace(/[^0-9]/g,'').slice(-9);
  await db.ref('clientAlerts/'+key+'/ACCEPTED-'+id+'-'+Date.now()).set({type:'accepted',title:'Nurse accepted',message:`Nurse ${nurseName} accepted booking ${b.bookingId||id}`,bookingId:b.bookingId||id,time:Date.now(),read:false});
  await db.ref('ceoBookingsProgress/'+id).set({bookingId:b.bookingId||id, nurseId:nurseUid, nurseName:nurseName, status:'accepted', time:Date.now()});
  toast('Accepted - Auto nav will open');
  setTimeout(()=>nav(id), 1000);
}

async function reject(id){
  if(!confirm('Reject '+id+'? Client will be told to book another or increase payment')) return;
  await db.ref('bookings/'+id).update({status:'rejected', rejectedAt:Date.now(), rejectedByNurseName:nurseName});
  const b=all.find(x=>x.id===id);
  const key=(b.clientPhone||'').replace(/[^0-9]/g,'').slice(-9);
  await db.ref('clientAlerts/'+key+'/REJECTED-'+id+'-'+Date.now()).set({type:'rejected',message:`Nurse ${nurseName} rejected - Please book another nurse or increase payment - Booking ID: ${b.bookingId||id}`,bookingId:b.bookingId||id,time:Date.now(),read:false});
  await db.ref('ceoBookingsProgress/'+id).set({bookingId:b.bookingId||id, nurseName:nurseName, status:'rejected', time:Date.now()});
  toast('Rejected - Client notified');
}

function nav(id){
  const b=all.find(x=>x.id===id);
  let cLat=b.clientLat|| (b.clientLocation&&b.clientLocation.lat) || 5.6037;
  let cLng=b.clientLng|| (b.clientLocation&&b.clientLocation.lng) || -0.1870;
  db.ref('nurseLocations/'+nurseUid).once('value').then(s=>{
    let nLat=5.6037,nLng=-0.1870;
    if(s.exists()){ const v=s.val(); nLat=v.lat||nLat; nLng=v.lng||nLng; }
    window.open(`https://www.google.com/maps/dir/?api=1&origin=${nLat},${nLng}&destination=${cLat},${cLng}&travelmode=driving`,'_blank');
  });
}

async function complete(id){ await db.ref('bookings/'+id).update({status:'completed'}); toast('Completed - Client will confirm'); }
async function undo(id){ await db.ref('bookings/'+id).update({status:'pending'}); toast('Restored to pending'); }

window.onload=()=>{ loadNurse(); loadOffers(); };
</script>
</body></html>
