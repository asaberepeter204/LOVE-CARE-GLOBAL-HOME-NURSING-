          React.createElement('button',{className:'btn-gold',style:{flex:1},onClick:()=>{
            rtdb.ref('myJobOffers/'+nurse.id+'/'+selAccept.id).update({status:'ACCEPTED', acceptedAt:Date.now(), lastUpdate:Date.now()});
            rtdb.ref('bookings/'+selAccept.id).update({status:'accepted', nurseId:nurse.id, nurseName:nurse.fullName, acceptedAt:Date.now(), lastUpdate:Date.now()});
            rtdb.ref('acceptedBookings/'+selAccept.id).update({status:'accepted', nurseId:nurse.id, nurseName:nurse.fullName, clientName:selAccept.clientName, acceptedAt:Date.now(), lastUpdate:Date.now()});
            rtdb.ref('ceoBookings/'+selAccept.id).update({status:'accepted', nurseId:nurse.id, nurseName:nurse.fullName, clientName:selAccept.clientName, acceptedAt:Date.now(), lastUpdate:Date.now()});
            const arr=offers.map(o=>o.id===selAccept.id?{...o,status:'ACCEPTED'}:o);setOffers(arr);
            showToast('✅ Accepted — GPS STARTED');startNurseGPSTracking(selAccept.id, nurse, 'accepted');setSelAccept(null);
          }},'✅ Accept + Start GPS'),
          React.createElement('button',{className:'btn-ghost',style:{flex:1},onClick:()=>setSelAccept(null)},'Cancel')
        )
      )
    ),
    toast&&React.createElement('div',{className:'toast'},toast),
    React.createElement('div',{id:'gpsBar',className:'gps-bar'},
      React.createElement('div',{style:{maxWidth:1240,margin:'0 auto',display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap'}},
        React.createElement('div',{style:{display:'flex',gap:10,alignItems:'center'}},
          React.createElement('span',{className:'gps-dot'}),
          React.createElement('div',null,
            React.createElement('div',{style:{fontSize:12,fontWeight:700,color:'#34d399'}},'🛰️ LIVE GPS Tracking — CEO Monitoring You'),
            React.createElement('div',{id:'gpsBarText',style:{fontSize:11,color:'var(--muted)'}},gpsInfo.lat?`📍 ${gpsInfo.lat.toFixed(5)}, ${gpsInfo.lng.toFixed(5)} • Updates every 10s`:'Starting GPS...')
          )
        ),
        React.createElement('div',{style:{display:'flex',gap:6}},
          React.createElement('a',{id:'gpsSosLink',href:`sos.html?bookingId=${currentTrackingBookingId||''}`,style:{padding:'6px 12px',borderRadius:999,background:'rgba(239,68,68,.15)',color:'#fca5a5',textDecoration:'none',fontSize:11,fontWeight:700,border:'1px solid rgba(239,68,68,.25)'}},'🚨 SOS → sos.html'),
          React.createElement('button',{onClick:()=>stopNurseGPSTracking(),style:{padding:'6px 12px',borderRadius:999,background:'rgba(255,255,255,.06)',color:'var(--text)',fontSize:11,fontWeight:700,border:'1px solid var(--line)',cursor:'pointer'}},'⏹️ Stop GPS')
        )
      )
    )
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
