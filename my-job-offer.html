                    (o.status==='ACCEPTED'||o.status==='accepted')&&React.createElement(React.Fragment,null,
                      React.createElement('button',{className:'btn-nav',style:{flex:1},onClick:()=>openGoogleMapsNavigation(navLat, navLng, gpsInfo.lat, gpsInfo.lng)},'🧭 Navigate to PATIENT'),
                      React.createElement('button',{className:'btn-gold',style:{background:'#facc15'},onClick:()=>{updateNurseStatus(o.id,'ENROUTE',nurse); setOffers(prev=>prev.map(x=>x.id===o.id?{...x,status:'ENROUTE'}:x)); showToast('🚗 En Route to PATIENT — GPS LIVE'); if(!isTracking) startNurseGPSTracking(o.id,nurse,'enRoute'); openGoogleMapsNavigation(navLat, navLng, gpsInfo.lat, gpsInfo.lng);}},'🚗 En Route + NAV')

                    (o.status==='ENROUTE'||o.status==='enRoute')&&React.createElement(React.Fragment,null,

                  ),

                    React.createElement('button',{className:'btn-purple',style:{flex:1},onClick:()=>complainAboutClient(o)},'⚠️ Complain About Client — CEO sees LIVE')

        React.createElement('div',{className:'card',style:{padding:20}},
          React.createElement('h3',{style:{margin:0,fontFamily:'Fraunces'}},'Wallet - '+nurse.fullName),

            React.createElement('div',{style:{fontSize:11,color:'var(--faint)'}},'Current Balance • LIVE'),
            React.createElement('div',{style:{fontSize:26,fontWeight:700}},'GHS '+Math.round(stats.balanceGHS)),
            React.createElement('div',{style:{fontSize:11,color:'var(--muted)',marginTop:6}},`≈ $${stats.balanceUSD.toFixed(2)} USD`)
          ),
          React.createElement('div',{style:{marginTop:12,fontSize:11,color:'var(--muted)',background:'rgba(34,197,94,.08)',padding:10,borderRadius:10,border:'1px solid rgba(34,197,94,.15)'}},'🏥 NEW: Client books for family at different places — Nurse navigates to PATIENT location, not client location — Call Patient phone directly!')
        )

    ),
    selAccept&&React.createElement('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',display:'grid',placeItems:'center',zIndex:50,padding:20}},
      React.createElement('div',{className:'card',style:{padding:24,maxWidth:480,width:'100%'}},
        React.createElement('h3',{style:{margin:0,fontFamily:'Fraunces'}},'✅ Accept Job + Navigate to PATIENT?'),
        (()=>{
          const pLoc=getPatientLocation(selAccept); const cLoc=getClientLocation(selAccept); const navLat=pLoc.lat||cLoc.lat; const navLng=pLoc.lng||cLoc.lng;

            `Patient: ${selAccept.patientName||'Patient'}`,React.createElement('br'),

            `Patient Address: ${selAccept.patientLocation||selAccept.patientAddress||''}`,React.createElement('br'),
            `Client: ${selAccept.clientName||''} — ${selAccept.clientPhone||''}`,React.createElement('br'),
            `Amount: GH₵ ${selAccept.amount||0}`,React.createElement('br'),

            React.createElement('div',{style:{background:'rgba(34,197,94,.12)',borderRadius:10,padding:10,border:'1px solid rgba(34,197,94,.2)'}},
              React.createElement('div',{style:{fontSize:11,fontWeight:700,color:'#34d399'}},'🧭 What happens:'),
              React.createElement('div',{style:{fontSize:11,marginTop:4,lineHeight:1.5}},'1. ✅ ACCEPTED',React.createElement('br'),'2. 🛰️ GPS STARTS — CEO sees LIVE',React.createElement('br'),'3. 🗺️ Maps auto-opens to PATIENT house',React.createElement('br'),'4. 🚗 Navigate to PATIENT')
            )

            const pLoc=getPatientLocation(selAccept); const cLoc=getClientLocation(selAccept); const navLat=pLoc.lat||cLoc.lat; const navLng=pLoc.lng||cLoc.lng;
            rtdb.ref('myJobOffers/'+nurse.id+'/'+selAccept.id).update({status:'ACCEPTED', acceptedAt:Date.now(), lastUpdate:Date.now()});
            rtdb.ref('bookings/'+selAccept.id).update({status:'accepted', nurseId:nurse.id, nurseName:nurse.fullName, acceptedAt:Date.now()});
            const arr=offers.map(o=>o.id===selAccept.id?{...o,status:'ACCEPTED'}:o);setOffers(arr);
            showToast('✅ Accepted — GPS + Navigate to PATIENT');
            startNurseGPSTracking(selAccept.id, nurse, 'accepted');
            setTimeout(()=>{ if(navLat&&navLng){ openGoogleMapsNavigation(navLat, navLng, lastLat, lastLng); } },800);
            setSelAccept(null);

      React.createElement('div',{style:{maxWidth:1240,margin:'0 auto',display:'flex',justifyContent:'space-between',alignItems:'center',gap:12}},
        React.createElement('div',{style:{display:'flex',gap:10,alignItems:'center'}},
          React.createElement('span',{className:'gps-dot'}),
          React.createElement('div',null,
