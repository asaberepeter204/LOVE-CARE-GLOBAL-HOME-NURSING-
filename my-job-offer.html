function getSavedNurseTone(){
  return {
    type: localStorage.getItem('nurse_tone_type')||'preset',
    id: localStorage.getItem('nurse_tone_id')||'new_booking_beep',
    name: localStorage.getItem('nurse_tone_name')||'New Booking Beep — Ding Ding',
    base64: localStorage.getItem('nurse_tone_base64')||'',
    time: localStorage.getItem('nurse_tone_time')||'',
    smsEnabled: localStorage.getItem('nurse_sms_enabled')||'true'
  };
}
function playNursePreset(id){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);
    if(id==='new_booking_beep'){o.frequency.value=800;g.gain.value=.18;o.start();setTimeout(()=>{o.frequency.value=1200;},150);setTimeout(()=>{o.stop();ctx.close();},600);}
    else if(id==='urgent_booking'){o.frequency.value=600;g.gain.value=.22;o.type='sawtooth';o.start();let c=0;const int=setInterval(()=>{o.frequency.value=c%2?600:1000;c++;if(c>10){clearInterval(int);o.stop();ctx.close();}},120);}
    else if(id==='cash_sound'){o.frequency.value=523;g.gain.value=.18;o.start();setTimeout(()=>{o.frequency.value=659;},120);setTimeout(()=>{o.frequency.value=784;},240);setTimeout(()=>{o.frequency.value=1046;},360);setTimeout(()=>{o.stop();ctx.close();},800);}
    else if(id==='gentle_bell'){o.frequency.value=1000;g.gain.value=.12;o.type='sine';o.start();g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+1);setTimeout(()=>{o.stop();ctx.close();},1000);}
    else if(id==='afrobeat_nurse'){o.frequency.value=180;g.gain.value=.18;o.start();setTimeout(()=>{o.frequency.value=250;},100);setTimeout(()=>{o.frequency.value=180;},200);setTimeout(()=>{o.frequency.value=350;},300);setTimeout(()=>{o.stop();ctx.close();},700);}
    else {o.frequency.value=900;g.gain.value=.15;o.start();setTimeout(()=>{o.stop();ctx.close();},500);}
  }catch(e){}
}

async function sendSMSToNurse(toPhone,message,bookingData){

  let phone=toPhone.replace(/[^0-9+]/g,''); if(phone.startsWith('0')) phone='+233'+phone.slice(1); if(!phone.startsWith('+')) phone='+'+phone;
  try{
    if(SMS_CONFIG_NURSE.useCloudFunction){
      await fetch(SMS_CONFIG_NURSE.cloudFunctionUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:phone,message,nurseName:bookingData?.nurseName||'',nursePhone:toPhone,clientName:bookingData?.clientName||'',clientPhone:bookingData?.clientPhone||'',clientPhotoUrl:bookingData?.clientPhotoUrl||'',bookingId:bookingData?.bookingId||bookingData?.id||'',time:Date.now(),timeStr:new Date().toLocaleString('en-GH')})});

window.ringNurseTone=ringNurseTone; window.playNursePreset=playNursePreset;

function extractPhoto(obj){
  if(!obj) return null;
  const keys=['photoURL','photoUrl','photo','image','avatar','profilePhoto','profileImage','picture','photo_url','imageUrl','avatarUrl','profilePic','nursePhoto','nursePhotoUrl'];
  for(const k of keys){
    const v=obj[k];
    if(v && typeof v==='string' && v.length>5 && (v.startsWith('http')||v.startsWith('data:image'))){ return v; }
    if(v && typeof v==='object' && v.url) return v.url;
  }
  return null;
}
function getNurse(){
  const directUidKeys=['lcg_nurse_uid','nurseUid','currentNurseId','currentNurseUid','nurseId','uid','nurse_uid','nurseUidBig','nurse_id','current_nurse_uid'];
  const photoKeysDirect=['nursePhoto','nursePhotoUrl','nurse_photo','nurseAvatar','currentNursePhoto','nurse_profile_photo','photoURL','photoUrl','photo','avatar','profilePhoto'];
  let realUid=null;
  let directPhoto=null;
  // Check direct storage for uid and photo
  for(const store of [localStorage, sessionStorage]){
    for(const k of directUidKeys){
      try{ const v=store.getItem(k); if(v && v.length>=10 && !v.includes(' ') && !v.includes('@')){ realUid=v; break; } }catch{}
    }
    for(const k of photoKeysDirect){
      try{ const v=store.getItem(k); if(v && (v.startsWith('http')||v.startsWith('data:image'))){ directPhoto=v; } }catch{}
    }
    if(realUid && directPhoto) break;
  }
  
  const KEYS=['nurse','nurseData','currentUser','user','auth_user','nurse_profile','nurseProfile','currentNurse','lcg_nurse_profile','nurseInfo','nurse_data','loggedNurse','authNurse'];
  for(const store of [localStorage, sessionStorage]){
    for(const k of KEYS){
      try{
        const raw=store.getItem(k); if(!raw) continue;
        let d=null;
        try{ d=JSON.parse(raw); }catch{ 
          if(raw.startsWith('http')){ directPhoto=raw; continue; }
          continue; 
        }
        const o=d.user||d.nurse||d.data||d.profile||d;
        const full=o.fullName||o.name||o.displayName||o.full_name||o.nurseName;
        const uid=o.uid||o.id||o.nurseId||o.nurseUid||o.userId||realUid;
        const photo=extractPhoto(o)||extractPhoto(d)||directPhoto;
        if(full || uid || photo){
          const finalId = uid || realUid || (full?full.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,''):'nurse');
          return {id:finalId, uid:uid||realUid, fullName:full||'Nurse', firstName:o.firstName||(full?full.split(' ')[0]:'Nurse'), location:o.location||'Accra', photo:photo||directPhoto||null, phone:o.phone||o.phoneNumber||o.phone_number||''};
        }
      }catch{}
    }
  }
  
  if(realUid){
    const nameFromStorage = localStorage.getItem('nurseName')||localStorage.getItem('fullName')||localStorage.getItem('currentNurseName')||localStorage.getItem('nurse_fullName')||'Nurse';
    const phoneFromStorage = localStorage.getItem('nursePhone')||localStorage.getItem('phone')||'';
    return {id:realUid, uid:realUid, fullName:nameFromStorage, firstName:nameFromStorage.split(' ')[0], location:'Accra', photo:directPhoto||null, phone:phoneFromStorage};
  }
  
  const p=new URLSearchParams(location.search); const q=p.get('nurse')||p.get('name')||p.get('nurseId')||p.get('uid')||p.get('photo')||p.get('photoUrl');
  const qPhoto=p.get('photo')||p.get('photoUrl')||p.get('photoURL');
  if(q) {
    if(q.length>15) return {id:q, uid:q, fullName:q, firstName:q.split(' ')[0], location:'Accra', photo:qPhoto||directPhoto||null, phone:''};
    return {id:q.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,''), uid:q, fullName:q, firstName:q.split(' ')[0], location:'Accra', photo:qPhoto||directPhoto||null, phone:''};
  }
  return {id:realUid||'demo-nurse', uid:realUid||'demo-nurse', fullName:'Nurse', firstName:'Nurse', location:'Accra', photo:directPhoto||null, phone:''};
}
let nurseWatchId=null;let lastLat=null;let lastLng=null;let isTracking=false;
function calcDistance(lat1,lon1,lat2,lon2){if(!lat1||!lon1||!lat2||!lon2) return 0;const R=6371;const dLat=(lat2-lat1)*Math.PI/180;const dLon=(lon2-lon1)*Math.PI/180;const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));return R*c;}
function shareNurseLocation(pos, bookingId, nurse, status){
  const lat=pos.coords.latitude;const lng=pos.coords.longitude;
  if(lastLat&&lastLng){const dist=calcDistance(lastLat,lastLng,lat,lng)*1000;if(dist<5) return;}
  lastLat=lat; lastLng=lng;
  const locationData={lat,lng,nurseLat:lat,nurseLng:lng,lastUpdate:Date.now(),updatedAt:Date.now(),nurseId:nurse.id,nurseName:nurse.fullName,bookingId,isLive:true,status:status||'enRoute'};
  const updates={};updates[`nurseLocations/${nurse.id}`]=locationData;updates[`liveNurseLocations/${bookingId}`]=locationData;updates[`ceoBookings/${bookingId}/nurseLat`]=lat;updates[`ceoBookings/${bookingId}/nurseLng`]=lng;updates[`ceoBookings/${bookingId}/lastUpdate`]=Date.now();rtdb.ref().update(updates);
}
function startNurseGPSTracking(bookingId, nurse, status){
  if(!navigator.geolocation){return;}
  navigator.geolocation.getCurrentPosition((pos)=>{
    shareNurseLocation(pos, bookingId, nurse, status||'accepted');isTracking=true;
    if(nurseWatchId) navigator.geolocation.clearWatch(nurseWatchId);
    nurseWatchId=navigator.geolocation.watchPosition((pos)=>shareNurseLocation(pos, bookingId, nurse, 'enRoute'),()=>{}, {enableHighAccuracy:true,maximumAge:5000,timeout:10000});
    const bar=document.getElementById('gpsBar'); if(bar) bar.classList.add('active');
  },{},{enableHighAccuracy:true,timeout:10000});
}
function stopNurseGPSTracking(){if(nurseWatchId){navigator.geolocation.clearWatch(nurseWatchId);nurseWatchId=null;}isTracking=false;const bar=document.getElementById('gpsBar'); if(bar) bar.classList.remove('active');}

    // Try primary ID first
    const offersRef=rtdb.ref('myJobOffers/'+nurseId);

      for(const idToCheck of uniqueIds){
        try{
          const s=await rtdb.ref('myJobOffers/'+idToCheck).once('value');
          if(s.exists()){
            s.forEach(ch=>{ const v=ch.val(); const bid=ch.key; if(!allOffersMap[bid]) allOffersMap[bid]=v; });
          }
        }catch(e){}
      }
      // Fallback: check ceoBookings where nurseId matches
      try{
        const ceoSnap=await rtdb.ref('ceoBookings').once('value');

          ceoSnap.forEach(ch=>{
            const v=ch.val();
            const bid=ch.key;
            if(v.nurseId && uniqueIds.includes(v.nurseId) && !allOffersMap[bid]){
              allOffersMap[bid]=v;
            }
          });
        }
      }catch(e){}
    };
    
    offersRef.on('value', async snap=>{
      await checkAllIds();
      let val=snap.val();
      // Merge with allOffersMap
      const merged={...(val||{}), ...allOffersMap};
      const arr = Object.keys(merged).length ? Object.values(merged).sort((a,b)=>(b.time||0)-(a.time||0)) : [];
      const newIds=new Set(arr.map(o=>o.id));
      const prevIds=prevIdsRef.current;
      let hasNewBooking=false; let newBookingObj=null;
      for(const o of arr){ if(!prevIds.has(o.id)){ hasNewBooking=true; newBookingObj=o; break; } }
      if(hasNewBooking && prevCountRef.current>0){
        setTimeout(()=>{ 
          ringNurseTone(newBookingObj);

          sendSMSToNurse(nurse.phone||newBookingObj.nursePhone||newBookingObj.clientPhone||'', msg, newBookingObj);
        },300);

      prevIdsRef.current=newIds;

      setStats({ totalJobs: arr.length, activeJobs: active, rating: 0, reviews: 0, balanceGHS: balance, balanceUSD: balance/15.5 });setLoading(false);

            React.createElement('div',{style:{marginTop:10,background:'rgba(250,204,21,.08)',border:'1px solid rgba(250,204,21,.2)',borderRadius:10,padding:8,fontSize:11,color:'#facc15'}},`🎵 Tone: ${getSavedNurseTone().name} • SMS: ${getSavedNurseTone().smsEnabled==='true'?'ON':'OFF'} • When client books, this rings + SMS!`)
          )
        )
      )
    ),
    selAccept&&React.createElement('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',display:'grid',placeItems:'center',zIndex:50,padding:20}},
      React.createElement('div',{className:'card',style:{padding:24,maxWidth:480,width:'100%'}},
        React.createElement('h3',{style:{margin:0,fontFamily:'Fraunces'}},'✅ Accept Job?'),
        React.createElement('div',{style:{fontSize:13,color:'var(--muted)',marginTop:10}},`Patient: ${selAccept.patientName||'Patient'} — Amount: GH₵ ${selAccept.amount||0}`),
        React.createElement('div',{style:{display:'flex',gap:10,marginTop:16}},
          React.createElement('button',{className:'btn-nav',style:{flex:1.5,background:'linear-gradient(135deg,#22c55e,#16a34a)',fontWeight:900},onClick:()=>{
            const pLoc=getPatientLocation(selAccept); const cLoc=getClientLocation(selAccept); const navLat=pLoc.lat||cLoc.lat; const navLng=pLoc.lng||cLoc.lng;
            const acceptData={
              status:'accepted', 
              acceptedAt:Date.now(), 
              acceptedAtStr:new Date().toLocaleString('en-GH'),
              nurseId:nurse.id, 
              nurseName:nurse.fullName,
              nursePhone:nurse.phone||'',
              acceptedByNurse:true
            };
            // FIX: Update ALL nodes so Client My Bookings shows ACCEPTED instantly
            rtdb.ref('myJobOffers/'+nurse.id+'/'+selAccept.id).update(acceptData);
            rtdb.ref('bookings/'+selAccept.id).update(acceptData).catch(()=>{});
            rtdb.ref('ceoBookings/'+selAccept.id).update(acceptData).catch(()=>{});
            rtdb.ref('allBookings/'+selAccept.id).update(acceptData).catch(()=>{});
            rtdb.ref('nurseBookings/'+nurse.id+'/'+selAccept.id).update(acceptData).catch(()=>{});
            if(selAccept.clientId||selAccept.clientUid){
              const cid=selAccept.clientId||selAccept.clientUid;
              rtdb.ref('clientBookings/'+cid+'/'+selAccept.id).update(acceptData).catch(()=>{});
            }
            if(selAccept.clientEmail){
              const ekey=selAccept.clientEmail.toLowerCase().trim().replace(/[.#$@\[\]]/g,'_');
              rtdb.ref('clientBookings/'+ekey+'/'+selAccept.id).update(acceptData).catch(()=>{});
            }
            setOffers(arr=>arr.map(o=>o.id===selAccept.id?{...o,status:'ACCEPTED'}:o));
            showToast('✅ ACCEPTED — Client will see Accepted in My Bookings now!');
            startNurseGPSTracking(selAccept.id, nurse, 'accepted');
            setTimeout(()=>{ if(navLat&&navLng){ openGoogleMapsNavigation(navLat, navLng, lastLat, lastLng); } },800);
            setSelAccept(null);
          }},'✅ ACCEPT — Client sees Accepted! + GPS + Navigate'),
          React.createElement('button',{className:'btn-ghost',style:{flex:1},onClick:()=>setSelAccept(null)},'Cancel')
        )
      )
    ),
    toast&&React.createElement('div',{className:'toast'},toast),
    React.createElement('div',{id:'gpsBar',className:'gps-bar'},
      React.createElement('div',{style:{maxWidth:1240,margin:'0 auto',display:'flex',justifyContent:'space-between',alignItems:'center',gap:10}},
        React.createElement('div',{style:{display:'flex',gap:10,alignItems:'center'}},
          React.createElement('span',{className:'gps-dot'}),
          React.createElement('b',{style:{fontSize:12}},'🛰️ GPS LIVE'),
          React.createElement('span',{style:{fontSize:11,color:'var(--muted)'}}, gpsInfo.lat?`${gpsInfo.lat.toFixed(5)}, ${gpsInfo.lng.toFixed(5)}`:'Getting location...')
        ),
        React.createElement('button',{className:'btn-ghost',style:{padding:'6px 12px',fontSize:11},onClick:()=>stopNurseGPSTracking()},'Stop GPS')
      )
    )
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body></html>
