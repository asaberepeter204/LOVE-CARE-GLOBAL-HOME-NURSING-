<style>

.topbar{position:sticky;top:0;z-index:9999;background:rgba(14,10,28,.96);backdrop-filter:blur(18px);border-bottom:1px solid rgba(168,85,247,.15);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.card{background:rgba(28,18,56,.85);border:1px solid rgba(168,85,247,.15);border-radius:20px;padding:18px;margin:12px 0}
.btn{border:none;border-radius:14px;padding:14px 18px;font-weight:900;cursor:pointer;font-size:13px;pointer-events:auto!important;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;position:relative;z-index:10;min-height:48px;display:inline-flex;align-items:center;justify-content:center;transition:.15s}

<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);
const rtdb = firebase.database();
const auth = firebase.auth();

let nurseId = localStorage.getItem('lcg_nurse_uid') || localStorage.getItem('nurseId') || 'demo1';
let allJobs = [];
let authReady = false;

async function ensureAuth(){
  return new Promise((res)=>{
    const unsub = auth.onAuthStateChanged(user=>{
      unsub();
      if(user){ authReady=true; res(user); }
      else {
        auth.signInAnonymously().then(cred=>{ authReady=true; res(cred.user); }).catch(e=>{ console.log('Auth anon failed', e.message); res(null); });
      }
    });
    setTimeout(()=>res(null), 3000);
  });
}

function getNurseId(){
  let id = localStorage.getItem('lcg_nurse_uid');
  if(!id) id = localStorage.getItem('nurseId');
  if(!id) {
    const urlParams = new URLSearchParams(location.search);
    id = urlParams.get('nurseId') || urlParams.get('id') || 'TyMqk6B7SncJoA9HsTNK3xIkHJD2';
  }
  return id;
}

function renderFiltered(){
  const filter = document.getElementById('filterStatus').value;
  const grid = document.getElementById('jobGrid');
  const countInfo = document.getElementById('countInfo');
  let filtered = allJobs;
  if(filter!=='all') filtered = allJobs.filter(j=>(j.status||'pending')===filter);
  countInfo.textContent = `${filtered.length} ${filter} — REAL WORKING BUTTONS — Tap Accept/Reject`;
  if(!filtered.length){
    grid.innerHTML = `<div style="padding:20px;text-align:center;color:#6b7280">No ${filter} bookings — When client books you via book-nurse (Full or 50% GHS/USD), it appears here + CEO Dashboard<br><br><small style="font-size:9px">If buttons show like picture, hard refresh: Ctrl+Shift+R or Clear Cache</small></div>`;
    return;
  }
  grid.innerHTML = filtered.map(job=>{
    const status = (job.status||'pending').toLowerCase();
    const isPending = status==='pending';
    const badgeClass = status==='accepted'?'badge-accepted':status==='rejected'?'badge-rejected':'badge-pending';
    const mapsLink = job.clientLat ? `https://www.google.com/maps?q=${job.clientLat},${job.clientLng}` : `https://www.google.com/maps?q=5.6037,-0.1870`;
    const nurseShare = job.amountSplit ? job.amountSplit.nurse : (job.amount*0.8).toFixed(2);
    const curr = job.currency||'GHS';
    const safeId = (job.id||'').replace(/'/g, '').replace(/"/g, '');
    const is50 = job.paymentMethod==='paystack_50_50';
    return `<div class="card" style="border-color:${isPending?'rgba(245,158,11,.3)':status==='accepted'?'rgba(34,197,94,.3)':'rgba(239,68,68,.3)'};border-width:2px">
      <div style="display:flex;justify-content:space-between;align-items:start;gap:10px">
        <div><b style="color:#f3e8ff;font-size:14px">${job.bookingId||job.id}</b><br><span class="badge ${badgeClass}" style="margin-top:6px">${status.toUpperCase()}</span> ${is50?'<span style="background:#f59e0b;color:#1e0a3a;padding:2px 6px;border-radius:999px;font-size:8px">50%+CASH</span>':'<span style="background:#a855f7;color:white;padding:2px 6px;border-radius:999px;font-size:8px">FULL</span>'} <span style="background:rgba(34,197,94,.15);padding:2px 6px;border-radius:999px;font-size:8px;color:#86efac">REAL BUTTONS</span></div>
        <div style="text-align:right"><small style="color:#86efac;font-weight:900">${curr} ${job.amount||0} (You: ${curr} ${nurseShare})</small><br><small style="color:#6b7280;font-size:9px">${new Date(job.time||Date.now()).toLocaleString()} | ${curr} ${job.hourlyRateUsed||'?'}/hr</small></div>
      </div>
      <div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11px;color:#c4b5fd">
        <div>👤 ${job.clientName||''}<br><a href="tel:${job.phone}" style="color:#4ade80">📞 ${job.phone||''}</a><br>🧑‍⚕️ Patient: ${job.patientName||''}</div>
        <div>🕐 ${job.totalHours||9} hrs (${job.startTime||'08:00'}→${job.endTime||'17:00'})<br>📦 ${job.careMode||'Daily'} x${job.quantity||1}<br>🚚 Transport: ${curr} ${job.transport||0}</div>
      </div>
      <div style="margin-top:8px;font-size:10px;color:#a78bfa">📍 ${job.clientLat?`${job.clientLat.toFixed(4)}, ${job.clientLng.toFixed(4)}`:'No location'} | Paystack: ${job.paystackRef||''} | ${curr} — CEO Dashboard also has this</div>
      
      <div style="display:flex;gap:8px;margin-top:16px">
        ${isPending?`
          <button type="button" class="btn btnAccept" data-action="accept" data-id="${safeId}" style="flex:1" onclick="acceptJob('${safeId}')">✅ Accept</button>
          <button type="button" class="btn btnReject" data-action="reject" data-id="${safeId}" style="flex:1" onclick="rejectJob('${safeId}')">❌ Reject</button>
        `:`<button type="button" class="btn" style="flex:1;background:rgba(76,29,149,.18);color:#a78bfa" disabled>${status==='accepted'?'✅ Accepted':'❌ Rejected'}</button>`}
        <a href="tel:${job.phone}" class="btn btnView" style="text-align:center;min-width:56px">📞</a>
        <a href="${mapsLink}" target="_blank" class="btn btnView" style="text-align:center;min-width:56px">🗺️</a>
      </div>
      <div style="font-size:8px;color:#6b7280;margin-top:8px;text-align:center">ID: ${safeId} — Buttons are REAL with click + touch — Firebase auth: ${authReady?'OK':'loading...'} — If like picture, hard refresh</div>
    </div>`;
  }).join('');
  
  // Attach real listeners (double ensure)
  setTimeout(()=>{
    document.querySelectorAll('[data-action="accept"]').forEach(btn=>{
      const id = btn.getAttribute('data-id');
      btn.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); console.log('Accept btn clicked', id); acceptJob(id); }, {passive:false});
      btn.addEventListener('touchend', (e)=>{ e.preventDefault(); e.stopPropagation(); console.log('Accept touch', id); acceptJob(id); }, {passive:false});
    });
    document.querySelectorAll('[data-action="reject"]').forEach(btn=>{
      const id = btn.getAttribute('data-id');
      btn.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); console.log('Reject btn clicked', id); rejectJob(id); }, {passive:false});
      btn.addEventListener('touchend', (e)=>{ e.preventDefault(); e.stopPropagation(); console.log('Reject touch', id); rejectJob(id); }, {passive:false});
    });
  }, 150);
}

window.loadBookings = async function(){
  await ensureAuth();
  nurseId = getNurseId();
  const grid = document.getElementById('jobGrid');
  const debug = document.getElementById('debugInfo');
  grid.innerHTML = `<div style="padding:20px;text-align:center;color:#6b7280">Loading bookings for nurse ${nurseId}... Auth: ${authReady?'OK':'...'}<br><small>Reading from nurseBookings/${nurseId} + jobOffers + bookings</small></div>`;
  debug.textContent = `NurseId: ${nurseId} | Auth: ${authReady?'OK':auth.currentUser?'OK':'no'} | Loading...`;
  
  let jobsMap = {};
  const paths = ['nurseBookings/'+nurseId, 'myJobOffers/'+nurseId, 'jobOffers', 'bookings'];
  
  for(let p of paths){
    try{
      const snap = await rtdb.ref(p).once('value');
      if(snap.exists()){
        snap.forEach(child=>{
          const v = child.val();
          const id = child.key;
          if(p==='jobOffers' || p==='bookings'){
            if(v.nurseId===nurseId || !v.nurseId || v.nurseId==='demo1'){
              if(!jobsMap[id] || (v.time||0) > (jobsMap[id].time||0)) jobsMap[id]= {...v, id};
            }
          } else {
            if(!jobsMap[id] || (v.time||0) > (jobsMap[id].time||0)) jobsMap[id]= {...v, id};
          }
        });
      }
    }catch(e){ console.log('Load error', p, e.message); debug.textContent += ` | Error ${p}: ${e.message}`; }
  }
  
  let jobs = Object.values(jobsMap);
  if(jobs.length===0){
    jobs = [
      {id:'LCG-20251016-ABC123', bookingId:'LCG-20251016-ABC123', clientName:'ASABERE PETER', phone:'+233544121814', patientName:'John Doe', nurseId:nurseId, amount:244, amountPaidNow:244, currency:'GHS', paymentMethod:'paystack_full', status:'pending', totalHours:9, hrsPerDay:9, startTime:'08:00', endTime:'17:00', careMode:'Daily', quantity:1, transport:0, clientLat:5.6037, clientLng:-0.1870, time:Date.now(), hourlyRateUsed:17, amountSplit:{nurse:'195.20'}}
    ];
    debug.textContent += ' | No bookings found, showing demo LCG-20251016-ABC123';
  } else {
    debug.textContent = `NurseId: ${nurseId} | Found ${jobs.length} bookings | Auth OK | Real buttons enabled`;
  }
  allJobs = jobs.sort((a,b)=>(b.time||0)-(a.time||0));
  renderFiltered();
}

function startRealtimeListener(){
  nurseId = getNurseId();
  try{
    rtdb.ref('nurseBookings/'+nurseId).on('value', (snap)=>{
      let jobsMap = {};
      if(snap.exists()){
        snap.forEach(child=>{ const v = child.val(); jobsMap[child.key]= {...v, id:child.key}; });
      }
      Object.values(jobsMap).forEach(j=>{
        const idx = allJobs.findIndex(x=>x.id===j.id);
        if(idx===-1) allJobs.unshift(j);
        else allJobs[idx]=j;
      });
      allJobs.sort((a,b)=>(b.time||0)-(a.time||0));
      renderFiltered();
      document.getElementById('liveInfo').innerHTML = '<span class="dot"></span> Live — Last: '+new Date().toLocaleTimeString()+' — Real buttons';
    });
  }catch(e){ console.log('Realtime error', e.message); }
}

window.acceptJob = async function(bookingId){
  console.log('>>> ACCEPT CLICKED', bookingId, 'nurseId', nurseId, 'auth', authReady);
  if(!bookingId){ alert('❌ Invalid booking ID'); return; }
  const btn = document.querySelector(`[data-id="${bookingId}"][data-action="accept"]`);
  if(btn){ btn.textContent='⏳ Accepting...'; btn.disabled=true; }
  try{
    await ensureAuth();
    const updates = {};
    updates['bookings/'+bookingId+'/status'] = 'accepted';
    updates['ceoBookings/'+bookingId+'/status'] = 'accepted';
    updates['allBookings/'+bookingId+'/status'] = 'accepted';
    updates['nurseBookings/'+nurseId+'/'+bookingId+'/status'] = 'accepted';
    updates['myJobOffers/'+nurseId+'/'+bookingId+'/status'] = 'accepted';
    updates['jobOffers/'+bookingId+'/status'] = 'accepted';
    updates['bookings/'+bookingId+'/acceptedAt'] = Date.now();
    updates['nurseBookings/'+nurseId+'/'+bookingId+'/acceptedAt'] = Date.now();
    updates['bookings/'+bookingId+'/acceptedBy'] = nurseId;
    updates['jobOffers/'+bookingId+'/acceptedBy'] = nurseId;
    console.log('Updating Firebase...', updates);
    await rtdb.ref().update(updates);
    const idx = allJobs.findIndex(j=>j.id===bookingId);
    if(idx!==-1){ allJobs[idx].status='accepted'; allJobs[idx].acceptedAt=Date.now(); }
    renderFiltered();
    alert('✅ ACCEPTED — Booking '+bookingId+' accepted!\n\nCEO Dashboard will show accepted.\nClient can be contacted now.\n\nButtons are REAL WORKING — not picture!');
  }catch(e){ 
    console.error('Accept error', e);
    alert('❌ Accept failed: '+e.message+'\n\nTry: 1. Hard refresh Ctrl+Shift+R\n2. Check internet\n3. Check Firebase rules\n\nBookingId: '+bookingId);
    if(btn){ btn.textContent='✅ Accept'; btn.disabled=false; }
  }
}

window.rejectJob = async function(bookingId){
  console.log('>>> REJECT CLICKED', bookingId);
  if(!bookingId){ alert('❌ Invalid ID'); return; }
  if(!confirm('❌ Reject booking '+bookingId+'?\n\nYou will be freed for other bookings.\nClient can book another nurse.')) return;
  const btn = document.querySelector(`[data-id="${bookingId}"][data-action="reject"]`);
  if(btn){ btn.textContent='⏳ Rejecting...'; btn.disabled=true; }
  try{
    await ensureAuth();
    const updates = {};
    updates['bookings/'+bookingId+'/status'] = 'rejected';
    updates['ceoBookings/'+bookingId+'/status'] = 'rejected';
    updates['allBookings/'+bookingId+'/status'] = 'rejected';
    updates['nurseBookings/'+nurseId+'/'+bookingId+'/status'] = 'rejected';
    updates['myJobOffers/'+nurseId+'/'+bookingId+'/status'] = 'rejected';
    updates['jobOffers/'+bookingId+'/status'] = 'rejected';
    updates['bookings/'+bookingId+'/rejectedAt'] = Date.now();
    updates['bookings/'+bookingId+'/rejectedBy'] = nurseId;
    await rtdb.ref().update(updates);
    const idx = allJobs.findIndex(j=>j.id===bookingId);
    if(idx!==-1){ allJobs[idx].status='rejected'; }
    renderFiltered();
    alert('❌ REJECTED — Booking '+bookingId+' rejected. You are freed.');
  }catch(e){
    console.error('Reject error', e);
    alert('❌ Reject failed: '+e.message);
    if(btn){ btn.textContent='❌ Reject'; btn.disabled=false; }
  }
}

window.addEventListener('DOMContentLoaded', async ()=>{
  await ensureAuth();
  const urlParams = new URLSearchParams(location.search);
  const idFromUrl = urlParams.get('nurseId') || urlParams.get('id');
  if(idFromUrl){ localStorage.setItem('lcg_nurse_uid', idFromUrl); }
  nurseId = getNurseId();
  console.log('My Job Offer — NurseId:', nurseId, 'Auth:', authReady);
  document.getElementById('debugInfo').textContent = `NurseId: ${nurseId} | Auth: ${authReady?'OK':auth.currentUser?'OK':'no'} | Loading bookings... If buttons like picture, hard refresh`;
  loadBookings();
  startRealtimeListener();
  setInterval(()=>{ loadBookings(); }, 20000);
});

window.addEventListener('error', (e)=>{
  console.error('JS Error:', e.message);
  const debug = document.getElementById('debugInfo');
  if(debug) debug.textContent = '⚠️ JS Error: '+e.message+' — Hard refresh Ctrl+Shift+R';
});

// === CEO LIVE MONITORING INTEGRATION - AFTER ACCEPTING BOOKING ===
let liveWatchId=null, liveInterval=null, currentActiveBooking=null, isLiveSharing=false;

function startLiveTrackingAfterAccept(bookingId){
  currentActiveBooking = allJobs.find(j=>j.id===bookingId) || {id:bookingId};
  const booking = currentActiveBooking;
  console.log('📍 Starting LIVE TRACKING for booking', bookingId, 'CEO will monitor');
  
  // Update booking to en_route status for CEO monitoring
  rtdb.ref('ceoBookings/'+bookingId).update({
    nurseLiveTracking: true,
    nurseId: nurseId,
    nurseName: localStorage.getItem('lcg_nurse_name')||'Nurse',
    status: 'accepted',
    liveStartedAt: Date.now(),
    clientLat: booking.clientLat||booking.clientLatitude||5.6037,
    clientLng: booking.clientLng||booking.clientLongitude||-0.1870,
    clientName: booking.clientName,
    patientName: booking.patientName,
    phone: booking.phone,
    amount: booking.amount,
    currency: booking.currency||'GHS'
  });
  
  rtdb.ref('allBookings/'+bookingId).update({
    nurseLiveTracking: true,
    liveStartedAt: Date.now()
  });

  // Show live tracking UI
  showLiveTrackingUI(bookingId);
  
  // Start GPS watch
  if(navigator.geolocation){
    // Watch position for real-time
    liveWatchId = navigator.geolocation.watchPosition(
      pos => updateNurseLiveLocation(bookingId, pos),
      err => console.log('GPS error', err.message),
      {enableHighAccuracy:true, maximumAge:3000, timeout:10000}
    );
    
    // Also interval every 5 sec as backup
    liveInterval = setInterval(()=>{
      navigator.geolocation.getCurrentPosition(
        pos => updateNurseLiveLocation(bookingId, pos),
        err => console.log('Interval GPS error', err.message),
        {enableHighAccuracy:true, maximumAge:5000, timeout:10000}
      );
    }, 5000);
    
    isLiveSharing=true;
    alert('✅ ACCEPTED + LIVE TRACKING STARTED!\n\n📍 Your location is now LIVE for CEO monitoring\nCEO Dashboard (ceo-live-monitoring.html) can see your every move\nYou are now on way to client: '+(booking.clientName||'Client')+'\n\nGreen blinking dot on CEO map = YOU\nKeep location ON and app open');
  } else {
    alert('⚠️ Geolocation not supported - CEO cannot track live location');
  }
}

function updateNurseLiveLocation(bookingId, pos){
  const lat=pos.coords.latitude, lng=pos.coords.longitude;
  const data={
    lat: lat,
    lng: lng,
    latitude: lat,
    longitude: lng,
    accuracy: pos.coords.accuracy,
    speed: pos.coords.speed||0,
    heading: pos.coords.heading||0,
    altitude: pos.coords.altitude||0,
    time: Date.now(),
    timestamp: Date.now(),
    nurseId: nurseId,
    bookingId: bookingId,
    isLive: true,
    battery: (navigator.getBattery? 'unknown' : 'unknown')
  };
  
  // Update 4 places for CEO to monitor
  rtdb.ref('nurseLiveLocations/'+nurseId).set(data);
  rtdb.ref('nurseLocations/'+nurseId).set(data);
  rtdb.ref('ceoLiveTracking/'+bookingId).set({...data, clientName: (allJobs.find(j=>j.id===bookingId)?.clientName||'Client')});
  rtdb.ref('ceoBookings/'+bookingId+'/nurseLive').set(data);
  rtdb.ref('ceoBookings/'+bookingId+'/nurseLat').set(lat);
  rtdb.ref('ceoBookings/'+bookingId+'/nurseLng').set(lng);
  rtdb.ref('ceoBookings/'+bookingId+'/lastUpdate').set(Date.now());
  rtdb.ref('ceoBookings/'+bookingId+'/liveData').set(data);
  
  // Update UI
  const el=document.getElementById('liveLocationStatus');
  if(el){
    el.innerHTML=`📍 LIVE: ${lat.toFixed(6)}, ${lng.toFixed(6)}<br>⏱️ ${new Date().toLocaleTimeString()}<br>🎯 Accuracy: ${Math.round(data.accuracy||0)}m | Speed: ${Math.round((data.speed||0)*3.6)} km/h<br>CEO Monitoring: ✅ ACTIVE — Every move visible on CEO Dashboard`;
    el.style.background='rgba(34,197,94,.15)';
    el.style.borderColor='rgba(34,197,94,.3)';
  }
  console.log('📍 Live location sent for CEO:', lat, lng, 'Booking:', bookingId);
}

function showLiveTrackingUI(bookingId){
  const grid=document.getElementById('jobGrid');
  const existing=document.getElementById('liveTrackingCard');
  if(existing) existing.remove();
  
  const booking=allJobs.find(j=>j.id===bookingId)||{clientName:'Client'};
  const card=document.createElement('div');
  card.id='liveTrackingCard';
  card.innerHTML=`
    <div style="background:linear-gradient(135deg,rgba(34,197,94,.18),rgba(16,185,129,.12));border:2px solid rgba(34,197,94,.4);border-radius:20px;padding:16px;margin-bottom:12px;animation:pulseLive 2s infinite">
      <style>@keyframes pulseLive{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.4)}50%{box-shadow:0 0 0 12px rgba(34,197,94,0)}}</style>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <div><b style="color:#86efac">📍 LIVE TRACKING ACTIVE — CEO MONITORING YOU</b><br><small style="color:#a7f3d0">Booking: ${bookingId} → Client: ${booking.clientName||'Client'} | Patient: ${booking.patientName||''}</small></div>
        <div><span class="dot"></span> <small style="color:#86efac;font-weight:900">CEO CAN SEE EVERY MOVE</small></div>
      </div>
      <div id="liveLocationStatus" style="margin-top:10px;padding:10px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid rgba(34,197,94,.2);font-size:11px">Starting GPS... Allow location permission</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button class="btn btnGreen" onclick="markEnRoute('${bookingId}')" style="padding:10px">🚗 Mark En Route → On Way to Client</button>
        <button class="btn btnBlue" onclick="markArrived('${bookingId}')" style="padding:10px">📍 Mark Arrived at Client</button>
        <button class="btn btnDark" onclick="openCEOLiveMonitoring()" style="padding:10px">👑 View CEO Live Map</button>
        <button class="btn btnRed" onclick="stopLiveTracking('${bookingId}')" style="padding:10px">⏹️ Stop Tracking</button>
        <button class="btn btnDark" onclick="triggerSOSFromNurse('${bookingId}')" style="padding:10px;background:rgba(239,68,68,.2);border-color:#ef4444;color:#fca5a5">🆘 SOS Emergency</button>
      </div>
      <small style="color:#6b7280;font-size:9px;display:block;margin-top:8px">CEO Dashboard (ceo-live-monitoring.html + CEO Dashboard Page 5) will show your blinking green dot moving live to client. Keep app open and location ON. ETA auto-calculated.</small>
    </div>
  `;
  grid.prepend(card);
}

function markEnRoute(bookingId){
  rtdb.ref('ceoBookings/'+bookingId+'/status').set('en_route');
  rtdb.ref('bookings/'+bookingId+'/status').set('en_route');
  rtdb.ref('nurseBookings/'+nurseId+'/'+bookingId+'/status').set('en_route');
  rtdb.ref('ceoBookings/'+bookingId+'/enRouteAt').set(Date.now());
  alert('🚗 Marked as EN ROUTE — On way to client\nCEO Dashboard now shows you moving to client with ETA');
}

function markArrived(bookingId){
  rtdb.ref('ceoBookings/'+bookingId+'/status').set('arrived');
  rtdb.ref('bookings/'+bookingId+'/status').set('arrived');
  rtdb.ref('nurseBookings/'+nurseId+'/'+bookingId+'/status').set('arrived');
  rtdb.ref('ceoBookings/'+bookingId+'/arrivedAt').set(Date.now());
  alert('📍 Marked as ARRIVED at client location\nCEO knows you arrived');
}

function stopLiveTracking(bookingId){
  if(liveWatchId!==null) navigator.geolocation.clearWatch(liveWatchId);
  if(liveInterval) clearInterval(liveInterval);
  isLiveSharing=false;
  const el=document.getElementById('liveTrackingCard');
  if(el) el.remove();
  rtdb.ref('ceoBookings/'+bookingId+'/nurseLiveTracking').set(false);
  alert('⏹️ Live tracking stopped');
}

function triggerSOSFromNurse(bookingId){
  if(!confirm('🆘 Trigger SOS Emergency?\nCEO will see RED blinking dot + alert')) return;
  navigator.geolocation.getCurrentPosition(pos=>{
    const data={
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      time: Date.now(),
      nurseId: nurseId,
      bookingId: bookingId,
      type: 'nurse_sos',
      isSOS: true
    };
    rtdb.ref('sosAlerts/'+bookingId).set(data);
    rtdb.ref('ceoBookings/'+bookingId+'/isSOS').set(true);
    rtdb.ref('ceoBookings/'+bookingId+'/sosAt').set(Date.now());
    rtdb.ref('nurseLiveLocations/'+nurseId).update({isSOS:true});
    alert('🆘 SOS Sent! CEO Dashboard shows RED alert + your location');
  });
}

function openCEOLiveMonitoring(){
  window.open('./ceo-live-monitoring.html','_blank');
}

// Override acceptJob to auto-start live tracking
const originalAcceptJob = window.acceptJob;
window.acceptJob = async function(bookingId){
  await originalAcceptJob(bookingId);
  setTimeout(()=>startLiveTrackingAfterAccept(bookingId), 1500);
};

</script>
