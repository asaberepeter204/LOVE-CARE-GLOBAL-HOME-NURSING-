<!DOCTYPE html><html lang="en"><head><script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script src="onesignal-setup.js" defer></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Job Offers - Clean - No Test Mode - Pending Shows</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0c0a1e;color:#ece8ff;min-height:100vh;padding-bottom:90px}
.top{position:sticky;top:0;z-index:20;background:rgba(12,10,30,.98);border-bottom:1px solid rgba(255,255,255,.08);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.badge{padding:7px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.06);font-size:11px;font-weight:700;color:#ece8ff;text-decoration:none;cursor:pointer}
.badgeGold{background:#facc15;color:#000;border-color:#facc15}
.card{background:#1a1633;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px;margin:10px}
.offer{background:#1a1633;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px;margin-bottom:12px}
.offer.pending{border:2px solid #facc15;background:linear-gradient(135deg,rgba(26,22,51,.95),rgba(50,40,10,.4))}
.offer.accepted{border:2px solid #22c55e}
.btn{padding:10px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.06);color:#ece8ff;font-size:11px;font-weight:700;cursor:pointer;min-height:40px;flex:1}
.btnGreen{background:#22c55e;color:#fff;border-color:#22c55e}
.btnRed{background:#ef4444;color:#fff;border-color:#ef4444}
.btnBlue{background:#2563eb;color:#fff;border-color:#2563eb}
.toast{position:fixed;right:16px;bottom:20px;z-index:100;background:#1e1a38;border:1px solid rgba(255,255,255,.08);padding:12px 16px;border-radius:12px;font-size:12px;display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modalBox{background:#1c1238;border:1px solid rgba(168,85,247,.25);border-radius:20px;padding:20px;max-width:400px;width:100%;max-height:80vh;overflow:auto}
.histId{padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(168,85,247,.15);margin-bottom:8px;cursor:pointer;font-size:12px;font-weight:700}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid #22c55e}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head><body>
<div class="top"><div><b>My Job Offers</b><br><small style="font-size:9px;color:#22c55e">Pending - Accepted - On Way - Completed - History only when CEO paid</small></div><div style="display:flex;gap:8px"><span class="badge" id="countBadge">0 Offers</span><a href="nurse-dashboard.html" class="badge">Dashboard</a><a href="nurse-withdrawal.html" class="badge badgeGold">Withdraw</a><button class="badge" onclick="loadAll()">Refresh</button></div></div>

<div style="max-width:800px;margin:0 auto;padding:10px">
<div id="offersArea" style="margin-top:12px"></div>
<div id="emptyArea" class="card" style="display:none;text-align:center;padding:30px"><b>No active job offers</b><br><small>When client books you, it shows here as Pending with Accept/Reject buttons</small></div>
<div class="card"><b>History - Only ID when CEO paid - Click for details</b><div id="historyList" style="margin-top:10px"><small>No history yet</small></div></div>
</div>

<div id="toast" class="toast"></div>
<div id="modal" class="modal" onclick="if(event.target===this) closeModal()"><div class="modalBox"><div style="display:flex;justify-content:space-between"><b id="modalTitle">Details</b><button class="btn" onclick="closeModal()">Close</button></div><div id="modalBody" style="margin-top:12px;font-size:12px;line-height:1.6"></div></div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
let nurseId=localStorage.getItem('lcg_nurse_uid')||localStorage.getItem('nurseUid')||localStorage.getItem('uid')||'';
let nurseEmail=localStorage.getItem('nurseEmail')||''; let nursePhone=localStorage.getItem('nursePhone')||''; let nurseName=localStorage.getItem('nurseName')||'Nurse';
let all=[], historyData=[];

function toast(m){const el=document.getElementById('toast'); el.textContent=m; el.style.display='block'; setTimeout(()=>el.style.display='none',4000);}

function loadAll(){
if(!nurseId && !nursePhone){ document.getElementById('emptyArea').style.display='block'; return; }
db.ref('bookings').on('value', snap=>{
  const list=[];
  if(!snap.exists()){ render([]); return; }
  snap.forEach(ch=>{
    const v=ch.val();
    const matchById=v.nurseId===nurseId;
    const matchByUid=v.nurseUid===nurseId;
    const matchByPhone=v.nursePhone&&nursePhone&&v.nursePhone.replace(/[^0-9]/g,'').slice(-9)===nursePhone.replace(/[^0-9]/g,'').slice(-9);
    const matchByEmail=v.nurseEmail&&nurseEmail&&v.nurseEmail.toLowerCase()===nurseEmail.toLowerCase();
    const isMatch=matchById||matchByUid||matchByPhone||matchByEmail;
    if(!isMatch) return;
    const st=(v.status||'pending').toLowerCase();
    const ceoPaid=v.ceoPaid===true;
    const statusPaid=st==='paid' || st==='ceo_paid';
    const isPaid=ceoPaid && statusPaid;
    if(!isPaid){
      if(!st.includes('client_confirmed_finished')){
        list.push({...v, id:ch.key, bookingId:v.bookingId||ch.key});
      }
    }
  });
  all=list.sort((a,b)=>(b.time||b.createdAt||0)-(a.time||a.createdAt||0));
  render();
});
}

function render(){
  const area=document.getElementById('offersArea');
  const empty=document.getElementById('emptyArea');
  if(all.length===0){ area.innerHTML=''; empty.style.display='block'; document.getElementById('countBadge').textContent='0 Offers'; return; }
  empty.style.display='none';
  document.getElementById('countBadge').textContent=all.length+' Offers - '+all.filter(b=>(b.status||'pending').toLowerCase().includes('pending')).length+' Pending';
  area.innerHTML=all.map(b=>{
    const st=(b.status||'pending').toLowerCase();
    const isPending=st.includes('pending')||st===''||st==='new';
    const isAccepted=st.includes('accepted');
    const isCompleted=st.includes('completed');
    return `<div class="offer ${isPending?'pending':''} ${isAccepted?'accepted':''}">
      <div style="display:flex;justify-content:space-between"><b>Booking ID ${b.bookingId||b.id}</b><span class="badge ${isPending?'badgeGold':''}">${(b.status||'PENDING').toUpperCase()}</span></div>
      <div style="margin-top:8px;font-size:11px;color:#9a95b8">Client: ${b.clientName||''} - Phone: ${b.clientPhone||''} - Amount: Earnings ${b.currency||'GHS'} ${(parseFloat(b.livelyAmount||b.amount||0*0.8)).toFixed(2)} - Location: ${b.location||''}</div>
      <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
        ${isPending?`<button class="btn btnGreen" onclick="acceptOffer('${b.id}')">Accept</button><button class="btn btnRed" onclick="rejectOffer('${b.id}')">Reject</button>`:''}
        ${isAccepted?`<button class="btn btnBlue" onclick="openNav('${b.id}')">Navigate</button><button class="btn btnGreen" onclick="markOnWay('${b.id}')">On The Way</button>`:''}
        ${isCompleted?`<div style="background:rgba(34,197,94,.1);border-radius:8px;padding:8px;font-size:11px">Completed - Waiting CEO paid</div>`:''}
        <button class="btn" onclick="showDetails('${b.id}')">Details</button>
        ${b.clientPhone?`<button class="btn btnBlue" onclick="window.open('tel:${b.clientPhone}')">Call Client</button>`:''}
      </div>
    </div>`;
  }).join('');
}

async function acceptOffer(id){ const b=all.find(x=>x.id===id); const now=Date.now(); await db.ref('bookings/'+id).update({status:'accepted', acceptedAt:now, acceptedAtStr:new Date().toLocaleString('en-GH')}); const clientKey=b.clientId||b.clientPhone||''; if(clientKey){ await db.ref('clientAlerts/'+clientKey+'/ACCEPTED-'+id+'-'+now).set({type:'accepted',title:`Nurse ${nurseName} accepted ${b.bookingId||id}`,message:`Nurse accepted - Auto nav opens`,bookingId:b.bookingId||id,time:now,read:false}); } toast('Accepted'); }
async function rejectOffer(id){ if(!confirm('Reject booking '+id+'?')) return; await db.ref('bookings/'+id).update({status:'rejected_by_nurse', rejectedAt:Date.now()}); toast('Rejected'); }
async function markOnWay(id){ await db.ref('bookings/'+id).update({status:'on_the_way', onTheWayAt:Date.now()}); toast('On the way'); }
function openNav(id){ const b=all.find(x=>x.id===id); const cLat=b.clientLat||5.6037; const cLng=b.clientLng||-0.1870; navigator.geolocation.getCurrentPosition(p=>{ window.open(`https://www.google.com/maps/dir/?api=1&origin=${p.coords.latitude},${p.coords.longitude}&destination=${cLat},${cLng}&travelmode=driving`,'_blank'); }, ()=>{ window.open(`https://www.google.com/maps/search/?api=1&query=${cLat},${cLng}`,'_blank'); }); }
function showDetails(id){ const b=all.find(x=>x.id===id); document.getElementById('modalTitle').textContent='Booking ID '+(b.bookingId||b.id); document.getElementById('modalBody').innerHTML=`ID: ${b.bookingId||b.id}<br>Status: ${b.status}<br>Client: ${b.clientName}<br>Phone: ${b.clientPhone}<br>Amount: Earnings ${b.currency||'GHS'} ${(parseFloat(b.livelyAmount||b.amount||0*0.8)).toFixed(2)}<br>Location: ${b.location||''}<br>Service: ${b.serviceType||''}<br>Time: ${new Date(b.time||Date.now()).toLocaleString('en-GH')}<br>CEO Paid: ${b.ceoPaid?'YES':'NO - CEO hasnt marked paid'}`; document.getElementById('modal').style.display='flex'; }
function closeModal(){ document.getElementById('modal').style.display='none'; }
function loadHistory(){
  db.ref('nurseBookingHistory/'+nurseId).on('value', snap=>{
    const el=document.getElementById('historyList');
    if(!snap.exists()){ el.innerHTML='<small>No history yet - When CEO marks paid, ID moves here</small>'; return; }
    const arr=[]; snap.forEach(ch=>{ arr.push({...ch.val(), id:ch.key}); });
    arr.sort((a,b)=>(b.ceoPaidAt||0)-(a.ceoPaidAt||0));
    el.innerHTML=arr.map(b=>`<div class="histId" onclick="showHistory('${b.id}')">Booking ID ${b.bookingId||b.id} - ${b.ceoPaidAtStr||''} - Paid - Click details</div>`).join('');
    window.historyData=arr;
  });
  db.ref('bookings').orderByChild('nurseId').equalTo(nurseId).on('value', snap=>{
    if(!snap.exists()) return;
    snap.forEach(ch=>{
      const v=ch.val();
      const ceoPaid=v.ceoPaid===true;
      const statusPaid=(v.status||'').toLowerCase().includes('paid');
      if(ceoPaid && statusPaid){
        const id=ch.key;
        if(all.find(x=>x.id===id)){
          db.ref('nurseBookingHistory/'+nurseId+'/'+id).set({...v, id, ceoPaidAt:Date.now(), ceoPaidAtStr:new Date().toLocaleString('en-GH')});
          db.ref('bookings/'+id).remove().catch(()=>{});
          toast('CEO marked paid - ID '+(v.bookingId||id)+' moved to history');
        }
      }
    });
  });
}
window.onload=()=>{ loadAll(); loadHistory(); };
</script>
</body></html>
