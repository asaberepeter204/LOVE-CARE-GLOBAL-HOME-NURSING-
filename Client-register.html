<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Registration - LOVE CARE GLOBAL HOME NURSING</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#7c3aed">
<style>
body{font-family:Inter,system-ui,sans-serif;margin:0;background:linear-gradient(135deg,#f0fdf4,#f3f0ff);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{max-width:480px;width:100%;background:white;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(124,58,237,0.15);border-top:5px solid #7c3aed}
h1{color:#7c3aed;text-align:center;margin:0}input,select{width:100%;padding:14px;margin:8px 0;border:2px solid #e5e7eb;border-radius:10px;box-sizing:border-box}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#16a34a,#7c3aed);color:white;border:none;border-radius:10px;font-weight:900;font-size:16px;cursor:pointer;margin-top:10px}
a{color:#7c3aed;font-weight:800;text-decoration:none}
.header{position:fixed;top:0;left:0;right:0;background:linear-gradient(90deg,#16a34a,#7c3aed);color:white;padding:12px 16px;display:flex;justify-content:space-between;z-index:10}
</style>
</head>
<body>
<div class="header"><div><strong>LOVE CARE GLOBAL HOME NURSING</strong></div><div><a href="index.html" style="color:white">🏠 Home</a></div></div>
<div class="card">
<h1>Client Registration</h1>
<p style="text-align:center;color:#666;font-size:13px">Official: https://asaberepeter204.github.io/LOVE-CARE-GLOBAL-HOME-NURSING-/</p>
<input type="text" id="cName" placeholder="Full Name *">
<input type="tel" id="cPhone" placeholder="Phone 0244XXXXXX *">
<input type="email" id="cEmail" placeholder="Email *">
<select id="cCountry"><option>Ghana</option><option>Nigeria</option><option>USA</option><option>UK</option><option>Canada</option><option>Germany</option><option>South Africa</option><option>UAE</option></select>
<input type="password" id="cPass" placeholder="Password *">
<input type="text" id="cLocation" placeholder="Your Location / Address">
<button class="btn" onclick="doRegister()">Create Account</button>
<p style="text-align:center">Already have? <a href="client-login.html">Login</a> | <a href="index.html">Home</a></p>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
const firebaseConfig = { databaseURL: "https://love-care-global-default-rtdb.firebaseio.com" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
window.doRegister = async function(){
 const name=document.getElementById('cName').value; const phone=document.getElementById('cPhone').value; const email=document.getElementById('cEmail').value;
 if(!name||!phone){alert('Name and phone required');return;}
 const id=phone.replace(/[^0-9]/g,'');
 await set(ref(db,'clients/'+id),{name,phone,email,country:document.getElementById('cCountry').value,location:document.getElementById('cLocation').value,created:Date.now()});
 localStorage.setItem('clientPhone',phone); localStorage.setItem('clientName',name);
 alert('Registered!'); window.location.href='client-dashboard.html';
}
</script>
</body>
</html>
