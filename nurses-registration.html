<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-storage.js";

const firebaseConfig={
  apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",
  authDomain:"web-care-618e8.firebaseapp.com",
  databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",
  projectId:"web-care-618e8",
  storageBucket:"web-care-618e8.firebasestorage.app",
  messagingSenderId:"1062578660694",
  appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const storage=getStorage(app);

window.toggleEye=(id,btn)=>{
  const input=document.getElementById(id);
  const openIcon=document.getElementById(`eye-${id}-open`);
  const closedIcon=document.getElementById(`eye-${id}-closed`);
  if(input.type==='password'){
    input.type='text';
    if(openIcon)openIcon.style.display='none';
    if(closedIcon)closedIcon.style.display='block';
  }else{
    input.type='password';
    if(openIcon)openIcon.style.display='block';
    if(closedIcon)closedIcon.style.display='none';
  }
}

window.updateWithdrawal=()=>{
  const c=document.getElementById('country').value;
  const momo=document.getElementById('momoFields');
  if(c==='GH'){momo.style.display='block';}
  else{ momo.style.display='none';}
}
window.updateCardFields=()=>{document.getElementById('debitFields').style.display=document.getElementById('debitCardType').value? 'block':'none';}
window.updateVirtualFields=()=>{document.getElementById('virtualFields').style.display=document.getElementById('virtualCardType').value? 'block':'none';}

window.handlePhoneCode=()=>{
  const sel=document.getElementById('phoneCode').value;
  document.getElementById('customCodeWrap').style.display = sel==='OTHER' ? 'block' : 'none';
};
window.syncPhoneCodeWithCountry=()=>{
  const country=document.getElementById('country').value;
  const phoneCode=document.getElementById('phoneCode');
  const map={GH:'+233',NG:'+234',ZA:'+27',GB:'+44',US:'+1',AU:'+61',AE:'+971',CA:'+1-CA'};
  if(map[country]){ phoneCode.value=map[country]; handlePhoneCode(); }
  if(country==='OTHER'){ phoneCode.value='OTHER'; handlePhoneCode(); }
};
document.getElementById('country')?.addEventListener('change', syncPhoneCodeWithCountry);

window.getGPS=()=>{
  const nameField=document.getElementById('gpsName');
  nameField.value='Locating...';
  if(!navigator.geolocation){nameField.value='GPS not supported';return;}
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude; const lng=pos.coords.longitude;
    document.getElementById('lat').value=lat.toFixed(6);
    document.getElementById('lng').value=lng.toFixed(6);
    document.getElementById('mapPreview').style.display='block';
    document.getElementById('mapFrame').src=`https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed`;
    try{
      const res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
      const data=await res.json();
      const actualName=data.display_name||`${lat},${lng}`;
      document.getElementById('gpsName').value=actualName;
      document.getElementById('address').value=actualName;
    }catch(e){
      document.getElementById('gpsName').value=`${lat.toFixed(6)}, ${lng.toFixed(6)}`;
      document.getElementById('address').value=`${lat.toFixed(6)}, ${lng.toFixed(6)}`;
    }
  },()=>{document.getElementById('gpsName').value='Enable GPS'; alert('Enable GPS');},{enableHighAccuracy:true});
}


window.register=async()=>{
  const country=document.getElementById('country').value;
  const fullName=document.getElementById('fullName').value.trim();
  const email=document.getElementById('email').value.trim().toLowerCase();
  const phoneRaw=document.getElementById('phone').value.trim();
  const phoneCodeVal=document.getElementById('phoneCode').value;
  const customCode=document.getElementById('customCode')?.value.trim();
  let finalCode=phoneCodeVal;
  if(phoneCodeVal==='OTHER'){
    if(!customCode){ alert('Enter country code'); return; }
    finalCode=customCode;
  }
  if(finalCode==='+1-CA') finalCode='+1';
  const phone=finalCode+' '+phoneRaw;
  if(!phoneRaw){ alert('Enter phone'); return; }
  const password=document.getElementById('password').value;
  const confirmPassword=document.getElementById('confirmPassword').value;
  const lat=document.getElementById('lat').value;
  const lng=document.getElementById('lng').value;
  const gpsName=document.getElementById('gpsName').value;
  const address=document.getElementById('address').value;
  const services=document.getElementById('services').value;
  const photo=document.getElementById('photo').files[0];

  if(!country){alert('Select country');return;}
  if(!fullName||!email){alert('Fill info');return;}
  if(password.length<6){alert('Password min 6');return;}
  if(password!==confirmPassword){alert('Passwords do not match');return;}
  if(!lat||!lng||!gpsName){alert('Use GPS'); getGPS(); return;}
  if(!photo){alert('Photo required');return;}

  // === STRICT EMAIL ROLE CHECK - PREVENT CLIENT EMAIL REUSE ===
  try{
    const clientQuery = query(collection(db,'clients'), where('email','==', email));
    const clientSnap = await getDocs(clientQuery);
    if(!clientSnap.empty){
      alert('SECURITY: Email already registered in opposite role. Use different email.');
      return;
    }
    const nurseQuery = query(collection(db,'nurses'), where('email','==', email));
    const nurseSnap = await getDocs(nurseQuery);
    if(!nurseSnap.empty){
      alert('❌ Email already registered as NURSE. Please login at nurse-login.html');
      return;
    }
  }catch(e){ console.log('role check error',e); }

  try{
    const cred=await createUserWithEmailAndPassword(auth,email,password);
    const uid=cred.user.uid;
    let photoURL='';
    try{
      const photoRef=ref(storage,`nurses/${uid}/photo_${Date.now()}`);
      await uploadBytes(photoRef,photo);
      photoURL=await getDownloadURL(photoRef);
    }catch(e){}

    const nurseData={
      id:uid, uid:uid, fullName, email, phone, phoneCode:finalCode, phoneRaw, phoneFull:phone, country,
      countryName:document.getElementById('country').options[document.getElementById('country').selectedIndex].text,
      lat:parseFloat(lat), lng:parseFloat(lng),
      gpsActualName: gpsName,
      address: address||gpsName,
      gps: `${lat},${lng}`,
      experience:document.getElementById('experience').value,
      services: services.split(',').map(s=>s.trim()).filter(s=>s),
      photoURL, photo:photoURL,
      momoNetwork:document.getElementById('momoNetwork').value||'',
      momoNumber:document.getElementById('momoNumber').value||'',
      debitCardType:document.getElementById('debitCardType').value||'',
      debitNumber:document.getElementById('debitNumber').value||'',
      debitExpiry:document.getElementById('debitExpiry').value||'',
      debitCVV:document.getElementById('debitCVV').value||'',
      debitName:document.getElementById('debitName').value||'',
      virtualCardType:document.getElementById('virtualCardType').value||'',
      virtualNumber:document.getElementById('virtualNumber').value||'',
      virtualExpiry:document.getElementById('virtualExpiry').value||'',
      virtualCVV:document.getElementById('virtualCVV').value||'',
      withdrawalMethod: country==='GH'? 'MOMO+DEBIT+VIRTUAL' : 'DEBIT+VIRTUAL',
      role:'nurse',
      isApproved:false, rating:0, reviewCount:0, totalEarnings:0,
      createdAt:serverTimestamp(), timestamp:new Date().toISOString()
    };

    await setDoc(doc(db,'nurses',uid),nurseData);
    localStorage.setItem('lcg_nurse_uid',uid);
    localStorage.setItem('lcg_role','nurse');
    localStorage.setItem('currentNurseEmail',email);
    localStorage.setItem('nurseProfile', JSON.stringify({uid, name:fullName, email, phone, photo:photoURL, country}));
    alert(`✅ Registered as Nurse! Awaiting CEO approval.`);
    location.href='nurse-login.html';
  }catch(e){
    alert('Failed: '+e.message);
  }
}

window.addEventListener('DOMContentLoaded',()=>{getGPS();});
