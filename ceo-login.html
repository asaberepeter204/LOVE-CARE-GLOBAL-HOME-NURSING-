<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEO Login</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Instrument Sans,sans-serif;background:#0c0a1e;color:#ece8ff;min-height:100vh;display:grid;place-items:center;padding:16px}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 10% 10%, rgba(76,29,149,.28), transparent 70%),linear-gradient(180deg,#0c0a1e,#120e26)}
.card{width:100%;max-width:400px;background:rgba(26,22,51,.96);border:1px solid rgba(255,255,255,.08);border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.header{padding:20px;border-bottom:1px solid rgba(255,255,255,.08);text-align:center}
.header b{font-size:22px;font-weight:800}
.body{padding:20px;display:flex;flex-direction:column;gap:14px}
.inputGroup{display:flex;flex-direction:column;gap:6px}
.inputGroup label{font-size:12px;font-weight:700}
.inputGroup input{padding:12px 14px;border-radius:12px;border:1.5px solid rgba(255,255,255,.08);background:rgba(12,10,30,.8);color:#ece8ff;outline:none}
.btn{padding:12px;border-radius:999px;border:none;font-weight:800;font-size:13px;cursor:pointer}
.btnLogin{background:linear-gradient(135deg,#facc15,#fde68a);color:#000}
.btnHome{background:rgba(255,255,255,.06);color:#ece8ff;border:1px solid rgba(255,255,255,.08);text-decoration:none;text-align:center;display:grid;place-items:center}
.status{padding:10px;border-radius:10px;font-size:11px;display:none;text-align:center}
.status.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#86efac}
.status.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.history{margin-top:8px;padding:12px;background:rgba(12,10,30,.6);border:1px solid rgba(255,255,255,.08);border-radius:12px}
.history b{font-size:11px;color:#c4b5fd;display:block;margin-bottom:8px}
.histItem{padding:8px;border-bottom:1px solid rgba(255,255,255,.08);font-size:10px;color:#9a95b8;display:flex;justify-content:space-between;gap:8px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
<div class="header"><b>👑 CEO Login</b></div>
<div class="body">
<div class="inputGroup"><label>Phone Number</label><input id="phone" type="tel" placeholder="Enter phone number" autocomplete="off"></div>
<div class="inputGroup"><label>Full Name</label><input id="name" type="text" placeholder="Enter full name" autocomplete="off"></div>
<div class="inputGroup"><label>Email</label><input id="email" type="email" placeholder="Enter email" autocomplete="off"></div>
<div id="status" class="status"></div>
<button class="btn btnLogin" onclick="ceoLogin()">Login</button>
<a href="index.html" class="btn btnHome">🏠 Home</a>
<div class="history"><b>Recent Logins</b><div id="loginHistory">Loading...</div></div>
</div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const auth=firebase.auth();
async function ensureAuth(){try{await auth.signInAnonymously();}catch(e){}}
function showStatus(msg, ok){const el=document.getElementById('status');el.textContent=msg;el.className='status '+(ok?'ok':'err');el.style.display='block';}
function normalizePhone(p){return (p||'').replace(/[^0-9]/g,'').slice(-10);}
async function ceoLogin(){
  const phoneRaw=document.getElementById('phone').value.trim();
  const name=document.getElementById('name').value.trim();
  const email=document.getElementById('email').value.trim().toLowerCase();
  if(!phoneRaw || !name){showStatus('Enter phone & name', false);return;}
  const phoneNorm=normalizePhone(phoneRaw);
  if(phoneNorm.length<9){showStatus('Enter valid phone', false);return;}
  showStatus('Checking...', true);
  try{
    await ensureAuth();
    let allowedUser=null;
    const snap=await db.ref('ceoAllowedUsers').once('value');
    if(snap.exists()){
      snap.forEach(ch=>{
        const u=ch.val();
        const uphone=normalizePhone(u.phone||ch.key);
        const uname=(u.name||'').toLowerCase();
        if(uphone===phoneNorm && uname===name.toLowerCase()){allowedUser=u;}
      });
    }
    // Fallback check in allowedCEOs
    if(!allowedUser){
      const snap2=await db.ref('allowedCEOs').once('value');
      if(snap2.exists()){
        snap2.forEach(ch=>{
          const u=ch.val();
          const uphone=normalizePhone(u.phone||'');
          const uname=(u.name||'').toLowerCase();
          if(uphone===phoneNorm && uname===name.toLowerCase()){allowedUser=u;}
        });
      }
    }
    if(!allowedUser){showStatus('Access denied', false);return;}
    const finalName=allowedUser.name||name;
    const finalPhone=allowedUser.phone||phoneRaw;
    const finalEmail=allowedUser.email||email;
    localStorage.setItem('ceo_logged_in','true');
    localStorage.setItem('ceo_name',finalName);
    localStorage.setItem('ceo_phone',finalPhone);
    localStorage.setItem('ceo_email',finalEmail);
    localStorage.setItem('ceo_login_time',Date.now().toString());
    const loginData={name:finalName,phone:finalPhone,email:finalEmail,loginAt:Date.now(),loginTime:new Date().toLocaleString(),timestamp:Date.now()};
    await db.ref('ceoLoginHistory').push(loginData);
    showStatus(`Welcome ${finalName}`, true);
    setTimeout(()=>{location.href='ceo-dashboard.html';}, 800);
  }catch(e){showStatus('Login failed', false);}
}
async function loadHistory(){
  const el=document.getElementById('loginHistory');
  try{
    await ensureAuth();
    const snap=await db.ref('ceoLoginHistory').orderByChild('timestamp').limitToLast(10).once('value');
    if(!snap.exists()){el.innerHTML='<div style="color:#6b6788;font-size:10px">No logins</div>';return;}
    const items=[];snap.forEach(ch=>{items.push(ch.val());});items.reverse();
    // Hide full phone for security — show only last 3 digits
    el.innerHTML=items.map(h=>{
      const maskedPhone = h.phone ? '***'+String(h.phone).slice(-3) : '';
      return `<div class="histItem"><span>${h.name||''}</span><span>${h.loginTime||''}</span></div>`;
    }).join('');
  }catch(e){el.innerHTML='<div style="color:#6b6788;font-size:10px">Loading...</div>';}
}
window.onload=async()=>{await ensureAuth();loadHistory();};
</script>
</body>
</html>
