<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEO Login — LOVE CARE GLOBAL</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
:root{--bg:#0c0a1e;--card:#1a1633;--line:rgba(255,255,255,.08);--text:#ece8ff;--muted:#9a95b8;--gold:#facc15}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Instrument Sans,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:16px}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 10% 10%, rgba(76,29,149,.28), transparent 70%),linear-gradient(180deg,#0c0a1e,#120e26)}
.card{width:100%;max-width:400px;background:rgba(26,22,51,.96);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.header{padding:20px;border-bottom:1px solid var(--line);text-align:center}
.header b{font-family:Fraunces,serif;font-size:22px;display:block}
.body{padding:20px;display:flex;flex-direction:column;gap:14px}
.inputGroup{display:flex;flex-direction:column;gap:6px}
.inputGroup label{font-size:12px;font-weight:700;color:var(--text)}
.inputGroup input{padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:rgba(12,10,30,.8);color:var(--text);font-size:14px;outline:none}
.inputGroup input:focus{border-color:#a78bfa}
.btn{padding:12px;border-radius:999px;border:none;font-weight:800;font-size:13px;cursor:pointer}
.btnLogin{background:linear-gradient(135deg,#facc15,#fde68a);color:#000}
.btnHome{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line);text-decoration:none;text-align:center;display:grid;place-items:center}
.status{padding:10px;border-radius:10px;font-size:11px;display:none;text-align:center}
.status.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#86efac}
.status.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.history{margin-top:8px;padding:12px;background:rgba(12,10,30,.6);border:1px solid var(--line);border-radius:12px}
.history b{font-size:11px;color:#c4b5fd;display:block;margin-bottom:8px}
.histItem{padding:8px;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
<div class="header">
<b>👑 CEO Login</b>
</div>
<div class="body">
<div class="inputGroup">
<label>Phone Number</label>
<input id="phone" type="tel" placeholder="0544121814">
</div>
<div class="inputGroup">
<label>Full Name</label>
<input id="name" type="text" placeholder="Asabere Peter">
</div>
<div class="inputGroup">
<label>Email</label>
<input id="email" type="email" placeholder="ceo@lovecareglobal.com">
</div>
<div id="status" class="status"></div>
<button class="btn btnLogin" onclick="ceoLogin()">Login</button>
<a href="index.html" class="btn btnHome">🏠 Home</a>

<div class="history">
<b>Recent Logins</b>
<div id="loginHistory">Loading...</div>
</div>
</div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const auth=firebase.auth();

async function ensureAuth(){
  try{await auth.signInAnonymously();}catch(e){}
}

const CEO_EMAILS=['lovecareglobal@gmail.com','ceo@lovecareglobal.com','asaberepeter204@gmail.com','lovecareglobalhome@gmail.com'];
function showStatus(msg, ok){const el=document.getElementById('status');el.textContent=msg;el.className='status '+(ok?'ok':'err');el.style.display='block';}
function normalizePhone(p){return (p||'').replace(/[^0-9]/g,'').slice(-10);}
async function ceoLogin(){
  const phoneRaw=document.getElementById('phone').value.trim();
  const name=document.getElementById('name').value.trim();
  const email=document.getElementById('email').value.trim().toLowerCase();
  if(!phoneRaw || !name){showStatus('Enter phone & name', false);return;}
  const phoneNorm=normalizePhone(phoneRaw);
  if(phoneNorm.length<9){showStatus('Enter valid phone', false);return;}
  showStatus('Checking...', true);
  try{
    await ensureAuth();
    const allowedPaths=['ceoAllowedUsers','ceoAccessList','ceoDashboardAccess','allowedCEOs'];
    let allowedUser=null;let allowedKey=null;
    for(const path of allowedPaths){
      try{
        const snap=await db.ref(path).once('value');
        if(snap.exists()){
          const val=snap.val();
          for(const k in val){
            const u=val[k];
            const uphone=normalizePhone(u.phone||u.phoneNumber||k);
            const uname=(u.name||u.fullName||'').toLowerCase();
            if(uphone===phoneNorm || uname===name.toLowerCase()){allowedUser=u;allowedKey=k;break;}
          }
          if(allowedUser) break;
        }
      }catch(e){}
    }
    let isCEOEmail = email && CEO_EMAILS.includes(email);
    let isDefaultCEO = name.toLowerCase().includes('asabere') || name.toLowerCase().includes('peter') || phoneNorm==='544121814';
    if(!allowedUser && !isCEOEmail && !isDefaultCEO){showStatus(`Access denied`, false);return;}
    const finalName = allowedUser ? (allowedUser.name||allowedUser.fullName||name) : name;
    const finalPhone = allowedUser ? (allowedUser.phone||phoneRaw) : phoneRaw;
    const finalEmail = allowedUser ? (allowedUser.email||email) : email;
    localStorage.setItem('ceo_logged_in','true');
    localStorage.setItem('ceo_name',finalName);
    localStorage.setItem('ceo_phone',finalPhone);
    localStorage.setItem('ceo_email',finalEmail);
    localStorage.setItem('ceo_login_time',Date.now().toString());
    const loginData={name:finalName,phone:finalPhone,email:finalEmail,loginAt:Date.now(),loginTime:new Date().toLocaleString(),timestamp:Date.now()};
    await db.ref('ceoLoginHistory').push(loginData);
    await db.ref('ceoLoginLogs').push(loginData);
    await db.ref('ceoDashboardLogins').push(loginData);
    showStatus(`Welcome ${finalName}`, true);
    setTimeout(()=>{location.href='ceo-dashboard.html?name='+encodeURIComponent(finalName);}, 800);
  }catch(e){showStatus(e.message, false);}
}
async function loadHistory(){
  const el=document.getElementById('loginHistory');
  try{
    await ensureAuth();
    const snap=await db.ref('ceoLoginHistory').orderByChild('timestamp').limitToLast(20).once('value');
    if(!snap.exists()){el.innerHTML='<div style="color:#6b6788;font-size:10px">No logins yet</div>';return;}
    const items=[];snap.forEach(ch=>{items.push(ch.val());});items.reverse();
    el.innerHTML=items.map(h=>`<div class="histItem"><span>${h.name||''} — ${h.phone||''}</span><span>${h.loginTime||''}</span></div>`).join('');
  }catch(e){el.innerHTML=`<div style="color:#fca5a5;font-size:10px">${e.message}</div>`;}
}
window.onload=async()=>{await ensureAuth();loadHistory();};
</script>
</body>
</html>
