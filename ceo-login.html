<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEO Login - LOVE CARE GLOBAL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#f8fafc;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.card{background:white;border-radius:16px;padding:24px;border:1px solid #e5e7eb;width:100%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,0.08)}
h1{font-size:20px;margin-bottom:4px} .sub{font-size:12px;color:#6b7280;margin-bottom:20px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #e5e7eb;margin-bottom:10px;font-size:14px}
.btn{width:100%;padding:12px;border-radius:10px;border:none;font-weight:800;font-size:14px;cursor:pointer}
.btnDark{background:#111827;color:white} .btnGhost{background:#f3f4f6;color:#111827;margin-top:8px}
.small{font-size:11px;color:#6b7280;margin-top:10px;text-align:center}
a{color:#3b82f6;text-decoration:none;font-weight:700}
.error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:10px;border-radius:10px;font-size:12px;margin-bottom:12px;display:none}
.success{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;padding:10px;border-radius:10px;font-size:12px;margin-bottom:12px;display:none}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",
  authDomain: "web-care-618e8.firebaseapp.com",
  databaseURL: "https://web-care-618e8-default-rtdb.firebaseio.com",
  projectId: "web-care-618e8",
  storageBucket: "web-care-618e8.firebasestorage.app",
  messagingSenderId: "1062578660694",
  appId: "1:1062578660694:web:f94dfe12c929df05bce2f7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// If already logged in as CEO, go straight to dashboard
onAuthStateChanged(auth, (user) => {
  if(user && user.email === "joshouapee@gmail.com") {
    window.location.href = "./ceo-dashboard.html";
  }
});

window.loginCEO = async () => {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value;
  const errEl = document.getElementById('error');
  const okEl = document.getElementById('success');
  errEl.style.display='none'; okEl.style.display='none';
  
  if(email !== "joshouapee@gmail.com") {
    errEl.innerText = "Only joshouapee@gmail.com can access CEO dashboard";
    errEl.style.display='block';
    return;
  }
  if(!pass) {
    errEl.innerText = "Enter password";
    errEl.style.display='block';
    return;
  }
  try {
    document.getElementById('loginBtn').innerText='Logging in...';
    await signInWithEmailAndPassword(auth, email, pass);
    okEl.innerText='Login success - redirecting...';
    okEl.style.display='block';
    setTimeout(()=>{ window.location.href='./ceo-dashboard.html'; }, 800);
  } catch(e) {
    document.getElementById('loginBtn').innerText='Login as CEO';
    errEl.innerText = e.message;
    if(e.code === 'auth/user-not-found') errEl.innerText = "No CEO account found. Go to Firebase Console > Authentication > Users > Add user: joshouapee@gmail.com";
    if(e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') errEl.innerText = "Wrong password. Click 'Forgot Password' below.";
    errEl.style.display='block';
  }
}

window.resetPass = async () => {
  const errEl = document.getElementById('error');
  const okEl = document.getElementById('success');
  try {
    await sendPasswordResetEmail(auth, "joshouapee@gmail.com");
    okEl.innerText = "Reset email sent to joshouapee@gmail.com - check your Gmail inbox and spam";
    okEl.style.display='block';
  } catch(e) {
    errEl.innerText = e.message;
    errEl.style.display='block';
  }
}
</script>
</head>
<body>
<div class="card">
<h1>CEO Login</h1>
<div class="sub">LOVE CARE GLOBAL - CEO only: joshouapee@gmail.com</div>

<div id="error" class="error"></div>
<div id="success" class="success"></div>

<input id="email" type="email" value="joshouapee@gmail.com" readonly style="background:#f3f4f6">
<input id="password" type="password" placeholder="Enter CEO password">

<button id="loginBtn" class="btn btnDark" onclick="loginCEO()">Login as CEO</button>
<button class="btn btnGhost" onclick="resetPass()">Forgot Password? Send Reset Email</button>

<div class="small">
<a href="./ceo-dashboard.html">Already logged in? Go to Dashboard</a><br><br>
<a href="./index.html">← Back to Home</a><br><br>
If you don't know the password, click Forgot Password or go to Firebase Console > Authentication > Users > Add user
</div>
</div>
</body>
</html>
