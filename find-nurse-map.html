<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find Nurse + Live Map - LOVE CARE GLOBAL</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
body{font-family:Inter,sans-serif;margin:0;background:#f8f9ff}
.header{background:linear-gradient(90deg,#16a34a,#2563eb);color:white;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000}
.container{max-width:1100px;margin:0 auto;padding:16px}
#map{height:420px;border-radius:16px;border:3px solid #16a34a;margin:12px 0}
.card{background:white;border-radius:14px;padding:16px;margin:12px 0;border:1px solid #e5e7eb;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
input,select{width:100%;padding:12px;margin:6px 0;border:2px solid #e5e7eb;border-radius:10px;box-sizing:border-box}
.btn{padding:12px 18px;background:#16a34a;color:white;border:none;border-radius:10px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}
.btn-blue{background:#2563eb}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.nurse-card{border-left:4px solid #16a34a}
a{color:white;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<div class="header"><div><strong>📍 Find Nurse - LOVE CARE GLOBAL</strong><br><small>8 Countries Live Tracking</small></div><a href="index.html">🏠 Home</a></div>
<div class="container">
<div class="card">
<h3 style="margin:0;color:#16a34a">🔍 Find Nearest Verified Nurse</h3>
<input type="text" id="searchLocation" placeholder="Enter City: Accra, Lagos, London, Toronto...">
<div style="display:flex;gap:8px"><select id="serviceType" style="flex:1"><option>All Services</option><option>Elderly Care</option><option>Baby Care</option><option>Wound Care</option></select><button class="btn" onclick="searchNurses()">Search</button><button class="btn btn-blue" onclick="useMyLocation()">📍 My Location</button></div>
</div>
<div id="map"></div>
<div class="grid" id="nurseResults"><div class="card">Loading verified nurses...</div></div>
<div class="card" style="text-align:center"><a href="client-public.html" class="btn">📝 Book This Nurse</a> <a href="index.html" class="btn btn-blue">Home</a> <a href="support.html" class="btn" style="background:#7c3aed">Need Help?</a></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
const app=initializeApp({databaseURL:"https://love-care-global-default-rtdb.firebaseio.com"}); const db=getDatabase(app);
const map=L.map('map').setView([5.6037,-0.1870],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
onValue(ref(db,'nurses'),snap=>{
 document.getElementById('nurseResults').innerHTML='';
 snap.forEach(child=>{
  const n=child.val(); if(n.status && n.status!=='approved') return;
  const lat=n.lat||(5.5+Math.random()*2), lng=n.lng||(-0.5+Math.random()*2.5);
  L.marker([lat,lng]).addTo(map).bindPopup(`<b>${n.name}</b><br>${n.country}<br><a href="client-public.html">Book</a>`);
  document.getElementById('nurseResults').innerHTML+=`<div class="card nurse-card"><strong>${n.name}</strong> - ${n.country}<br>⭐ ${n.experience||'Verified'}<br><br><a href="client-public.html" class="btn">Book Nurse</a></div>`;
 });
});
window.searchNurses=function(){alert('Searching: '+document.getElementById('searchLocation').value)}
window.useMyLocation=function(){navigator.geolocation.getCurrentPosition(p=>{map.setView([p.coords.latitude,p.coords.longitude],12); L.marker([p.coords.latitude,p.coords.longitude]).addTo(map).bindPopup('You are here').openPopup();})}
</script>
</body>
</html>
