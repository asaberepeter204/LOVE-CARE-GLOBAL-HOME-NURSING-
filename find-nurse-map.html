<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find Nurse + Live Map - LOVE CARE GLOBAL HOME NURSING</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#16a34a">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
body{font-family:Inter,sans-serif;margin:0;background:#f8f9ff;color:#111}
.header{position:sticky;top:0;z-index:1000;background:linear-gradient(90deg,#16a34a,#2563eb);color:white;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.container{max-width:1100px;margin:0 auto;padding:16px}
#map{height:420px;border-radius:16px;border:3px solid #16a34a;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
.card{background:white;border-radius:14px;padding:16px;margin:12px 0;border:1px solid #e5e7eb;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
input,select{width:100%;padding:12px;margin:6px 0;border:2px solid #e5e7eb;border-radius:10px;box-sizing:border-box}
.btn{padding:12px 18px;background:#16a34a;color:white;border:none;border-radius:10px;font-weight:900;cursor:pointer}
.btn-blue{background:#2563eb}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.nurse-card{border-left:4px solid #16a34a}
a{color:#7c3aed;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<div class="header"><div><strong>📍 Find Nurse + Live Map - LOVE CARE GLOBAL</strong><br><small>Official - 8 Countries Live Tracking</small></div><div><a href="index.html" style="color:white">🏠 Home</a></div></div>
<div class="container">
<div class="card" style="border-color:#16a34a;background:linear-gradient(135deg,#f0fdf4,#eff6ff)">
<h2>🔍 Find Nearest Verified Nurse</h2>
<p style="font-size:12px">Official: https://asaberepeter204.github.io/LOVE-CARE-GLOBAL-HOME-NURSING-/</p>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<input type="text" id="searchLocation" placeholder="Enter City / Location (e.g., Accra, Lagos, London)" style="flex:1;min-width:200px">
<select id="serviceType" style="max-width:200px"><option>All Services</option><option>Elderly Care</option><option>Baby Care</option><option>Wound Care</option><option>Post-Surgery</option><option>Injection</option></select>
<button class="btn" onclick="searchNurses()">Search</button>
<button class="btn btn-blue" onclick="useMyLocation()">📍 Use My Location</button>
</div>
</div>

<div id="map"></div>

<div class="grid" id="nurseResults">Loading nurses...</div>

<div class="card"><a class="btn" href="client-public.html">📝 Book Nurse Now</a> <a class="btn btn-blue" href="group-chat.html">💬 Chat Support</a> <a href="index.html" style="margin-left:10px">Home</a></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
const app=initializeApp({databaseURL:"https://love-care-global-default-rtdb.firebaseio.com"}); const db=getDatabase(app);

const map=L.map('map').setView([5.6037,-0.1870],6); // Ghana center
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);

let markers=[];
onValue(ref(db,'nurses'),snap=>{
 document.getElementById('nurseResults').innerHTML='';
 markers.forEach(m=>map.removeLayer(m)); markers=[];
 snap.forEach(child=>{
  const n=child.val(); if(n.status!=='approved') return;
  // Random nearby lat lng for demo if no real location
  const lat = n.lat || (5.5 + Math.random()*1.5); const lng = n.lng || (-0.5 + Math.random()*2);
  const marker=L.marker([lat,lng]).addTo(map).bindPopup(`<b>${n.name}</b><br>${n.country}<br>${n.experience||''}<br><a href="client-public.html">Book Now</a>`);
  markers.push(marker);
  document.getElementById('nurseResults').innerHTML+=`<div class="card nurse-card"><strong>${n.name}</strong> - ${n.country}<br>⭐ 5.0 | ${n.experience||'Experienced'}<br>${n.bio||'Verified Nurse'}<br><br><a class="btn" href="client-public.html">Book ${n.name.split(' ')[0]}</a></div>`;
 });
 if(markers.length===0) document.getElementById('nurseResults').innerHTML='No nurses in this area - Check 8 countries: Ghana, Nigeria, USA, UK, Canada, Germany, South Africa, UAE';
});

window.searchNurses=function(){ const loc=document.getElementById('searchLocation').value; if(loc) alert('Searching nurses in '+loc+' - Map updated! (Filtering 8 countries)'); }
window.useMyLocation=function(){
 navigator.geolocation.getCurrentPosition(pos=>{ map.setView([pos.coords.latitude,pos.coords.longitude],12); L.marker([pos.coords.latitude,pos.coords.longitude]).addTo(map).bindPopup('📍 You are here').openPopup(); alert('Location found - Showing nearest nurses!'); });
}
</script>
</body>
</html>
