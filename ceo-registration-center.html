<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEO View All Uploads - Nurses + Clients</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:#0e0a1c;color:#e8e0ff;min-height:100vh;padding:12px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(14,10,28,.96);border:1px solid rgba(168,85,247,.2);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:10px 16px;border-radius:999px;border:1px solid rgba(168,85,247,.2);background:rgba(28,18,56,.6);color:#d8b4fe;font-weight:800;font-size:11px;cursor:pointer}
.tab.active{background:linear-gradient(135deg,#a855f7,#d8b4fe);color:#1e0a3a}
.searchRow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.input{padding:10px 14px;border-radius:12px;border:1px solid rgba(168,85,247,.2);background:rgba(14,10,28,.6);color:#fff;font-size:12px;flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.card{background:rgba(28,18,56,.96);border:1px solid rgba(168,85,247,.18);border-radius:18px;padding:14px;position:relative}
.card.approved{border-color:rgba(34,197,94,.3)}
.card.pending{border-color:rgba(251,191,36,.3)}
.cardHeader{display:flex;gap:10px;align-items:start}
.avatar{width:64px;height:64px;border-radius:50%;background:#2e1065;display:grid;place-items:center;font-weight:900;overflow:hidden;flex-shrink:0;border:2px solid rgba(168,85,247,.3)}
.avatar img{width:100%;height:100%;object-fit:cover}
.badge{font-size:9px;font-weight:900;padding:4px 8px;border-radius:999px;border:1px solid;display:inline-flex;margin:2px}
.badgePending{background:rgba(251,191,36,.15);color:#fbbf24;border-color:rgba(251,191,36,.3)}
.badgeApproved{background:rgba(34,197,94,.15);color:#4ade80;border-color:rgba(34,197,94,.4)}
.badgeAll5{background:rgba(34,197,94,.1);color:#86efac;border-color:rgba(34,197,94,.2)}
.badgeMissing{background:rgba(239,68,68,.15);color:#fca5a5;border-color:rgba(239,68,68,.3)}
.info{font-size:11px;color:#a78bfa;line-height:1.5;margin-top:6px}
.docs{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.docBox{background:rgba(14,10,28,.6);border:1px solid rgba(168,85,247,.15);border-radius:12px;padding:8px;text-align:center;cursor:pointer;transition:.15s}
.docBox:hover{border-color:#a855f7;transform:translateY(-2px)}
.docBox img, .docBox video{width:100%;height:80px;object-fit:cover;border-radius:8px;background:#000}
.docLabel{font-size:9px;font-weight:800;margin-top:4px;color:#c4b5fd;text-transform:uppercase}
.docMissing{opacity:.3;border-style:dashed}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{flex:1;padding:10px;border-radius:10px;font-weight:900;font-size:10px;border:none;cursor:pointer;min-width:90px}
.btnApprove{background:linear-gradient(135deg,#22c55e,#16a34a);color:#052e16}
.btnReject{background:linear-gradient(135deg,#ef4444,#991b1b);color:white}
.btnView{background:rgba(168,85,247,.15);color:#d8b4fe;border:1px solid rgba(168,85,247,.3)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:9999;padding:20px}
.modalContent{background:rgba(28,18,56,.98);border:1px solid rgba(168,85,247,.3);border-radius:16px;padding:16px;max-width:90vw;max-height:90vh;overflow:auto;text-align:center}
.modalContent img, .modalContent video{max-width:100%;max-height:70vh;border-radius:12px}
.toast{position:fixed;right:14px;bottom:14px;z-index:200;background:#1e0a3a;border:1px solid rgba(168,85,247,.3);color:#fff;padding:12px 16px;border-radius:12px;font-size:12px;display:none}
</style>
</head>
<body>
<div class="topbar">
<div><b>👑 CEO — View All Uploads — Nurses + Clients</b><br><small id="counts" style="color:#a78bfa">Loading...</small></div>
<div style="display:flex;gap:8px">
<button onclick="loadAll()" style="padding:8px 14px;border-radius:999px;background:#2e1065;color:#d8b4fe;border:1px solid rgba(168,85,247,.2);cursor:pointer">🔄 Refresh</button>
<a href="ceo-dashboard.html" style="padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.06);color:#fff;text-decoration:none;font-size:11px">🏠 Dashboard</a>
</div>
</div>

<div class="searchRow">
<input id="search" class="input" placeholder="Search name, email, phone..." oninput="render()">
<select id="filterDoc" class="input" style="max-width:180px" onchange="render()">
<option value="all">All Documents</option>
<option value="missing">Missing ALL 5</option>
<option value="hasVideo">Has Video</option>
<option value="hasPhoto">Has Photo</option>
</select>
</div>

<div class="tabs">
<button class="tab active" data-tab="nursesPending" onclick="switchTab('nursesPending')">👩‍⚕️ Nurses Pending <small id="c_nursesPending">0</small></button>
<button class="tab" data-tab="nursesApproved" onclick="switchTab('nursesApproved')">✅ Nurses Approved <small id="c_nursesApproved">0</small></button>
<button class="tab" data-tab="clientsPending" onclick="switchTab('clientsPending')">👥 Clients Pending <small id="c_clientsPending">0</small></button>
<button class="tab" data-tab="clientsApproved" onclick="switchTab('clientsApproved')">✅ Clients Approved <small id="c_clientsApproved">0</small></button>
<button class="tab" data-tab="all" onclick="switchTab('all')">📦 ALL <small id="c_all">0</small></button>
</div>

<div id="grid" class="grid"></div>
<div id="empty" style="padding:30px;text-align:center;color:#6b7280;display:none">No records</div>

<div class="modal" id="modal" onclick="closeModal()">
<div class="modalContent" onclick="event.stopPropagation()">
<div id="modalTitle" style="font-weight:900;margin-bottom:10px"></div>
<div id="modalBody"></div>
<button onclick="closeModal()" style="margin-top:12px;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;cursor:pointer">Close</button>
</div>
</div>

<div id="toast" class="toast"></div>

<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let allData={nursesPending:[],nursesApproved:[],clientsPending:[],clientsApproved:[],all:[]};
let currentTab='nursesPending';

function toast(m){const el=document.getElementById('toast');el.textContent=m;el.style.display='block';setTimeout(()=>el.style.display='none',4000);}

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab[data-tab]').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tab}"]`)?.classList.add('active');
  render();
}

function sanitizeEmail(e){ return (e||'').toLowerCase().replace(/[.#$@\[\]]/g,'_'); }

function normalizeRecord(id, raw, type){
  const v=raw.profile||raw.data||raw||{};
  const email=(v.email||v.clientEmail||'').toLowerCase();
  const name=v.fullName||v.name||v.displayName||v.clientName||(email?email.split('@')[0]:'Unnamed');
  const phone=v.phone||v.phoneNumber||v.clientPhone||'';
  const photo=v.photoURL||v.photo||v.photoUrl||v.avatar||'';
  const idURL=v.idURL||v.idUrl||v.nationalIdUrl||'';
  const licenceURL=v.licenceURL||v.licenseUrl||v.licence||v.licenceUrl||'';
  const videoURL=v.videoURL||v.videoUrl||'';
  const certURL=v.cvURL||v.cvUrl||v.certificateURL||v.certificate||'';
  const lat=v.lat||v.latitude||null;
  const lng=v.lng||v.longitude||null;
  const gpsName=v.gpsActualName||v.gpsName||v.locationName||'';
  const isApproved=v.isApproved===true||v.approved===true||v.status==='approved'||v.canLogin===true||v.isVerified===true;
  const hasAll5=!!(email && name && photo && phone && (type==='client' || videoURL)); // client doesn't need video but we have it
  const hasPhoto=!!photo;
  const hasVideo=!!videoURL;
  const hasId=!!idURL;
  const hasLicence=!!licenceURL;
  const hasCert=!!certURL;

  return {
    id: id,
    uid: v.uid||id,
    type: type,
    name: name.substring(0,40),
    email: email,
    phone: phone,
    photo: photo,
    idURL: idURL,
    licenceURL: licenceURL,
    videoURL: videoURL,
    certURL: certURL,
    lat: lat,
    lng: lng,
    gpsName: gpsName,
    isApproved: isApproved,
    hasAll5: hasAll5,
    hasPhoto: hasPhoto,
    hasVideo: hasVideo,
    hasId: hasId,
    hasLicence: hasLicence,
    hasCert: hasCert,
    raw: v,
    createdAt: v.createdAt||v.timestamp||Date.now(),
    qualification: v.qualification||'',
    services: v.services||v.specialty||'',
    referenceName: v.referenceName||'',
    referencePhone: v.referencePhone||''
  };
}

async function loadAll(){
  document.getElementById('grid').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:30px;color:#6b7280">Loading all uploads from nurses + clients...</div>';
  allData={nursesPending:[],nursesApproved:[],clientsPending:[],clientsApproved:[],all:[]};
  const nursesMap={};
  const clientsMap={};

  // NURSES - from multiple paths
  const nursePaths=['ceoRegistrationCenter/nurses','nurses','pending_nurses','pendingNurses','ceoNurseUpdates','nurse_registrations','allNurses','nurseUsers'];
  for(const path of nursePaths){
    try{
      const snap=await db.ref(path).once('value');
      if(snap.exists()){
        snap.forEach(ch=>{
          const id=ch.key;
          const raw=ch.val();
          if(!raw) return;
          const rec=normalizeRecord(id, raw, 'nurse');
          if(!nursesMap[rec.uid]) nursesMap[rec.uid]=rec;
          else nursesMap[rec.uid]={...nursesMap[rec.uid], ...rec, photo: nursesMap[rec.uid].photo||rec.photo, videoURL: nursesMap[rec.uid].videoURL||rec.videoURL, idURL: nursesMap[rec.uid].idURL||rec.idURL, licenceURL: nursesMap[rec.uid].licenceURL||rec.licenceURL, certURL: nursesMap[rec.uid].certURL||rec.certURL};
          // Update approval status to latest true
          if(rec.isApproved) nursesMap[rec.uid].isApproved=true;
        });
      }
    }catch(e){ console.log('nurse path err', path, e); }
  }

  // CLIENTS - from multiple paths
  const clientPaths=['ceoRegistrationCenter/clients','clients','client_registrations','allClients','clientUsers','pendingClientRegistrations','ceoClientUpdates','googleClients'];
  for(const path of clientPaths){
    try{
      const snap=await db.ref(path).once('value');
      if(snap.exists()){
        snap.forEach(ch=>{
          const id=ch.key;
          const raw=ch.val();
          if(!raw) return;
          const rec=normalizeRecord(id, raw, 'client');
          if(!clientsMap[rec.uid]) clientsMap[rec.uid]=rec;
          else clientsMap[rec.uid]={...clientsMap[rec.uid], ...rec, photo: clientsMap[rec.uid].photo||rec.photo};
          if(rec.isApproved) clientsMap[rec.uid].isApproved=true;
        });
      }
    }catch(e){ console.log('client path err', path, e); }
  }

  const nurses=Object.values(nursesMap);
  const clients=Object.values(clientsMap);

  allData.nursesPending=nurses.filter(n=>!n.isApproved);
  allData.nursesApproved=nurses.filter(n=>n.isApproved);
  allData.clientsPending=clients.filter(c=>!c.isApproved);
  allData.clientsApproved=clients.filter(c=>c.isApproved);
  allData.all=[...nurses, ...clients].sort((a,b)=>b.createdAt-a.createdAt);

  document.getElementById('counts').textContent=`Nurses: ${nurses.length} (${allData.nursesPending.length} pending, ${allData.nursesApproved.length} approved) | Clients: ${clients.length} (${allData.clientsPending.length} pending, ${allData.clientsApproved.length} approved)`;
  document.getElementById('c_nursesPending').textContent=allData.nursesPending.length;
  document.getElementById('c_nursesApproved').textContent=allData.nursesApproved.length;
  document.getElementById('c_clientsPending').textContent=allData.clientsPending.length;
  document.getElementById('c_clientsApproved').textContent=allData.clientsApproved.length;
  document.getElementById('c_all').textContent=allData.all.length;

  render();
}

function render(){
  const grid=document.getElementById('grid');
  const empty=document.getElementById('empty');
  const search=(document.getElementById('search').value||'').toLowerCase();
  const docFilter=document.getElementById('filterDoc').value;
  let list=allData[currentTab]||[];

  if(search){
    list=list.filter(r=> (r.name+' '+r.email+' '+r.phone).toLowerCase().includes(search));
  }
  if(docFilter==='missing'){
    list=list.filter(r=>!r.hasAll5);
  }else if(docFilter==='hasVideo'){
    list=list.filter(r=>r.hasVideo);
  }else if(docFilter==='hasPhoto'){
    list=list.filter(r=>r.hasPhoto);
  }

  if(list.length===0){
    grid.innerHTML='';
    empty.style.display='block';
    empty.textContent=currentTab+' — No records'+(search?' for "'+search+'"':'');
    return;
  }
  empty.style.display='none';
  grid.innerHTML='';

  list.forEach(rec=>{
    const card=document.createElement('div');
    card.className='card '+(rec.isApproved?'approved':'pending');
    card.innerHTML=`
      <div class="cardHeader">
        <div class="avatar">${rec.photo?`<img src="${rec.photo}" onerror="this.parentElement.textContent='${rec.name.charAt(0).toUpperCase()}'">`:rec.name.charAt(0).toUpperCase()}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px">
            <div style="font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${rec.name} ${rec.type==='nurse'?'👩‍⚕️':'👤'}</div>
            <div>
              <span class="badge ${rec.isApproved?'badgeApproved':'badgePending'}">${rec.isApproved?'✅ APPROVED':'⏳ PENDING'}</span>
              <span class="badge ${rec.hasAll5?'badgeAll5':'badgeMissing'}">${rec.hasAll5?'✅ ALL 5':'❌ Missing'}</span>
            </div>
          </div>
          <div class="info">
            📧 ${rec.email||'no email'}<br>
            📞 ${rec.phone||'no phone'}<br>
            ${rec.type==='nurse'?`🎓 ${rec.qualification||''} • ${rec.services||''}<br>👤 Ref: ${rec.referenceName||''} ${rec.referencePhone||''}<br>`:''}
            📍 ${rec.gpsName||''} ${rec.lat?`(${Number(rec.lat).toFixed(4)}, ${Number(rec.lng).toFixed(4)})`:''}<br>
            <small style="color:#6b7280">UID: ${rec.uid} • ${new Date(rec.createdAt).toLocaleString()}</small>
          </div>
        </div>
      </div>

      <div class="docs">
        <div class="docBox ${rec.hasPhoto?'':'docMissing'}" onclick="viewDoc('${rec.photo}','Photo - ${rec.name}','image')">
          ${rec.photo?`<img src="${rec.photo}" loading="lazy">`:`<div style="height:80px;display:grid;place-items:center;color:#6b7280">No Photo</div>`}
          <div class="docLabel">📸 Profile Photo ${rec.hasPhoto?'✅':'❌'}</div>
        </div>

        ${rec.type==='nurse'?`
        <div class="docBox ${rec.hasId?'':'docMissing'}" onclick="viewDoc('${rec.idURL}','National ID - ${rec.name}','image')">
          ${rec.idURL? (rec.idURL.includes('.pdf')?`<div style="height:80px;display:grid;place-items:center;background:#1a1633">📄 PDF</div>`:`<img src="${rec.idURL}" loading="lazy">`) :`<div style="height:80px;display:grid;place-items:center;color:#6b7280">No ID</div>`}
          <div class="docLabel">🪪 National ID ${rec.hasId?'✅':'❌'}</div>
        </div>

        <div class="docBox ${rec.hasLicence?'':'docMissing'}" onclick="viewDoc('${rec.licenceURL}','Licence - ${rec.name}','image')">
          ${rec.licenceURL? (rec.licenceURL.includes('.pdf')?`<div style="height:80px;display:grid;place-items:center;background:#1a1633">📄 PDF</div>`:`<img src="${rec.licenceURL}" loading="lazy">`) :`<div style="height:80px;display:grid;place-items:center;color:#6b7280">No Licence</div>`}
          <div class="docLabel">📜 Licence ${rec.hasLicence?'✅':'❌'}</div>
        </div>

        <div class="docBox ${rec.hasVideo?'':'docMissing'}" onclick="viewDoc('${rec.videoURL}','Intro Video - ${rec.name}','video')">
          ${rec.videoURL?`<video src="${rec.videoURL}" style="height:80px"></video>`:`<div style="height:80px;display:grid;place-items:center;color:#6b7280">No Video</div>`}
          <div class="docLabel">🎥 Intro Video ${rec.hasVideo?'✅ REQUIRED':'❌ REQUIRED MISSING'}</div>
        </div>

        <div class="docBox ${rec.hasCert?'':'docMissing'}" onclick="viewDoc('${rec.certURL}','Certificate (Optional) - ${rec.name}','image')" style="grid-column:span 2">
          ${rec.certURL? (rec.certURL.includes('.pdf')?`<div style="height:80px;display:grid;place-items:center;background:#1a1633">📄 PDF Certificate</div>`:`<img src="${rec.certURL}" loading="lazy">`) :`<div style="height:80px;display:grid;place-items:center;color:#6b7280">No Certificate (Optional - OK)</div>`}
          <div class="docLabel">📜 Certificate ${rec.hasCert?'✅ Optional provided':'➖ Optional not provided'}</div>
        </div>
        ` : `
        <div class="docBox" style="grid-column:span 2;color:#6b7280;font-size:10px">Client has only Profile Photo (ALL 4 for clients: Email+Name+Phone+Photo)</div>
        `}
      </div>

      <div class="actions">
        ${!rec.isApproved?`<button class="btn btnApprove" onclick="approve('${rec.uid}','${rec.email}','${rec.type}')">✅ Approve — Allow Login</button>`:``}
        <button class="btn btnView" onclick="viewAllDocs('${rec.uid}')">👁️ View All Uploads</button>
        ${!rec.isApproved?`<button class="btn btnReject" onclick="reject('${rec.uid}','${rec.email}','${rec.type}')">❌ Reject</button>`:``}
      </div>
    `;
    grid.appendChild(card);
  });
}

function viewDoc(url, title, type){
  if(!url){ toast('No file'); return; }
  const modal=document.getElementById('modal');
  document.getElementById('modalTitle').textContent=title;
  const body=document.getElementById('modalBody');
  if(url.includes('.pdf')){
    body.innerHTML=`<a href="${url}" target="_blank" style="color:#93c5fd">📄 Open PDF in new tab</a><br><br><iframe src="${url}" style="width:100%;height:60vh;border-radius:12px;border:none"></iframe>`;
  }else if(type==='video'){
    body.innerHTML=`<video src="${url}" controls autoplay style="max-width:100%;max-height:70vh"></video><br><br><a href="${url}" target="_blank" style="color:#93c5fd">🔗 Open video in new tab</a>`;
  }else{
    body.innerHTML=`<img src="${url}" style="max-width:100%;max-height:70vh;border-radius:12px"><br><br><a href="${url}" target="_blank" style="color:#93c5fd">🔗 Open image in new tab</a>`;
  }
  modal.style.display='grid';
}

function viewAllDocs(uid){
  const rec=allData.all.find(r=>r.uid===uid);
  if(!rec){ toast('Not found'); return; }
  const modal=document.getElementById('modal');
  document.getElementById('modalTitle').textContent=`All Uploads — ${rec.name} (${rec.type})`;
  const body=document.getElementById('modalBody');
  let html=`<div style="text-align:left;font-size:11px">
    <b>Name:</b> ${rec.name}<br><b>Email:</b> ${rec.email}<br><b>Phone:</b> ${rec.phone}<br><b>Type:</b> ${rec.type}<br><b>Approved:</b> ${rec.isApproved?'Yes':'No'}<br><b>ALL 5:</b> ${rec.hasAll5?'Yes':'No'}<br><br>
    <div style="display:grid;gap:8px">
      <div><b>📸 Photo:</b> ${rec.photo?`<a href="${rec.photo}" target="_blank" style="color:#93c5fd">View</a> - <img src="${rec.photo}" style="width:60px;height:60px;border-radius:50%;object-fit:cover">`:'Missing ❌'}</div>
      ${rec.type==='nurse'?`
      <div><b>🪪 ID:</b> ${rec.idURL?`<a href="${rec.idURL}" target="_blank" style="color:#93c5fd">View ID</a>`:'Missing ❌'}</div>
      <div><b>📜 Licence:</b> ${rec.licenceURL?`<a href="${rec.licenceURL}" target="_blank" style="color:#93c5fd">View Licence</a>`:'Missing ❌'}</div>
      <div><b>🎥 Video:</b> ${rec.videoURL?`<a href="${rec.videoURL}" target="_blank" style="color:#facc15">View Video</a> <video src="${rec.videoURL}" controls style="width:100%;max-height:200px;margin-top:6px;border-radius:8px"></video>`:'Missing ❌ REQUIRED'}</div>
      <div><b>📜 Certificate:</b> ${rec.certURL?`<a href="${rec.certURL}" target="_blank" style="color:#93c5fd">View Certificate</a>`:'Not provided (Optional)'}</div>
      `:''}
    </div>
  </div>`;
  body.innerHTML=html;
  modal.style.display='grid';
}

function closeModal(){ document.getElementById('modal').style.display='none'; }

async function approve(uid, email, type){
  if(!confirm(`Approve ${type} ${email}?\n\nWill:\n1. Add to allowed${type==='nurse'?'Nurses':'Clients'} whitelist\n2. Allow login`)) return;
  try{
    const emailKey=sanitizeEmail(email);
    let data=allData.all.find(r=>r.uid===uid)||{};
    const approvedData={
      ...data.raw,
      uid:uid,
      email:email.toLowerCase(),
      isApproved:true,
      approved:true,
      status:'approved',
      canLogin:true,
      isVerified:true,
      approvedAt:Date.now(),
      approvedBy:'CEO'
    };
    if(type==='nurse'){
      await db.ref('nurses/'+uid).update({isApproved:true,approved:true,status:'approved',canLogin:true,isVerified:true,approvedAt:Date.now()});
      await db.ref('allowedNurses/'+emailKey).set(approvedData);
      await db.ref('allowedNursesByUid/'+uid).set(approvedData);
      await db.ref('ceoRegistrationCenter/nurses/'+uid).update({isApproved:true,approved:true,status:'approved',approvedAt:Date.now()});
    }else{
      await db.ref('clients/'+uid).update({isApproved:true,approved:true,status:'approved',canLogin:true,approvedAt:Date.now()});
      await db.ref('allowedClients/'+emailKey).set(approvedData);
      await db.ref('allowedClientsByUid/'+uid).set(approvedData);
      await db.ref('ceoRegistrationCenter/clients/'+uid).update({isApproved:true,approved:true,status:'approved',approvedAt:Date.now()});
    }
    toast(`✅ ${type} ${email} APPROVED — can now login`);
    setTimeout(loadAll, 1000);
  }catch(e){ toast('Approve failed: '+e.message); }
}

async function reject(uid, email, type){
  if(!confirm(`Reject ${type} ${email}?`)) return;
  try{
    const emailKey=sanitizeEmail(email);
    if(type==='nurse'){
      await db.ref('nurses/'+uid).update({isApproved:false,status:'rejected',rejectedAt:Date.now()});
      await db.ref('ceoRegistrationCenter/nurses/'+uid).update({isApproved:false,status:'rejected'});
      await db.ref('allowedNurses/'+emailKey).remove().catch(()=>{});
      await db.ref('allowedNursesByUid/'+uid).remove().catch(()=>{});
    }else{
      await db.ref('clients/'+uid).update({isApproved:false,status:'rejected'});
      await db.ref('ceoRegistrationCenter/clients/'+uid).update({isApproved:false,status:'rejected'});
    }
    toast(`❌ ${type} ${email} rejected`);
    setTimeout(loadAll, 800);
  }catch(e){ toast('Reject failed: '+e.message); }
}

loadAll();
setInterval(loadAll, 20000);
</script>
