<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0e0a1c;color:#e8e0ff;overflow-x:hidden}

.empty{padding:30px;text-align:center;color:#a78bfa;font-size:13px;border:1px dashed rgba(168,85,247,.2);border-radius:18px;background:rgba(28,18,56,.4)}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.88);backdrop-filter:blur(12px);display:none;place-items:center;padding:16px}

.modalCard{background:#1a1633;border:1px solid rgba(168,85,247,.3);border-radius:20px;max-width:900px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.7)}

.deleteWarning.active{display:block}
</style>

<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
let allData={pendingNurses:[],approvedNurses:[],rejectedNurses:[],clients:[],allUpdates:[]};
let currentTab='pendingNurses';
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.style.display='block';setTimeout(()=>el.style.display='none',7000);}
function switchTab(tab){currentTab=tab;document.querySelectorAll('.tab[data-tab]').forEach(b=>b.classList.remove('active'));const el=document.querySelector(`.tab[data-tab="${tab}"]`);if(el) el.classList.add('active');render();}
function formatTime(ts){if(!ts||ts===0)return'no date';const diff=Date.now()-ts;if(diff<60000)return'just now';if(diff<3600000)return Math.floor(diff/60000)+'m ago';if(diff<86400000)return Math.floor(diff/3600000)+'h ago';if(diff<86400000*7)return Math.floor(diff/86400000)+'d ago';return new Date(ts).toLocaleString();}
function extractRealName(v){
  if(!v||typeof v!=='object') return 'Unnamed';
  let name = v.fullName || v.name || v.nurseName || v.clientName || v.displayName || v.userName || '';
  if(!name || name.length<2){
    const first = v.firstName || v.first_name || v.fName || '';
    const last = v.lastName || v.last_name || v.lName || v.surname || '';
    if(first||last) name = `${first} ${last}`.trim();
  }
  if(!name || name.length<2){
    if(v.email){
      const en = v.email.split('@')[0].replace(/[._-]/g,' ').replace(/\d+/g,'').trim();
      if(en.length>2) name = en.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
    }
  }
  if(!name || name.length<2) name = 'Unnamed';
  return name.trim().replace(/\s+/g,' ').substring(0,60);
}
function normalizeNurse(id,v){
  if(!v||typeof v!=='object') return null;
  const isApproved = v.isApproved===true || v.approved===true || v.status==='approved' || v.canLogin===true;
  const isRejected = v.isRejected===true || v.rejected===true || v.status==='rejected';
  const realName = extractRealName(v);
  return {
    id, type:'nurse', fullName: realName,
    email: v.email || '', phone: v.phone || v.phoneNumber || '',
    country: v.country || '', experience: v.experience || '',
    qualification: v.qualification || '', services: v.services || v.service || v.specialty || '',
    bio: v.bio || '', referenceName: v.referenceName || '', referencePhone: v.referencePhone || '',
    lat: v.lat || null, lng: v.lng || null, gpsActualName: v.gpsActualName || v.location || '',
    photo: v.photo || v.photoURL || '', idURL: v.idURL || '', licenceURL: v.licenceURL || v.licenseURL || '',
    cvURL: v.cvURL || v.cvUrl || '', videoURL: v.videoURL || v.videoUrl || '', certificateUrl: v.certificateUrl || '',
    isApproved, isRejected, status: isApproved?'approved':isRejected?'rejected':'pending', rating: v.rating || 5.0,
    createdAt: v.createdAt || 0, updatedAt: v.updatedAt || v.lastUpdate || v.createdAt || 0, raw: v
  };
}
function normalizeClient(id,v){
  if(!v||typeof v!=='object') return null;
  const realName = extractRealName(v);
  return {
    id, type:'client', fullName: realName,
    email: v.email || '', phone: v.phone || v.phoneNumber || '',
    country: v.country || '', address: v.address || v.location || v.gpsActualName || '',
    lat: v.lat || null, lng: v.lng || null, gpsActualName: v.gpsActualName || v.location || '',
    photo: v.photo || v.photoURL || '', isApproved: true, status: 'client',
    createdAt: v.createdAt || 0, updatedAt: v.updatedAt || v.lastUpdate || 0, raw: v
  };
}
async function loadAll(){
  toast('Loading Nurses + Clients — No green box — Clients only delete...');
  const nursePaths=['nurses','nurse_registrations','pendingNurseRegistrations','nurseUsers','ceoNurseUpdates','ceoRegistrationCenter/nurses','nurseRegistrations','allNurses','ceoBookingReceiverNurses'];
  const clientPaths=['clients','client_registrations','pendingClientRegistrations','clientUsers','ceoClientUpdates','ceoRegistrationCenter/clients','clientRegistrations','allClients','ceoBookingReceiverClients','users'];
  let nurseMap={},clientMap={};
  for(const p of nursePaths){
    try{
      const snap=await db.ref(p).once('value');
      if(snap.exists()){
        snap.forEach(ch=>{
          const id=ch.key; const val=ch.val(); if(!val||typeof val!=='object') return;
          if(!nurseMap[id]) nurseMap[id]=val;
          else{
            const merged={...nurseMap[id],...val};
            Object.keys(val).forEach(k=>{if(val[k] && typeof val[k]==='string' && val[k].length>0) merged[k]=val[k];});
            nurseMap[id]=merged;
          }
        });
      }
    }catch(e){}
  }
  for(const p of clientPaths){
    try{
      const snap=await db.ref(p).once('value');
      if(snap.exists()){
        snap.forEach(ch=>{
          const id=ch.key; const val=ch.val(); if(!val||typeof val!=='object') return;
          if(val.services || val.qualification || val.experience || val.licenceURL || val.cvURL) return;
          if(!clientMap[id]) clientMap[id]=val;
          else clientMap[id]={...clientMap[id],...val};
        });
      }
    }catch(e){}
  }
  let pending=[],approved=[],rejected=[],clients=[],all=[];
  Object.entries(nurseMap).forEach(([id,v])=>{
    const n=normalizeNurse(id,v); if(!n) return; all.push(n);
    if(n.isApproved) approved.push(n); else if(n.isRejected) rejected.push(n); else pending.push(n);
  });
  Object.entries(clientMap).forEach(([id,v])=>{
    const c=normalizeClient(id,v); if(!c) return;
    if(nurseMap[id]) return;
    clients.push(c);
    all.push(c);
  });
  all.sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0));
  clients.sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0));
  allData={pendingNurses:pending,approvedNurses:approved,rejectedNurses:rejected,clients:clients,allUpdates:all};
  document.getElementById('c_pendingNurses').textContent=pending.length;
  document.getElementById('c_approvedNurses').textContent=approved.length;
  document.getElementById('c_rejectedNurses').textContent=rejected.length;
  document.getElementById('c_clients').textContent=clients.length;
  document.getElementById('c_allUpdates').textContent=all.length;
  document.getElementById('counts').textContent=`Nurses: ${pending.length} pending, ${approved.length} approved, ${rejected.length} rejected | Clients: ${clients.length} — Only delete`;
  render();
  toast(`Loaded: ${pending.length+approved.length+rejected.length} nurses + ${clients.length} clients — Green box removed — Clients only DELETE`);
}
function viewParticular(url, type, name){
  if(!url || url==='#' || url.length<5){toast(`No ${type} for ${name}`);return;}
  const lower=url.toLowerCase();
  const isImg=lower.includes('.jpg')||lower.includes('.jpeg')||lower.includes('.png')||lower.includes('image')||type.includes('Photo');
  const isVid=lower.includes('.mp4')||lower.includes('video')||type.includes('Video');
  const modal=document.getElementById('previewModal');
  const title=document.getElementById('previewTitle');
  const body=document.getElementById('previewBody');
  title.textContent=`${type} — ${name}`;
  if(isImg && !isVid){
    body.innerHTML=`<img src="${url}" class="previewImg"><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><a href="${url}" target="_blank" style="flex:1;padding:12px;border-radius:12px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#052e16;text-align:center;text-decoration:none;font-weight:800">Open in New Tab</a><button onclick="closePreview()" style="flex:1;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(168,85,247,.2);cursor:pointer">Close</button></div>`;
  } else if(isVid){
    body.innerHTML=`<video src="${url}" controls autoplay style="width:100%;max-height:65vh;border-radius:12px;background:#000"></video><div style="margin-top:12px;display:flex;gap:8px"><a href="${url}" target="_blank" style="flex:1;padding:12px;border-radius:12px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#052e16;text-align:center;text-decoration:none;font-weight:800">Open in New Tab</a><button onclick="closePreview()" style="flex:1;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(168,85,247,.2);cursor:pointer">Close</button></div>`;
  } else {
    body.innerHTML=`<div style="background:rgba(14,10,28,.6);border-radius:12px;padding:12px"><b>${type}</b> — ${name}<br><a href="${url}" target="_blank" style="color:#93c5fd;word-break:break-all">${url}</a></div><iframe src="${url}" style="width:100%;height:65vh;border-radius:12px;border:1px solid rgba(168,85,247,.2);margin-top:12px;background:#fff"></iframe><div style="margin-top:12px;display:flex;gap:8px"><a href="${url}" target="_blank" style="flex:1;padding:12px;border-radius:12px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#052e16;text-align:center;text-decoration:none;font-weight:800">Open in New Tab</a><button onclick="closePreview()" style="flex:1;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(168,85,247,.2);cursor:pointer">Close</button></div>`;
  }
  modal.classList.add('active');
}
function closePreview(){document.getElementById('previewModal').classList.remove('active');}
function render(){
  const grid=document.getElementById('grid'); const empty=document.getElementById('empty');
  const search=document.getElementById('search').value.toLowerCase().trim(); const sort=document.getElementById('sort').value;
  let list=[...(allData[currentTab]||[])];
  if(search){list=list.filter(i=>`${i.fullName} ${i.email} ${i.phone} ${i.country} ${i.id}`.toLowerCase().includes(search));}
  if(sort==='name') list.sort((a,b)=>a.fullName.localeCompare(b.fullName));
  else if(sort==='type') list.sort((a,b)=>a.type.localeCompare(b.type));
  else if(sort==='newest') list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  else list.sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0));
  grid.innerHTML=''; if(list.length===0){empty.style.display='block';return;} empty.style.display='none';
  list.forEach(item=>{
    const isNurse=item.type==='nurse';
    if(isNurse){
      const statusBadge=item.status==='approved'?'<span class="badge badgeApproved">Approved</span>':item.status==='rejected'?'<span class="badge badgeRejected">Rejected</span>':'<span class="badge badgePending">Pending</span>';
      const nameBadge=`<span class="badge badgeName">${item.fullName}</span>`;
      const idBadge=`<span class="badge badgeId">ID: ${item.id.substring(0,20)}...</span>`;
      const expBadge=item.experience?`<span class="badge badgeExp">${item.experience}</span>`:'';
      const qualBadge=item.qualification?`<span class="badge badgeInfo">${item.qualification}</span>`:'';
      const serviceBadge=item.services?`<span class="badge badgeInfo">${item.services}</span>`:'';
      const photoHtml=item.photo?`<img src="${item.photo}" style="width:100%;height:100%;object-fit:cover">`:item.fullName.charAt(0).toUpperCase();
      const details=`<div class="details"><b>Nurse Particulars:</b><br>Email: ${item.email||'no email'}<br>Phone: ${item.phone||'no phone'}<br>Country: ${item.country||'-'}<br>Exp: ${item.experience||'-'}<br>Qual: ${item.qualification||'-'}<br>Services: ${item.services||'-'}<br>Bio: ${item.bio||'-'}<br><br><b>Reference:</b> ${item.referenceName||'-'} — ${item.referencePhone||'-'}<br><br><b>GPS:</b> ${item.gpsActualName||'No address'}<br>Lat: ${item.lat||'-'} Lng: ${item.lng||'-'}<br>Rating: ${item.rating||5.0}<br>Created: ${formatTime(item.createdAt)} • Updated: ${formatTime(item.updatedAt)}</div>`;
      const mapId=`map_${item.id}_${Math.random().toString(36).slice(2,5)}`;
      const hasMap=item.lat&&item.lng;
      const mapBox=hasMap?`<div id="${mapId}" class="mapMini"></div>`:`<small style="color:#a78bfa">${item.gpsActualName||'No GPS'}</small>`;
      const photoBtn=item.photo?`<button class="docBtn has" onclick="viewParticular('${item.photo}','Photo','${item.fullName.replace(/'/g,'')}')">Photo</button>`:`<span class="docBtn no">No Photo</span>`;
      const idBtn=item.idURL?`<button class="docBtn has" onclick="viewParticular('${item.idURL}','National ID','${item.fullName.replace(/'/g,'')}')">ID</button>`:`<span class="docBtn no">No ID</span>`;
      const licBtn=(item.licenceURL)?`<button class="docBtn has" onclick="viewParticular('${item.licenceURL}','Licence','${item.fullName.replace(/'/g,'')}')">Licence</button>`:`<span class="docBtn no">No Licence</span>`;
      const cvBtn=item.cvURL?`<button class="docBtn has" onclick="viewParticular('${item.cvURL}','CV','${item.fullName.replace(/'/g,'')}')">CV</button>`:`<span class="docBtn no">No CV</span>`;
      const videoBtn=item.videoURL?`<button class="docBtn has" onclick="viewParticular('${item.videoURL}','Video','${item.fullName.replace(/'/g,'')}')">Video</button>`:`<span class="docBtn no">No Video</span>`;
      const actions=`<div class="actions">${item.status!=='approved'?`<button class="btn btnAccept" onclick="acceptNurse('${item.id}')">ACCEPT — ${item.fullName}</button>`:`<button class="btn" style="background:rgba(34,197,94,.15);color:#4ade80" disabled>Approved</button>`}${item.status!=='rejected'?`<button class="btn btnReject" onclick="rejectNurse('${item.id}')">REJECT</button>`:''}</div>`;
      const card=document.createElement('div'); card.className='card';
      card.innerHTML=`<div class="head"><div class="avatar" onclick="viewParticular('${item.photo}','Photo','${item.fullName.replace(/'/g,'')}')">${photoHtml}</div><div class="meta"><h3>${item.fullName} Nurse</h3><small>Email: ${item.email||'no email'}<br>Phone: ${item.phone||'no phone'}</small><div class="row">${statusBadge} ${nameBadge}<br>${expBadge} ${qualBadge} ${serviceBadge}<br>${idBadge}</div></div></div>${details}<div style="margin-top:8px">${mapBox}</div><div class="docRow">${photoBtn} ${idBtn} ${licBtn} ${cvBtn} ${videoBtn}</div>${actions}`;
      grid.appendChild(card);
      if(hasMap){setTimeout(()=>{try{const el=document.getElementById(mapId); if(!el) return; const map=L.map(el).setView([item.lat,item.lng],13); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map); L.marker([item.lat,item.lng]).addTo(map).bindPopup(item.fullName);}catch(e){}},400);}
    } else {
      const photoHtml=item.photo?`<img src="${item.photo}" style="width:100%;height:100%;object-fit:cover">`:item.fullName.charAt(0).toUpperCase();
      const details=`<div class="details"><b>Client Particulars:</b><br>Email: ${item.email||'no email'}<br>Phone: ${item.phone||'no phone'}<br>Country: ${item.country||'-'}<br>Address: ${item.address||item.gpsActualName||'-'}<br>Created: ${formatTime(item.createdAt)}<br>Updated: ${formatTime(item.updatedAt)}<br><br><b>Client — Only DELETE ACCOUNT (no accept/reject)</b></div>`;
      const photoBtn=item.photo?`<button class="docBtn has" onclick="viewParticular('${item.photo}','Client Photo','${item.fullName.replace(/'/g,'')}')">Photo</button>`:`<span class="docBtn no">No Photo</span>`;
      const deleteBtn=`<div class="actions"><button class="btn btnDelete" onclick="deleteClient('${item.id}')">DELETE ACCOUNT — ${item.fullName}</button></div>
      <div id="delWarn_${item.id}" class="deleteWarning"><b style="color:#ef4444">DELETE Client — FINAL — Type DELETE</b><br><input id="delInput_${item.id}" placeholder="Type DELETE" style="width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.1);color:#fff"><div style="display:flex;gap:8px;margin-top:8px"><button onclick="confirmDeleteClient('${item.id}')" style="flex:1;padding:10px;border-radius:10px;background:#000;color:#ef4444;border:1px solid rgba(239,68,68,.5);font-weight:900;cursor:pointer">CONFIRM DELETE</button><button onclick="cancelDeleteClient('${item.id}')" style="flex:1;padding:10px;border-radius:10px;background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.1);cursor:pointer">Cancel</button></div></div>`;
      const card=document.createElement('div'); card.className='card clientCard';
      card.innerHTML=`<div class="head"><div class="avatar" onclick="viewParticular('${item.photo}','Client Photo','${item.fullName.replace(/'/g,'')}')">${photoHtml}</div><div class="meta"><h3>${item.fullName} Client</h3><small>Email: ${item.email||'no email'}<br>Phone: ${item.phone||'no phone'}</small><div class="row"><span class="badge badgeClient">Client — Only Delete</span><span class="badge badgeName">${item.fullName}</span><br><span class="badge badgeId">ID: ${item.id.substring(0,20)}...</span></div></div></div>${details}<div class="docRow">${photoBtn}</div>${deleteBtn}`;
      grid.appendChild(card);
    }
  });
}
async function acceptNurse(id){
  const nurse=allData.allUpdates.find(n=>n.id===id) || allData.pendingNurses.find(n=>n.id===id);
  const realName=nurse? nurse.fullName : 'Unknown';
  if(!confirm(`ACCEPT nurse ${realName}? ID: ${id}`)) return;
  const base=nurse? nurse.raw : {};
  const updateData={...base, fullName: realName, name: realName, displayName: realName, nurseName: realName, isApproved:true, canLogin:true, approved:true, isRejected:false, rejected:false, status:'approved', approvedAt:Date.now(), updatedAt:Date.now(), lastUpdate:Date.now(), approvedBy:'CEO'};
  const paths=[`nurses/${id}`,`nurse_registrations/${id}`,`pendingNurseRegistrations/${id}`,`nurseUsers/${id}`,`ceoNurseUpdates/${id}`,`ceoRegistrationCenter/nurses/${id}`,`nurseRegistrations/${id}`,`allNurses/${id}`];
  let saved=0; for(const path of paths){try{const snap=await db.ref(path).once('value'); if(snap.exists()){await db.ref(path).update(updateData); saved++;} else if(path.startsWith('nurses/')){await db.ref(path).set(updateData); saved++;}}catch(e){}}
  toast(`ACCEPTED ${realName} — Saved to ${saved} paths`); setTimeout(loadAll,800);
}
async function rejectNurse(id){
  const nurse=allData.allUpdates.find(n=>n.id===id);
  const realName=nurse? nurse.fullName : 'Unknown';
  if(!confirm(`REJECT nurse ${realName}? ID: ${id}`)) return;
  const updateData={isApproved:false, isRejected:true, rejected:true, canLogin:false, approved:false, status:'rejected', rejectedAt:Date.now(), updatedAt:Date.now(), fullName: realName, name: realName};
  const paths=[`nurses/${id}`,`nurse_registrations/${id}`,`pendingNurseRegistrations/${id}`,`nurseUsers/${id}`,`ceoRegistrationCenter/nurses/${id}`,`nurseRegistrations/${id}`,`allNurses/${id}`];
  let saved=0; for(const path of paths){try{const snap=await db.ref(path).once('value'); if(snap.exists()){await db.ref(path).update(updateData); saved++;}}catch(e){}}
  toast(`REJECTED ${realName} — Saved to ${saved} paths`); setTimeout(loadAll,800);
}
function deleteClient(id){
  const el=document.getElementById(`delWarn_${id}`);
  if(el) el.classList.toggle('active');
}
function cancelDeleteClient(id){
  const el=document.getElementById(`delWarn_${id}`);
  if(el) el.classList.remove('active');
  const inp=document.getElementById(`delInput_${id}`);
  if(inp) inp.value='';
}
async function confirmDeleteClient(id){
  const inp=document.getElementById(`delInput_${id}`);
  if(!inp || inp.value.trim()!=='DELETE'){toast('Type DELETE exactly'); if(inp) inp.focus(); return;}
  const client=allData.clients.find(c=>c.id===id) || allData.allUpdates.find(c=>c.id===id);
  const realName=client? client.fullName : id;
  if(!confirm(`FINAL DELETE client ${realName}? ID: ${id} — Confirm?`)) return;
  const paths=[`clients/${id}`,`client_registrations/${id}`,`pendingClientRegistrations/${id}`,`clientUsers/${id}`,`ceoClientUpdates/${id}`,`ceoRegistrationCenter/clients/${id}`,`clientRegistrations/${id}`,`allClients/${id}`,`ceoBookingReceiverClients/${id}`,`users/${id}`];
  let deleted=0;
  for(const path of paths){
    try{
      const snap=await db.ref(path).once('value');
      if(snap.exists()){await db.ref(path).remove(); deleted++;}
    }catch(e){}
  }
  toast(`DELETED client ${realName} — Removed from ${deleted} paths — FINAL`);
  cancelDeleteClient(id);
  setTimeout(loadAll,1000);
}
window.onload=loadAll;
</script>
</body>
