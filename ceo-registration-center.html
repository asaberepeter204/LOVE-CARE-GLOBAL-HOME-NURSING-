<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0e0a1c;color:#e8e0ff}
.topbar{position:sticky;top:0;z-index:60;background:rgba(14,10,28,.96);border-bottom:1px solid rgba(168,85,247,.2);padding:12px 16px;display:flex;justify-content:space-between;flex-wrap:wrap}
.wrap{max-width:1360px;margin:0 auto;padding:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tab{padding:10px 14px;border-radius:999px;border:1px solid rgba(168,85,247,.2);background:rgba(28,18,56,.6);color:#d8b4fe;font-weight:800;font-size:11px;cursor:pointer}

.head{display:flex;gap:12px}

.toast{position:fixed;right:14px;bottom:14px;z-index:200;background:#1e0a3a;border:1px solid rgba(168,85,247,.3);color:#fff;padding:12px 16px;border-radius:12px;font-size:12px;display:none}
.deleteWarning{background:rgba(239,68,68,.1);border:2px solid rgba(239,68,68,.3);border-radius:12px;padding:12px;margin-top:10px;display:none}
.deleteWarning.active{display:block}
.empty{padding:30px;text-align:center;color:#a78bfa;border:1px dashed rgba(168,85,247,.2);border-radius:18px}
</style>

<body>

<div class="wrap">

<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const dbFS=firebase.firestore();
let allData={pendingNurses:[],approvedNurses:[],rejectedNurses:[],blockedNurses:[],clients:[],blockedClients:[],allUpdates:[]};
let currentTab='pendingNurses';
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.style.display='block';setTimeout(()=>el.style.display='none',5000); console.log(m);}
function switchTab(tab){currentTab=tab;document.querySelectorAll('.tab[data-tab]').forEach(b=>b.classList.remove('active'));document.querySelector(`.tab[data-tab="${tab}"]`)?.classList.add('active');render();}
function formatTime(ts){if(!ts)return'no date';const d=Date.now()-ts;if(d<60000)return'just now';if(d<3600000)return Math.floor(d/60000)+'m ago';if(d<86400000)return Math.floor(d/3600000)+'h ago';return new Date(ts).toLocaleDateString();}
function extractName(v){if(!v||typeof v!=='object')return'Unnamed';let n=v.displayName||v.fullName||v.name||v.nurseName||v.clientName||'';if(!n&&v.email)n=v.email.split('@')[0];return n.substring(0,40)||'Unnamed';}
function normalizeNurse(id,v){
  let real=v.profile||v.data||v;
  const isBlocked=real.isBlocked===true||real.blocked===true||real.status==='blocked';
  const isApproved=real.isApproved===true||real.approved===true||real.status==='approved';
  const isRejected=real.isRejected===true||real.rejected===true||real.status==='rejected';
  let status='pending'; if(isBlocked)status='blocked'; else if(isApproved)status='approved'; else if(isRejected)status='rejected';
  return {id,type:'nurse',fullName:extractName(real),email:real.email||'',phone:real.phone||'',photo:real.photo||real.photoURL||'',isBlocked,status,createdAt:real.createdAt||0,updatedAt:real.updatedAt||0,raw:real};
}
function normalizeClient(id,v){
  let real=v.profile||v.data||v.clientData||v;
  const isBlocked=real.isBlocked===true||real.blocked===true||real.status==='blocked';
  const email=real.email||real.clientEmail||''; const phone=real.phone||real.clientPhone||'';
  if(!email&&!phone)return null;
  return {id,type:'client',fullName:extractName(real),email,phone,photo:real.photo||real.photoURL||'',isBlocked,status:isBlocked?'blocked':'client',createdAt:real.createdAt||0,updatedAt:real.updatedAt||0,raw:real};
}
async function loadAll(){
  toast('Loading...');
  const nursePaths=['nurses','nurse_registrations','pendingNurseRegistrations','nurseUsers','nurseRegistrations','allNurses','users'];
  const clientPaths=['clients','client_registrations','pendingClientRegistrations','clientUsers','clientRegistrations','users','googleClients','googleUsers','authUsers'];
  let nurseMap={},clientMap={};
  for(const p of nursePaths){
    try{
      const snap=await db.ref(p).once('value');
      if(snap.exists()) snap.forEach(ch=>{
        const val=ch.val(); if(!val||typeof val!=='object')return;
        let real=val.profile||val.data||val;
        if(real.role==='client'||real.type==='client') return;
        if(real.services||real.qualification||real.licenceURL||real.cvURL||real.experience||p.includes('nurse')){ if(!nurseMap[ch.key]) nurseMap[ch.key]=real; else nurseMap[ch.key]={...nurseMap[ch.key],...real}; }
      });
    }catch(e){}
  }
  for(const p of clientPaths){
    try{
      const snap=await db.ref(p).once('value');
      if(snap.exists()) snap.forEach(ch=>{
        const val=ch.val(); if(!val||typeof val!=='object')return;
        let real=val.profile||val.data||val.clientData||val;
        if(real.role==='nurse'||real.type==='nurse'||real.services) return;
        if(!clientMap[ch.key]) clientMap[ch.key]=real; else clientMap[ch.key]={...clientMap[ch.key],...real};
      });
    }catch(e){}
  }
  try{ const fs=await dbFS.collection('clients').get(); fs.forEach(d=>{ if(!clientMap[d.id]) clientMap[d.id]=d.data(); }); }catch(e){}
  try{ const fs=await dbFS.collection('nurses').get(); fs.forEach(d=>{ if(!nurseMap[d.id]) nurseMap[d.id]=d.data(); }); }catch(e){}
  try{ const fs=await dbFS.collection('users').get(); fs.forEach(d=>{ const v=d.data(); if(v.type==='client'||v.role==='client'){ if(!clientMap[d.id]) clientMap[d.id]=v; } if(v.type==='nurse'||v.role==='nurse'){ if(!nurseMap[d.id]) nurseMap[d.id]=v; } }); }catch(e){}

  let pending=[],approved=[],rejected=[],blockedN=[],clients=[],blockedC=[],all=[];
  Object.entries(nurseMap).forEach(([id,v])=>{ const n=normalizeNurse(id,v); if(!n)return; all.push(n); if(n.isBlocked)blockedN.push(n); else if(n.status==='approved')approved.push(n); else if(n.status==='rejected')rejected.push(n); else pending.push(n); });
  Object.entries(clientMap).forEach(([id,v])=>{ const c=normalizeClient(id,v); if(!c)return; all.push(c); if(c.isBlocked)blockedC.push(c); else clients.push(c); });

  allData={pendingNurses:pending,approvedNurses:approved,rejectedNurses:rejected,blockedNurses:blockedN,clients,blockedClients:blockedC,allUpdates:all};
  document.getElementById('c_pendingNurses').textContent=pending.length;
  document.getElementById('c_approvedNurses').textContent=approved.length;
  document.getElementById('c_blockedNurses').textContent=blockedN.length;
  document.getElementById('c_clients').textContent=clients.length;
  document.getElementById('c_blockedClients').textContent=blockedC.length;
  document.getElementById('c_allUpdates').textContent=all.length;
  document.getElementById('counts').textContent=`Nurses: ${pending.length}p ${approved.length}a ${rejected.length}r ${blockedN.length}b | Clients: ${clients.length}a ${blockedC.length}b`;
  render();
}
function render(){
  const grid=document.getElementById('grid'); const empty=document.getElementById('empty');
  const search=document.getElementById('search').value.toLowerCase().trim();
  let list=[...(allData[currentTab]||[])];
  if(search) list=list.filter(i=>`${i.fullName} ${i.email} ${i.phone}`.toLowerCase().includes(search));
  list.sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0));
  grid.innerHTML=''; if(list.length===0){empty.style.display='block';return;} empty.style.display='none';
  list.forEach(item=>{
    const isBlocked=item.isBlocked; const isNurse=item.type==='nurse';
    const photo=item.photo?`<img src="${item.photo}">`:item.fullName.charAt(0);
    const statusBadge=isBlocked?`<span class="badge badgeBlocked">BLOCKED</span>`:isNurse?`<span class="badge ${item.status==='approved'?'badgeActive':item.status==='pending'?'badgePending':'badgeBlocked'}">${item.status.toUpperCase()}</span>`:`<span class="badge badgeActive">ACTIVE</span>`;
    const details=`<div class="details">Email: ${item.email||'-'}<br>Phone: ${item.phone||'-'}<br>Status: ${item.status}<br>Updated: ${formatTime(item.updatedAt)}</div>`;
    let acceptReject='';
    if(isNurse && !isBlocked){
      if(item.status!=='approved') acceptReject+=`<button class="btn btnAccept" onclick="acceptNurse('${item.id}')">ACCEPT — ${item.fullName}</button>`;
      if(item.status!=='rejected') acceptReject+=`<button class="btn btnReject" onclick="rejectNurse('${item.id}')">REJECT — ${item.fullName}</button>`;
    }
    const blockBtn=isBlocked?`<button class="btn btnUnblock" onclick="unblock_${isNurse?'Nurse':'Client'}('${item.id}')">UNBLOCK ${isNurse?'NURSE':'CLIENT'}</button>`:`<button class="btn btnBlock" onclick="block_${isNurse?'Nurse':'Client'}('${item.id}')">BLOCK ${isNurse?'NURSE':'CLIENT'}</button>`;
    const deleteBtn=`<button class="btn btnDelete" onclick="delete_${isNurse?'Nurse':'Client'}('${item.id}')">DELETE ${isNurse?'NURSE':'CLIENT'}</button>`;
    const warn=`<div id="delWarn_${item.id}" class="deleteWarning"><b style="color:#ef4444">Type DELETE</b><br><input id="delInput_${item.id}" placeholder="Type DELETE" style="width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid #ef4444;background:rgba(239,68,68,.1);color:#fff"><div style="display:flex;gap:8px;margin-top:8px"><button onclick="confirmDelete_${isNurse?'Nurse':'Client'}('${item.id}')" style="flex:1;padding:10px;border-radius:10px;background:#000;color:#ef4444;border:1px solid #ef4444;font-weight:900">CONFIRM DELETE</button><button onclick="document.getElementById('delWarn_${item.id}').classList.remove('active')" style="flex:1;padding:10px;border-radius:10px;background:rgba(255,255,255,.06);color:#fff">Cancel</button></div></div>`;
    const card=document.createElement('div'); card.className='card'+(isBlocked?' blocked':''); card.id='card_'+item.id;
    card.innerHTML=`<div class="head"><div class="avatar">${photo}</div><div class="meta"><h3>${item.fullName} ${isNurse?'(Nurse)':'(Client)'}</h3><div>${statusBadge}</div></div></div>${details}${acceptReject?`<div class="actions">${acceptReject}</div>`:''}<div class="actions">${deleteBtn} ${blockBtn}</div>${warn}`;
    grid.appendChild(card);
  });
}

// === ACCEPT CONNECTED TO ALL PATHS ===
async function acceptNurse(id){
  let email=''; let name=''; Object.values(allData).flat().forEach(o=>{ if(o.id===id){ email=(o.email||'').toLowerCase(); name=o.fullName; } });
  if(!confirm(`ACCEPT nurse ${name} — ${email} — Approve in ALL databases?`)) return;
  toast(`Accepting nurse ${name} in ALL paths...`);
  const rtPaths=['nurses','nurse_registrations','pendingNurseRegistrations','nurseUsers','nurseRegistrations','allNurses','users'];
  const updateObj={isApproved:true, approved:true, isRejected:false, rejected:false, isBlocked:false, blocked:false, status:'approved', approvedAt:Date.now(), updatedAt:Date.now()};
  for(const p of rtPaths){
    try{ await db.ref(p+'/'+id).update(updateObj); console.log('ACCEPT RT ID',p+'/'+id); }catch(e){}
    if(email){
      try{
        const snap=await db.ref(p).once('value');
        snap.forEach(ch=>{
          const real=ch.val()?.profile||ch.val()?.data||ch.val()||{};
          const em=(real.email||'').toLowerCase();
          if(em===email) db.ref(p+'/'+ch.key).update(updateObj);
        });
      }catch(e){}
    }
  }
  try{ await dbFS.collection('nurses').doc(id).set(updateObj,{merge:true}); }catch(e){}
  try{ await dbFS.collection('nurse_registrations').doc(id).set(updateObj,{merge:true}); }catch(e){}
  try{ await dbFS.collection('users').doc(id).set({...updateObj, role:'nurse', type:'nurse'},{merge:true}); }catch(e){}
  if(email){
    try{
      const q=await dbFS.collection('nurses').where('email','==',email).get();
      const batch=dbFS.batch(); q.forEach(d=>batch.set(d.ref,updateObj,{merge:true})); await batch.commit();
      const q2=await dbFS.collection('users').where('email','==',email).get();
      const batch2=dbFS.batch(); q2.forEach(d=>batch2.set(d.ref,{...updateObj, role:'nurse'},{merge:true})); await batch2.commit();
    }catch(e){}
  }
  toast(`✅ Nurse ${name} ACCEPTED in ALL paths — Can login now!`);
  setTimeout(()=>loadAll(),1200);
}

// === REJECT CONNECTED TO ALL PATHS ===

    try{
      const q=await dbFS.collection('nurses').where('email','==',email).get();

}

// === DELETE / BLOCK / UNBLOCK ALL PATHS (previous fix) ===
async function deleteByAllPaths(id, type){
  const warn=document.getElementById('delWarn_'+id);
  if(!warn.classList.contains('active')){ warn.classList.add('active'); toast('Type DELETE'); return; }
  const input=document.getElementById('delInput_'+id);
  if(input.value!=='DELETE'){ toast('Type DELETE exactly'); return; }
  if(!confirm(`FINAL DELETE ${type} ${id} from ALL DBs?`)) return;
  let targetEmail=''; Object.values(allData).flat().forEach(obj=>{ if(obj.id===id) targetEmail=(obj.email||'').toLowerCase(); });
  toast(`Deleting ${type} ${id} from ALL paths...`);
  const rtPathsClient=['clients','client_registrations','pendingClientRegistrations','clientUsers','ceoClientUpdates','clientRegistrations','allClients','users','googleClients','googleUsers','clientGoogleLogins','authUsers'];
  const rtPathsNurse=['nurses','nurse_registrations','pendingNurseRegistrations','nurseUsers','ceoNurseUpdates','nurseRegistrations','allNurses','users'];
  const rtPaths = type==='client'?rtPathsClient:rtPathsNurse;
  const fsCols = type==='client'?['clients','client_registrations','users']:['nurses','nurse_registrations','users'];
  for(const p of rtPaths){ try{ await db.ref(p+'/'+id).remove(); }catch(e){} }
  if(targetEmail){
    for(const p of rtPaths){
      try{
        const snap=await db.ref(p).once('value');
        if(snap.exists()){
          snap.forEach(ch=>{
            const real=ch.val()?.profile||ch.val()?.data||ch.val()?.clientData||ch.val()||{};
            const em=(real.email||real.clientEmail||'').toLowerCase();
            if(em===targetEmail) db.ref(p+'/'+ch.key).remove();
          });
        }
      }catch(e){}
    }
  }
  for(const col of fsCols){ try{ await dbFS.collection(col).doc(id).delete(); }catch(e){} }
  if(targetEmail){
    for(const col of fsCols){
      try{
        const q=await dbFS.collection(col).where('email','==',targetEmail).get();
        const batch=dbFS.batch(); q.forEach(doc=>batch.delete(doc.ref)); await batch.commit();
      }catch(e){}
    }
  }
  const cardEl=document.getElementById('card_'+id);
  if(cardEl){ cardEl.style.transform='scale(0)'; cardEl.style.opacity='0'; setTimeout(()=>cardEl.remove(),300); }
  toast(`✅ ${type.toUpperCase()} DELETED forever!`); setTimeout(()=>loadAll(),1000);
}
async function blockByAllPaths(id, type, shouldBlock){
  let email=''; Object.values(allData).flat().forEach(o=>{ if(o.id===id) email=(o.email||'').toLowerCase(); });
  const action=shouldBlock?'BLOCK':'UNBLOCK';
  if(!confirm(`${action} ${type} ${id}?`)) return;
  const rtPaths = type==='client'?['clients','client_registrations','clientUsers','users','googleClients']:['nurses','nurse_registrations','nurseUsers','users'];
  const statusVal = shouldBlock?'blocked':(type==='client'?'client':'approved');
  const updateObj = shouldBlock?{isBlocked:true,blocked:true,status:statusVal,blockedAt:Date.now()}:{isBlocked:false,blocked:false,status:statusVal,unblockedAt:Date.now(),isApproved:true};
  for(const p of rtPaths){
    try{ await db.ref(p+'/'+id).update(updateObj); }catch(e){}
    if(email){
      try{
        const snap=await db.ref(p).once('value');
        snap.forEach(ch=>{
          const real=ch.val()?.profile||ch.val()?.data||ch.val()||{};
          const em=(real.email||real.clientEmail||'').toLowerCase();
          if(em===email) db.ref(p+'/'+ch.key).update(updateObj);
        });
      }catch(e){}
    }
  }
  const fsCols = type==='client'?['clients','client_registrations','users']:['nurses','nurse_registrations','users'];
  for(const col of fsCols){
    try{ await dbFS.collection(col).doc(id).set(updateObj,{merge:true}); }catch(e){}
    if(email){
      try{
        const q=await dbFS.collection(col).where('email','==',email).get();
        const batch=dbFS.batch(); q.forEach(d=>batch.set(d.ref,updateObj,{merge:true})); await batch.commit();
      }catch(e){}
    }
  }
  toast(`✅ ${type} ${action}ED everywhere`); setTimeout(()=>loadAll(),1000);
}
