<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOVE CARE GLOBAL - Fixed Login</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>body{font-family:sans-serif;background:#f8fafc;display:flex;align-items:center;justify-content:center;min-height:100vh} .card{background:white;padding:24px;border-radius:16px;max-width:400px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,0.1)} input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0} .btn{width:100%;padding:12px;background:#16a34a;color:white;border:none;border-radius:10px;font-weight:800;cursor:pointer}</style>
</head><body>
<div class="card">
<h2>Welcome Back ❤️</h2><p>Login to manage bookings</p>
<div id="error" style="color:#ef4444;background:#fef2f2;padding:10px;border-radius:8px;display:none"></div>
<div id="ok" style="color:#16a34a;background:#f0fdf4;padding:10px;border-radius:8px;display:none"></div>
<label>Email</label><input id="email" type="email" placeholder="you@example.com">
<label>Password</label><input id="pass" type="password" placeholder="password">
<button class="btn" onclick="login()">🔓 Login to Dashboard</button>
<button class="btn" style="background:#e5e7eb;color:#111;margin-top:8px" onclick="resetPass()">Forgot Password?</button>
<p style="font-size:12px;margin-top:12px">New? <a href="index.html">Create Client Account</a></p>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
try{ if(!firebase.apps.length) firebase.initializeApp(firebaseConfig); window.auth=firebase.auth(); window.db=firebase.database(); }catch(e){ console.error(e); document.getElementById('error').style.display='block'; document.getElementById('error').innerText='Firebase Init Error: '+e.message; }

function login(){
  var email=document.getElementById('email').value.trim();
  var pass=document.getElementById('pass').value;
  var err=document.getElementById('error'); var ok=document.getElementById('ok');
  err.style.display='none'; ok.style.display='none';
  if(!email||!pass){ err.innerText='Enter email and password'; err.style.display='block'; return; }
  auth.signInWithEmailAndPassword(email, pass).then(function(u){
    ok.innerText='✅ Login success - redirecting...'; ok.style.display='block';
    var isCEO = email.toLowerCase()==='joshouapee@gmail.com';
    setTimeout(()=>{ location.href = isCEO ? 'ceo-dashboard.html' : 'index.html'; }, 800);
  }).catch(function(e){
    err.innerText='❌ '+e.message+'\n\nIf api-key error, check firebaseConfig has correct key'; err.style.display='block';
  });
}
function resetPass(){
  var email=document.getElementById('email').value.trim();
  if(!email){ alert('Enter email first'); return; }
  auth.sendPasswordResetEmail(email).then(()=>{ alert('Reset email sent to '+email); }).catch(e=>{ alert(e.message); });
}
</script>
</body></html>
