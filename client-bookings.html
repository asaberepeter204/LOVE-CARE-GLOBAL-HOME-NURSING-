<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Bookings - LOVE CARE GLOBAL HOME NURSING</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icon-transparent-512.png">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
const app=initializeApp(firebaseConfig);const db=getDatabase(app);
let currentBooking=null;

window.onload=()=>{
  const urlId=new URLSearchParams(location.search).get('bookingId');
  const lastId=localStorage.getItem('pendingBookingId')||urlId;
  if(!lastId){document.getElementById('main').innerHTML="<div class='card'>No booking found. <a href='client-booking.html' style='color:#d8b4fe'>Book Now</a></div>";return;}
  onValue(ref(db,'bookings/'+lastId), async snap=>{
    if(!snap.exists()){document.getElementById('main').innerHTML="Booking not found";return;}
    currentBooking=snap.val();
    let nurseData=null;
    if(currentBooking.nurseId){
      const nSnap=await get(ref(db,'nurses/'+currentBooking.nurseId));
      if(nSnap.exists()) nurseData=nSnap.val();
    }
    render(currentBooking,nurseData);
  });
};

function render(b,nurse){
  const isPaid=b.payment_status==="paid";
  const status=b.status||"pending_payment";
  const steps=["pending","accepted","on_the_way","care_started","completed"];
  const stepIndex=steps.indexOf(status);
  
  document.getElementById('main').innerHTML=`
  <!-- 1. STATUS TRACKER -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <div><b style="font-family:Plus Jakarta Sans,sans-serif;color:#f3e8ff;letter-spacing:.03em">${b.bookingId}</b><br><small style="color:#a78bfa">LOVE CARE GLOBAL • After Booking</small></div>
      <span class="badge ${isPaid?'b-paid':'b-unpaid'}">${isPaid?'PAID ✅':'UNSUCCESSFUL ❌'}</span>
    </div>
    <div class="track">
      <div class="step ${stepIndex>=0?'active':''}"><div class="dot">1</div>Pending</div>
      <div class="step ${stepIndex>=1?'active':''}"><div class="dot">2</div>Accepted</div>
      <div class="step ${stepIndex>=2?'active':''}"><div class="dot">3</div>On The Way</div>
      <div class="step ${stepIndex>=3?'active':''}"><div class="dot">4</div>Care Started</div>
      <div class="step ${stepIndex>=4?'active':''}"><div class="dot">5</div>Completed</div>
    </div>
    <div class="alertBox ${isPaid?'alertOk':'alertErr'}">
      ${isPaid? '🟢 Nurse can see this booking on her job page' : '🔴 Nurse CANNOT see — Booking unsuccessful until payment'}
    </div>
  </div>

  <!-- 2. BOOKING DETAILS -->
  <div class="card">
    <h3 class="cardTitle">📋 Booking Details</h3>
    <div class="nurse-box">
      <img class="nurse-photo" src="${nurse?.photo||'https://via.placeholder.com/80'}">
      <div>
        <b style="color:#f3e8ff">${b.nurseName||nurse?.fullName||'Any Nurse (After Pay)'}</b> <span class="rating">⭐ ${nurse?.rating||4.9}</span><br>
        <small style="color:#a78bfa">📞 ${nurse?.phone||'Assigned after payment'} • ${b.country||''}</small><br>
        <small style="color:#c4b5fd">🩺 ${b.careType||'Nursing Care'} • ${b.genderPref||'Any'} preference</small>
      </div>
    </div>
    <div class="grid2">
      <div class="info"><span>From</span><b>${b.dateFrom||'--'}</b></div>
      <div class="info"><span>To</span><b>${b.dateTo||'Ongoing'}</b></div>
      <div class="info"><span>Patient</span><b>${b.patientName||'--'} (${b.patientAge||''})</b></div>
      <div class="info"><span>Total</span><b>$${b.amount||'0'} • ${b.payment_status||'pending'}</b></div>
      <div class="info full"><span>Address</span><b>📍 ${b.address||'--'}</b></div>
      <div class="info full"><span>Notes</span><b>📝 ${b.notes||'No notes'}</b></div>
    </div>
  </div>

  <!-- 3. ACTIONS -->
  <div class="card">
    <h3 class="cardTitle">⚡ Actions</h3>
    <div class="actionGrid">
    ${!isPaid? `
    <button class="btn btnPrimary" onclick="payNow()">💳 Pay Now to Activate</button>
    <button class="btn btnDanger" onclick="cancel()">❌ Cancel Booking</button>` : `
    <button class="btn btnPrimary" onclick="callNurse()">📞 Call Nurse</button>
    <button class="btn btnPrimary" onclick="chatNurse()">💬 Chat with Nurse</button>
    <button class="btn btnGhost" onclick="track()">📍 Track Live Location</button>
    <button class="btn btnGhost" onclick="reschedule()">🔄 Reschedule</button>
    <button class="btn btnDanger" onclick="emergency()">🆘 Emergency / Support</button>
    <button class="btn btnGhost" onclick="cancel()">❌ Cancel Booking</button>`}
    </div>
  </div>

  <!-- 4. CARE PROGRESS -->
  <div class="card ${!isPaid?'locked':''}">
    <h3 class="cardTitle">📈 Care Progress ${!isPaid?'<small style=\"color:#ef4444\">(Locked until paid)</small>':''}</h3>
    <div class="log">
      <div class="logRow"><span>Check-in</span><b>${b.checkIn||'--'}</b><span>Check-out</span><b>${b.checkOut||'--'}</b></div>
      <div class="logBlock"><b>Daily Notes from Nurse:</b><br>${b.dailyNotes||'No notes yet. Nurse will update after care starts.'}</div>
      <div class="logBlock"><b>💊 Medication Given:</b><br>${b.medicationLog||'None logged yet'}</div>
      <div class="logBlock"><b>📸 Photo Updates:</b><br>${b.photoUpdates?`<img src="${b.photoUpdates}" style="width:100px;border-radius:8px;border:1px solid rgba(168,85,247,.15)">`:'No photos yet'}</div>
    </div>
  </div>

  <!-- 5. PAYMENT -->
  <div class="card">
    <h3 class="cardTitle">💳 Payment & Invoice</h3>
    <div class="payBox">
      <div><span>Amount</span><b>$${b.amount||'0'}</b></div>
      <div><span>Status</span><b>${b.payment_status||'pending'}</b></div>
      <div><span>Method</span><b>${b.paymentMethod||'Paystack / MoMo'}</b></div>
      <div><span>Paid At</span><b>${b.paidAt||'Not paid yet'}</b></div>
      <div><span>Visible to nurse</span><b>${b.visible_to_nurse?'YES':'NO'}</b></div>
    </div>
    <div class="actionGrid" style="margin-top:12px">
      ${!isPaid? `<button class="btn btnPrimary" onclick="payNow()">💳 Pay Now</button>` : `<button class="btn btnGhost" onclick="invoice()">🧾 Download Invoice</button>`}
      <button class="btn btnGhost" onclick="history()">📜 Transaction History</button>
    </div>
  </div>

  <!-- 6. CLIENT CONFIRMATION - CEO VISIBLE -->
  <div class="card" style="border:2px solid ${b.clientConfirmedFinished?'rgba(168,85,247,.5)':'rgba(245,158,11,.4)'};background:${b.clientConfirmedFinished?'linear-gradient(135deg,rgba(28,18,56,.88),rgba(56,28,96,.78))':'rgba(28,18,56,.78)'}">
    <h3 class="cardTitle">✅ Confirm Nurse Finished Work <span style="font-size:10px;background:rgba(168,85,247,.18);padding:3px 8px;border-radius:999px;border:1px solid rgba(168,85,247,.2);margin-left:6px">Visible to CEO</span></h3>
    ${b.clientConfirmedFinished? `
      <div class="alertBox alertOk">
        ✅ You confirmed on ${b.clientConfirmedAt||''} — CEO has been notified.<br>
        <small>Note: ${b.clientConfirmedNote||'No note'}</small><br>
        <small style="color:#a78bfa">Status: Seen by CEO ${b.ceoSeenConfirmation?'✅ YES':'⏳ Pending CEO view'} • Booking: ${b.bookingId}</small>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <button class="btn btnGhost" onclick="viewCeoStatus()">👁️ View CEO Status</button>
      </div>
    ` : `
      <div style="color:#c4b5fd;font-size:13px;margin-bottom:10px">
        Has the nurse completed the care? Please confirm so CEO can verify and release payment / close job.<br>
        <small style="color:#a78bfa">This confirmation will be stored in Firebase and visible to CEO in CEO Dashboard.</small>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <span class="badge b-pending">Current: ${status}</span>
        ${b.nurseFinishedWork?'<span class="badge b-paid">Nurse marked Finished ✅</span>':'<span class="badge b-unpaid">Waiting for nurse to finish</span>'}
      </div>
      <textarea id="confirmNote" placeholder="Optional: How was the service? Any note for CEO..." class="textarea"></textarea>
      <div class="actionGrid" style="margin-top:12px">
        <button class="btn btnPrimary" onclick="confirmFinished()">✅ Yes, Nurse Finished Work — Confirm for CEO</button>
        <button class="btn btnGhost" onclick="notYet()">⏳ Not Yet — Nurse Still Working</button>
      </div>
    `}
  </div>

  <!-- 7. AFTER COMPLETED -->
  <div class="card" style="${status!=='completed'?'display:none':''}">
    <h3 class="cardTitle">⭐ After Completed</h3>
    <div style="color:#c4b5fd;font-size:13px;margin-bottom:8px">Rate your nurse:</div>
    <div class="stars" id="stars"><span onclick="rate(1)">☆</span><span onclick="rate(2)">☆</span><span onclick="rate(3)">☆</span><span onclick="rate(4)">☆</span><span onclick="rate(5)">☆</span></div>
    <textarea id="reviewText" placeholder="Write review..." class="textarea"></textarea>
    <div class="actionGrid" style="margin-top:10px">
      <button class="btn btnPrimary" onclick="submitReview()">✍️ Submit Review</button>
      <button class="btn btnGhost" onclick="report()">📄 Care Summary Report</button>
      <button class="btn btnGhost" onclick="rebook()">🔁 Re-book Same Nurse</button>
    </div>
  </div>
  `;
}

window.payNow=()=>{location.href=`client-booking.html?pay=${currentBooking.bookingId}&amount=${currentBooking.amount}`};
window.cancel=async()=>{
  if(confirm('Cancel booking?')){
    const { getDatabase, ref, update } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");
    const db=getDatabase();
    await update(ref(db,'bookings/'+currentBooking.bookingId),{status:"cancelled",visible_to_nurse:false});
    alert('Cancelled');
  }
};
window.callNurse=()=>{alert('Calling '+currentBooking.nurseName);};
window.chatNurse=()=>{location.href=`chat.html?bookingId=${currentBooking.bookingId}`;};
window.track=()=>{alert('Opening live map... Nurse location: Tracking');};
window.reschedule=()=>{const d=prompt('New date?'); if(d){import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js").then(m=>{const db=m.getDatabase(); m.update(m.ref(db,'bookings/'+currentBooking.bookingId),{dateFrom:d});});}};
window.emergency=()=>{location.href='tel:+233000000000';};
window.invoice=()=>{alert('Downloading invoice for '+currentBooking.bookingId);};
window.history=()=>{alert('Transaction: Paid $'+currentBooking.amount+' on '+currentBooking.paidAt);};
window.rate=(n)=>{document.getElementById('stars').innerHTML='★'.repeat(n)+'☆'.repeat(5-n); window._rating=n;};
window.submitReview=async()=>{
  const txt=document.getElementById('reviewText').value;
  const m=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");
  const db=m.getDatabase();
  await m.update(m.ref(db,'bookings/'+currentBooking.bookingId),{rating:window._rating,review:txt});
  alert('Review submitted!');
};
window.report=()=>{alert('Care Summary PDF downloading...');};

window.confirmFinished=async()=>{
  if(!confirm('Confirm that nurse has finished work? This will notify CEO.')) return;
  const note=document.getElementById('confirmNote')?.value||'';
  const now=new Date().toLocaleString();
  const iso=new Date().toISOString();
  const m=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");
  const db=m.getDatabase();
  const bookingId=currentBooking.bookingId;
  // 1. Update booking itself
  await m.update(m.ref(db,'bookings/'+bookingId),{
    clientConfirmedFinished:true,
    clientConfirmedAt:now,
    clientConfirmedAtISO:iso,
    clientConfirmedNote:note,
    ceoSeenConfirmation:false,
    status:"client_confirmed_finished",
    clientConfirmationForCEO:true,
    lastUpdatedBy:"client",
    lastUpdatedAt:now
  });
  // 2. CEO notifications node - so CEO dashboard can list
  await m.set(m.ref(db,'ceo_notifications/client_confirmations/'+bookingId),{
    bookingId:bookingId,
    clientId:currentBooking.clientId||currentBooking.userId||'unknown',
    nurseId:currentBooking.nurseId||'unknown',
    nurseName:currentBooking.nurseName||'unknown',
    patientName:currentBooking.patientName||'--',
    amount:currentBooking.amount||0,
    clientNote:note,
    confirmedAt:now,
    confirmedAtISO:iso,
    ceoSeen:false,
    type:"client_finished_confirmation",
    country:currentBooking.country||'--'
  });
  // 3. CEO dashboard feed
  await m.set(m.ref(db,'admin/confirmations/'+bookingId),{
    bookingId:bookingId,
    message:`Client confirmed nurse finished work for booking ${bookingId}`,
    clientConfirmed:true,
    timestamp:now,
    timestampISO:iso,
    ceoSeen:false,
    clientNote:note
  });
  alert('✅ Confirmed! CEO has been notified and will see this in CEO dashboard.');
};
window.notYet=()=>{alert('Okay - keep tracking. You can confirm when nurse finishes.');};
window.viewCeoStatus=()=>{
  const b=currentBooking;
  alert(`Booking: ${b.bookingId}\nClient Confirmed: ${b.clientConfirmedFinished?'YES ✅':'NO'}\nAt: ${b.clientConfirmedAt||'--'}\nCEO Seen: ${b.ceoSeenConfirmation?'YES ✅':'Not yet ⏳'}\nNote: ${b.clientConfirmedNote||'--'}`);
};
window.rebook=()=>{location.href=`client-booking.html?nurseId=${currentBooking.nurseId}`;};
</script>

<body>
<div class="bg"></div>
