<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Registration - Fading Eye + GPS Actual Name - LOVE CARE GLOBAL HOME NURSING</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#f8fafc;color:#111827}
.topbar{background:#16a34a;padding:12px 14px;display:flex;justify-content:space-between;color:white;position:sticky;top:0;z-index:100}
.wrap{max-width:480px;margin:0 auto;padding:20px}
.card{background:white;border-radius:20px;padding:20px;border:1px solid #e5e7eb;box-shadow:0 8px 24px rgba(0,0,0,.06)}
label{font-size:11px;font-weight:800;margin:10px 0 4px;display:block}
.inputWrap{position:relative}
input,select{width:100%;padding:12px 44px 12px 12px;border-radius:12px;border:1.5px solid #d1d5db;font-size:13px;outline:none}
input:focus,select:focus{border-color:#16a34a}
.eyeBtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:#f3f4f6;border:none;width:36px;height:36px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0.9}
.eyeBtn:active{opacity:0.5;transform:translateY(-50%) scale(0.95)}
.btn{padding:14px;border-radius:12px;font-weight:900;border:none;cursor:pointer;width:100%;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:6px}
.btnGreen{background:linear-gradient(90deg,#22c55e,#16a34a);color:white}
.btnLight{background:#f3f4f6;border:1px solid #e5e7eb}
.badge{padding:6px 12px;border-radius:999px;font-size:10px;font-weight:900;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
</style>
</head>
<body>
<div class="topbar"><b>👤 CLIENT REGISTRATION</b><a href="index.html" style="color:white;text-decoration:none;font-weight:900">Home</a></div>
<div class="wrap"><div class="card">
<h2 style="text-align:center;font-weight:900">Client Registration</h2>
<p style="text-align:center;font-size:11px;color:#6b7280;margin:4px 0 12px">Fading Eye Toggle + Auto GPS Actual Name + 8 Countries + One Login</p>

<label>Full Name *</label><input id="fullName" placeholder="John Doe" required>
<label>Email *</label><input id="email" type="email" placeholder="client@email.com" required>
<label>Phone *</label><input id="phone" placeholder="+233 24...">

<label>Country *</label>
<select id="country">
<option value="">-- Select Country --</option>
<option value="GH">🇬🇭 Ghana</option><option value="NG">🇳🇬 Nigeria</option><option value="ZA">🇿🇦 South Africa</option><option value="GB">🇬🇧 UK</option><option value="US">🇺🇸 USA</option><option value="AU">🇦🇺 Australia</option><option value="AE">🇦🇪 UAE</option><option value="CA">🇨🇦 Canada</option><option value="OTHER">🌍 Other</option>
</select>

<label>Password *</label>
<div class="inputWrap">
<input id="password" type="password" placeholder="Create password" required>
<button class="eyeBtn" type="button" onclick="toggleEye('password',this)">
<svg id="eye-password-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
<svg id="eye-password-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.53 9.53a3 3 0 1 0 4.24 4.24"/><path d="M1 1l22 22"/><path d="M10.58 10.58A3 3 0 0 0 12 14a3 3 0 0 0 2.94-2.42"/><path d="M14.12 14.12A3 3 0 0 1 9.88 9.88"/></svg>
</button>
</div>

<label>Confirm Password *</label>
<div class="inputWrap">
<input id="confirmPassword" type="password" placeholder="Confirm password" required>
<button class="eyeBtn" type="button" onclick="toggleEye('confirmPassword',this)">
<svg id="eye-confirmPassword-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
<svg id="eye-confirmPassword-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.53 9.53a3 3 0 1 0 4.24 4.24"/><path d="M1 1l22 22"/></svg>
</button>
</div>

<label>GPS Location - Actual Name (Auto GPS) *</label>
<input id="gpsName" readonly placeholder="📍 Auto locating... Actual name will appear here" style="background:#f0fdf4;border-color:#bbf7d0;font-weight:700">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px"><input id="lat" readonly placeholder="Auto Lat"><input id="lng" readonly placeholder="Auto Lng"></div>
<button class="btn btnLight" type="button" onclick="getGPS()">📍 Refresh GPS - Get Actual Name</button>
<div id="mapPreview" style="display:none;margin-top:8px"><iframe id="mapFrame" style="width:100%;height:140px;border:none;border-radius:12px"></iframe></div>

<button class="btn btnGreen" onclick="register()">✅ Register - Fading Eye + GPS Actual Name</button>
<div style="text-align:center;margin-top:12px;font-size:12px"><a href="client-login.html" style="color:#16a34a;font-weight:900;text-decoration:none">Already have account? Login - Eye Toggle + GPS Actual Name</a><br><a href="index.html" style="font-size:11px;color:#6b7280;text-decoration:none">Home - LOVE CARE GLOBAL HOME NURSING</a></div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

window.toggleEye=(id,btn)=>{
  const input=document.getElementById(id);
  const openIcon=document.getElementById(`eye-${id}-open`);
  const closedIcon=document.getElementById(`eye-${id}-closed`);
  if(input.type==='password'){
    input.type='text';
    if(openIcon)openIcon.style.display='none';
    if(closedIcon)closedIcon.style.display='block';
    btn.style.opacity='1';
  }else{
    input.type='password';
    if(openIcon)openIcon.style.display='block';
    if(closedIcon)closedIcon.style.display='none';
    btn.style.opacity='0.7';
  }
}

window.getGPS=()=>{
  const nameField=document.getElementById('gpsName');
  nameField.value='📍 Locating GPS... Getting actual place name...';
  if(!navigator.geolocation){nameField.value='GPS not supported';return;}
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude; const lng=pos.coords.longitude;
    document.getElementById('lat').value=lat.toFixed(6);
    document.getElementById('lng').value=lng.toFixed(6);
    document.getElementById('mapPreview').style.display='block';
    document.getElementById('mapFrame').src=`https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed`;
    try{
      const res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18`);
      const data=await res.json();
      const actualName=data.display_name || `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
      nameField.value=actualName;
    }catch(e){
      nameField.value=`${lat.toFixed(6)}, ${lng.toFixed(6)} - GPS Located`;
    }
  },()=>{nameField.value='❌ Enable GPS - Required for Google Map'; alert('Enable GPS - Required');},{enableHighAccuracy:true, timeout:15000});
}

window.register=async()=>{
  const fullName=document.getElementById('fullName').value.trim();
  const email=document.getElementById('email').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const country=document.getElementById('country').value;
  const pass=document.getElementById('password').value;
  const cpass=document.getElementById('confirmPassword').value;
  const lat=document.getElementById('lat').value;
  const lng=document.getElementById('lng').value;
  const gpsName=document.getElementById('gpsName').value;
  if(!fullName||!email||!country||!pass){alert('Fill all required fields');return;}
  if(pass!==cpass){alert('Passwords do not match');return;}
  if(!lat||!lng||!gpsName||gpsName.includes('Locating')){alert('Wait for Auto GPS actual name or click Refresh GPS'); getGPS(); return;}
  try{
    const cred=await createUserWithEmailAndPassword(auth,email,pass);
    const uid=cred.user.uid;
    await setDoc(doc(db,'clients',uid),{
      uid, fullName, email, phone, country,
      countryName: document.getElementById('country').options[document.getElementById('country').selectedIndex].text,
      lat:parseFloat(lat), lng:parseFloat(lng), gpsActualName:gpsName, gpsName:gpsName, actualLocationName:gpsName,
      role:'client', isApproved:true,
      createdAt:serverTimestamp(), timestamp:new Date().toISOString()
    });
    localStorage.setItem('lcg_client_uid',uid); localStorage.setItem('lcg_role','client'); localStorage.setItem('lcg_logged_in','true');
    alert(`✅ Registered! Actual Location: ${gpsName}`);
    location.href='client-dashboard.html';
  }catch(e){alert('Registration failed: '+e.message);}
}
window.addEventListener('DOMContentLoaded',()=>{getGPS();});
</script>
</body>
</html>
