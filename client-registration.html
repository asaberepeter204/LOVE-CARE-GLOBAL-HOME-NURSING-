<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Client Account - LOVE CARE GLOBAL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0e0a1c;color:#e8e0ff;min-height:100vh;display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:420px;background:#1e1a3a;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px}
.logo{width:64px;height:64px;background:linear-gradient(135deg,#a855f7,#7c3aed);border-radius:16px;display:grid;place-items:center;margin:0 auto;font-size:28px}
h2{text-align:center;font-size:22px;font-weight:800;margin-top:8px}
.sub{font-size:12px;color:#8b7ab8;text-align:center;margin-top:-4px}
label{font-size:11px;color:#facc15;font-weight:700;letter-spacing:.04em;margin-top:4px}
input,select{padding:13px 14px;border-radius:12px;border:1px solid rgba(168,85,247,.15);background:rgba(12,10,30,.8);color:#ece8ff;width:100%;font-size:14px;outline:none}
input:focus,select:focus{border-color:#a855f7}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:14px;border-radius:12px;border:none;font-weight:800;cursor:pointer;font-size:14px;text-align:center}
.btnReg{background:#facc15;color:#000}
.btnGoogle{background:#fff;color:#1f1f1f;border:1px solid #747775;display:flex;gap:10px;align-items:center;justify-content:center;font-weight:500}
.status{padding:10px;border-radius:10px;font-size:11px;display:none;text-align:center}
.status.ok{background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.3)}
.status.err{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.status.warn{background:rgba(250,204,21,.12);color:#fde68a;border:1px solid rgba(250,204,21,.3)}
.photoBox{border:1px dashed rgba(168,85,247,.3);border-radius:16px;padding:16px;text-align:center;background:rgba(12,10,30,.4)}
.photoPreview{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #facc15;margin:0 auto 10px;display:none}
.link{font-size:12px;text-align:center;text-decoration:none;color:#a78bfa}
.passWrap{position:relative}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:16px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">👤</div>
  <h2>Create Client Account</h2>
  <p class="sub">Join LOVE CARE GLOBAL — Nurses will see your profile photo if you add one (optional)</p>
  
  <div id="status" class="status"></div>

  <label>FULL NAME *</label>
  <input id="fullName" placeholder="ASABERE PETER">

  <div class="row">
    <div>
      <label>EMAIL *</label>
      <input id="email" type="email" placeholder="lovecareglobal@gr">
    </div>
    <div>
      <label>PHONE *</label>
      <input id="phone" type="tel" placeholder="+233502957280">
    </div>
  </div>

  <label>PASSWORD *</label>
  <div class="passWrap">
    <input id="password" type="password" placeholder="Peterasa80@you!">
    <span class="eye" onclick="togglePass()">👁️</span>
  </div>

  <label>COUNTRY *</label>
  <select id="country">
    <option value="Ghana" selected>Ghana</option>
    <option value="Nigeria">Nigeria</option>
    <option value="Kenya">Kenya</option>
    <option value="South Africa">South Africa</option>
    <option value="USA">USA</option>
    <option value="UK">UK</option>
    <option value="Other">Other</option>
  </select>

  <label>PROFILE PHOTO <span style="color:#8b7ab8">(Optional — Nurses will see you)</span></label>
  <div class="photoBox" onclick="document.getElementById('photoFile').click()">
    <img id="photoPreview" class="photoPreview" src="">
    <div id="photoPlaceholder" style="font-size:32px">👤</div>
    <p style="font-size:11px;color:#a78bfa;margin-top:6px">📁 Tap to upload photo — Optional</p>
    <p style="font-size:10px;color:#6b7280;margin-top:4px">JPG/PNG, max 3MB. This helps nurses recognize you during home visit.</p>
  </div>
  <input type="file" id="photoFile" accept="image/*" style="display:none">

  <button class="btn btnReg" onclick="register()" id="regBtn">Create Account</button>
  
  <button class="btn btnGoogle" onclick="googleRegister()">
    <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Continue with Google
  </button>

  <a href="client-login.html" class="link">Already have account? Login</a>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();
const storage=firebase.storage();
const dbFS=firebase.firestore();

function showStatus(m,type){
  const el=document.getElementById('status');
  el.textContent=m;
  el.className='status '+type;
  el.style.display='block';
}
function togglePass(){
  const p=document.getElementById('password');
  p.type = p.type==='password' ? 'text' : 'password';
}
function sanitizeEmail(email){ return email.toLowerCase().trim().replace(/[.#$@\[\]]/g,'_'); }

let selectedFile=null;
let photoDataUrl='';

document.getElementById('photoFile').addEventListener('change', function(e){
  const file=e.target.files[0];
  if(!file) return;
  if(file.size>3*1024*1024){ showStatus('Photo max 3MB', 'err'); return; }
  selectedFile=file;
  const reader=new FileReader();
  reader.onload=(ev)=>{
    photoDataUrl=ev.target.result;
    const img=document.getElementById('photoPreview');
    img.src=photoDataUrl;
    img.style.display='block';
    document.getElementById('photoPlaceholder').style.display='none';
  };
  reader.readAsDataURL(file);
});

// Prefill from Google block
window.addEventListener('DOMContentLoaded',()=>{
  const params=new URLSearchParams(location.search);
  const email=params.get('email') || localStorage.getItem('pendingGoogleEmail') || '';
  const name=params.get('name') || localStorage.getItem('pendingGoogleName') || '';
  const photo=params.get('photo') || localStorage.getItem('pendingGooglePhoto') || '';
  if(email) document.getElementById('email').value=email;
  if(name) document.getElementById('fullName').value=name;
  if(photo){
    const img=document.getElementById('photoPreview');
    img.src=photo;
    img.style.display='block';
    document.getElementById('photoPlaceholder').style.display='none';
    photoDataUrl=photo;
  }
  // Check for from param
  if(params.get('from')){
    showStatus('🧹 Previous incomplete data detected - You can re-register now and it will overwrite old data', 'warn');
  }
});

// ✅ CEO SECURITY CHECK + AUTO-CLEAN LEFTOVER
async function checkAndCleanLeftover(email){
  const eLower=email.toLowerCase().trim();
  const key=sanitizeEmail(eLower);
  
  // Check Auth
  let authExists=false;
  try{
    const methods=await auth.fetchSignInMethodsForEmail(eLower);
    if(methods && methods.length>0) authExists=true;
  }catch(e){}

  // Check DB
  let dbExists=false;
  try{
    const snap=await db.ref('allowedClients/'+key).once('value');
    if(snap.exists()) dbExists=true;
    else{
      const snap2=await db.ref('clients').orderByChild('email').equalTo(eLower).once('value');
      if(snap2.exists()) dbExists=true;
    }
  }catch(e){}

  // If DB exists but Auth doesn't -> Leftover from auto-delete -> Clean and allow
  if(dbExists && !authExists){
    showStatus('🧹 Cleaning old leftover data for '+eLower+' (Auth was deleted but DB remained) - Will overwrite now...', 'warn');
    try{
      await db.ref('allowedClients/'+key).remove();
      await db.ref('clientRegistrations/'+key).remove();
      await db.ref('clientRegistrations/'+eLower.replace(/[.]/g,'_')).remove();
      const qSnap=await db.ref('clients').orderByChild('email').equalTo(eLower).once('value');
      if(qSnap.exists()){
        qSnap.forEach(ch=>{ db.ref('clients/'+ch.key).remove(); });
      }
      await db.ref('ceoClientsTracking').orderByChild('email').equalTo(eLower).once('value').then(s=>{
        if(s.exists()){ s.forEach(ch=>{ db.ref('ceoClientsTracking/'+ch.key).remove(); }); }
      });
      console.log('✅ Old DB cleaned for', eLower);
    }catch(e){ console.log('Cleanup error', e.message); }
    return {canRegister:true, cleaned:true};
  }

  if(dbExists && authExists){
    return {canRegister:false, reason:'Email already registered — Please login'};
  }

  return {canRegister:true, cleaned:false};
}

async function register(){
  const fullName=document.getElementById('fullName').value.trim();
  const email=document.getElementById('email').value.trim().toLowerCase();
  const phone=document.getElementById('phone').value.trim();
  const password=document.getElementById('password').value.trim();
  const country=document.getElementById('country').value;

  if(!fullName||!email||!phone||!password){
    showStatus('All * fields required - CEO needs Name+Phone+Email for tracking unlawful actions', 'err');
    return;
  }
  if(phone.replace(/\D/g,'').length<9){
    showStatus('Valid phone required - At least 9 digits for CEO tracking', 'err');
    return;
  }
  if(password.length<6){
    showStatus('Password min 6 chars', 'err');
    return;
  }

  const btn=document.getElementById('regBtn');
  btn.textContent='Checking...';
  btn.disabled=true;

  // ✅ Check and clean leftover
  const check=await checkAndCleanLeftover(email);
  if(!check.canRegister){
    showStatus(check.reason, 'err');
    btn.textContent='Create Account';
    btn.disabled=false;
    return;
  }

  if(check.cleaned){
    showStatus('✅ Old data cleaned - Creating new account now...', 'ok');
    await new Promise(r=>setTimeout(r,800));
  }

  showStatus('Creating account...', 'ok');
  
  try{
    const cred=await auth.createUserWithEmailAndPassword(email,password);
    const uid=cred.user.uid;
    
    let photoUrl=photoDataUrl || '';
    
    // Upload photo if selected file
    if(selectedFile){
      try{
        showStatus('Uploading photo...', 'ok');
        const storageRef=storage.ref('clientAvatars/'+sanitizeEmail(email)+'/'+Date.now()+'_'+selectedFile.name);
        const upload=await storageRef.put(selectedFile);
        photoUrl=await upload.ref.getDownloadURL();
      }catch(e){
        console.log('Photo upload failed, using data URL', e.message);
        // Keep data URL as fallback
      }
    }

    const key=sanitizeEmail(email);
    const clientData={
      email: email,
      fullName: fullName,
      name: fullName,
      clientName: fullName,
      phone: phone,
      clientPhone: phone,
      photoUrl: photoUrl,
      photo: photoUrl,
      clientPhotoUrl: photoUrl,
      clientEmail: email,
      country: country,
      uid: uid,
      createdAt: Date.now(),
      lastLoginAt: Date.now(),
      verifiedForDashboard: true,
      registrationComplete: true,
      registrationMethod: 'email',
      ceoTracking: {
        fullName: fullName,
        phone: phone,
        email: email,
        photoUrl: photoUrl,
        country: country,
        registeredAt: Date.now(),
        ip: 'web-registration'
      }
    };

    showStatus('Saving to Firebase for CEO tracking...', 'ok');

    // ✅ SAVE TO ALL CEO TRACKING NODES
    await db.ref('allowedClients/'+key).set(clientData);
    await db.ref('clients/'+uid).set(clientData);
    await db.ref('clientRegistrations/'+key).set(clientData);
    await db.ref('client_registrations/'+uid).set(clientData);
    await db.ref('ceoClientsTracking/'+uid).set(clientData);
    await db.ref('allClientsTracking/'+uid).set(clientData);

    // Firestore also
    try{
      await dbFS.collection('clients').doc(uid).set(clientData);
      await dbFS.collection('allowedClients').doc(key).set(clientData);
    }catch(e){}

    localStorage.setItem('clientLoggedIn','true');
    localStorage.setItem('clientEmail', email);
    localStorage.setItem('clientName', fullName);
    localStorage.setItem('clientPhone', phone);
    localStorage.setItem('clientPhoto', photoUrl);
    localStorage.setItem('clientUid', uid);
    localStorage.removeItem('pendingGoogleEmail');
    localStorage.removeItem('pendingGoogleName');
    localStorage.removeItem('pendingGooglePhoto');

    showStatus('✅ Registered! Name+Phone+Photo+Email saved for CEO tracking - Redirecting...', 'ok');
    setTimeout(()=>{ location.replace('client-dashboard.html'); }, 1000);

  }catch(e){
    console.error(e);
    if(e.code==='auth/email-already-in-use'){
      // This happens if Auth exists but DB was cleaned - Try to delete Auth and retry
      showStatus('Auth exists but DB was cleaned - Deleting Auth to allow fresh registration...', 'warn');
      try{
        // Try sign in then delete
        const temp=await auth.signInWithEmailAndPassword(email,password).catch(()=>null);
        if(temp && temp.user){
          await temp.user.delete();
          showStatus('✅ Old Auth deleted - Please click Create Account again', 'ok');
        }else{
          showStatus('Email already registered in Auth - Please use Login or use different email. Or go to Firebase Auth and delete '+email+' manually', 'err');
        }
      }catch(delErr){
        showStatus('Email already in Auth - Please login or delete from Firebase Console > Authentication > Users > '+email, 'err');
      }
    }else{
      showStatus(e.message, 'err');
    }
  }finally{
    btn.textContent='Create Account';
    btn.disabled=false;
  }
}

async function googleRegister(){
  const provider=new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({prompt:'select_account'});
  try{
    const result=await auth.signInWithPopup(provider);
    const user=result.user;
    const email=user.email.toLowerCase();
    const name=user.displayName||document.getElementById('fullName').value;
    const photo=user.photoURL||'';
    
    // Check if fully registered
    const key=sanitizeEmail(email);
    const snap=await db.ref('allowedClients/'+key).once('value');
    if(snap.exists()){
      const v=snap.val();
      if(v.phone && (v.name||v.fullName) && (v.photoUrl||v.photo)){
        // Already registered
        localStorage.setItem('clientEmail', email);
        location.replace('client-dashboard.html');
        return;
      }
    }
    
    // Not fully registered - Prefill form and let user complete phone
    document.getElementById('email').value=email;
    document.getElementById('fullName').value=name;
    if(photo){
      document.getElementById('photoPreview').src=photo;
      document.getElementById('photoPreview').style.display='block';
      document.getElementById('photoPlaceholder').style.display='none';
      photoDataUrl=photo;
    }
    showStatus('Google account linked - Please add Phone Number (required for CEO tracking) and click Create Account. Your photo from Google is already added.', 'warn');
    // Sign out Google temp user - Will create properly via email/pass or we will save directly
    await auth.signOut();
    localStorage.setItem('pendingGoogleEmail', email);
    localStorage.setItem('pendingGoogleName', name);
    localStorage.setItem('pendingGooglePhoto', photo);
    localStorage.setItem('pendingGoogleUid', user.uid);
    
  }catch(e){
    showStatus('Google failed: '+e.message, 'err');
  }
}
</script>
</body>
</html>
