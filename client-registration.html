<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Client Account - LOVE CARE GLOBAL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0e0a1c;color:#e8e0ff;min-height:100vh;display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:420px;background:#1e1a3a;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px}
.logo{width:64px;height:64px;background:linear-gradient(135deg,#a855f7,#7c3aed);border-radius:16px;display:grid;place-items:center;margin:0 auto;font-size:28px}
h2{text-align:center;font-size:22px;font-weight:800;margin-top:8px}
.sub{font-size:12px;color:#8b7ab8;text-align:center;margin-top:-4px}
label{font-size:11px;color:#facc15;font-weight:700;letter-spacing:.04em;margin-top:4px}
input,select{padding:13px 14px;border-radius:12px;border:1px solid rgba(168,85,247,.15);background:rgba(12,10,30,.8);color:#ece8ff;width:100%;font-size:14px;outline:none}
input:focus,select:focus{border-color:#a855f7}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:14px;border-radius:12px;border:none;font-weight:800;cursor:pointer;font-size:14px;text-align:center}
.btnReg{background:#facc15;color:#000}
.btnGoogle{background:#fff;color:#1f1f1f;border:1px solid #747775;display:flex;gap:10px;align-items:center;justify-content:center;font-weight:500}
.status{padding:10px;border-radius:10px;font-size:11px;display:none;text-align:center}
.status.ok{background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.3)}
.status.err{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.status.warn{background:rgba(250,204,21,.12);color:#fde68a;border:1px solid rgba(250,204,21,.3)}
.photoBox{border:1px dashed rgba(168,85,247,.3);border-radius:16px;padding:16px;text-align:center;background:rgba(12,10,30,.4);cursor:pointer}
.photoPreview{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #facc15;margin:0 auto 10px;display:none}
.link{font-size:12px;text-align:center;text-decoration:none;color:#a78bfa}
.passWrap{position:relative}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:16px;user-select:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">👤</div>
  <h2>Create Client Account</h2>
  <p class="sub">Join LOVE CARE GLOBAL — CEO tracking requires Name+Phone+Photo+Email</p>
  
  <div id="status" class="status"></div>

  <label>FULL NAME *</label>
  <input id="fullName" placeholder="Your full name">

  <div class="row">
    <div>
      <label>EMAIL *</label>
      <input id="email" type="email" placeholder="your@email.com">
    </div>
    <div>
      <label>PHONE *</label>
      <input id="phone" type="tel" placeholder="+233XXXXXXXXX">
    </div>
  </div>

  <label>PASSWORD *</label>
  <div class="passWrap">
    <input id="password" type="password" placeholder="Min 6 characters">
    <span class="eye" onclick="togglePass()">👁️</span>
  </div>

  <label>COUNTRY *</label>
  <select id="country">
    <option value="Ghana" selected>Ghana</option>
    <option value="Nigeria">Nigeria</option>
    <option value="Kenya">Kenya</option>
    <option value="South Africa">South Africa</option>
    <option value="USA">USA</option>
    <option value="UK">UK</option>
    <option value="Other">Other</option>
  </select>

  <label>PROFILE PHOTO <span style="color:#8b7ab8">(Optional — Helps nurses recognize you)</span></label>
  <div class="photoBox" onclick="document.getElementById('photoFile').click()">
    <img id="photoPreview" class="photoPreview" src="">
    <div id="photoPlaceholder" style="font-size:32px">👤</div>
    <p style="font-size:11px;color:#a78bfa;margin-top:6px">📁 Tap to upload — Optional</p>
    <p style="font-size:10px;color:#6b7280;margin-top:4px">JPG/PNG max 3MB</p>
  </div>
  <input type="file" id="photoFile" accept="image/*" style="display:none">

  <button class="btn btnReg" onclick="register()" id="regBtn">Create Account</button>
  <button class="btn btnGoogle" onclick="googleRegister()">Continue with Google</button>
  <a href="client-login.html" class="link">Already have account? Login</a>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();
const storage=firebase.storage();
const dbFS=firebase.firestore();

function showStatus(m,type){ const el=document.getElementById('status'); el.textContent=m; el.className='status '+type; el.style.display='block'; }
function togglePass(){ const p=document.getElementById('password'); const eye=document.querySelector('.eye'); if(p.type==='password'){ p.type='text'; eye.textContent='🙈'; } else { p.type='password'; eye.textContent='👁️'; } }
function sanitizeEmail(email){ return email.toLowerCase().trim().replace(/[.#$@\[\]]/g,'_'); }

let selectedFile=null; let photoDataUrl='';
document.getElementById('photoFile').addEventListener('change', function(e){
  const file=e.target.files[0]; if(!file) return;
  if(file.size>3*1024*1024){ showStatus('Photo max 3MB','err'); return; }
  selectedFile=file;
  const reader=new FileReader();
  reader.onload=(ev)=>{ photoDataUrl=ev.target.result; const img=document.getElementById('photoPreview'); img.src=photoDataUrl; img.style.display='block'; document.getElementById('photoPlaceholder').style.display='none'; };
  reader.readAsDataURL(file);
});

window.addEventListener('DOMContentLoaded',()=>{
  const params=new URLSearchParams(location.search);
  const email=params.get('email') || localStorage.getItem('pendingGoogleEmail') || '';
  const name=params.get('name') || localStorage.getItem('pendingGoogleName') || '';
  const photo=params.get('photo') || localStorage.getItem('pendingGooglePhoto') || '';
  if(email) document.getElementById('email').value=email;
  if(name) document.getElementById('fullName').value=name;
  if(photo){ const img=document.getElementById('photoPreview'); img.src=photo; img.style.display='block'; document.getElementById('photoPlaceholder').style.display='none'; photoDataUrl=photo; }
  if(params.get('from')){ showStatus('Previous incomplete registration detected - You can re-register now, old data will be overwritten','warn'); }
});

async function checkAndCleanLeftover(email){
  const eLower=email.toLowerCase().trim();
  const key=sanitizeEmail(eLower);
  let authExists=false;
  try{ const methods=await auth.fetchSignInMethodsForEmail(eLower); if(methods && methods.length>0) authExists=true; }catch(e){}
  let dbExists=false;
  try{ const snap=await db.ref('allowedClients/'+key).once('value'); if(snap.exists()) dbExists=true; else { const snap2=await db.ref('clients').orderByChild('email').equalTo(eLower).once('value'); if(snap2.exists()) dbExists=true; } }catch(e){}
  if(dbExists && !authExists){
    showStatus('🧹 Cleaning old leftover data (Auth was deleted but DB remained) - Will overwrite now...','warn');
    try{
      await db.ref('allowedClients/'+key).remove();
      await db.ref('clientRegistrations/'+key).remove();
      const qSnap=await db.ref('clients').orderByChild('email').equalTo(eLower).once('value');
      if(qSnap.exists()){ qSnap.forEach(ch=>{ db.ref('clients/'+ch.key).remove(); }); }
    }catch(e){}
    return {canRegister:true, cleaned:true};
  }
  if(dbExists && authExists){ return {canRegister:false, reason:'Email already registered — Please login'}; }
  return {canRegister:true, cleaned:false};
}

async function register(){
  const fullName=document.getElementById('fullName').value.trim();
  const email=document.getElementById('email').value.trim().toLowerCase();
  const phone=document.getElementById('phone').value.trim();
  const password=document.getElementById('password').value.trim();
  const country=document.getElementById('country').value;
  if(!fullName||!email||!phone||!password){ showStatus('All * fields required - CEO needs Name+Phone+Email for tracking','err'); return; }
  if(phone.replace(/\D/g,'').length<9){ showStatus('Valid phone required - At least 9 digits','err'); return; }
  if(password.length<6){ showStatus('Password min 6 chars','err'); return; }
  const btn=document.getElementById('regBtn'); btn.textContent='Checking...'; btn.disabled=true;
  const check=await checkAndCleanLeftover(email);
  if(!check.canRegister){ showStatus(check.reason,'err'); btn.textContent='Create Account'; btn.disabled=false; return; }
  if(check.cleaned){ showStatus('✅ Old data cleaned - Creating new account...','ok'); await new Promise(r=>setTimeout(r,800)); }
  showStatus('Creating account...','ok');
  try{
    const cred=await auth.createUserWithEmailAndPassword(email,password);
    const uid=cred.user.uid;
    let photoUrl=photoDataUrl || '';
    if(selectedFile){
      try{ showStatus('Uploading photo...','ok'); const storageRef=storage.ref('clientAvatars/'+key+'/photo_'+Date.now()); const upload=await storageRef.put(selectedFile); photoUrl=await upload.ref.getDownloadURL(); }catch(e){}
    }
    const key=sanitizeEmail(email);
    const clientData={ email: email, fullName: fullName, name: fullName, clientName: fullName, phone: phone, clientPhone: phone, photoUrl: photoUrl, photo: photoUrl, clientPhotoUrl: photoUrl, clientEmail: email, country: country, uid: uid, createdAt: Date.now(), lastLoginAt: Date.now(), verifiedForDashboard: true, registrationComplete: true, registrationMethod: 'email' };
    showStatus('Saving for CEO tracking...','ok');
    await db.ref('allowedClients/'+key).set(clientData);
    await db.ref('clients/'+uid).set(clientData);
    await db.ref('clientRegistrations/'+key).set(clientData);
    await db.ref('ceoClientsTracking/'+uid).set(clientData);
    await db.ref('allClientsTracking/'+uid).set(clientData);
    try{ await dbFS.collection('clients').doc(uid).set(clientData); }catch(e){}
    localStorage.setItem('clientLoggedIn','true'); localStorage.setItem('clientEmail', email); localStorage.setItem('clientName', fullName); localStorage.setItem('clientPhone', phone); localStorage.setItem('clientPhoto', photoUrl); localStorage.setItem('clientUid', uid);
    localStorage.removeItem('pendingGoogleEmail'); localStorage.removeItem('pendingGoogleName'); localStorage.removeItem('pendingGooglePhoto');
    showStatus('✅ Registered! Redirecting...','ok'); setTimeout(()=>{ location.replace('client-dashboard.html'); }, 1000);
  }catch(e){
    console.error(e);
    if(e.code==='auth/email-already-in-use'){ showStatus('Email exists in Auth — Please login or delete from Firebase Console > Authentication','err'); }
    else { showStatus(e.message,'err'); }
  }finally{ btn.textContent='Create Account'; btn.disabled=false; }
}

async function googleRegister(){
  const provider=new firebase.auth.GoogleAuthProvider(); provider.setCustomParameters({prompt:'select_account'});
  try{
    const result=await auth.signInWithPopup(provider);
    const user=result.user; const email=user.email.toLowerCase(); const name=user.displayName||''; const photo=user.photoURL||'';
    document.getElementById('email').value=email; document.getElementById('fullName').value=name;
    if(photo){ document.getElementById('photoPreview').src=photo; document.getElementById('photoPreview').style.display='block'; document.getElementById('photoPlaceholder').style.display='none'; photoDataUrl=photo; }
    showStatus('Google linked — Add phone number (required for CEO tracking) and click Create Account','warn');
    await auth.signOut();
    localStorage.setItem('pendingGoogleEmail', email); localStorage.setItem('pendingGoogleName', name); localStorage.setItem('pendingGooglePhoto', photo);
  }catch(e){ showStatus('Google failed: '+e.message,'err'); }
}
</script>
</body>
</html>
