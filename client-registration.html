<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Registration - 8 Countries</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#f8fafc}.topbar{background:linear-gradient(90deg,#22c55e,#16a34a);padding:12px 14px;display:flex;justify-content:space-between;color:white}.wrap{max-width:600px;margin:0 auto;padding:14px}.card{background:white;border-radius:16px;padding:16px;border:1px solid #e5e7eb}label{font-size:11px;font-weight:800;margin:8px 0 4px;display:block}input,select{width:100%;padding:11px;border-radius:10px;border:1.5px solid #d1d5db;font-size:12px}.btn{padding:12px;border-radius:12px;font-weight:900;border:none;cursor:pointer;width:100%;margin-top:10px}.btnGreen{background:linear-gradient(90deg,#22c55e,#16a34a);color:white}</style></head><body><div class="topbar"><b>👤 Client Registration - 8 Countries</b><a href="index.html" style="color:white;text-decoration:none;font-weight:800">Home</a></div><div class="wrap"><div class="card"><h3>🌍 Select Country + GPS (8 Countries + Other)</h3><label>Country *</label><select id="country" required><option value="">-- Select Country --</option><option value="GH">🇬🇭 Ghana</option><option value="NG">🇳🇬 Nigeria</option><option value="ZA">🇿🇦 South Africa</option><option value="GB">🇬🇧 United Kingdom (UK)</option><option value="US">🇺🇸 USA</option><option value="AU">🇦🇺 Australia</option><option value="AE">🇦🇪 UAE</option><option value="CA">🇨🇦 Canada</option><option value="OTHER">🌍 Other Country</option></select><label>Full Name *</label><input id="fullName" required><label>Phone *</label><input id="phone" required><label>Email *</label><input id="email" type="email" required><label>Password *</label><input id="password" type="password" required><label>GPS Location *</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="lat" readonly placeholder="Lat"><input id="lng" readonly placeholder="Lng"></div><button class="btn" style="background:#3b82f6;color:white" type="button" onclick="getGPS()">📍 Use My GPS - Required</button><div id="mapPreview" style="display:none;margin-top:8px"><iframe id="mapFrame" style="width:100%;height:140px;border:none;border-radius:10px"></iframe></div><button class="btn btnGreen" onclick="registerClient()">📝 Register as Client</button><div style="text-align:center;margin-top:10px;font-size:12px">Already have account? <a href="client-login.html" style="color:#16a34a;font-weight:900">Client Login</a></div></div></div><script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);window.getGPS=()=>{  navigator.geolocation.getCurrentPosition(pos=>{    document.getElementById('lat').value=pos.coords.latitude.toFixed(6);    document.getElementById('lng').value=pos.coords.longitude.toFixed(6);    document.getElementById('mapPreview').style.display='block';    document.getElementById('mapFrame').src=`https://maps.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}&z=15&output=embed`;  });}window.registerClient=async()=>{  const country=document.getElementById('country').value;  const lat=document.getElementById('lat').value;  const lng=document.getElementById('lng').value;  if(!country){alert('Select country - 8 Countries: Ghana, Nigeria, SA, UK, USA, Australia, UAE, Canada, Other');return;}  if(!lat||!lng){alert('Use GPS');return;}  const email=document.getElementById('email').value.trim();  const password=document.getElementById('password').value;  try{    const cred=await createUserWithEmailAndPassword(auth,email,password);    await setDoc(doc(db,'clients',cred.user.uid),{      uid:cred.user.uid, email,      fullName:document.getElementById('fullName').value,      phone:document.getElementById('phone').value,      country, countryName:document.getElementById('country').options[document.getElementById('country').selectedIndex].text,      lat:parseFloat(lat), lng:parseFloat(lng),      createdAt:serverTimestamp()    });    localStorage.setItem('lcg_client_uid',cred.user.uid);    localStorage.setItem('lcg_role','client');    localStorage.setItem('lcg_logged_in','true');    alert('✅ Registered! Country: '+country+' GPS saved');    location.href='client-dashboard.html';  }catch(e){alert('Failed: '+e.message);}}</script></body></html>
