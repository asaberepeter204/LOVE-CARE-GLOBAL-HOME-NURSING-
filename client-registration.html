<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:#0e0a1c;color:#e8e0ff;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 380px at 14% 10%, rgba(76,29,149,.22) 0%, transparent 65%),radial-gradient(500px 340px at 86% 14%, rgba(107,33,168,.14) 0%, transparent 60%),linear-gradient(180deg,#0e0a1c 0%, #120e26 40%, #0a0714 100%)}
.wrap{max-width:520px;margin:0 auto;padding:24px 14px 60px}
.card{background:rgba(28,18,56,.78);border:1px solid rgba(168,85,247,.12);border-radius:20px;padding:22px;backdrop-filter:blur(14px);box-shadow:0 14px 40px rgba(0,0,0,.5)}
.card h2{font-family:Plus Jakarta Sans,sans-serif;font-size:18px;font-weight:800;color:#f3e8ff;text-align:center;margin-bottom:18px}
label{font-size:11px;font-weight:800;margin:14px 0 6px;display:block;color:#c4b5fd;letter-spacing:.05em}
.inputWrap{position:relative}
input,select{width:100%;padding:13px 44px 13px 14px;border-radius:12px;border:1px solid rgba(168,85,247,.18);background:rgba(14,10,28,.7);color:#ede9fe;font-size:14px;font-weight:600;outline:none}
select{padding-right:14px}
input::placeholder{color:#6b5b8a}
input:focus,select:focus{border-color:#a855f7;box-shadow:0 0 0 4px rgba(168,85,247,.15)}
.eyeBtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:rgba(76,29,149,.18);border:1px solid rgba(168,85,247,.14);width:36px;height:36px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.eyeBtn svg{stroke:#d8b4fe}
.btn{padding:14px;border-radius:12px;font-weight:900;border:none;cursor:pointer;width:100%;margin-top:14px;display:flex;align-items:center;justify-content:center;font-size:14px}
.btnPrimary{background:linear-gradient(135deg,#a855f7,#d8b4fe);color:#1e0a3a;box-shadow:0 8px 20px rgba(168,85,247,.3)}
.btnLight{background:rgba(76,29,149,.16);border:1px solid rgba(168,85,247,.18);color:#d8b4fe}
.gpsInput{background:rgba(76,29,149,.12)!important;color:#d8b4fe!important}
</style>

<style>
.topbar{position:sticky;top:0;z-index:50;background:rgba(14,10,28,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(168,85,247,.12);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.left{display:flex;align-items:center;gap:12px}
.hamburger{width:42px;height:42px;border-radius:12px;border:1px solid rgba(168,85,247,.18);background:rgba(76,29,149,.16);display:grid;place-items:center;cursor:pointer}
.hamburger span{display:block;width:18px;height:2px;background:#e9d5ff;border-radius:99px}
.hamburger span+span{margin-top:4px}
.logoBox{display:flex;align-items:center;gap:10px}
.logoImg{width:42px;height:42px;border-radius:12px;object-fit:contain;background:#3b0f6e;border:1px solid rgba(168,85,247,.18)}
.brand{font-family:Plus Jakarta Sans,sans-serif;font-weight:800;font-size:13px;letter-spacing:.05em;line-height:1.1;color:#f3e8ff}
.sosBtn{background:linear-gradient(135deg,#ef4444,#dc2626);color:white;padding:8px 14px;border-radius:999px;font-weight:900;font-size:11px;border:none;cursor:pointer;text-decoration:none}
#overlay{position:fixed;inset:0;background:rgba(14,10,28,.65);backdrop-filter:blur(6px);z-index:80;display:none}
#overlay.show{display:block}
#drawer{position:fixed;left:0;top:0;bottom:0;width:300px;background:rgba(18,12,36,.98);border-right:1px solid rgba(168,85,247,.12);z-index:90;transform:translateX(-100%);transition:.32s;display:flex;flex-direction:column}
#drawer.open{transform:translateX(0)}
.item{padding:11px 13px;border-radius:12px;border:1px solid rgba(168,85,247,.10);background:rgba(76,29,149,.08);font-weight:700;font-size:13px;display:flex;gap:10px;color:#d8b4fe;text-decoration:none;align-items:center}
.item.consent{background:linear-gradient(135deg,#a855f7,#d8b4fe);color:#1e0a3a;border:none;font-weight:900}
.item.sos{background:linear-gradient(135deg,#ef4444,#dc2626);color:white;border:none;font-weight:900;justify-content:center}
</style>
</head>
<body>
<div class="bg"></div>

<div class="topbar">
<div class="left">
<button class="hamburger" onclick="openD()"><span></span><span></span><span></span></button>
<div class="logoBox">
<img src="icon-transparent-512.png" alt="Logo" class="logoImg">
<div class="brand">LOVE CARE GLOBAL<br>HOME NURSING</div>
</div>
</div>
<a href="sos.html" class="sosBtn">SOS</a>
</div>

<div id="overlay" onclick="closeD()"></div>
<div id="drawer">
<div style="padding:18px;border-bottom:1px solid rgba(168,85,247,.10);display:flex;gap:12px;align-items:center">
<img src="icon-transparent-512.png" alt="Logo" style="width:44px;height:44px;border-radius:12px;background:#3b0f6e">
<div><b style="font-size:12px;color:#f3e8ff">LOVE CARE GLOBAL<br>HOME NURSING</b></div>
</div>
<div style="padding:12px;display:grid;gap:8px;flex:1;overflow:auto">
<a class="item" href="index.html">Home</a>
<a class="item" href="about.html">About</a>
<a class="item" href="services.html">Services</a>
<a class="item" href="how-it-works.html">How It Works</a>
<a class="item" href="contact.html">Contact</a>
<a class="item" href="client-registration.html">Client Registration</a>
<a class="item" href="nurses-registration.html">Nurse Registration</a>
<a class="item consent" href="consent-form.html">Consent Form</a>
<a class="item" href="privacy.html">Privacy</a>
<a class="item" href="terms.html">Terms</a>
<a class="item" href="refund.html">Refund</a>
<a class="item sos" href="sos.html">SOS</a>
</div>
<div style="padding:12px;border-top:1px solid rgba(168,85,247,.10)"><button onclick="closeD()" style="width:100%;padding:11px;border-radius:12px;border:1px solid rgba(168,85,247,.15);background:rgba(76,29,149,.12);color:#d8b4fe;font-weight:800;cursor:pointer">Close</button></div>
</div>

<div class="wrap">

<div class="card">
<h2>Client Registration</h2>

<label>Full Name</label>
<input id="fullName" placeholder="Full name">

<label>Email</label>
<input id="email" type="email" placeholder="Email">

<label>Phone</label>
<div style="display:grid;grid-template-columns:130px 1fr;gap:8px">
<select id="phoneCode" onchange="handlePhoneCode()">
<option value="+233">🇬🇭 +233</option>
<option value="+234">🇳🇬 +234</option>
<option value="+27">🇿🇦 +27</option>
<option value="+44">🇬🇧 +44</option>
<option value="+1">🇺🇸 +1</option>
<option value="+61">🇦🇺 +61</option>
<option value="+971">🇦🇪 +971</option>
<option value="+1-CA">🇨🇦 +1</option>
<option value="OTHER">🌍 Other</option>
</select>
<input id="phone" placeholder="Phone number" inputmode="numeric">
</div>
<div id="customCodeWrap" style="display:none;margin-top:8px">
<input id="customCode" placeholder="Country code e.g. +33">
</div>

<label>Country</label>
<select id="country">
<option value="">Select Country</option>
<option value="GH">🇬🇭 Ghana</option>
<option value="NG">🇳🇬 Nigeria</option>
<option value="ZA">🇿🇦 South Africa</option>
<option value="GB">🇬🇧 UK</option>
<option value="US">🇺🇸 USA</option>
<option value="AU">🇦🇺 Australia</option>
<option value="AE">🇦🇪 UAE</option>
<option value="CA">🇨🇦 Canada</option>
<option value="OTHER">🌍 Other</option>
</select>

<label>Password</label>
<div class="inputWrap">
<input id="password" type="password" placeholder="Password">
<button class="eyeBtn" type="button" onclick="toggleEye('password',this)">
<svg id="eye-password-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
<svg id="eye-password-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.53 9.53a3 3 0 1 0 4.24 4.24"/><path d="M1 1l22 22"/></svg>
</button>
</div>

<label>Confirm Password</label>
<div class="inputWrap">
<input id="confirmPassword" type="password" placeholder="Confirm password">
<button class="eyeBtn" type="button" onclick="toggleEye('confirmPassword',this)">
<svg id="eye-confirmPassword-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
<svg id="eye-confirmPassword-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.53 9.53a3 3 0 1 0 4.24 4.24"/><path d="M1 1l22 22"/></svg>
</button>
</div>

<label>Actual Location</label>
<input id="gpsName" readonly class="gpsInput" placeholder="Locating...">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><input id="lat" readonly class="gpsInput" placeholder="Lat"><input id="lng" readonly class="gpsInput" placeholder="Lng"></div>
<button class="btn btnLight" type="button" onclick="getGPS()">Refresh Location</button>
<div id="mapPreview" style="display:none;margin-top:10px"><iframe id="mapFrame" style="width:100%;height:160px;border:none;border-radius:12px;border:1px solid rgba(168,85,247,.12)"></iframe></div>

<button class="btn btnPrimary" onclick="register()">Register</button>
<div style="text-align:center;margin-top:16px;font-size:13px"><a href="client-login.html" style="color:#d8b4fe;font-weight:800;text-decoration:none">Already have account? Login</a><br><a href="index.html" style="font-size:12px;color:#a78bfa;text-decoration:none;margin-top:8px;display:inline-block">Home</a></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",
  authDomain:"web-care-618e8.firebaseapp.com",
  databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",
  projectId:"web-care-618e8",
  storageBucket:"web-care-618e8.firebasestorage.app",
  messagingSenderId:"1062578660694",
  appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const rtdb=getDatabase(app);

window.toggleEye=(id,btn)=>{
  const input=document.getElementById(id);
  const openIcon=document.getElementById(`eye-${id}-open`);
  const closedIcon=document.getElementById(`eye-${id}-closed`);
  if(input.type==='password'){
    input.type='text';
    if(openIcon)openIcon.style.display='none';
    if(closedIcon)closedIcon.style.display='block';
  }else{
    input.type='password';
    if(openIcon)openIcon.style.display='block';
    if(closedIcon)closedIcon.style.display='none';
  }
}

window.getGPS=()=>{
  const nameField=document.getElementById('gpsName');
  nameField.value='Locating...';
  if(!navigator.geolocation){nameField.value='GPS not supported';return;}
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude; const lng=pos.coords.longitude;
    document.getElementById('lat').value=lat.toFixed(6);
    document.getElementById('lng').value=lng.toFixed(6);
    document.getElementById('mapPreview').style.display='block';
    document.getElementById('mapFrame').src=`https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed`;
    try{
      const res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18`);
      const data=await res.json();
      nameField.value=data.display_name || `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
    }catch(e){
      nameField.value=`${lat.toFixed(6)}, ${lng.toFixed(6)}`;
    }
  },()=>{nameField.value='Enable GPS'; alert('Enable GPS');},{enableHighAccuracy:true, timeout:15000});
}

window.handlePhoneCode=()=>{
  const sel=document.getElementById('phoneCode').value;
  const wrap=document.getElementById('customCodeWrap');
  wrap.style.display = sel==='OTHER' ? 'block' : 'none';
};

window.syncPhoneCodeWithCountry=()=>{
  const country=document.getElementById('country').value;
  const phoneCode=document.getElementById('phoneCode');
  const map={GH:'+233',NG:'+234',ZA:'+27',GB:'+44',US:'+1',AU:'+61',AE:'+971',CA:'+1-CA'};
  if(map[country]){ phoneCode.value=map[country]; handlePhoneCode(); }
  if(country==='OTHER'){ phoneCode.value='OTHER'; handlePhoneCode(); }
};
document.getElementById('country')?.addEventListener('change', syncPhoneCodeWithCountry);

window.register=async()=>{
  const fullName=document.getElementById('fullName').value.trim();
  const email=document.getElementById('email').value.trim();
  const phoneRaw=document.getElementById('phone').value.trim();
  const phoneCodeVal=document.getElementById('phoneCode').value;
  const customCode=document.getElementById('customCode')?.value.trim();
  let finalCode=phoneCodeVal;
  if(phoneCodeVal==='OTHER'){
    if(!customCode){ alert('Enter your country code'); return; }
    finalCode=customCode;
  }
  if(finalCode==='+1-CA') finalCode='+1';
  const phone=finalCode+' '+phoneRaw;
  if(!phoneRaw){ alert('Enter phone number'); return; }
  const country=document.getElementById('country').value;
  const pass=document.getElementById('password').value;
  const cpass=document.getElementById('confirmPassword').value;
  const lat=document.getElementById('lat').value;
  const lng=document.getElementById('lng').value;
  const gpsName=document.getElementById('gpsName').value;
  if(!fullName||!email||!country||!pass){alert('Fill all fields');return;}
  if(pass!==cpass){alert('Passwords do not match');return;}
  if(!lat||!lng||!gpsName||gpsName.includes('Locating')){alert('Wait for location'); getGPS(); return;}
  try{
    const cred=await createUserWithEmailAndPassword(auth,email,pass);
    const uid=cred.user.uid;
    await setDoc(doc(db,'clients',uid),{
      uid, fullName, email, phone, country,
      countryName: document.getElementById('country').options[document.getElementById('country').selectedIndex].text,
      phoneCode: finalCode, phoneRaw, phoneFull: phone,
      lat:parseFloat(lat), lng:parseFloat(lng), gpsActualName:gpsName, actualLocationName:gpsName,
      role:'client', isApproved:true,
      createdAt:serverTimestamp(), timestamp:new Date().toISOString()
    });
    await set(ref(rtdb,'clients/'+uid),{
      uid, name:fullName, fullName, email, phone, phoneCode:finalCode, phoneRaw, phoneFull:phone, country,
      lat:parseFloat(lat), lng:parseFloat(lng), gpsName:gpsName,
      role:'client', createdAt:Date.now()
    });
    localStorage.setItem('lcg_client_uid',uid);
    localStorage.setItem('clientProfile', JSON.stringify({uid, name:fullName, email, phone, lat, lng, gpsName}));
    alert(`Registered!`);
    location.href='client-login.html';
  }catch(e){alert('Failed: '+e.message);}
}
window.addEventListener('DOMContentLoaded',()=>{getGPS();});
function openD(){document.getElementById('drawer').classList.add('open');document.getElementById('overlay').classList.add('show')}
function closeD(){document.getElementById('drawer').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
</script>
<script>function openD(){document.getElementById('drawer').classList.add('open');document.getElementById('overlay').classList.add('show')} function closeD(){document.getElementById('drawer').classList.remove('open');document.getElementById('overlay').classList.remove('show')}</script></body>
</html>
