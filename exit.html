<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exiting | LOVE CARE GLOBAL</title>
<meta name="theme-color" content="#a855f7">
<style>
body{margin:0;background:#0e0a1c;color:#fff;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;text-align:center}
.logo{font-size:56px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.1)}}
h1{color:#a855f7;margin:10px 0}
</style>
</head>
<body>
<div class="logo">💜</div>
<h1>LOVE CARE GLOBAL</h1>
<p>Closing app...</p>
<script>
function closeApp(){
  try{window.location.href="intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.HOME;end";}catch(e){}
  setTimeout(function(){try{window.close();}catch(e){}},400);
  setTimeout(function(){try{window.location.href="about:blank";}catch(e){}},900);
}
window.addEventListener('load', closeApp);
document.addEventListener('click', closeApp);
</script>
</body>
</html>
