<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exiting... | LOVE CARE GLOBAL</title>
<meta name="theme-color" content="#a855f7">
<style>
  body {
    margin:0; background:#0e0a1c; color:white; font-family:system-ui;
    display:flex; align-items:center; justify-content:center; height:100vh; flex-direction:column;
  }
  .logo{font-size:48px; animation: pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1} 50%{opacity:.5}}
</style>
</head>
<body>
<div class="logo">💜</div>
<h2>Thank you for using</h2>
<h1>LOVE CARE GLOBAL</h1>
<p>Closing app...</p>

<script>
// AUTO CLOSE - Works in APK / TWA / PWA

function closeApp() {
  // Method 1: For Android APK / TWA - Go to Home Screen
  try {
    // This is the Android HOME intent - takes phone to home screen
    window.location.href = "intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.HOME;end";
  } catch(e){}

  // Method 2: Close PWA window
  setTimeout(() => {
    try { window.close(); } catch(e){}
  }, 300);

  // Method 3: For iOS / Browser fallback - clear history and close
  setTimeout(() => {
    try {
      if (window.history.length > 1) {
        window.history.go(-(window.history.length - 1));
      }
      window.close();
      // If can't close, go to about:blank which looks like closed
      window.location.href = "about:blank";
    } catch(e){}
  }, 800);

  // Method 4: Final fallback - go to GitHub Pages blank
  setTimeout(() => {
    // If still here, just show exited message and let user press home button
    document.body.innerHTML = `
      <div style="text-align:center; padding:20px;">
        <div style="font-size:64px;">✅</div>
        <h1>App Closed</h1>
        <p>You can now return to home screen</p>
        <p style="opacity:.6; font-size:14px;">Press the home button ⭕</p>
      </div>
    `;
  }, 1500);
}

// Run auto on load
window.addEventListener('load', closeApp);

// Also allow tap to close again
document.addEventListener('click', closeApp);
document.addEventListener('touchstart', closeApp);
</script>
</body>
</html>
