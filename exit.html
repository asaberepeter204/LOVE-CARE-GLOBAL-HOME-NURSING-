<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exit | LOVE CARE GLOBAL</title>
<meta name="theme-color" content="#0e0a1c">
<style>
  html,body{margin:0;padding:0;background:#0e0a1c;height:100%;overflow:hidden}
</style>
</head>
<body>
<script>
// V2 - FIXED: No about:blank, goes directly to home screen

(function() {
  // For PWABuilder APK (TWA) - this is the real close
  function hardClose() {
    try {
      // 1. Try to close the window - works in APK
      window.close();
    } catch(e){}

    try {
      // 2. Try top window
      window.top.close();
    } catch(e){}

    try {
      // 3. Tell Android to move app to background = shows home screen
      // This works in Trusted Web Activity
      if (document.visibilityState) {
        // Move task to back
        window.history.go(-(window.history.length));
      }
    } catch(e){}

    // 4. Last resort: try HOME intent WITHOUT staying in about:blank
    // We use _self and immediate close after
    try {
      var a = document.createElement('a');
      a.href = "intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.HOME;end";
      a.click();
    } catch(e){}
  }

  // Try immediately
  hardClose();

  // Try again after 100ms, 300ms, 600ms
  setTimeout(hardClose, 100);
  setTimeout(hardClose, 300);
  setTimeout(hardClose, 600);

  // If still not closed after 1 sec, show a nice screen
  // and user just taps X at top - that X DOES go to home!
  setTimeout(function(){
    document.body.innerHTML = `
      <div style="background:#0e0a1c;color:white;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;text-align:center;padding:20px">
        <div style="font-size:60px">💜</div>
        <h2 style="color:#a855f7">LOVE CARE GLOBAL</h2>
        <p>App closed successfully</p>
        <p style="opacity:0.6;font-size:14px;margin-top:20px">Tap X at top left to return home</p>
        <button onclick="window.close()" style="margin-top:20px;background:#a855f7;color:white;border:none;padding:12px 30px;border-radius:25px;font-size:16px">Close App</button>
      </div>
    `;
  }, 1000);
})();
</script>
</body>
</html>
