<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nurse Login - LOVE CARE GLOBAL</title>
<style>body{font-family:Inter,sans-serif;background:#eff6ff;margin:0}.top{background:#2563eb;color:white;padding:12px}.card{max-width:420px;margin:20px auto;background:white;border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.1)}input{width:100%;padding:12px;border-radius:10px;border:1px solid #d1d5db;margin:6px 0 12px} .btn{width:100%;padding:12px;border-radius:12px;border:none;font-weight:800;cursor:pointer}.btn-blue{background:#2563eb;color:white} .btn-white{background:white;border:1px solid #d1d5db;margin-top:10px}</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg", authDomain: "web-care-618e8.firebaseapp.com", databaseURL: "https://web-care-618e8-default-rtdb.firebaseio.com", projectId: "web-care-618e8", storageBucket: "web-care-618e8.firebasestorage.app", messagingSenderId: "1062578660694", appId: "1:1062578660694:web:f94dfe12c929df05bce2f7" };
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getDatabase(app); const provider=new GoogleAuthProvider();
window.loginEmail=async function(){
 const e=document.getElementById('email').value.trim(); const p=document.getElementById('pass').value;
 if(!e||!p){alert('Enter email and password');return;}
 try{ let cred=await signInWithEmailAndPassword(auth,e,p); let uid=cred.user.uid;
  let v=await get(ref(db,'verified_nurses/'+uid)); let pend=await get(ref(db,'nurses_pending/'+uid));
  if(v.exists()){ localStorage.setItem('currentNurseId',uid); location.href='nurse-dashboard-final.html'; }
  else if(pend.exists()){ alert('Your application pending CEO approval - CEO will verify ID & License'); }
  else{ alert('No nurse profile found - Please register first with ID/License'); localStorage.setItem('tempNurseUid',uid); localStorage.setItem('tempNurseEmail',e); location.href='nurse-registration-new.html'; }
 }catch(err){ alert(err.message); }
}
window.loginGoogle=async function(){
 try{
  let r=await signInWithPopup(auth,provider); let uid=r.user.uid; let email=r.user.email;
  let v=await get(ref(db,'verified_nurses/'+uid)); let pend=await get(ref(db,'nurses_pending/'+uid));
  if(v.exists()){ localStorage.setItem('currentNurseId',uid); location.href='nurse-dashboard-final.html'; }
  else if(pend.exists()){ alert('Application pending approval - CEO will verify ID & License'); }
  else{ localStorage.setItem('tempNurseUid',uid); localStorage.setItem('tempNurseEmail',email); localStorage.setItem('tempNurseName',r.user.displayName||''); alert('Google OK - Complete nurse registration with ID & License - One time only'); location.href='nurse-registration-new.html?google=1'; }
 }catch(err){ alert('Google Failed: '+err.message); }
}
</script></head><body><div class="top"><b>LOVE CARE GLOBAL - NURSE PORTAL</b></div><div class="card"><h2>Nurse Login 👩‍⚕️</h2><p style="font-size:12px;color:#6b7280">Verified nurses only. New nurses must upload ID & License.</p><input id="email" placeholder="you@example.com"><input id="pass" type="password" placeholder="Password"><button class="btn btn-blue" onclick="loginEmail()">🔐 Login to Dashboard</button><div style="text-align:center;margin:10px 0;font-size:12px;color:#6b7280">OR</div><button class="btn btn-white" onclick="loginGoogle()">G Google Login</button><div style="font-size:12px;text-align:center;margin-top:12px"><a href="nurse-registration-new.html">New Nurse? Register & Upload ID/License</a><br><a href="index.html">Back to Home</a></div></div></body></html>
