<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0e0a1c;color:#e8e0ff;padding-bottom:90px}

.badge{padding:4px 10px;border-radius:999px;font-size:10px;font-weight:900;display:inline-block}

    .photoRow{display:flex;gap:12px;margin:10px 0}

<script>
function openBothPhotosModal(bookingId){
  const b=all.find(x=>x.id===bookingId);
  if(!b) return;
  getClientPhoto(b.clientId||b.clientPhone, cUrl=>{
    getNursePhoto(b.nurseId, b.nursePhone, nUrl=>{
      const modal = document.createElement('div');
      modal.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
      modal.innerHTML=`
        <div style="background:#12122a;border-radius:16px;padding:16px;max-width:420px;width:100%;border:2px solid #444">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <div style="font-weight:bold;color:#fff;font-size:14px">Booking ID: ${b.bookingId||b.id}</div>
            <button onclick="this.closest('div').parentElement.parentElement.remove()" style="background:#ff5252;color:#fff;border:none;border-radius:8px;padding:6px 12px">Close</button>
          </div>
          <div class="photoRow">
            <div class="photoBox client">
              ${cUrl?`<img src="${cUrl}">`:`<div style="width:90px;height:90px;border-radius:50%;background:#333;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:40px">ðŸ‘¤</div>`}
              <div style="font-size:12px;color:#b39ddb;font-weight:bold">CLIENT</div>
              <div style="font-size:13px;color:#fff;font-weight:bold;margin-top:4px">${b.clientName||b.clientUsername||'Client'}</div>
              <div style="font-size:11px;color:#ccc">${b.clientPhone||''}</div>
              <div style="font-size:10px;color:#aaa;margin-top:4px">Email: ${b.clientEmail||'-'}</div>
              <div style="font-size:10px;color:#aaa">Location: ${b.clientLocation||b.location||'-'}</div>
            </div>
            <div class="photoBox nurse">
              ${nUrl?`<img src="${nUrl}">`:`<div style="width:90px;height:90px;border-radius:50%;background:#333;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:40px">ðŸ‘©â€âš•ï¸</div>`}
              <div style="font-size:12px;color:#a5d6a7;font-weight:bold">NURSE</div>
              <div style="font-size:13px;color:#fff;font-weight:bold;margin-top:4px">${b.nurseName||'Nurse'}</div>
              <div style="font-size:11px;color:#ccc">${b.nursePhone||''}</div>
              <div style="font-size:10px;color:#aaa;margin-top:4px">Earns: GHS ${b.nurse80||Math.round((b.amount||0)*0.8)} (80%)</div>
              <div style="font-size:10px;color:#aaa">Total: GHS ${b.amount||'-'}</div>
            </div>
          </div>
          <div style="background:#1e1e2f;border-radius:8px;padding:8px;margin-top:8px">
            <div style="font-size:11px;color:#aaa">Status: <span style="color:#FFD700">${b.status||'pending'}</span> | Amount: GHS ${b.amount||'-'} | Date: ${new Date(b.createdAt||Date.now()).toLocaleString()}</div>
          </div>
          <div style="display:flex;gap:8px;margin-top:10px">
            <button onclick="if(navigator.geolocation){alert('Opening navigation for CEO view - Client: ${b.clientLocation||b.location} Nurse: ${b.nurseLocation||b.nurseLat||''}'); window.open('https://www.google.com/maps/dir/?api=1&origin=${b.nurseLat||''},${b.nurseLng||''}&destination=${b.clientLat||b.clientLocation||b.location||''}','_blank')}" style="flex:1;background:#00c853;color:#fff;border:none;border-radius:8px;padding:10px;font-weight:bold">View Route</button>
            <button onclick="this.closest('div').parentElement.parentElement.remove()" style="flex:1;background:#333;color:#fff;border:none;border-radius:8px;padding:10px">Close</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      modal.addEventListener('click', e=>{ if(e.target===modal) modal.remove(); });
    });
  });
}
</script>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head><body>
<div style="padding:12px 16px;background:rgba(14,10,28,.98);border-bottom:1px solid rgba(168,85,247,.12);display:flex;justify-content:space-between"><b>CEO Bookings Progress - Rejected Flow Fixed</b><small style="color:#22c55e">Live - Shows rejected - CEO clears after seeing</small></div>
<div style="max-width:900px;margin:0 auto;padding:10px">
<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 14px"><button class="btn btnGray" onclick="filter='all';load()">All</button><button class="btn btnRed" style="flex:none" onclick="filter='rejected';load()">ALL Progress - Pending, Accepted, Rejected, Completed - CEO View Both Photos</button><button class="btn btnGray" onclick="filter='accepted';load()">Accepted</button></div>
<div id="list" style="display:grid;gap:12px"></div>
</div>
<div id="toast" class="toast"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
let filter='all'; let all=[];
function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.style.display='block'; setTimeout(()=>el.style.display='none',4000); }
function load(){
  // Load from BOTH ceoBookingsProgress AND bookings (so CEO sees ALL even if progress node empty)
  db.ref('bookings').on('value', snapBookings=>{
    const bookingsList=[];
    if(snapBookings.exists()){
      snapBookings.forEach(ch=>{
        const v=ch.val();
        v.id=ch.key;
        bookingsList.push(v);
      });
    }
    window._bookingsAll=bookingsList;
    combineAndRender();
  });
  db.ref('ceoBookingsProgress').on('value', snap=>{

    const arr=[]; if(snap.exists()){ snap.forEach(ch=>{ arr.push({...ch.val(), id:ch.key}); }); }
    // Also check bookings with rejected status that CEO hasn't seen
    db.ref('bookings').once('value').then(bSnap=>{
      if(bSnap.exists()){
        bSnap.forEach(ch=>{
          const v=ch.val(); const st=(v.status||'').toLowerCase();
          if(st.includes('rejected')){
            const exists=arr.find(a=>a.id===ch.key||a.bookingId===(v.bookingId||ch.key));
            if(!exists){
              arr.push({...v, id:ch.key, bookingId:v.bookingId||ch.key, status:'rejected', type:'rejected', rejectedBy:'nurse', time:v.rejectedAt||v.time});
            }
          }
        });
      }
      all=arr.sort((a,b)=>(b.time||b.createdAt||0)-(a.time||a.createdAt||0));
      render();
    });
  });
}
function render(){
  const area=document.getElementById('list');
  let filtered=all;
  if(filter==='rejected') filtered=all.filter(b=>(b.status||'').toLowerCase().includes('rejected'));
  if(filter==='accepted') filtered=all.filter(b=>(b.status||'').toLowerCase().includes('accepted'));
  if(filtered.length===0){ area.innerHTML='<div class="card">No bookings - When nurse rejects, shows here - CEO sees then clears - Auto delete from client and nurse</div>'; return; }
  area.innerHTML=filtered.map(b=>{
    const st=(b.status||'').toLowerCase();
    const isRejected=st.includes('rejected');
    return `<div class="card" style="border-left:3px solid ${isRejected?'#ef4444':'#22c55e'}">
      <div style="display:flex;justify-content:space-between"><b>Booking ID ${b.bookingId||b.id}</b><span class="badge ${isRejected?'badge-rejected':'badge-accepted'}">${(b.status||'').toUpperCase()} - ${isRejected?'Nurse rejected':'Accepted'}</span></div>
      <div style="margin-top:8px;font-size:11px">
        Client: ${b.clientName||''} - ${b.clientPhone||''}<br>
        Nurse: ${b.nurseName||''} - ${b.nursePhone||''}<br>
        Amount: GHS ${b.amount||''} - 80% Nurse: GHS ${b.nurse80||Math.round((b.amount||20)*0.8)} - 20% CEO: GHS ${b.ceo20||Math.round((b.amount||20)*0.2)}<br>
        Rejected At: ${b.rejectedAtStr||new Date(b.rejectedAt||b.time||Date.now()).toLocaleString('en-GH')}<br>
        ${isRejected?`<span style="color:#fca5a5">Client was told: Nurse ${b.nurseName||''} has rejected your offer - Please book another nurse or increase your payment rate - Booking ID: ${b.bookingId||b.id}</span>`:''}
      </div>
      <div style="margin-top:12px;display:flex;gap:6px">
        ${isRejected?`<button class="btn btnRed" onclick="clearRejected('${b.id}','${b.bookingId||b.id}')">CEO Seen Rejected - Clear All - Delete from client and nurse</button>`:`<button class="btn btnGray" onclick="clearAny('${b.id}')">Clear</button>`}
        <button class="btn btnGray" onclick="viewRaw('${b.id}')">View Raw</button>
      </div>
    </div>`;
  }).join('');
}
async function clearRejected(id, bookingId){
  if(!confirm('CEO seen rejected booking '+bookingId+'? This will delete it all from client and nurse active lists - After CEO sees that booking ID '+bookingId+' is rejected by nurse')) return;
  const now=Date.now();
  // 1. Remove from ceoBookingsProgress
  await db.ref('ceoBookingsProgress/'+id).remove().catch(()=>{});
  await db.ref('ceoBookingsProgress/'+bookingId).remove().catch(()=>{});
  // 2. Remove from bookings - so it disappears from my-bookings and my-job-offer
  // But first save to history as rejected_cleared
  try{
    const snap=await db.ref('bookings/'+id).once('value');
    if(snap.exists()){
      const v=snap.val();
      const clientKey=(v.clientPhone||'').replace(/[^0-9]/g,'').slice(-9)||v.clientId;
      const nurseKey=v.nurseId||v.nursePhone;
      if(clientKey){
        await db.ref('clientBookingHistory/'+clientKey+'/'+id).set({...v, status:'rejected_cleared_by_ceo', clearedAt:now, clearedAtStr:new Date().toLocaleString('en-GH')});
        await db.ref('clientAlerts/'+clientKey+'/REJECTED_CLEARED-'+id+'-'+now).set({type:'rejected_cleared',title:'Rejected booking cleared',message:`Booking ID ${bookingId} rejected by nurse has been cleared by CEO - Please book another nurse or increase payment - Booking ID: ${bookingId}`,bookingId:bookingId,time:now,read:false});
      }
      if(nurseKey){
        await db.ref('nurseBookingHistory/'+nurseKey+'/'+id).set({...v, status:'rejected_cleared_by_ceo', clearedAt:now});
      }
    }
  }catch(e){ console.log(e); }
  // 3. Delete from bookings - this auto removes from client and nurse
  await db.ref('bookings/'+id).remove().catch(async()=>{
    // Try by bookingId
    const snap=await db.ref('bookings').orderByChild('bookingId').equalTo(bookingId).once('value');
    if(snap.exists()){
      snap.forEach(ch=>{ db.ref('bookings/'+ch.key).remove(); });
    }
  });
  await db.ref('bookings/'+bookingId).remove().catch(()=>{});
  toast('CEO cleared rejected '+bookingId+' - Deleted from client and nurse - Client told to book another or increase payment');
  load();
}
async function clearAny(id){ if(!confirm('Clear '+id+'?')) return; await db.ref('ceoBookingsProgress/'+id).remove(); toast('Cleared'); }
function viewRaw(id){ const b=all.find(x=>x.id===id); alert(JSON.stringify(b,null,2)); }
window.onload=()=>{ load(); };
<script>
// CEO: Ring for new booking + new payment
try {
  if (window.db || window.firebase) {
    const db = window.db || firebase.firestore();
    
    // 1. New Booking
    db.collection('bookings').onSnapshot((snap) => {
      snap.docChanges().forEach((change) => {
        if (change.type === 'added') {
          playLoveCareAlert('new_booking');
          if (Notification.permission === 'granted') {
            new Notification('💰 CEO: New Booking!', {
              body: 'New booking don enter! Check dashboard.',
              icon: '/icon-192.png'
            });
          }
        }
        if (change.type === 'modified') {
          const data = change.doc.data();
          if (data.status === 'paid' || data.paymentStatus === 'paid') {
            playLoveCareAlert('paid');
            if (Notification.permission === 'granted') {
              new Notification('💰 CEO: Payment Don Come!', {
                body: 'Client don pay! Check am.',
                icon: '/icon-192.png'
              });
            }
          }
        }
      });
    });
  }
} catch(e) { console.log('CEO listener:', e); }
</script>
</body></html>
