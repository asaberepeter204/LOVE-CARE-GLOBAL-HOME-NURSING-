<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEO Bookings Progress - LoveCare Global</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#0c0a1e;--card:#1a1633;--line:rgba(255,255,255,.08);--text:#ece8ff;--muted:#9a95b8;--gold:#facc15;--green:#22c55e;--red:#ef4444;--orange:#f59e0b;--purple:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Instrument Sans,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:rgba(12,10,30,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.brand{font-family:Fraunces,serif;font-weight:800;font-size:18px}
.badge{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:11px;font-weight:700}
.tabs{display:flex;gap:8px;padding:12px 18px;overflow-x:auto;background:rgba(26,22,51,.5);border-bottom:1px solid var(--line)}
.tab{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab.active{background:var(--gold);color:#000}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:14px 18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.list{padding:0 18px 100px;display:flex;flex-direction:column;gap:12px}
.bookingCard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.statusBadge{padding:4px 10px;border-radius:999px;font-size:10px;font-weight:800;display:inline-block}
.btn{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;gap:6px}
.btnGold{background:var(--gold);color:#000;border:0}
.toast{position:fixed;right:16px;bottom:20px;z-index:100;background:#1e1a38;border:1px solid var(--line);padding:12px 16px;border-radius:12px;font-size:12px;display:none}
</style></head><body>
<div class="top"><div><div class="brand">CEO Bookings Progress - All Live Bookings</div><small style="color:var(--muted);font-size:10px">Real-time: Pending, Accepted, On the way, Close, Completed, Rejected</small></div><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="badge" id="totalBadge">0 Total</span><a href="ceo-dashboard.html" class="badge" style="text-decoration:none;color:var(--text)">CEO Dashboard</a><a href="ceo-notification-room.html" class="badge" style="text-decoration:none;background:rgba(167,139,250,.15);color:#c4b5fd">Notification Room</a><button class="badge" onclick="location.reload()">Refresh</button></div></div>
<div class="tabs"><button class="tab active" onclick="filterStatus('all')" id="tab-all">All (<span id="c-all">0</span>)</button><button class="tab" onclick="filterStatus('pending')" id="tab-pending">Pending (<span id="c-pending">0</span>)</button><button class="tab" onclick="filterStatus('accepted')" id="tab-accepted">Accepted (<span id="c-accepted">0</span>)</button><button class="tab" onclick="filterStatus('on_the_way')" id="tab-on_the_way">On The Way (<span id="c-on_the_way">0</span>)</button><button class="tab" onclick="filterStatus('close')" id="tab-close">Close (<span id="c-close">0</span>)</button><button class="tab" onclick="filterStatus('completed')" id="tab-completed">Completed (<span id="c-completed">0</span>)</button><button class="tab" onclick="filterStatus('client_confirmed')" id="tab-client_confirmed">Client Confirmed (<span id="c-client_confirmed">0</span>)</button><button class="tab" onclick="filterStatus('rejected')" id="tab-rejected">Rejected (<span id="c-rejected">0</span>)</button></div>
<div class="stats"><div class="stat"><small>Pending</small><b id="s-pending">0</b><small id="s-pending-amount">GHS 0</small></div><div class="stat"><small>Accepted</small><b id="s-accepted">0</b><small id="s-accepted-amount">GHS 0</small></div><div class="stat"><small>Completed</small><b id="s-completed">0</b><small id="s-completed-amount">GHS 0</small></div><div class="stat"><small>Total Revenue</small><b id="s-revenue">GHS 0</b><small>All bookings</small></div><div class="stat"><small>Active Nurses</small><b id="s-nurses">0</b><small>On jobs</small></div><div class="stat"><small>Today</small><b id="s-today">0</b><small>Bookings today</small></div></div>
<div id="bookingsList" class="list"><div style="text-align:center;padding:40px;color:var(--muted)">Loading all bookings...</div></div>
<div id="toast" class="toast"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
let allBookings=[]; let currentFilter='all';
function toastM(m){const e=document.getElementById('toast'); e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',3000);}
function filterStatus(s){currentFilter=s; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.getElementById('tab-'+s)?.classList.add('active'); render();}
function loadAll(){['bookings','ceoBookings','allBookings'].forEach(path=>{db.ref(path).on('value', snap=>{if(!snap.exists()) return; snap.forEach(ch=>{const v=ch.val(); const id=ch.key; if(id==='LCG-20251016-ABC123') return; if(!allBookings.find(b=>b.id===id)){allBookings.push({...v,id,bookingId:v.bookingId||id});} else {const idx=allBookings.findIndex(b=>b.id===id); allBookings[idx]={...allBookings[idx],...v,id};}}); updateCounts(); render();});});}
function updateCounts(){const counts={all:allBookings.length,pending:0,accepted:0,on_the_way:0,close:0,completed:0,client_confirmed:0,rejected:0}; let revenue=0,pendingAmt=0,acceptedAmt=0,completedAmt=0,todayCount=0; const todayStr=new Date().toDateString(); allBookings.forEach(b=>{const s=(b.status||'pending').toLowerCase(); const amt=parseFloat(b.amount||0); revenue+=amt; if(s.includes('pending')){counts.pending++; pendingAmt+=amt;} else if(s==='accepted'||s.includes('on_the_way')||s.includes('close')){if(s.includes('on_the_way')) counts.on_the_way++; else if(s.includes('close')) counts.close++; else counts.accepted++; acceptedAmt+=amt;} else if(s.includes('completed')||s==='finished'){counts.completed++; completedAmt+=amt;} else if(s.includes('client_confirmed')){counts.client_confirmed++; completedAmt+=amt;} else if(s.includes('rejected')){counts.rejected++;} const bDate=new Date(b.time||b.createdAt||Date.now()).toDateString(); if(bDate===todayStr) todayCount++;}); document.getElementById('c-all').textContent=counts.all; document.getElementById('c-pending').textContent=counts.pending; document.getElementById('c-accepted').textContent=counts.accepted; document.getElementById('c-on_the_way').textContent=counts.on_the_way; document.getElementById('c-close').textContent=counts.close; document.getElementById('c-completed').textContent=counts.completed+counts.client_confirmed; document.getElementById('c-client_confirmed').textContent=counts.client_confirmed; document.getElementById('c-rejected').textContent=counts.rejected; document.getElementById('s-pending').textContent=counts.pending; document.getElementById('s-accepted').textContent=counts.accepted+counts.on_the_way+counts.close; document.getElementById('s-completed').textContent=counts.completed+counts.client_confirmed; document.getElementById('s-revenue').textContent='GHS '+revenue.toFixed(2); document.getElementById('s-pending-amount').textContent='GHS '+pendingAmt.toFixed(2); document.getElementById('s-accepted-amount').textContent='GHS '+acceptedAmt.toFixed(2); document.getElementById('s-completed-amount').textContent='GHS '+completedAmt.toFixed(2); document.getElementById('s-today').textContent=todayCount; document.getElementById('totalBadge').textContent=counts.all+' Total'; const unique=new Set(allBookings.filter(b=>{const s=(b.status||'').toLowerCase(); return s==='accepted'||s.includes('on_the_way')||s.includes('close');}).map(b=>b.nurseId)); document.getElementById('s-nurses').textContent=unique.size;}
function render(){const list=document.getElementById('bookingsList'); let filtered=allBookings; if(currentFilter!=='all'){if(currentFilter==='completed'){filtered=allBookings.filter(b=>{const s=(b.status||'').toLowerCase(); return s.includes('completed')||s.includes('finished')||s.includes('client_confirmed');});} else if(currentFilter==='client_confirmed'){filtered=allBookings.filter(b=> (b.status||'').toLowerCase().includes('client_confirmed'));} else {filtered=allBookings.filter(b=> (b.status||'').toLowerCase()===currentFilter || (b.status||'').toLowerCase().includes(currentFilter));}} filtered.sort((a,b)=>(b.time||0)-(a.time||0)); if(filtered.length===0){list.innerHTML=`<div style="text-align:center;padding:40px;color:var(--muted)">No ${currentFilter} bookings</div>`; return;} list.innerHTML=filtered.slice(0,100).map(b=>{const s=(b.status||'').toLowerCase(); let badgeClass='pending', statusText=s.toUpperCase(), cardClass='pending'; if(s==='accepted'){badgeClass='accepted'; statusText='ACCEPTED'; cardClass='accepted';} else if(s.includes('on_the_way')){badgeClass='accepted'; statusText='ON THE WAY';} else if(s.includes('close')){badgeClass='accepted'; statusText='CLOSE';} else if(s.includes('completed')||s==='finished'){badgeClass='completed'; statusText='COMPLETED'; cardClass='completed';} else if(s.includes('client_confirmed')){badgeClass='completed'; statusText='CLIENT CONFIRMED - WORK COMPLETED'; cardClass='confirmed';} else if(s.includes('rejected')){badgeClass='rejected'; statusText='REJECTED';} else if(s.includes('cancelled')){badgeClass='rejected'; statusText='CANCELLED';} const timeStr=b.time?new Date(b.time).toLocaleString('en-GH'):(b.createdAt?new Date(b.createdAt).toLocaleString('en-GH'):''); const completedAt=b.clientConfirmedAt?new Date(b.clientConfirmedAt).toLocaleString('en-GH'):(b.completedAt?new Date(b.completedAt).toLocaleString('en-GH'):''); const bookingId=b.bookingId||b.id||'Unknown'; return `<div class="bookingCard ${cardClass}" style="border-left:4px solid ${s.includes('client_confirmed')?'#22c55e':s==='accepted'?'#22c55e':s.includes('rejected')?'#ef4444':'#f59e0b'}"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b style="font-size:14px">Booking: ${bookingId}</b><br><span class="statusBadge" style="margin-top:6px;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:800;background:${s.includes('client_confirmed')?'#22c55e;color:#fff':s==='accepted'?'rgba(34,197,94,.15);color:#86efac':'rgba(245,158,11,.15);color:#fde68a'}">${statusText}</span><div style="margin-top:8px;font-size:12px"><div>Nurse: <b>${b.nurseName||'Unknown'}</b></div><div>Client: <b>${b.clientName||'Client'}</b></div><div>Location: ${b.patientLocation||'N/A'}</div><div>Amount: <b>${b.currency||'GHS'} ${b.amount||0}</b></div><div>Booked: ${timeStr}</div>${completedAt?`<div style="background:rgba(34,197,94,.15);padding:6px 10px;border-radius:8px;margin-top:6px">Work Completed: <b>${completedAt}</b></div>`:''}</div></div><div style="display:flex;flex-direction:column;gap:6px"><span class="badge">ID: ${bookingId.slice(-8)}</span></div></div><div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap"><button class="btn" onclick="viewDetails('${b.id}')">View Details</button><button class="btn btnGold" onclick="trackNurse('${b.nurseId||''}','${b.id}')">Track Nurse</button></div></div>`;}).join('');}
function viewDetails(id){const b=allBookings.find(x=>x.id===id); if(!b){toastM('Not found'); return;} alert(`Booking Details:
ID: ${b.bookingId||b.id}
Status: ${b.status}
Nurse: ${b.nurseName}
Client: ${b.clientName}
Amount: ${b.currency||'GHS'} ${b.amount}
Time: ${new Date(b.time||b.createdAt).toLocaleString('en-GH')}
Completed: ${b.clientConfirmedAt?new Date(b.clientConfirmedAt).toLocaleString('en-GH'):'Not yet'}`);}
function trackNurse(nurseId, bookingId){if(!nurseId){toastM('No nurse ID'); return;} window.open(`ceo-live-tracking-map.html?nurseId=${nurseId}&bookingId=${bookingId}`, '_blank');}
window.onload=()=>{loadAll();};
</script></body></html>
