<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nurse Dashboard Final</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getStorage, ref as sRef, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
import { getDatabase, ref as dbRef, get, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const cfg={apiKey:"AIzaSyYOUR_API_KEY",authDomain:"love-care-global.firebaseapp.com",databaseURL:"https://love-care-global-default-rtdb.firebaseio.com",projectId:"love-care-global",storageBucket:"love-care-global.appspot.com",messagingSenderId:"123",appId:"1:123:web:abc"};
const app=initializeApp(cfg); const storage=getStorage(app); const db=getDatabase(app); const fs=getFirestore(app);
const nurseId=localStorage.getItem('currentNurseId'); if(!nurseId) location.href='nurse-login.html';

window.tab=function(t){ document.querySelectorAll('.sec').forEach(s=>s.style.display='none'); document.getElementById('sec_'+t).style.display='block'; document.querySelectorAll('.tBtn').forEach(b=>b.classList.remove('active')); document.getElementById('t_'+t).classList.add('active'); }

window.load=async function(){
 let snap=await get(dbRef(db,`verified_nurses/${nurseId}`)); let d=snap.val()||{}; if(!Object.keys(d).length){ let fd=await getDoc(doc(fs,'verified_nurses',nurseId)); if(fd.exists()) d=fd.data(); }
 document.getElementById('p_name').value=d.fullName||''; document.getElementById('p_city').value=d.city||''; document.getElementById('p_bio').value=d.publicBio||''; document.getElementById('p_avail').value=d.availability||'Available';
 document.getElementById('s_email').value=d.email||''; document.getElementById('s_phone').value=d.phone||''; document.getElementById('s_id').innerText=nurseId;
 document.getElementById('w_momo').value=d.momoNumber||''; document.getElementById('w_debit').value=d.debitLast4||''; document.getElementById('w_virtual').value=d.virtualNumber||''; document.getElementById('w_paypal').value=d.paypalEmail||''; document.getElementById('w_provider').value=d.virtualProvider||'Grey';
 let rs=await get(dbRef(db,`nurse_ratings/${nurseId}`)); let vals=Object.values(rs.val()||{}); let avg=vals.length?(vals.reduce((a,b)=>a+(b.stars||0),0)/vals.length).toFixed(1):'0.0'; document.getElementById('stars').innerText='★'.repeat(Math.round(avg))+'☆'.repeat(5-Math.round(avg)); document.getElementById('avg').innerText=`⭐ ${avg}/5 (${vals.length}) - Cannot edit`;
 loadBookings();
}

function loadBookings(){
 onValue(dbRef(db,'bookings'),(snap)=>{
  let data=snap.val()||{}; let cur=''; let hist='';
  for(let id in data){ let b=data[id]; if(b.nurseId!==nurseId) continue;
   let mapLink=b.clientLat?`https://www.google.com/maps/dir/?api=1&destination=${b.clientLat},${b.clientLng}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.clientAddress||'')}`;
   let html=`<div class="card"><b>${b.serviceType||'Care'} - ${b.clientName||'Client'}</b><div class="s">${b.date||''} ${b.time||''}<br>${b.clientAddress||''}<br>${b.clientPhone||''} - <span class="badge ${b.status}">${b.status}</span></div>`;
   if(b.status==='PENDING'){ html+=`<button class="btn green" onclick="accept('${id}','${b.clientLat||''}','${b.clientLng||''}')">Accept</button><button class="btn orange" onclick="reject('${id}')">Reject</button>`; cur+=html+`</div>`; }
   else if(b.status==='ACCEPTED'){ html+=`<a href="${mapLink}" target="_blank" class="btn green" style="display:block;text-align:center;text-decoration:none">📍 Map Directions</a><button class="btn light" onclick="complete('${id}')">Complete</button>`; cur+=html+`</div>`; }
   else{ hist+=html+`</div>`; }
  }
  document.getElementById('cur').innerHTML=cur||'<div class="card s">No current bookings</div>'; document.getElementById('his').innerHTML=hist||'<div class="card s">No history</div>';
 });
}

window.accept=async function(id,lat,lng){
 let snap=await get(dbRef(db,`bookings/${id}`)); let b=snap.val(); await update(dbRef(db,`bookings/${id}`),{status:'ACCEPTED',acceptedAt:new Date().toISOString()}); await setDoc(doc(fs,'bookings',id),{status:'ACCEPTED',acceptedAt:serverTimestamp()},{merge:true});
 await set(dbRef(db,`client_notifications/${b.clientId}/${id}`),{type:'ACCEPTED',bookingId:id,nurseId,message:'Nurse accepted - On way',timestamp:new Date().toISOString()});
 let link=lat?`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.clientAddress||'')}`; window.open(link,'_blank');
}
window.reject=async function(id){
 let snap=await get(dbRef(db,`bookings/${id}`)); let b=snap.val(); await update(dbRef(db,`bookings/${id}`),{status:'REJECTED',rejectedAt:new Date().toISOString(),availableForOthers:true}); await setDoc(doc(fs,'bookings',id),{status:'REJECTED'},{merge:true});
 await set(dbRef(db,`client_notifications/${b.clientId}/${id}`),{type:'REJECTED',bookingId:id,message:'Nurse rejected - Find another nurse',action:'FIND_ANOTHER',timestamp:new Date().toISOString()}); await set(dbRef(db,`rejected_bookings/${id}`),{...b,status:'REJECTED',availableForOthers:true});
}
window.complete=async function(id){ await update(dbRef(db,`bookings/${id}`),{status:'COMPLETED'}); await setDoc(doc(fs,'bookings',id),{status:'COMPLETED'},{merge:true}); }

window.upload=function(f,p){return new Promise((res,rej)=>{const r=sRef(storage,p);const t=uploadBytesResumable(r,f);t.on('state_changed',null,e=>rej(e),async()=>{res({url:await getDownloadURL(t.snapshot.ref)});});});}
window.savePublic=async function(){ let snap=await get(dbRef(db,`verified_nurses/${nurseId}`)); let d=snap.val()||{}; let photo=d.publicPhoto||null; let file=document.getElementById('p_photo').files[0]; if(file) photo=await upload(file,`nurses/${nurseId}/public/photo_${Date.now()}`); let upd={...d,fullName:document.getElementById('p_name').value,city:document.getElementById('p_city').value,publicBio:document.getElementById('p_bio').value,availability:document.getElementById('p_avail').value,publicPhoto:photo,publicUpdatedAt:new Date().toISOString()}; await set(dbRef(db,`verified_nurses/${nurseId}`),upd); await set(dbRef(db,`nurse_public/${nurseId}`),upd); await set(dbRef(db,`nurse_registrations/${nurseId}`),upd); await setDoc(doc(fs,'verified_nurses',nurseId),upd,{merge:true}); document.getElementById('btnP').innerText='Saved - CEO sees'; setTimeout(()=>document.getElementById('btnP').innerText='Save Public',1000); }
window.saveWithdrawal=async function(){ let snap=await get(dbRef(db,`verified_nurses/${nurseId}`)); let d=snap.val()||{}; let upd={...d,momoNumber:document.getElementById('w_momo').value,debitLast4:document.getElementById('w_debit').value,virtualNumber:document.getElementById('w_virtual').value,virtualProvider:document.getElementById('w_provider').value,paypalEmail:document.getElementById('w_paypal').value}; await set(dbRef(db,`verified_nurses/${nurseId}`),upd); await set(dbRef(db,`withdrawal_methods/${nurseId}`),upd); await setDoc(doc(fs,'verified_nurses',nurseId),upd,{merge:true}); await setDoc(doc(fs,'withdrawal_methods',nurseId),upd,{merge:true}); document.getElementById('btnW').innerText='Saved - CEO sees'; setTimeout(()=>document.getElementById('btnW').innerText='Save Withdrawal',1000); }
window.saveSettings=async function(){ let snap=await get(dbRef(db,`verified_nurses/${nurseId}`)); let d=snap.val()||{}; let newEmail=document.getElementById('s_email').value.trim().toLowerCase(); if(newEmail) d.email=newEmail; d.phone=document.getElementById('s_phone').value; let oldP=document.getElementById('s_old').value; let newP=document.getElementById('s_new').value; let conf=document.getElementById('s_conf').value; if(oldP&&newP&&newP===conf&&newP.length>=6){ if(!d.password||d.password===oldP) d.password=newP; } await set(dbRef(db,`verified_nurses/${nurseId}`),d); await setDoc(doc(fs,'verified_nurses',nurseId),d,{merge:true}); if(newEmail) localStorage.setItem('currentNurseEmail',newEmail); alert('Saved - Reflects to CEO'); }

window.addEventListener('DOMContentLoaded',()=>{load(); tab('bookings');});
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#f8fafc}
.h{padding:12px;background:#16a34a;color:white;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
.c{max-width:700px;margin:auto;padding:10px;padding-bottom:90px}
.card{background:white;border-radius:10px;padding:12px;border:1px solid #e5e7eb;margin-bottom:8px}
label{font-size:11px;font-weight:700;margin:6px 0 3px;display:block}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #d1d5db;font-size:12px}
.btn{width:100%;padding:11px;border-radius:8px;font-weight:800;border:none;cursor:pointer;margin-top:6px}
.green{background:#16a34a;color:white}.orange{background:#f97316;color:white}.light{background:#f3f4f6;border:1px solid #e5e7eb}
.s{font-size:11px;color:#6b7280;margin-top:2px}.stars{font-size:18px;color:#f59e0b}
.badge{padding:2px 6px;border-radius:999px;font-size:10px;font-weight:900}.PENDING{background:#fef3c7}.ACCEPTED{background:#dcfce7}.REJECTED{background:#fee2e2}.COMPLETED{background:#dbeafe}
.tabs{position:fixed;bottom:0;left:0;width:100%;background:white;border-top:1px solid #e5e7eb;display:flex;padding:6px;gap:4px}
.tBtn{flex:1;padding:9px 2px;border-radius:8px;border:1px solid #e5e7eb;background:#f9fafb;font-weight:800;font-size:10px}.tBtn.active{background:#16a34a;color:white}
.sec{display:none}
</style>
</head>
<body>
<div class="h"><b>Nurse Dashboard</b><button style="background:white;color:#16a34a;border:none;padding:6px 12px;border-radius:8px;font-weight:800" onclick="localStorage.clear();location.href='nurse-login.html'">Logout</button></div>
<div class="c">

<div id="sec_bookings" class="sec">
<div class="card"><b>Current Receiving Bookings</b><div class="s">Accept -> Auto Google Map to client / Reject -> Client finds another nurse</div></div>
<div id="cur">Loading...</div>
<div class="card" style="margin-top:10px"><b>History</b></div>
<div id="his">Loading...</div>
</div>

<div id="sec_public" class="sec">
<div class="card"><label>Name</label><input id="p_name"><label>City</label><input id="p_city"><label>Bio - Editable to win bookings</label><textarea id="p_bio" rows="3"></textarea><label>Availability</label><select id="p_avail"><option>Available</option><option>Busy</option><option>Morning Only</option><option>Night Only</option></select><label>Photo</label><input type="file" id="p_photo"></div>
<div class="card" style="background:#fefce8"><div class="stars" id="stars"></div><div class="s" id="avg"></div><div class="s">Cannot edit - Exact from clients</div></div>
<button class="btn green" id="btnP" onclick="savePublic()">Save Public</button>
</div>

<div id="sec_withdrawal" class="sec">
<div class="card"><b>Withdrawal - 85%</b><div class="s">Momo / Debit last4 / Virtual Grey/Geegpay/Wise / PayPal</div></div>
<div class="card"><label>Momo / Vodafone</label><input id="w_momo"><label>Debit Last4</label><input id="w_debit" maxlength="4"><label>Virtual Provider</label><select id="w_provider"><option>Grey</option><option>Geegpay</option><option>Wise</option></select><label>Virtual Number</label><input id="w_virtual"><label>PayPal Email</label><input id="w_paypal"></div>
<button class="btn green" id="btnW" onclick="saveWithdrawal()">Save Withdrawal</button>
</div>

<div id="sec_settings" class="sec">
<div class="card"><div class="s">ID: <span id="s_id"></span> - Cannot change ID</div></div>
<div class="card"><label>Email</label><input id="s_email" type="email"><label>Phone</label><input id="s_phone"><label>Old Password</label><input type="password" id="s_old"><label>New Password</label><input type="password" id="s_new"><label>Confirm</label><input type="password" id="s_conf"><button class="btn green" onclick="saveSettings()">Save Settings</button></div>
</div>

</div>

<div class="tabs">
<button class="tBtn active" id="t_bookings" onclick="tab('bookings')">Bookings</button>
<button class="tBtn" id="t_public" onclick="tab('public')">Public</button>
<button class="tBtn" id="t_withdrawal" onclick="tab('withdrawal')">Withdrawal</button>
<button class="tBtn" id="t_settings" onclick="tab('settings')">Settings</button>
</div>

</body>
</html>
