<!DOCTYPE html><html lang="en"><head><script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0e0a1c;color:#e8e0ff;min-height:100vh;padding-bottom:90px}
.card{background:rgba(28,18,56,.92);border:1px solid rgba(168,85,247,.15);border-radius:20px;padding:16px;margin:12px 14px}
.badge{padding:4px 10px;border-radius:999px;font-size:10px;font-weight:900;display:inline-block}
.badge-pending{background:rgba(245,158,11,.15);color:#fde68a;border:1px solid rgba(245,158,11,.3)}
.badge-accepted{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.35)}
.badge-rejected{background:rgba(239,68,68,.2);color:#fca5a5;border:1px solid rgba(239,68,68,.4)}
.badge-ontheway{background:rgba(37,99,235,.15);color:#93c5fd;border:1px solid rgba(37,99,235,.3)}
.badge-close{background:rgba(168,85,247,.15);color:#d8b4fe;border:1px solid rgba(168,85,247,.3)}
.badge-completed{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff}
.btn{border:none;border-radius:14px;padding:12px;font-weight:800;cursor:pointer;font-size:11px;min-height:44px;flex:1}
.btnGreen{background:linear-gradient(135deg,#22c55e,#16a34a);color:white}
.btnBlue{background:linear-gradient(135deg,#2563eb,#60a5fa);color:white}
.btnRed{background:linear-gradient(135deg,#ef4444,#dc2626);color:white}
.btnYellow{background:linear-gradient(135deg,#facc15,#eab308);color:#000}
.btnGray{background:rgba(255,255,255,.07);border:1px solid rgba(168,85,247,.18);color:#d8b4fe}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modalBox{background:#1c1238;border:1px solid rgba(168,85,247,.25);border-radius:20px;padding:20px;max-width:400px;width:100%;max-height:80vh;overflow:auto}
.histId{padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(168,85,247,.15);margin-bottom:8px;cursor:pointer;font-size:12px;font-weight:700}
.rejectedBox{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:16px;padding:12px;margin-top:10px}
</style>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head><body>
<div style="padding:12px 16px;display:flex;justify-content:space-between;background:rgba(14,10,28,.98);border-bottom:1px solid rgba(168,85,247,.12)"><b>My Bookings - REJECTED FLOW FIXED</b><a href="alerts.html" style="padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(168,85,247,.18);color:#d8b4fe;font-size:11px;text-decoration:none">Alerts</a></div>
<div style="max-width:800px;margin:0 auto;padding:10px">
<div id="info" class="card" style="background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);font-size:11px;display:none"></div>
<div id="bookingsList" style="display:grid;gap:12px"></div>
<div id="emptyBookings" class="card" style="display:none;text-align:center;padding:30px"><b>No active bookings</b><br><small>If client booked someone, shows as Pending - If rejected, shows with message to book another or increase payment</small></div>
<div class="card"><b>History - Only Booking ID Shows - Click ID for Details</b><div id="historyList" style="margin-top:10px"><small>No history yet</small></div></div>
</div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal" onclick="if(event.target===this) closeModal()"><div class="modalBox"><div style="display:flex;justify-content:space-between"><b id="modalTitle">Details</b><button class="btn btnGray" style="flex:none;padding:6px 10px" onclick="closeModal()">Close</button></div><div id="modalBody" style="margin-top:12px;font-size:12px;line-height:1.6"></div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
let all=[], clientUid='', clientPhone='', clientUsername='', clientName='', historyData=[], monitorIntervals={}, prev={}, nursePhotoCache={};
function toast(m){const el=document.getElementById('toast'); el.textContent=m; el.style.display='block'; setTimeout(()=>el.style.display='none',5000);}
function getKeys(){
  clientUid=localStorage.getItem('lcg_client_uid')||localStorage.getItem('clientUid')||localStorage.getItem('uid')||localStorage.getItem('clientId')||'';
  clientPhone=localStorage.getItem('clientPhone')||localStorage.getItem('phone')||localStorage.getItem('clientPhoneNumber')||'';
  clientUsername=localStorage.getItem('clientUsername')||localStorage.getItem('username')||localStorage.getItem('clientUserName')||'';
  clientName=localStorage.getItem('clientName')||localStorage.getItem('name')||'Client';
  const info=document.getElementById('info'); info.style.display='block';
  info.innerHTML='Client: '+clientName+' - Phone: '+(clientPhone||'No phone')+' - Username: '+(clientUsername||'No username')+' - UID: '+(clientUid||'No UID')+' - Matched by phone 9-digit + username';
}
function haversine(lat1,lon1,lat2,lon2){ const R=6371; const dLat=(lat2-lat1)*Math.PI/180; const dLon=(lon2-lon1)*Math.PI/180; const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2); return 2*R*Math.asin(Math.sqrt(a)); }
async function fetchNursePhoto(nurseId, nursePhone, nurseEmail){
  const cacheKey=nurseId||nursePhone||nurseEmail;
  if(nursePhotoCache[cacheKey]) return nursePhotoCache[cacheKey];
  try{
    if(nurseId){
      const snap=await db.ref('nurses/'+nurseId).once('value');
      if(snap.exists()){ const v=snap.val(); if(v.photoURL||v.nursePhoto||v.avatar||v.photo){ nursePhotoCache[cacheKey]=v.photoURL||v.nursePhoto||v.avatar||v.photo; return nursePhotoCache[cacheKey]; } }
      const snap2=await db.ref('nurseList/'+nurseId).once('value').catch(()=>null);
      if(snap2&&snap2.exists()){ const v=snap2.val(); if(v.photoURL||v.nursePhoto){ nursePhotoCache[cacheKey]=v.photoURL||v.nursePhoto; return nursePhotoCache[cacheKey]; } }
    }
    if(nursePhone){
      const phone9=nursePhone.replace(/[^0-9]/g,'').slice(-9);
      const snap=await db.ref('allowedNurses').once('value').catch(()=>null);
      if(snap&&snap.exists()){
        let found=''; snap.forEach(ch=>{ const v=ch.val(); const p=(v.phone||'').replace(/[^0-9]/g,'').slice(-9); if(p===phone9 && (v.photoURL||v.nursePhoto||v.avatar)){ found=v.photoURL||v.nursePhoto||v.avatar; } });
        if(found){ nursePhotoCache[cacheKey]=found; return found; }
      }
    }
  }catch(e){}
  return '';
}
async function fetchClientPhotoForBooking(clientId, clientPhone){
  try{
    if(clientId){ const s=await db.ref('clients/'+clientId).once('value').catch(()=>null); if(s&&s.exists()){ const v=s.val(); if(v.photoURL||v.clientPhoto) return v.photoURL||v.clientPhoto; } }
  }catch(e){}
  return localStorage.getItem('clientPhoto')||localStorage.getItem('photoURL')||'';
}
function loadBookings(){
  getKeys();
  db.ref('bookings').on('value', async snap=>{
    const list=[]; let total=0;
    if(snap.exists()){
      snap.forEach(ch=>{
        total++;
        const v=ch.val();
        const bPhone=(v.clientPhone||v.phone||'').replace(/[^0-9]/g,'');
        const myPhone=clientPhone.replace(/[^0-9]/g,'');
        const phoneMatch=bPhone&&myPhone&&bPhone.slice(-9)===myPhone.slice(-9);
        const usernameMatch=v.clientUsername&&clientUsername&&v.clientUsername.toLowerCase()===clientUsername.toLowerCase();
        const uidMatch=v.clientId&&clientUid&&v.clientId===clientUid;
        if(phoneMatch||usernameMatch||uidMatch||(!clientPhone&&!clientUsername&&!clientUid)){
          const st=(v.status||'pending').toLowerCase();
          if(!st.includes('client_confirmed_finished') && !st.includes('paid') && v.ceoPaid!==true){
            list.push({...v, id:ch.key, bookingId:v.bookingId||ch.key});
          }
        }
      });
    }
    for(const b of list){
      if(!b.nursePhoto){ b.nursePhoto = await fetchNursePhoto(b.nurseId, b.nursePhone, b.nurseEmail); }
      if(!b.clientPhoto){ b.clientPhoto = await fetchClientPhotoForBooking(b.clientId, b.clientPhone||b.phone); }
    }
    if(list.length===0 && total>0 && !clientPhone && !clientUsername && !clientUid){
      let debugList=[]; snap.forEach(ch=>{ const v=ch.val(); const st=(v.status||'pending').toLowerCase(); if(!st.includes('client_confirmed_finished') && !st.includes('paid')){ debugList.push({...v, id:ch.key, bookingId:v.bookingId||ch.key}); } }); debugList.sort((a,b)=>(b.time||0)-(a.time||0)); list.push(...debugList.slice(0,5));
      document.getElementById('info').innerHTML+='<br><span style="color:#facc15">No localStorage - Showing recent 5 bookings debug - Your booking should be here</span>';
    }
    list.sort((a,b)=>(b.time||b.createdAt||0)-(a.time||a.createdAt||0));
    all=list;
    render(list);
    list.forEach(b=>{ const st=(b.status||'').toLowerCase(); if(st.includes('rejected')){ checkIfCeoCleared(b); } });
    document.getElementById('info').innerHTML+='<br>Total DB: '+total+' - Matched: '+list.length;
  });
  const key=clientPhone.replace(/[^0-9]/g,'').slice(-9)||clientUid||clientUsername;
  if(key){
    db.ref('clientAlerts/'+key).on('child_added', snap=>{
      const v=snap.val(); if(!v) return; if((v.type||'').toLowerCase().includes('rejected')){
        toast(v.message||'Nurse rejected your offer - Book another nurse or increase payment - ID: '+v.bookingId);
        if(navigator.vibrate) navigator.vibrate([300,100,300]);
      }
    });
  }
}
function checkIfCeoCleared(booking){
  db.ref('ceoBookingsProgress/'+booking.id).on('value', snap=>{
    if(!snap.exists()){
      db.ref('bookings/'+booking.id).once('value').then(s=>{
        if(s.exists()){
          const v=s.val(); const st=(v.status||'').toLowerCase();
          if(st.includes('rejected')){
            const key=clientUid||clientPhone||clientUsername;
            if(key){
              db.ref('clientBookingHistory/'+key+'/'+booking.id).set({...v, status:'rejected_cleared_by_ceo', clearedAt:Date.now(), clearedAtStr:new Date().toLocaleString('en-GH')}).then(()=>{
                db.ref('bookings/'+booking.id).remove().catch(()=>{});
                toast('Booking '+ (v.bookingId||booking.id) +' rejected cleared by CEO - Removed');
              });
            }
          }
        }
      });
    }
  });
}
function render(list){
  const area=document.getElementById('bookingsList');
  const empty=document.getElementById('emptyBookings');
  if(list.length===0){ area.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  area.innerHTML=list.map(b=>{
    const st=(b.status||'pending').toLowerCase();
    let badge='badge-pending', text='PENDING - Waiting nurse accept'; let extra='';
    if(st.includes('rejected')){ badge='badge-rejected'; text='REJECTED by nurse - '+ (b.rejectedByNurseName||b.nurseName||'Nurse') +' rejected your offer'; extra=`<div class="rejectedBox"><b style="color:#fca5a5">Nurse ${b.rejectedByNurseName||b.nurseName||''} has rejected your offer</b><br><br>Please book another nurse or increase your payment rate to get accepted<br><br>Booking ID: ${b.bookingId||b.id}<br><small>After CEO sees that booking ID ${b.bookingId||b.id} is rejected, it will be deleted automatically from your list and nurse list</small><br><br><button class="btn btnYellow" onclick="bookAnother()">Book Another Nurse</button> <button class="btn btnBlue" onclick="increasePayment('${b.id}')">Increase Payment - Pay Rest via Paystack</button> <button class="btn btnGray" onclick="dismissRejected('${b.id}')">Dismiss</button></div>`; }
    else if(st.includes('accepted')){ badge='badge-accepted'; text='ACCEPTED - Auto nav'; }
    else if(st.includes('on_the_way')){ badge='badge-ontheway'; text='ON THE WAY'; }
    else if(st.includes('close')){ badge='badge-close'; text='CLOSE - Can call'; }
    else if(st.includes('completed')){ badge='badge-completed'; text='COMPLETED - Confirm to finish'; }
    const isCompleted=st.includes('completed');
    let nursePhoto = b.nursePhoto || b.nurseAvatar || b.nursePhotoURL || b.photoURL || '';
    let clientPhoto = b.clientPhoto || b.clientAvatar || localStorage.getItem('clientPhoto') || localStorage.getItem('photoURL') || '';
    return `<div class="card" style="border-left:3px solid ${st.includes('rejected')?'#ef4444':'#facc15'}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="display:flex;gap:10px;align-items:center">
          <div style="width:50px;height:50px;border-radius:50%;background:#2a1a4a;overflow:hidden;flex-shrink:0;border:2px solid #a78bfa;display:flex;align-items:center;justify-content:center">
            ${clientPhoto ? `<img src="${clientPhoto}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='<div style=font-weight:900;font-size:20px>${(b.clientName||clientName||'C').charAt(0).toUpperCase()}</div>'">` : `<div style="font-weight:900;font-size:20px">${(b.clientName||clientName||'C').charAt(0).toUpperCase()}</div>`}
          </div>
          <div>
            <div style="font-weight:900;font-size:14px;color:#fff">${b.clientName||clientName}</div>
            <div style="font-size:10px;color:#d8b4fe">${b.clientPhone||clientPhone} - Validated: This page is for only you</div>
          </div>
        </div>
        <span class="badge ${badge}">${text}</span>
      </div>
      <div style="margin-top:10px;font-size:11px;background:rgba(255,255,255,.04);padding:10px;border-radius:12px">
        <b>Booking ID ${b.bookingId||b.id}</b><br>
        Nurse Booked: ${b.nurseName||'Any nurse'} - ${b.nursePhone||''}<br>
        Service: ${b.serviceType||''}<br>
        Amount: ${b.currency||'GHS'} ${b.amount||''} - Location: ${b.location||''}
      </div>
      ${extra}
      <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
        ${isCompleted?`<button class="btn btnGreen" onclick="confirmDone('${b.id}')">Confirm Work Done</button>`:''}
        ${!st.includes('rejected')?`<button class="btn btnGray" onclick="showDetails('${b.id}')">Details</button>`:''}
        ${b.nursePhone&&!st.includes('rejected')?`<button class="btn btnBlue" onclick="window.open('tel:${b.nursePhone}')">Call Nurse</button>`:''}
        ${st.includes('accepted')||st.includes('on_the_way')||st.includes('close')?`<button class="btn btnBlue" onclick="openNav('${b.id}')">Navigate</button>`:''}
        ${st.includes('pending')?`<button class="btn btnRed" onclick="cancelBooking('${b.id}')">Cancel</button>`:''}
      </div>
    </div>`;
  }).join('');
}
function bookAnother(){ window.location.href='book-nurse.html'; }
// ✅ NEW - NO PROMPT, NO DIRECT AMOUNT CHANGE - GOES TO increase-payment.html
function increasePayment(id){ const b=all.find(x=>x.id===id); const bid=(b&&(b.bookingId||b.id))||id; window.location.href='increase-payment.html?id='+encodeURIComponent(id)+'&bookingId='+encodeURIComponent(bid)+'&v='+Date.now(); }
async function dismissRejected(id){ if(!confirm('Dismiss rejected booking '+id+'? It will be removed after CEO sees it')) return; const key=clientUid||clientPhone||clientUsername; if(key){ const b=all.find(x=>x.id===id); await db.ref('clientBookingHistory/'+key+'/'+id).set({...b, status:'rejected_dismissed_by_client', dismissedAt:Date.now()}); } await db.ref('bookings/'+id).update({dismissedByClient:true, dismissedAt:Date.now()}); toast('Dismissed - CEO will clear it'); }
function openNav(id){ const b=all.find(x=>x.id===id); if(!b) return; db.ref('nurseLocations/'+b.nurseId).once('value').then(s=>{ let nLat=5.6137,nLng=-0.1770; if(s.exists()){ const v=s.val(); nLat=v.lat||nLat; nLng=v.lng||nLng; } const cLat=b.clientLat||5.6037; const cLng=b.clientLng||-0.1870; window.open(`https://www.google.com/maps/dir/?api=1&origin=${nLat},${nLng}&destination=${cLat},${cLng}&travelmode=driving`,'_blank'); }); }
async function confirmDone(id){ const b=all.find(x=>x.id===id); if(!confirm(`Confirm work done for ${b.bookingId||id}?`)) return; const now=Date.now(); const nowStr=new Date().toLocaleString('en-GH'); const key=clientUid||clientPhone||clientUsername; await db.ref('clientBookingHistory/'+key+'/'+id).set({...b, status:'client_confirmed_finished', clientConfirmed:true, clientConfirmedAt:now, clientConfirmedAtStr:nowStr}); await db.ref('bookings/'+id).update({status:'client_confirmed_finished', clientConfirmed:true, clientConfirmedAt:now, clientConfirmedAtStr:nowStr}); setTimeout(()=>{ db.ref('bookings/'+id).remove().catch(()=>{}); toast('Confirmed - Moved to history ID only'); loadHistory(); }, 1000); }
async function cancelBooking(id){ if(!confirm('Cancel '+id+'?')) return; await db.ref('bookings/'+id).update({status:'cancelled_by_client', cancelledAt:Date.now()}); toast('Cancelled'); }
function showDetails(id){ const b=all.find(x=>x.id===id); document.getElementById('modalTitle').textContent='Booking ID '+(b.bookingId||b.id); document.getElementById('modalBody').innerHTML=`ID: ${b.bookingId||b.id}<br>Status: ${b.status}<br>Client: ${b.clientName}<br>Phone: ${b.clientPhone}<br>Nurse: ${b.nurseName}<br>Amount: ${b.currency||'GHS'} ${b.amount}<br>Location: ${b.location||''}<br>Time: ${new Date(b.time||Date.now()).toLocaleString('en-GH')}`; document.getElementById('modal').style.display='flex'; }
function closeModal(){ document.getElementById('modal').style.display='none'; }
function loadHistory(){ const key=clientUid||clientPhone||clientUsername; if(!key) return; db.ref('clientBookingHistory/'+key).on('value', snap=>{ const el=document.getElementById('historyList'); if(!snap.exists()){ el.innerHTML='<small>No history yet</small>'; return; } const arr=[]; snap.forEach(ch=>{ arr.push({...ch.val(), id:ch.key}); }); arr.sort((a,b)=>(b.clientConfirmedAt||b.dismissedAt||0)-(a.clientConfirmedAt||a.clientConfirmedAt||0)); el.innerHTML=arr.map(b=>`<div class="histId" onclick="showHistory('${b.id}')">Booking ID ${b.bookingId||b.id} - ${b.clientConfirmedAtStr||b.clearedAtStr||''} - ${b.status} - Click details</div>`).join(''); window.historyData=arr; }); }
function showHistory(id){ const b=window.historyData.find(x=>x.id===id); document.getElementById('modalTitle').textContent='History - '+(b.bookingId||b.id); document.getElementById('modalBody').innerHTML=`ID: ${b.bookingId||b.id}<br>Status: ${b.status}<br>Nurse: ${b.nurseName}<br>Amount: ${b.currency||'GHS'} ${b.amount}<br>Confirmed: ${b.clientConfirmedAtStr||b.clearedAtStr||''}`; document.getElementById('modal').style.display='flex'; }
window.onload=()=>{ getKeys(); loadBookings(); loadHistory(); };
</script>
