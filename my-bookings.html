<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Bookings - LOVE CARE GLOBAL HOME NURSING</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet"><link rel="icon" type="image/png" href="icon-transparent-512.png"><script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};const app=initializeApp(firebaseConfig);const db=getDatabase(app);let currentBooking=null;window.onload=()=>{  // NO LOGIN - Already logged at app start  const urlId=new URLSearchParams(location.search).get('bookingId');  const lastId=localStorage.getItem('pendingBookingId')||localStorage.getItem('lastBookingId')||urlId;  if(!lastId){    document.getElementById('main').innerHTML="<div class='card'>No booking found. <a href='book-nurse.html' style='color:#d8b4fe'>Book Now</a></div>";    return;  }  onValue(ref(db,'bookings/'+lastId), async snap=>{    if(!snap.exists()){document.getElementById('main').innerHTML="Booking not found";return;}    currentBooking=snap.val();    let nurseData=null;    if(currentBooking.nurseId){      const nSnap=await get(ref(db,'nurses/'+currentBooking.nurseId));      if(nSnap.exists()) nurseData=nSnap.val();    }    render(currentBooking,nurseData);  });};function render(b,nurse){  const isPaid=b.payment_status==="paid";  const status=b.status||"pending";  const steps=["pending","accepted","in_progress","awaiting_client_confirmation","completed"];  const stepIndex=steps.indexOf(status);  // ===== MAP LINKS - AUTO FOR BOTH AFTER ACCEPT =====  const clientLat=b.clientLat, clientLng=b.clientLng;  const nurseLat=b.nurseLat||b.acceptedNurseLat||nurse?.lat, nurseLng=b.nurseLng||b.acceptedNurseLng||nurse?.lng;  const dirForClient = b.clientNavigationLink || (clientLat&&nurseLat?`https://www.google.com/maps/dir/?api=1&origin=${clientLat},${clientLng}&destination=${nurseLat},${nurseLng}`:`https://maps.google.com/?q=${nurseLat||''},${nurseLng||''}`);  const dirForNurse = b.nurseNavigationLink || (clientLat&&nurseLat?`https://www.google.com/maps/dir/?api=1&origin=${nurseLat},${nurseLng}&destination=${clientLat},${clientLng}`:`https://maps.google.com/?q=${clientLat},${clientLng}`);  // ===== ACCEPTED / REJECTED BOXES =====  let statusActionBox="";  if(status==="accepted"||status==="in_progress"){    statusActionBox=`    <div class="card" style="border:2px solid #22c55e;background:linear-gradient(135deg,rgba(22,101,52,.35),rgba(28,18,56,.88))">      <h3 class="cardTitle">✅ Accepted - Nurse Coming! + Auto Maps Active</h3>      <div class="alertBox alertOk">        🎉 <b>${b.nurseName||nurse?.fullName||'Your Nurse'}</b> accepted your booking!<br>        ${b.acceptanceMessage||'Success - Navigation activated for both sides'}      </div>      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">        <div class="info"><span>Nurse</span><b>${b.nurseName||nurse?.fullName||'Nurse'}</b></div>        <div class="info"><span>Phone</span><b>${b.nursePhone||nurse?.phone||''}</b></div>      </div>      <div class="mapBox">        <b>🗺️ Auto Google Map Navigation - Both Sides</b><br>        <small>Your Location: ${clientLat||''},${clientLng||''}<br>Nurse Location: ${nurseLat||''},${nurseLng||''}</small><br><br>        <a href="${dirForClient}" target="_blank" class="btn btnPrimary" style="width:100%;margin-bottom:8px">🧭 NAVIGATE TO NURSE - Open Google Maps</a>        <a href="tel:${b.nursePhone||nurse?.phone||''}" class="btn btnGhost" style="width:100%">📞 Call Nurse - ${b.nursePhone||''}</a>        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">          <a href="https://wa.me/${(b.nursePhone||nurse?.phone||'').replace(/[^0-9]/g,'')}" target="_blank" class="btn btnGhost">💬 WhatsApp</a>          <button class="btn btnGhost" onclick="window.open('${dirForClient}','_blank')">📍 Live Track</button>        </div>        <small style="color:#a78bfa;display:block;margin-top:8px">Nurse also sees navigation to you on her My Jobs page - Both get directions</small>      </div>    </div>`;  }  if(status==="rejected"){    statusActionBox=`    <div class="card" style="border:2px solid #ef4444;background:linear-gradient(135deg,rgba(127,29,29,.35),rgba(28,18,56,.88))">      <h3 class="cardTitle">❌ Booking Rejected by Nurse</h3>      <div class="alertBox alertErr">        ${b.rejectionMessage||b.rejectReason||`Sorry, Nurse ${b.nurseName||'selected'} rejected your booking.`}<br><br>        <b>💡 Advice:</b> Please look for a different nurse and consider <b>increasing your amount</b> for faster acceptance.      </div>      <div class="actionGrid" style="margin-top:12px">        <button class="btn btnPrimary" onclick="location.href='book-nurse.html'">🔄 Try Different Nurse + Increase Amount</button>        <button class="btn btnGhost" onclick="location.href='nurse-jobs.html'">👀 View Other Nurses</button>      </div>      <div style="margin-top:10px;font-size:11px;color:#fca5a5">        Reason: ${b.rejectReason||'Not specified'}<br>        Tip: Nurses accept higher offers faster. Try adding 10-20% more.      </div>    </div>`;  }  document.getElementById('main').innerHTML=`  <!-- STATUS TRACKER -->  <div class="card">    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">      <div><b style="font-family:Plus Jakarta Sans,sans-serif;color:#f3e8ff;letter-spacing:.03em">${b.bookingId}</b><br><small style="color:#a78bfa">LOVE CARE GLOBAL • After Booking</small>${b.clientPhoto||b.clientData?.photo? `<div style="margin-top:8px"><img src="${b.clientPhoto||b.clientData?.photo}" style="width:56px;height:56px;border-radius:12px;object-fit:cover;border:1px solid rgba(168,85,247,.18)"><div style="font-size:11px;color:#d8b4fe;margin-top:4px">${b.clientName||""}</div></div>` : ""}</div>      <span class="badge ${isPaid?'b-paid':'b-unpaid'}">${isPaid?'PAID ✅':'UNSUCCESSFUL ❌'} - ${status.toUpperCase()}</span>    </div>    <div class="track">      <div class="step ${stepIndex>=0?'active':''}"><div class="dot">1</div>Pending</div>      <div class="step ${stepIndex>=1?'active':''}"><div class="dot">2</div>Accepted</div>      <div class="step ${stepIndex>=2?'active':''}"><div class="dot">3</div>On Way</div>      <div class="step ${stepIndex>=3?'active':''}"><div class="dot">4</div>Care</div>      <div class="step ${stepIndex>=4?'active':''}"><div class="dot">5</div>Done</div>    </div>    <div class="alertBox ${isPaid?'alertOk':'alertErr'}">      ${isPaid? '🟢 Nurse can see this booking on her My Jobs page' : '🔴 Nurse CANNOT see — Booking unsuccessful until payment'}    </div>  </div>  ${statusActionBox}  <!-- BOOKING DETAILS -->  <div class="card">    <h3 class="cardTitle">📋 Booking Details</h3>    <div class="nurse-box">      <img class="nurse-photo" src="${nurse?.photo||nurse?.profilePhoto||'https://via.placeholder.com/80/8b5cf6/ffffff?text=N'}">      <div>        <b style="color:#f3e8ff">${b.nurseName||nurse?.fullName||'Any Nurse (After Pay)'} ${status==='accepted'?'✅':''}</b> <span class="rating">⭐ ${nurse?.rating||4.9}</span><br>        <small style="color:#a78bfa">📞 ${b.nursePhone||nurse?.phone||'Assigned after accept'} • ${b.country||''}</small><br>        <small style="color:#c4b5fd">🩺 ${b.service||b.careType||'Nursing Care'} • ${b.totalHours||''}h • ${b.amount||b.clientOffer||''} ${b.currency||''}</small>      </div>    </div>    <div class="grid2">      <div class="info"><span>Patient</span><b>${b.patientName||'--'} (${b.patientAge||''})</b></div>      <div class="info"><span>Total Paid</span><b>${b.amount||b.clientOffer||'0'} ${b.currency||''} • ${b.payment_status||'pending'}</b></div>      <div class="info full"><span>Address</span><b>📍 ${b.address||b.clientAddress||'--'}</b></div>      <div class="info full"><span>Written Concerns</span><b>📝 ${b.patientConcerns||b.notes||'No notes'}</b></div>      ${b.voiceNoteUrl?`<div class="info full"><span>Voice Note You Sent</span><audio controls src="${b.voiceNoteUrl}" style="width:100%;margin-top:6px"></audio></div>`:''}      ${clientLat?`<div class="info full"><span>Your GPS</span><b>${clientLat},${clientLng} - <a href="https://maps.google.com/?q=${clientLat},${clientLng}" target="_blank" style="color:#a78bfa">View on Maps</a></b></div>`:''}    </div>  </div>  <!-- ACTIONS -->  <div class="card">    <h3 class="cardTitle">⚡ Actions</h3>    <div class="actionGrid">    ${!isPaid? `    <button class="btn btnPrimary" onclick="payNow()">💳 Pay Now to Activate</button>    <button class="btn btnDanger" onclick="cancel()">❌ Cancel Booking</button>` : status==="rejected"?`    <button class="btn btnPrimary" onclick="location.href='book-nurse.html'">🔄 Re-Book with Higher Amount</button>    <button class="btn btnGhost" onclick="location.href='nurse-jobs.html'">👀 Find Different Nurse</button>` : status==="accepted"?`    <button class="btn btnPrimary" onclick="window.open('${dirForClient}','_blank')">🧭 Navigate to Nurse</button>    <button class="btn btnPrimary" onclick="callNurse()">📞 Call Nurse</button>    <button class="btn btnGhost" onclick="chatNurse()">💬 Chat with Nurse</button>    <button class="btn btnGhost" onclick="track()">📍 Track Live</button>` : `    <button class="btn btnGhost" onclick="track()">📍 Track Status</button>    <button class="btn btnGhost" onclick="callNurse()">📞 Call Nurse</button>    <button class="btn btnGhost" onclick="chatNurse()">💬 Chat</button>    <button class="btn btnDanger" onclick="emergency()">🆘 Emergency</button>`}    </div>  </div>  <!-- PAYMENT -->  <div class="card">    <h3 class="cardTitle">💳 Payment & Invoice</h3>    <div class="payBox">      <div><span>Amount</span><b>${b.amount||b.clientOffer||'0'} ${b.currency||''}</b></div>      <div><span>Status</span><b>${b.payment_status||'pending'} - ${status}</b></div>      <div><span>Method</span><b>${b.paymentMethod||'Paystack'}</b></div>      <div><span>Ref</span><b>${b.paystackRef||'--'}</b></div>    </div>  </div>  <!-- CLIENT CONFIRMATION -->  <div class="card" style="border:2px solid ${b.clientConfirmedFinished?'rgba(168,85,247,.5)':'rgba(245,158,11,.4)'}">    <h3 class="cardTitle">✅ Confirm Nurse Finished <span style="font-size:10px;background:rgba(168,85,247,.18);padding:3px 8px;border-radius:999px;border:1px solid rgba(168,85,247,.2);margin-left:6px">Visible to CEO</span></h3>    ${b.clientConfirmedFinished? `      <div class="alertBox alertOk">✅ You confirmed on ${b.clientConfirmedAt||''} — CEO notified. Note: ${b.clientConfirmedNote||'No note'}</div>    ` : `      <textarea id="confirmNote" placeholder="How was service? Note for CEO..." class="textarea"></textarea>      <div class="actionGrid" style="margin-top:12px">        <button class="btn btnPrimary" onclick="confirmFinished()">✅ Confirm Finished - For CEO</button>        <button class="btn btnGhost" onclick="notYet()">⏳ Not Yet</button>      </div>    `}  </div>  `;}window.payNow=()=>{location.href=`book-nurse.html?pay=${currentBooking.bookingId}&amount=${currentBooking.amount}`};window.cancel=async()=>{  if(confirm('Cancel booking?')){    const { getDatabase, ref, update } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");    const db=getDatabase();    await update(ref(db,'bookings/'+currentBooking.bookingId),{status:"cancelled",visible_to_nurse:false});    alert('Cancelled');  }};window.callNurse=()=>{ window.open('tel:'+(currentBooking.nursePhone||'')); };window.chatNurse=()=>{location.href=`chat.html?bookingId=${currentBooking.bookingId}`;};window.track=()=>{  if(currentBooking.clientNavigationLink) window.open(currentBooking.clientNavigationLink,'_blank');  else alert('Tracking - Status: '+currentBooking.status);};window.confirmFinished=async()=>{  if(!confirm('Confirm nurse finished? Notify CEO.')) return;  const note=document.getElementById('confirmNote')?.value||'';  const now=new Date().toLocaleString(); const iso=new Date().toISOString();  const m=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");  const db=m.getDatabase(); const bookingId=currentBooking.bookingId;  await m.update(m.ref(db,'bookings/'+bookingId),{clientConfirmedFinished:true,clientConfirmedAt:now,clientConfirmedAtISO:iso,clientConfirmedNote:note,ceoSeenConfirmation:false,status:"client_confirmed_finished"});  await m.set(m.ref(db,'ceo_notifications/client_confirmations/'+bookingId),{bookingId,clientId:currentBooking.clientId||'unknown',nurseId:currentBooking.nurseId||'unknown',nurseName:currentBooking.nurseName||'unknown',clientNote:note,confirmedAt:now,confirmedAtISO:iso,ceoSeen:false,type:"client_finished_confirmation"});  alert('✅ Confirmed! CEO notified.');};window.notYet=()=>{alert('Okay - You can confirm when nurse finishes.');};</script><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0e0a1c;color:#e8e0ff;overflow-x:hidden}.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(700px 420px at 12% 8%, rgba(76,29,149,.24) 0%, transparent 65%),radial-gradient(600px 380px at 88% 12%, rgba(168,85,247,.14) 0%, transparent 60%),linear-gradient(180deg,#0e0a1c 0%, #120e26 45%, #0a0714 100%)}.wrap{max-width:880px;margin:0 auto;padding:16px 14px 80px;min-height:calc(100vh - 62px - 78px);display:flex;flex-direction:column}.container{flex:1}.card{background:rgba(28,18,56,.78);border:1px solid rgba(168,85,247,.14);border-radius:20px;padding:18px;margin:14px 0;backdrop-filter:blur(14px);box-shadow:0 12px 32px rgba(0,0,0,.45)}.cardTitle{font-family:Plus Jakarta Sans,sans-serif;font-size:14px;font-weight:800;color:#f3e8ff;margin:0 0 12px}.badge{padding:5px 12px;border-radius:999px;font-size:11px;font-weight:900;color:white}.b-paid{background:linear-gradient(135deg,#a855f7,#7c3aed);border:1px solid rgba(168,85,247,.3)}.b-unpaid{background:linear-gradient(135deg,#ef4444,#dc2626)}.track{display:flex;justify-content:space-between;gap:6px;padding:14px 0;overflow-x:auto}.step{flex:1;text-align:center;font-size:11px;opacity:.35;min-width:64px}.step.active{opacity:1;font-weight:800;color:#d8b4fe}.step .dot{width:32px;height:32px;border-radius:50%;background:rgba(76,29,149,.18);border:1px solid rgba(168,85,247,.14);margin:0 auto 6px;display:grid;place-items:center;font-weight:900;color:#a78bfa}.step.active .dot{background:linear-gradient(135deg,#a855f7,#d8b4fe);color:#1e0a3a;border:none}.alertBox{padding:10px 12px;border-radius:12px;font-size:12px;font-weight:700;margin-top:6px}.alertOk{background:rgba(168,85,247,.14);border:1px solid rgba(168,85,247,.18);color:#d8b4fe}.alertErr{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.22);color:#fca5a5}.mapBox{background:rgba(22,101,52,.18);border:2px solid #22c55e;border-radius:14px;padding:12px;margin:12px 0}.nurse-box{display:flex;gap:14px;align-items:center;border:1px solid rgba(168,85,247,.12);background:rgba(14,10,28,.5);border-radius:16px;padding:12px}.nurse-photo{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid rgba(168,85,247,.22);background:#2e1065}.rating{font-size:11px;background:rgba(168,85,247,.18);padding:2px 8px;border-radius:999px;border:1px solid rgba(168,85,247,.14);color:#d8b4fe}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.info{border:1px solid rgba(168,85,247,.10);background:rgba(14,10,28,.4);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}.info span{font-size:10px;color:#a78bfa;text-transform:uppercase;letter-spacing:.06em;font-weight:800}.info b{font-size:13px;color:#ede9fe}.info.full{grid-column:1/-1}.btn{padding:12px 14px;border-radius:12px;border:none;font-weight:800;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}.btnPrimary{background:linear-gradient(135deg,#a855f7,#d8b4fe);color:#1e0a3a;box-shadow:0 6px 18px rgba(168,85,247,.3)}.btnGhost{background:rgba(76,29,149,.14);border:1px solid rgba(168,85,247,.16);color:#d8b4fe}.btnDanger{background:linear-gradient(135deg,#ef4444,#dc2626);color:white}.actionGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:600px){.actionGrid{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}.textarea{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(168,85,247,.18);background:rgba(14,10,28,.6);color:#ede9fe;font-size:13px;margin-top:8px;outline:none;resize:none;min-height:80px}.bottom-tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(18,12,36,.98);backdrop-filter:blur(18px);display:flex;border-top:1px solid rgba(168,85,247,.18);z-index:30}.btab{flex:1;padding:18px 6px 20px;text-align:center;font-size:14px;font-weight:900;cursor:pointer;color:#a78bfa;display:flex;flex-direction:column;align-items:center;gap:4px}.btab.active{color:#f3e8ff;background:linear-gradient(180deg,rgba(168,85,247,.18),rgba(76,29,149,.14));box-shadow:inset 0 2px 0 #a855f7}</style></head><body><div class="bg"></div><div class="wrap"><div class="container" id="main">Loading your booking...</div></div><div class="bottom-tabs">  <div class="btab active"><span style="font-size:22px">📅</span><span>My Bookings</span></div>  <div class="btab" onclick="location.href='book-nurse.html'"><span style="font-size:22px">➕</span><span>Book</span></div>  <div class="btab" onclick="alert('Notifications')"><span style="font-size:22px">🔔</span><span>Alerts</span></div>  <div class="btab" onclick="location.href='client-profile.html'"><span style="font-size:22px">👤</span><span>Profile</span></div></div></body></html>
