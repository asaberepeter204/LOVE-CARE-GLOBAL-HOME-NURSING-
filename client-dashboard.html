<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Dashboard - Love Care Global</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
import { getDatabase } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",
  authDomain: "web-care-618e8.firebaseapp.com",
  databaseURL: "https://web-care-618e8-default-rtdb.firebaseio.com",
  projectId: "web-care-618e8",
  storageBucket: "web-care-618e8.firebasestorage.app",
  messagingSenderId: "1062578660694",
  appId: "1:1062578660694:web:f94dfe12c929df05bce2f7"
};
const app = initializeApp(firebaseConfig);
window.auth = getAuth(app);
window.fs = getFirestore(app);
window.rtdb = getDatabase(app);
window.signOutUser = async () => { try{await signOut(window.auth);}catch(e){} localStorage.clear(); location.href='client-login.html'; };
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;background:#f8fafc}
.topbar{background:linear-gradient(90deg,#22c55e,#16a34a);padding:12px;color:white;display:flex;justify-content:space-between;position:sticky;top:0}
.topbar a{color:white;text-decoration:none;font-weight:800;padding:6px 12px;background:rgba(255,255,255,0.2);border-radius:999px;font-size:12px}
.wrap{max-width:800px;margin:0 auto;padding:14px}
.card{background:white;border-radius:16px;padding:16px;border:1px solid #e5e7eb;margin-bottom:12px}
.btn{padding:10px 14px;border-radius:10px;border:none;font-weight:900;cursor:pointer;font-size:12px}
.btnGreen{background:#22c55e;color:white}.btnBlue{background:#3b82f6;color:white}.btnLight{background:#f3f4f6;border:1px solid #e5e7eb}
.blocker{position:fixed;inset:0;background:rgba(255,255,255,0.97);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
.statGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat{background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:12px;text-align:center}
.booking{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0}
</style>
</head>
<body>
<div id="loginBlocker" class="blocker">
<div style="background:white;border-radius:16px;padding:20px;max-width:360px;width:100%;text-align:center;border:2px solid #22c55e">
<div style="font-size:40px">🔐</div><h3>Client Login Required</h3>
<p style="font-size:12px;color:#6b7280;margin:8px 0">One login unlocks dashboard & booking</p>
<button class="btn btnGreen" onclick="location.href='client-login.html'">Go to Client Login</button>
<button class="btn btnLight" onclick="location.href='index.html'">Home</button>
</div>
</div>

<div class="topbar">
<div><b>👤 Client Dashboard</b></div>
<div style="display:flex;gap:6px"><a href="book-nurse.html">📅 Book Nurse</a><a href="settings.html">⚙️ Settings</a><a href="#" onclick="logout()" style="background:#ef4444">Logout</a></div>
</div>

<div class="wrap" id="mainContent" style="display:none">
<div class="card">
<div style="display:flex;justify-content:space-between"><div>
<div style="font-size:12px;color:#6b7280">Welcome back,</div>
<div style="font-size:18px;font-weight:900" id="clientName">Client</div>
<div style="font-size:12px;color:#6b7280" id="clientEmail">email@example.com</div>
</div><div id="avatar" style="width:48px;height:48px;border-radius:50%;background:#22c55e;color:white;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px">C</div></div>
</div>

<div class="statGrid">
<div class="stat"><b id="totalBookings">0</b><span style="font-size:11px;color:#6b7280">Total</span></div>
<div class="stat"><b id="activeBookings">0</b><span style="font-size:11px;color:#6b7280">Active</span></div>
<div class="stat"><b id="completedBookings">0</b><span style="font-size:11px;color:#6b7280">Done</span></div>
</div>

<div class="card">
<h3>⚡ Quick Actions</h3>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
<button class="btn btnGreen" onclick="location.href='book-nurse.html'">📅 Book New Nurse</button>
<button class="btn btnBlue" onclick="location.href='client-bookings.html'">📋 My Bookings</button>
<button class="btn btnLight" onclick="location.href='settings.html'">⚙️ Settings</button>
</div>
</div>

<div class="card"><h3>📋 Recent Bookings</h3><div id="bookingsList">Loading...</div></div>
</div>

<script>
// ONE LOGIN - accepts BOTH old currentClientId and new lcg_logged_in system
function getClientSession(){
  const oldId = localStorage.getItem('currentClientId');
  const newUid = localStorage.getItem('lcg_client_uid');
  const logged = localStorage.getItem('lcg_logged_in');
  const role = localStorage.getItem('lcg_role');
  const email = localStorage.getItem('currentClientEmail') || localStorage.getItem('lcg_client_email') || '';
  const name = localStorage.getItem('currentClientName') || localStorage.getItem('lcg_client_name') || email.split('@')[0] || 'Client';
  if(logged==='true' && role==='client' && newUid) return {id:newUid,email,name};
  if(oldId) return {id:oldId,email,name};
  return null;
}
function checkLogin(){
  const s = getClientSession();
  const blocker = document.getElementById('loginBlocker');
  const main = document.getElementById('mainContent');
  if(!s){ blocker.style.display='flex'; main.style.display='none'; return null; }
  blocker.style.display='none'; main.style.display='block'; return s;
}
function logout(){ localStorage.clear(); if(window.signOutUser) window.signOutUser(); else location.href='client-login.html'; }
window.logout=logout;

let currentClient=null;
async function loadDashboard(){
  const session = checkLogin(); if(!session) return;
  currentClient=session;
  document.getElementById('clientName').textContent=session.name;
  document.getElementById('clientEmail').textContent=session.email;
  document.getElementById('avatar').textContent=(session.name[0]||'C').toUpperCase();
  localStorage.setItem('currentClientId',session.id);

  // Load bookings from client_bookings/{id}
  try{
    const { ref, get } = await import("https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js");
    const snap = await get(ref(window.rtdb, `client_bookings/${session.id}`));
    let bookings = snap.exists()? Object.values(snap.val()) : [];
    document.getElementById('totalBookings').textContent=bookings.length;
    document.getElementById('activeBookings').textContent=bookings.filter(b=>b.status==='PAID').length;
    const list = document.getElementById('bookingsList');
    if(bookings.length===0){ list.innerHTML=`<div style="text-align:center;padding:20px;color:#6b7280">No bookings yet<br><button class="btn btnGreen" style="margin-top:10px" onclick="location.href='book-nurse.html'">Book First Nurse</button></div>`; }
    else{
      bookings.sort((a,b)=> new Date(b.timestamp)-new Date(a.timestamp));
      let h=''; bookings.slice(0,5).forEach(b=>{ h+=`<div class="booking"><b>${b.nurseName||'Nurse'} - ${b.service||''}</b><div style="font-size:11px;color:#6b7280">${b.sDate||''} to ${b.eDate||''} • ${b.address||''}</div></div>`; });
      list.innerHTML=h;
    }
  }catch(e){ document.getElementById('bookingsList').innerHTML=`Error: ${e.message}`; }
}
window.addEventListener('DOMContentLoaded', ()=>{ checkLogin(); setTimeout(loadDashboard,500); });
</script>

<script type="module">
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
const auth = window.auth; const db = window.fs;
onAuthStateChanged(auth, async(user)=>{
  if(!user) return;
  if(localStorage.getItem('lcg_logged_in')==='true') return;
  try{
    const snap = await getDoc(doc(db,'clients', user.uid));
    if(snap.exists()){
      localStorage.setItem('lcg_client_uid', user.uid);
      localStorage.setItem('lcg_client_email', user.email);
      localStorage.setItem('lcg_client_name', snap.data().fullName || user.email);
      localStorage.setItem('lcg_role', 'client');
      localStorage.setItem('lcg_logged_in', 'true');
      localStorage.setItem('currentClientId', user.uid);
      localStorage.setItem('currentClientEmail', user.email);
      document.getElementById('loginBlocker').style.display='none';
      document.getElementById('mainContent').style.display='block';
      loadDashboard();
    }
  }catch(e){ console.log(e); }
});
</script>
</body>
</html>
