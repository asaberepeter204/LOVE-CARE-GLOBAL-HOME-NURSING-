<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0e0a1c;color:#e8e0ff;overflow-x:hidden}.topbar{position:sticky;top:0;z-index:50;background:rgba(14,10,28,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(168,85,247,.12);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}#overlay{position:fixed;inset:0;background:rgba(14,10,28,.65);z-index:80;display:none}#overlay.show{display:block}#drawer{position:fixed;left:0;top:0;bottom:0;width:310px;background:rgba(18,12,36,.98);z-index:90;transform:translateX(-100%);transition:.32s;display:flex;flex-direction:column}#drawer.open{transform:translateX(0)}.wrap{max-width:480px;margin:0 auto;padding:24px 14px 70px}.card{background:rgba(28,18,56,.78);border:1px solid rgba(168,85,247,.12);border-radius:20px;padding:20px;margin-bottom:16px}
#blockModal{position:fixed;inset:0;z-index:99999;background:rgba(12,10,30,0.96);display:none;place-items:center;padding:20px}#blockModal.show{display:grid}.blockBox{max-width:420px;width:100%;background:#1e1a3a;padding:32px;border:1px solid rgba(255,255,255,.15);text-align:center}
</style></head><body>
<!-- BLOCK MODAL -->
<div id="blockModal"><div class="blockBox"><div style="width:70px;height:70px;background:rgba(239,68,68,.15);border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;font-size:36px">🚫</div><h2 style="color:#fca5a5;font-size:22px;font-weight:800;margin-bottom:12px">Not Registered!</h2><p style="font-size:14px;color:#e8e0ff;margin-bottom:8px">Your Gmail <b id="blockEmail" style="color:#facc15"></b> is not registered as Client.</p><p style="font-size:14px;color:#facc15;font-weight:700;margin-bottom:16px">Please go back and complete Client Registration first.</p><p id="countText" style="font-size:12px;color:#a78bfa;margin-bottom:18px">Redirecting to registration in 5 seconds...</p><button onclick="goRegister()" style="padding:14px 20px;background:#facc15;color:#000;border:none;font-weight:800;cursor:pointer;width:100%;font-size:15px;margin-bottom:10px">👉 Go to Registration Now</button><button onclick="goLogin()" style="padding:12px 20px;background:transparent;color:#9a95b8;border:1px solid rgba(255,255,255,.2);cursor:pointer;width:100%">Back to Login</button></div></div>
<div class="topbar"><div>LOVE CARE GLOBAL</div><a href="sos.html" style="background:#ef4444;color:white;padding:6px 12px;border-radius:99px;text-decoration:none;font-size:11px;font-weight:800">SOS</a></div>
<div class="wrap"><div class="card"><h2>Welcome, <span id="clientName">Client</span> 👋</h2><p id="clientEmailDisplay" style="font-size:12px;color:#a78bfa"></p></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth();const db=firebase.database();const dbFS=firebase.firestore();
window.goRegister=function(){const email=(localStorage.getItem('clientEmail')||document.getElementById('blockEmail').textContent||'').toLowerCase();localStorage.setItem('pendingGoogleEmail',email);localStorage.clear();sessionStorage.clear();localStorage.setItem('pendingGoogleEmail',email);firebase.auth().signOut().then(()=>{location.replace('client-register.html?from=dashboard_block&email='+encodeURIComponent(email));});};
window.goLogin=function(){localStorage.clear();sessionStorage.clear();location.replace('client-login.html');};
function showBlockModal(email){document.getElementById('blockEmail').textContent=email;document.getElementById('blockModal').classList.add('show');setTimeout(()=>{alert('❌ Not Registered!\n\nYour Gmail '+email+' is not registered as Client.\nPlease go back and complete Client Registration first.');},300);let count=5;const timer=setInterval(()=>{count--;const el=document.getElementById('countText');if(el)el.textContent='Redirecting to registration in '+count+' seconds...';if(count<=0){clearInterval(timer);goRegister();}},1000);}
async function ultraStrictDashboardCheck(){try{const email=(localStorage.getItem('clientEmail')||'').toLowerCase().trim();if(!email){location.replace('client-login.html');return;}let isRegistered=false;const paths=['clients','clientUsers','client_registrations','clientRegistrations','allClients'];for(const p of paths){try{const snap=await db.ref(p).once('value');if(snap.exists()){snap.forEach(ch=>{const v=ch.val()||{};const real=v.profile||v.data||v.clientData||v;const em=(real.email||real.clientEmail||v.email||'').toLowerCase().trim();if(em===email)isRegistered=true;});if(isRegistered)break;}}catch(e){}}if(!isRegistered){try{const fs1=await dbFS.collection('clients').where('email','==',email).get();if(!fs1.empty)isRegistered=true;if(!isRegistered){const fs2=await dbFS.collection('client_registrations').where('email','==',email).get();if(!fs2.empty)isRegistered=true;}}catch(e){}}if(!isRegistered){showBlockModal(email);localStorage.removeItem('clientLoggedIn');return;}}catch(err){}}
document.addEventListener('DOMContentLoaded',()=>{setTimeout(ultraStrictDashboardCheck,500);setTimeout(ultraStrictDashboardCheck,1500);});
auth.onAuthStateChanged(async(user)=>{if(!user)return;document.getElementById('clientName').textContent=user.displayName||localStorage.getItem('clientName')||'Client';document.getElementById('clientEmailDisplay').textContent=user.email||localStorage.getItem('clientEmail')||'';});
</script></body></html>
