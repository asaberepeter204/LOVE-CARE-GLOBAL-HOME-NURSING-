<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Dashboard - LOVE CARE GLOBAL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#f8fafc;color:#111}
.header{position:sticky;top:0;z-index:1000;background:linear-gradient(90deg,#16a34a,#7c3aed);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px;border:2px solid #e5e7eb;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.btnSmall{padding:12px 16px;border:none;border-radius:10px;font-weight:900;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.menuOverlay{position:fixed;top:0;left:-100%;width:290px;height:100%;background:#fff;z-index:3000;transition:.35s;overflow:auto}.menuOverlay.open{left:0}.menuBg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:2999;display:none}.menuBg.show{display:block}
</style>
</head>
<body>

<div class="header">
<div style="display:flex;align-items:center;gap:8px">
<button class="btnSmall" style="background:#facc15;color:#111;font-size:20px" onclick="toggleMenu()">☰</button>
<div style="font-weight:900;font-size:13px">LOVE CARE GLOBAL HOME NURSING<br><span style="font-weight:500;font-size:11px">Welcome</span></div>
</div>
<div style="display:flex;gap:8px"><a href="index.html" class="btnSmall" style="background:rgba(255,255,255,.2);color:white;text-decoration:underline">Home |</a><button class="btnSmall" style="background:transparent;color:white;text-decoration:underline" onclick="logout()">Logout</button></div>
</div>

<div id="menuBg" class="menuBg" onclick="toggleMenu()"></div>
<div id="menuOverlay" class="menuOverlay">
<div style="padding:14px">
<h3>LOVE CARE GLOBAL</h3>
<button class="btnSmall" style="background:#f0fdf4;width:100%;margin:4px 0;border:2px solid #16a34a;justify-content:flex-start" onclick="location.href='./index.html'">🏠 Home</button>
<button class="btnSmall" style="background:#eff6ff;width:100%;margin:4px 0;border:2px solid #2563eb;justify-content:flex-start" onclick="location.href='./book-nurse.html'">📅 Book a Nurse</button>
<button class="btnSmall" style="background:#f0fdf4;width:100%;margin:4px 0;justify-content:flex-start" onclick="location.href='./my-bookings.html'">📋 My Bookings</button>
<button class="btnSmall" style="background:#16a34a;color:white;width:100%;margin:4px 0;justify-content:flex-start" onclick="location.href='./client-dashboard.html'">👤 Client Dashboard</button>
<button class="btnSmall" style="background:#f9fafb;width:100%;margin:4px 0;justify-content:flex-start" onclick="location.href='./privacy.html'">🔒 Privacy</button>
<button class="btnSmall" style="background:#111827;color:white;width:100%;margin:4px 0;justify-content:flex-start" onclick="location.href='./settings.html'">⚙️ Settings</button>
<button onclick="toggleMenu()" class="btnSmall" style="width:100%;background:#6b7280;color:white;margin-top:10px">✕ Close</button>
</div>
</div>

<div style="padding:16px 12px 0"><h2 style="font-size:22px">Welcome Client!</h2><p id="clientInfo" style="font-size:12px;color:#6b7280;margin-top:4px">Loading...</p></div>

<!-- BOOK A NURSE - KEEP -->
<div class="card">
<div style="display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px"><span>📅</span> Book a Nurse</div>
<p style="font-size:13px;color:#444;margin:12px 0">Find verified nurses near you</p>
<button class="btnSmall" style="background:#7c3aed;color:white;padding:12px 18px" onclick="location.href='./book-nurse.html'">Book Now</button>
</div>

<!-- MY BOOKINGS - KEEP -->
<div class="card">
<div style="display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px"><span>📋</span> My Bookings</div>
<p style="font-size:13px;color:#444;margin:12px 0">View your bookings</p>
<button class="btnSmall" style="background:#7c3aed;color:white;padding:12px 18px" onclick="location.href='./my-bookings.html'">View Bookings</button>
</div>

<!-- NURSES FAVORITE - REMOVED AS YOU CROSSED ❌ -->

<!-- EXTRA INFO CARDS - KEEP -->
<div class="card" style="border-left:4px solid #16a34a">
<div style="font-weight:900;font-size:14px">👤 My Profile</div>
<div id="profileBox" style="font-size:12px;margin-top:8px;line-height:1.6"></div>
</div>

<div class="card" style="border-left:4px solid #eab308;background:#fffbeb">
<div style="font-weight:900;font-size:13px">📍 Your Auto GPS Location</div>
<p id="gpsBox" style="font-size:11px;margin-top:6px">Loading location...</p>
<button class="btnSmall" style="background:#16a34a;color:white;margin-top:8px" onclick="refreshGPS()">📍 Refresh GPS</button>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px">
<button class="btnSmall" style="background:#16a34a;color:white;width:100%;padding:14px" onclick="location.href='./book-nurse.html'">📅 Book Nurse</button>
<button class="btnSmall" style="background:#ef4444;color:white;width:100%;padding:14px" onclick="logout()">🚪 Logout</button>
</div>

<script>
function toggleMenu(){document.getElementById('menuOverlay').classList.toggle('open');document.getElementById('menuBg').classList.toggle('show')}
let currentClient=null;
window.addEventListener('DOMContentLoaded',()=>{
  currentClient=JSON.parse(localStorage.getItem('currentClient')||'null');
  if(!currentClient){alert('Please login first');window.location.href='./client-login.html';return;}
  document.getElementById('clientInfo').innerHTML=`Hello <b>${currentClient.name}</b> - ${currentClient.phone} - ${currentClient.location||'No location'}`;
  document.getElementById('profileBox').innerHTML=`<b>Name:</b> ${currentClient.name}<br><b>Phone:</b> ${currentClient.phone}<br><b>Email:</b> ${currentClient.email}<br><b>Country:</b> ${currentClient.country}<br><b>Location:</b> ${currentClient.location}<br><b>Member since:</b> ${new Date(currentClient.created).toLocaleDateString()}`;
  document.getElementById('gpsBox').innerHTML=`<b>Location:</b> ${currentClient.location}<br><b>Lat:</b> ${currentClient.lat} <b>Lng:</b> ${currentClient.lng}<br><a href="https://www.google.com/maps?q=${currentClient.lat},${currentClient.lng}" target="_blank" style="color:#16a34a">View on Map</a>`;
});

function refreshGPS(){
  if(!navigator.geolocation){alert('GPS not supported');return;}
  navigator.geolocation.getCurrentPosition(p=>{
    const lat=p.coords.latitude,lng=p.coords.longitude;
    currentClient.lat=lat;currentClient.lng=lng;
    currentClient.location=`${lat.toFixed(5)}, ${lng.toFixed(5)} - Updated`;
    localStorage.setItem('currentClient',JSON.stringify(currentClient));
    let clients=JSON.parse(localStorage.getItem('loveCareClients')||'[]');
    clients=clients.map(c=>c.phone===currentClient.phone?currentClient:c);
    localStorage.setItem('loveCareClients',JSON.stringify(clients));
    alert('✅ GPS Updated!');location.reload();
  },()=>alert('GPS denied'),{enableHighAccuracy:true});
}

function logout(){
  if(confirm('Logout?')){
    localStorage.removeItem('currentClient');
    window.location.href='./client-login.html';
  }
}
</script>
</body>
</html>
