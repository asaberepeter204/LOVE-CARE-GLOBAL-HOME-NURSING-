<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Dashboard - LOVE CARE GLOBAL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icon-transparent-512.png">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
// 🔒 ULTRA STRICT CEO PROTECTION - BLOCK NEW GMAIL WITHOUT REGISTRATION
(function(){
  const email = (localStorage.getItem('clientEmail')||'').toLowerCase().trim();
  const isLogged = localStorage.getItem('clientLoggedIn');
  if(!isLogged || !email){
    location.replace('client-login.html');
    return;
  }
})();
</script>
<script>
// 🔒 REAL REGISTRATION CHECK - BLOCK NEW GMAIL FROM DASHBOARD
async function ultraStrictDashboardCheck(){
  try{
    const email = (localStorage.getItem('clientEmail')||'').toLowerCase().trim();
    if(!email) return;
    let isRegistered = false;
    const db = firebase.database();
    const dbFS = firebase.firestore();
    const paths=['clients','clientUsers','client_registrations','clientRegistrations','allClients'];
    for(const p of paths){
      try{
        const snap = await db.ref(p).once('value');
        if(snap.exists()){
          snap.forEach(ch=>{
            const v=ch.val()||{};
            const real=v.profile||v.data||v.clientData||v;
            const em=(real.email||real.clientEmail||v.email||'').toLowerCase().trim();
            if(em===email) isRegistered=true;
          });
          if(isRegistered) break;
        }
      }catch(e){}
    }
    if(!isRegistered){
      try{
        const fs1 = await dbFS.collection('clients').where('email','==',email).get();
        if(!fs1.empty) isRegistered=true;
        if(!isRegistered){
          const fs2 = await dbFS.collection('client_registrations').where('email','==',email).get();
          if(!fs2.empty) isRegistered=true;
        }
      }catch(e){}
    }
    if(!isRegistered){
      document.body.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;background:#0c0a1e;color:#fff;font-family:Inter;padding:20px;text-align:center"><div style="max-width:400px;background:#1e1a3a;padding:30px;border:1px solid rgba(255,255,255,.1)"><h2 style="color:#fca5a5;margin-bottom:12px">❌ Not Registered</h2><p style="font-size:14px;color:#9a95b8;margin-bottom:20px">Your Gmail <b style="color:#fff">'+email+'</b> is not registered as Client. You must complete Client Registration first.</p><button onclick="localStorage.clear();sessionStorage.clear();firebase.auth().signOut().then(()=>location.replace(\'client-register.html?from=dashboard_block&email=\'+encodeURIComponent(email)))" style="padding:12px 20px;background:#facc15;color:#000;border:none;font-weight:800;cursor:pointer;width:100%">Go to Registration</button><br><br><button onclick="localStorage.clear();sessionStorage.clear();location.replace(\'client-login.html\')" style="padding:10px;background:transparent;color:#9a95b8;border:1px solid rgba(255,255,255,.1);width:100%;cursor:pointer">Back to Login</button></div></div>';
      localStorage.removeItem('clientLoggedIn');
      try{ await firebase.auth().signOut(); }catch(e){}
      return;
    }
  }catch(err){}
}
setTimeout(()=>{ if(typeof firebase!=='undefined') ultraStrictDashboardCheck(); }, 1500);
</script>
