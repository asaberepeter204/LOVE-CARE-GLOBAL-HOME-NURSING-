<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Login - Love Care</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:#f8fafc;color:#111827;min-height:100vh;display:flex;flex-direction:column}
.top{background:linear-gradient(90deg,#22c55e,#16a34a);padding:12px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.top a{color:#fff;text-decoration:none;font-weight:900}
.card{max-width:400px;margin:20px auto;background:#fff;padding:20px;border-radius:16px;border:1px solid #e5e7eb;box-shadow:0 4px 12px rgba(0,0,0,.05)}
h1{font-size:20px;font-weight:900;margin-bottom:6px}
.sub{font-size:13px;color:#6b7280;margin-bottom:14px}
.label{font-size:12px;font-weight:700;margin:10px 0 4px;display:block}
.input{width:100%;padding:12px;border-radius:10px;border:1.5px solid #e5e7eb;background:#f9fafb;outline:none}
.input:focus{border-color:#22c55e;background:#fff}
.btn{width:100%;padding:12px;border-radius:10px;border:none;font-weight:900;cursor:pointer;margin-top:12px;transition:all .2s}
.btn1{background:linear-gradient(90deg,#22c55e,#16a34a);color:#fff;box-shadow:0 2px 8px rgba(34,197,94,.3)}
.btn1:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(34,197,94,.4)}
/* PROFESSIONAL GOOGLE BUTTON */
.btnG{background:#fff;border:1.5px solid #dadce0;color:#3c4043;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.btnG:hover{background:#f8f9fa;border-color:#dadce0;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.btnG:active{background:#f1f3f4}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:#9aa0a6;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#e8eaed}
.alert{padding:10px;border-radius:10px;font-size:12px;font-weight:700;margin-bottom:10px;display:none}
.alert.err{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;display:block}
.alert.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;display:block}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:#f3f4f6;width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.wrap{position:relative;display:flex;align-items:center}
.footer{font-size:12px;text-align:center;margin-top:14px;color:#6b7280}
.footer a{color:#0369a1;font-weight:900;text-decoration:none}
.gps-badge{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;font-size:11px;font-weight:700;margin-bottom:10px;border:1px solid #e5e7eb}
.gps-badge.ok{background:#f0fdf4;border-color:#bbf7d0;color:#15803d}
.gps-badge.wait{background:#fffbeb;border-color:#fde68a;color:#92400e}
.gps-badge.err{background:#fef2f2;border-color:#fecaca;color:#dc2626}
</style>
</head>
<body>
<div class="top"><a href="/">LOVE CARE GLOBAL</a><span style="font-size:12px;font-weight:700">Client Portal</span></div>

<div class="card">
<h1>Client Login 🔐</h1>
<p class="sub">Login with email or Google - location will be captured automatically for nurse dispatch</p>

<div id="alertBox" class="alert" style="display:none"></div>

<!-- AUTO GPS STATUS -->
<div id="gpsStatus" class="gps-badge wait">📍 Locating you... <span id="gpsText">Requesting GPS permission</span></div>

<label class="label">Email</label>
<input id="email" class="input" type="email" placeholder="you@example.com">

<label class="label">Password</label>
<div class="wrap">
<input id="password" class="input" type="password" placeholder="••••••••" style="padding-right:42px">
<button class="eye" id="eyeBtn" type="button" onclick="togglePwd()" aria-label="Toggle password">👁️</button>
</div>

<!-- Hidden GPS fields (also saved to Firestore) -->
<input type="hidden" id="lat">
<input type="hidden" id="lng">
<input type="hidden" id="accuracy">

<div style="display:flex;justify-content:space-between;margin-top:10px;font-size:12px"><label><input type="checkbox" id="remember"> Remember</label><span style="color:#0ea5e9;font-weight:800;cursor:pointer" onclick="forgot()">Forgot?</span></div>

<button id="loginBtn" class="btn btn1" onclick="emailLogin()">Login to Dashboard</button>
<div class="divider">or</div>
<button class="btn btnG" onclick="googleLogin()">
<!-- Official Google G Logo SVG -->
<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
Continue with Google
</button>

<div class="footer">New? <a href="client-registration.html">Create account</a> • <a href="#" onclick="retryGPS();return false">Enable Location</a></div>
</div>

<script>
/* ===== EYE TOGGLE - IMPROVED ===== */
function togglePwd(){
  const p=document.getElementById('password');
  const btn=document.getElementById('eyeBtn');
  const isPwd = p.type === 'password';
  p.type = isPwd ? 'text' : 'password';
  btn.textContent = isPwd ? '🙈' : '👁️';
  btn.setAttribute('aria-label', isPwd ? 'Hide password' : 'Show password');
}

function showMsg(m,ok){
  const b=document.getElementById('alertBox');
  b.textContent=m;
  b.className='alert '+(ok?'ok':'err');
  b.style.display='block';
}

/* ===== AUTO GPS ===== */
let lastPosition = null;
let gpsWatchId = null;

function updateGPSUI(state, text){
  const box = document.getElementById('gpsStatus');
  const txt = document.getElementById('gpsText');
  box.className = 'gps-badge ' + state;
  if(state==='ok') box.innerHTML = '📍 '+text;
  else if(state==='wait') box.innerHTML = '⏳ '+text;
  else box.innerHTML = '⚠️ '+text;
}

function onGPSPosition(pos){
  lastPosition = pos;
  document.getElementById('lat').value = pos.coords.latitude;
  document.getElementById('lng').value = pos.coords.longitude;
  document.getElementById('accuracy').value = pos.coords.accuracy;
  updateGPSUI('ok', `Location captured • ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)} (±${Math.round(pos.coords.accuracy)}m)`);
  console.log('GPS captured', pos.coords);
}

function onGPSError(err){
  let msg = err.message;
  if(err.code===1) msg = 'Permission denied - click Enable Location';
  if(err.code===2) msg = 'Position unavailable';
  if(err.code===3) msg = 'Timeout - retrying...';
  updateGPSUI('err', msg + ' • <a href="#" onclick="retryGPS();return false" style="color:inherit;text-decoration:underline">Retry</a>');
  console.warn('GPS error', err);
}

function requestGPS(){
  if(!('geolocation' in navigator)){
    updateGPSUI('err','Geolocation not supported in this browser');
    return;
  }
  updateGPSUI('wait','Requesting GPS permission...');
  // One-time high accuracy
  navigator.geolocation.getCurrentPosition(onGPSPosition, onGPSError, {
    enableHighAccuracy:true,
    timeout:15000,
    maximumAge:30000
  });
  // Also watch for better accuracy while on page
  if(gpsWatchId===null){
    gpsWatchId = navigator.geolocation.watchPosition(onGPSPosition, ()=>{}, {
      enableHighAccuracy:true,
      maximumAge:10000
    });
  }
}

function retryGPS(){ requestGPS(); }

// Auto request on page load
window.addEventListener('load', requestGPS);

// Helper to ensure we have GPS before login - waits up to 4s if not yet captured
function ensureGPS(){
  return new Promise((resolve)=>{
    if(lastPosition) return resolve(lastPosition);
    let done=false;
    updateGPSUI('wait','Getting location before login...');
    navigator.geolocation.getCurrentPosition((pos)=>{
      if(done) return;
      done=true;
      onGPSPosition(pos);
      resolve(pos);
    }, (err)=>{
      if(done) return;
      done=true;
      // resolve null - we still allow login but log warning
      resolve(null);
    }, {enableHighAccuracy:true, timeout:4000, maximumAge:60000});
    // fallback after 4.5s
    setTimeout(()=>{ if(!done){ done=true; resolve(lastPosition); } },4500);
  });
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, sendPasswordResetEmail, setPersistence, browserLocalPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const provider=new GoogleAuthProvider();

function buildLocationPayload(){
  const lat = document.getElementById('lat').value;
  const lng = document.getElementById('lng').value;
  const acc = document.getElementById('accuracy').value;
  if(!lat || !lng) return null;
  return {
    lat: parseFloat(lat),
    lng: parseFloat(lng),
    accuracy: acc ? parseFloat(acc) : null,
    capturedAt: serverTimestamp(),
    source: 'auto-gps-login'
  };
}

window.emailLogin=async()=>{
  const email=document.getElementById('email').value.trim();
  const pwd=document.getElementById('password').value;
  const remember=document.getElementById('remember').checked;
  if(!email||!pwd){showMsg('Enter email and password');return;}
  const btn=document.getElementById('loginBtn');
  btn.disabled=true;btn.textContent='📍 Locating & Signing...';
  // Try to get GPS before login
  await window.ensureGPS?.() || await new Promise(r=>setTimeout(r,800));
  const loc = buildLocationPayload();
  btn.textContent='Signing...';
  try{
    await setPersistence(auth, remember?browserLocalPersistence:browserSessionPersistence);
    const cred=await signInWithEmailAndPassword(auth,email,pwd);
    const ref=doc(db,'clients',cred.user.uid);
    const snap=await getDoc(ref);
    const payload = {
      lastLogin: serverTimestamp(),
      lastLocation: loc || null,
      lastLoginIp: null
    };
    if(!snap.exists()){
      await setDoc(ref,{uid:cred.user.uid,email:cred.user.email,role:'client',createdAt:serverTimestamp(),...payload},{merge:true});
    } else {
      await setDoc(ref,payload,{merge:true});
    }
    showMsg('Success! Redirecting...',true);
    setTimeout(()=>location.href='client-dashboard.html',800);
  }catch(e){
    let m=e.message;
    if(e.code==='auth/invalid-credential') m='Invalid email or password';
    if(e.code==='auth/user-not-found') m='No account, please Sign Up';
    showMsg(m);
  }finally{
    const b=document.getElementById('loginBtn');b.disabled=false;b.textContent='Login to Dashboard';
  }
}

window.googleLogin=async()=>{
  try{
    // ensure GPS before google popup too
    await window.ensureGPS?.();
    const loc = buildLocationPayload();
    const cred=await signInWithPopup(auth,provider);
    const user=cred.user;
    const ref=doc(db,'clients',user.uid);
    const snap=await getDoc(ref);
    if(!snap.exists()){
      await setDoc(ref,{uid:user.uid,email:user.email,displayName:user.displayName||'',photoURL:user.photoURL||'',role:'client',provider:'google',profileCompleted:false,lastLocation:loc,createdAt:serverTimestamp(),lastLogin:serverTimestamp()},{merge:true});
      showMsg('Welcome! Complete registration...',true);
      setTimeout(()=>location.href='client-registration.html?new=google&uid='+user.uid,800);
      return;
    }
    const data=snap.data();
    await setDoc(ref,{lastLogin:serverTimestamp(), lastLocation:loc},{merge:true});
    if(data.profileCompleted===false){
      showMsg('Complete your registration...',true);
      setTimeout(()=>location.href='client-registration.html?new=google&uid='+user.uid,800);
      return;
    }
    showMsg('Google login success!',true);
    setTimeout(()=>location.href='client-dashboard.html',800);
  }catch(e){showMsg(e.message);}
}

window.forgot=async()=>{
  const email=document.getElementById('email').value.trim()||prompt('Enter email for reset:');
  if(!email) return;
  try{await sendPasswordResetEmail(auth,email);showMsg('Reset email sent to '+email,true);}catch(e){showMsg(e.message);}
}

// expose ensureGPS globally for module access
window.ensureGPS = window.ensureGPS || function(){ return Promise.resolve(null); };
// override with real one from non-module script if loaded after
if(typeof ensureGPS !== 'undefined') window.ensureGPS = ensureGPS;
</script>
</body>
</html>
