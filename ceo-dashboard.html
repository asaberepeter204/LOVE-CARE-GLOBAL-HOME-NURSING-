<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEO Dashboard - LOVE CARE GLOBAL</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,Arial,sans-serif;background:#f8fafc}
.header{background:#111827;color:white;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99}
.tabs{display:flex;gap:6px;padding:10px;background:white;border-bottom:1px solid #e5e7eb;overflow-x:auto;position:sticky;top:50px;z-index:98}
.tabBtn{padding:8px 14px;border-radius:20px;border:1px solid #e5e7eb;background:#f3f4f6;font-weight:700;cursor:pointer;white-space:nowrap}
.tabBtn.active{background:#111827;color:white}
.content{max-width:900px;margin:0 auto;padding:12px}
.card{background:white;border-radius:12px;padding:12px;border:1px solid #e5e7eb;margin-bottom:10px}
.item{background:white;border:2px solid #e5e7eb;border-radius:12px;padding:12px;margin:10px 0}
.badge{padding:2px 8px;border-radius:999px;font-size:10px;font-weight:900}
.pending{background:#fef3c7;color:#92400e} .green{background:#dcfce7;color:#166534}
.btn{padding:8px 12px;border-radius:8px;border:none;font-weight:800;cursor:pointer}
.btnGreen{background:#16a34a;color:white} .btnRed{background:#ef4444;color:white} .btnDark{background:#111827;color:white}
.links a{display:inline-block;margin:2px;padding:4px 8px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;color:#2563eb;font-size:11px;text-decoration:none;font-weight:700}
.empty{text-align:center;padding:30px;color:#9ca3af;border:2px dashed #e5e7eb;border-radius:12px;background:white}
</style>
</head>
<body>
<div class="header">
<b>👑 CEO Dashboard - LOVE CARE GLOBAL</b>
<div style="display:flex;gap:6px"><span id="authStatus" style="font-size:10px">Checking...</span><button class="btn" style="background:white;color:#111" onclick="location.href='index.html'">Home</button><button class="btn" style="background:white;color:#111" onclick="logout()">Logout</button></div>
</div>

<div class="tabs">
<button class="tabBtn active" id="btn_pending" onclick="switchTab('pending')">Pending <span id="count_pending">0</span></button>
<button class="tabBtn" id="btn_verified" onclick="switchTab('verified')">Verified <span id="count_verified">0</span></button>
<button class="tabBtn" id="btn_clients" onclick="switchTab('clients')">Clients <span id="count_clients">0</span></button>
<button class="tabBtn" id="btn_bookings" onclick="switchTab('bookings')">Bookings <span id="count_bookings">0</span></button>
<button class="tabBtn" id="btn_all" onclick="switchTab('all')">All Nurses</button>
</div>

<div class="content">
<div id="tab_pending"><div class="card"><b>Pending Nurses - Need Approval</b> <button class="btn btnDark" onclick="loadPending()">🔄 Refresh</button><div style="font-size:11px;color:#6b7280;margin-top:4px">Source: localStorage nurseApplications + Firebase nurseApplications + pending_nurses</div></div><div id="pendingList">Loading...</div></div>
<div id="tab_verified" style="display:none"><div class="card"><b>Verified Nurses</b> <button class="btn btnDark" onclick="loadVerified()">Refresh</button></div><div id="verifiedList"></div></div>
<div id="tab_clients" style="display:none"><div class="card"><b>Clients</b> <button class="btn btnDark" onclick="loadClients()">Refresh</button></div><div id="clientsList"></div></div>
<div id="tab_bookings" style="display:none"><div class="card"><b>Bookings</b> <button class="btn btnDark" onclick="loadBookings()">Refresh</button></div><div id="bookingsList"></div></div>
<div id="tab_all" style="display:none"><div class="card"><b>All Nurses (Local Storage)</b> <button class="btn btnDark" onclick="loadAll()">Refresh</button></div><div id="allList"></div></div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
try{
  if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  window.db=firebase.database(); window.auth=firebase.auth();
  console.log("✅ Firebase OK - web-care-618e8");
}catch(e){ document.body.innerHTML='<div style="padding:20px;background:#fef2f2;color:#991b1b">Firebase Init Error: '+e.message+'<br>Check API key: web-care-618e8</div>'; }

auth.onAuthStateChanged(function(user){
  var el=document.getElementById('authStatus');
  if(!user){ el.innerHTML='Not logged in - <a href="ceo-login.html" style="color:#facc15">Go login</a>'; return; }
  el.innerHTML='CEO: '+user.email+' ✅';
  if(user.email.toLowerCase()!=='joshouapee@gmail.com'){ document.querySelector('.content').innerHTML='<div class="card" style="background:#fef2f2"><b>CEO Only</b><br>Login with joshouapee@gmail.com</div>'; return; }
  loadPending();
});

function logout(){ auth.signOut().then(()=>{ location.href='ceo-login.html'; }); }
function switchTab(t){
  document.querySelectorAll('[id^=tab_]').forEach(function(e){ e.style.display='none'; });
  document.getElementById('tab_'+t).style.display='block';
  document.querySelectorAll('.tabBtn').forEach(function(b){ b.classList.remove('active'); });
  var btn=document.getElementById('btn_'+t); if(btn) btn.classList.add('active');
  if(t==='pending') loadPending(); if(t==='verified') loadVerified(); if(t==='clients') loadClients(); if(t==='bookings') loadBookings(); if(t==='all') loadAll();
}

// Core helpers from Index_80
window.getNurseApplications = function(){ try{ return JSON.parse(localStorage.getItem('nurseApplications')||'[]'); }catch(e){ return []; } };
window.saveNurseApplications = function(apps){ localStorage.setItem('nurseApplications', JSON.stringify(apps)); };
window.filter = 'pending';

function loadPending(){
  var list=document.getElementById('pendingList');
  list.innerHTML='⏳ Loading from localStorage + Firebase...';
  var apps=getNurseApplications();
  console.log('Local apps:', apps.length);
  
  function render(allApps){
    var pending = allApps.filter(function(a){ return (a.status||'pending')==='pending'; });
    document.getElementById('count_pending').innerText=pending.length;
    document.getElementById('count_verified').innerText=allApps.filter(a=>a.status==='approved').length;
    if(pending.length===0){
      list.innerHTML='<div class="empty">📭 No pending nurses<br><small>Total in storage: '+allApps.length+'<br>Try All tab or register a test nurse</small><br><br><button class="btn btnDark" onclick="switchTab(\'all\')">Show All '+allApps.length+'</button></div>';
      return;
    }
    var html='';
    pending.forEach(function(app){
      var d=app.docs||{}; var id=(app.id||'').replace(/'/g,'');
      html+='<div class="item" style="border-color:#eab308">';
      html+='<div style="display:flex;justify-content:space-between"><b>👩‍⚕️ '+(app.name||'Unnamed')+' - '+(app.phone||'')+'</b><span class="badge pending">'+(app.status||'pending')+'</span></div>';
      html+='<div style="font-size:11px;color:#6b7280;margin-top:4px">ID: '+app.id+' | License: '+(app.licenseNumber||'')+' | Spec: '+(app.specialty||'')+' | Email: '+(app.email||'')+'</div>';
      html+='<div class="links" style="margin-top:6px">';
      Object.keys(d).forEach(function(k){ if(d[k]) html+='<a href="'+d[k]+'" target="_blank">'+k.toUpperCase()+'</a>'; });
      if(app.cv) html+='<a href="'+app.cv+'" target="_blank">CV</a>';
      if(app.docs&&app.docs.cv) html+='<a href="'+app.docs.cv+'" target="_blank">CV</a>';
      html+='</div>';
      html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px"><button class="btn btnGreen" onclick="approveNurseApp(\''+id+'\')">✓ Approve</button><button class="btn btnRed" onclick="rejectNurseApp(\''+id+'\')">✕ Reject</button></div>';
      html+='</div>';
    });
    list.innerHTML=html;
  }

  if(window.db){
    db.ref('nurseApplications').once('value').then(function(snap){
      var val=snap.val(); if(val){
        var fbApps=Object.values(val);
        fbApps.forEach(function(fa){ if(!apps.find(function(a){return a.id===fa.id})) apps.push(fa); });
        saveNurseApplications(apps);
      }
      render(apps);
    }).catch(function(e){
      console.error(e); list.innerHTML='Error: '+e.message+'<br>Check Firebase Rules - set to auth != null'; render(apps);
    });
  }else{ render(apps); }
}

function approveNurseApp(id){
  if(!confirm('Approve '+id+'?')) return;
  var apps=getNurseApplications(); var idx=apps.findIndex(function(a){return a.id===id});
  if(idx>=0){ apps[idx].status='approved'; apps[idx].approvedAt=Date.now(); saveNurseApplications(apps);
    if(window.db){ db.ref('nurseApplications/'+id).update({status:'approved', approvedAt:Date.now()}); db.ref('verifiedNurses/'+id).set(apps[idx]); db.ref('nurses/'+apps[idx].username).set(apps[idx]); }
  }
  loadPending(); alert('✅ Approved '+id);
}
function rejectNurseApp(id){
  var reason=prompt('Reject '+id+'? Reason:'); if(reason===null) return;
  var apps=getNurseApplications(); var idx=apps.findIndex(function(a){return a.id===id});
  if(idx>=0){ apps[idx].status='rejected'; apps[idx].rejectReason=reason; saveNurseApplications(apps);
    if(window.db){ db.ref('nurseApplications/'+id).update({status:'rejected', rejectReason:reason}); }
  }
  loadPending(); alert('Rejected');
}
function loadVerified(){
  var apps=getNurseApplications().filter(function(a){return a.status==='approved'});
  var html=apps.map(function(a){ return '<div class="item" style="border-color:#16a34a"><b>'+a.name+'</b> - '+a.phone+' <span class="badge green">VERIFIED</span></div>'; }).join('');
  document.getElementById('verifiedList').innerHTML=html||'<div class="empty">No verified nurses</div>';
}
function loadClients(){
  var list=document.getElementById('clientsList'); list.innerHTML='Loading...';
  if(window.db){ db.ref('clientUsers').once('value').then(function(s){ var h=''; s.forEach(function(c){ var v=c.val(); h+='<div class="item"><b>'+ (v.name||v.phone||c.key) +'</b> - '+v.phone+'</div>'; }); list.innerHTML=h||'<div class="empty">No clients</div>'; }); }
}
function loadBookings(){
  var list=document.getElementById('bookingsList'); list.innerHTML='Loading...';
  if(window.db){ db.ref('bookings').limitToLast(20).once('value').then(function(s){ var h=''; s.forEach(function(c){ var v=c.val(); h+='<div class="item"><b>#'+c.key+'</b> - '+v.service+' - '+v.status+'<br><small>'+v.clientPhone+' -> '+ (v.nurseName||'') +'</small></div>'; }); list.innerHTML=h||'<div class="empty">No bookings</div>'; document.getElementById('count_bookings').innerText=s.numChildren(); }).catch(e=>{ list.innerHTML='Error: '+e.message; }); }
}
function loadAll(){
  var apps=getNurseApplications();
  var html=apps.map(function(a){ return '<div class="item"><b>'+a.name+' - '+a.id+'</b> - '+a.status+' - '+a.phone+' <span class="badge '+(a.status==='approved'?'green':'pending')+'">'+a.status+'</span></div>'; }).join('');
  document.getElementById('allList').innerHTML=html||'<div class="empty">No nurses in localStorage</div>';
}
</script>
</body>
</html>
