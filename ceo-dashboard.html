  databaseURL: "https://web-care-618e8-default-rtdb.firebaseio.com",
  projectId: "web-care-618e8",
  storageBucket: "web-care-618e8.firebasestorage.app",

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// CEO ONLY protection
onAuthStateChanged(auth, (user) => {
  const statusEl = document.getElementById('authStatus');
  if(!user) {
    statusEl.innerHTML = "Not logged in - <a href='./index.html' style='color:yellow'>Go login</a>";
    document.querySelector('.content').innerHTML = '<div class="card" style="background:#fef2f2;border-color:#fecaca;color:#991b1b"><b>CEO Access Required</b><br>Please login with joshouapee@gmail.com first.<br><br><a href="./index.html">Go to Login</a></div>';
    return;
  }
  if(user.email !== "joshouapee@gmail.com") {
    statusEl.innerHTML = "Access Denied: "+user.email;
    document.querySelector('.content').innerHTML = '<div class="card" style="background:#fef2f2"><b>CEO Only</b><br>This dashboard is only for joshouapee@gmail.com</div>';
    return;
  }
  statusEl.innerHTML = "CEO: "+user.email+" ✅";

window.activeTab='pending';
window.switchTab=function(tab){
  activeTab=tab;
  document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('active'));
  const btn = document.getElementById('btn_'+tab);
  if(btn) btn.classList.add('active');
  document.querySelectorAll('.tabContent').forEach(c=>c.style.display='none');
  const tabEl = document.getElementById('tab_'+tab);
  if(tabEl) tabEl.style.display='block';
  if(tab==='pending') loadPending();
  if(tab==='verified') loadVerified();
  if(tab==='clients') loadClients();
  if(tab==='bookings') loadBookings();
  if(tab==='payouts') loadPayouts();
  if(tab==='ai') loadAI();
}

window.loadPending=async function(){
  let list=document.getElementById('pendingList');
  list.innerHTML='Loading...';
  try{
    let snap=await get(dbRef(realtimeDB, 'pending_nurses'));
    let data=snap.val()||{};
    try {
      let fsSnap=await getDocs(collection(firestore, 'pending_nurses'));
      fsSnap.forEach(d=>{ if(!data[d.id]) data[d.id]={id:d.id, ...d.data()}; });
    } catch(e) { console.log("Firestore pending skip:", e.message) }
    
    if(Object.keys(data).length===0){ list.innerHTML='<div class="empty">No pending nurses - database empty or check Realtime DB rules</div>'; document.getElementById('count_pending').innerText='0'; return; }
    let html='';
    Object.entries(data).forEach(([id, n])=>{
      const nurseId = n.id || id;
      html+=`
      <div class="item">
        <div style="display:flex;justify-content:space-between">
          <b>${n.fullName||n.name||'Unnamed'} - ${n.country||''} - ${n.city||''}</b>
          <span class="badge pending">${n.status||'PENDING'}</span>
        </div>
        <div class="small">${n.email||''} | ${n.phone||''} | ${n.specialization||n.spec||''}</div>
        <div class="links" style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">
          ${n.cv?.url?`<a href="${n.cv.url}" target="_blank">CV</a>`:''}
          ${n.licence?.url||n.license?.url?`<a href="${n.licence?.url||n.license?.url}" target="_blank">Licence</a>`:''}
          ${n.certificate?.url?`<a href="${n.certificate.url}" target="_blank">Cert</a>`:''}
          ${n.video?.url?`<a href="${n.video.url}" target="_blank">Video</a>`:''}
          ${n.nationalId?.url||n.idDoc?.url||n.ghanaCard?.url?`<a href="${n.nationalId?.url||n.idDoc?.url||n.ghanaCard?.url}" target="_blank">ID</a>`:''}
          ${n.photo?.url?`<a href="${n.photo.url}" target="_blank">Photo</a>`:''}
          ${n.photos?`${n.photos.map((p,i)=>`<a href="${p.url||p}" target="_blank">Photo${i+1}</a>`).join(' ')}`:''}
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px">
          <button class="btn btnGreen" onclick="approveNurse('${nurseId}')">✓ Approve</button>
          <button class="btn btnRed" onclick="rejectNurse('${nurseId}')">✕ Reject</button>
        </div>
      </div>`;
    });
    list.innerHTML=html;
    document.getElementById('count_pending').innerText=Object.keys(data).length;
  }catch(e){ list.innerHTML='Error: '+e.message+'<br><small>Check Realtime Database Rules</small>'; console.error(e); }
}

window.approveNurse=async function(id){
  if(!confirm('Approve this nurse? ID: '+id)) return;
  try{
    let snap=await get(dbRef(realtimeDB, `pending_nurses/${id}`));
    let data=snap.val();
    if(!data){
      try {
        let fsDoc=await getDoc(doc(firestore, 'pending_nurses', id));
        if(fsDoc.exists()) data=fsDoc.data();
      } catch(e){}
    }
    if(!data){ alert('Not found: '+id); return; }
    data.status='APPROVED'; data.approvedAt=new Date().toISOString();
    await set(dbRef(realtimeDB, `verified_nurses/${id}`), data);
    await set(dbRef(realtimeDB, `nurse_registrations/${id}`), data);
    try {
      await setDoc(doc(firestore, 'verified_nurses', id), {...data, createdAt:serverTimestamp()});
      await setDoc(doc(firestore, 'nurse_registrations', id), {...data, createdAt:serverTimestamp()});
    } catch(e){ console.log("Firestore write skip", e.message) }
    await remove(dbRef(realtimeDB, `pending_nurses/${id}`));
    try { await deleteDoc(doc(firestore, 'pending_nurses', id)); } catch(e){}
    alert('Approved: '+(data.fullName||id));
    loadPending();
  }catch(e){ alert("Approve error: "+e.message); }
}

window.rejectNurse=async function(id){
  if(!confirm('Reject and delete this nurse? ID: '+id)) return;
  try{
    await remove(dbRef(realtimeDB, `pending_nurses/${id}`));
    try { await deleteDoc(doc(firestore, 'pending_nurses', id)); } catch(e){}
    alert('Rejected & deleted');
    loadPending();
  }catch(e){ alert("Reject error: "+e.message); }
}

window.loadVerified=async function(){
  let list=document.getElementById('verifiedList');
  list.innerHTML='Loading...';
  try{
    let snap=await get(dbRef(realtimeDB, 'verified_nurses'));
    let data=snap.val()||{};
    let html='';
    Object.values(data).forEach(n=>{
      html+=`<div class="item"><b>${n.fullName||n.name} - ${n.country||''}</b><div class="small">${n.email||''} | ${n.city||''} | ${n.specialization||''}</div><span class="badge green">VERIFIED</span><div class="small">Approved: ${n.approvedAt||''}</div></div>`;
    });
    list.innerHTML=html||'<div class="empty">No verified nurses yet</div>';
    document.getElementById('count_verified').innerText=Object.keys(data).length;
  }catch(e){ list.innerHTML='Error: '+e.message; }
}

window.loadClients=async function(){
  let list=document.getElementById('clientsList');
  list.innerHTML='Loading...';
  try{
    let snap=await get(dbRef(realtimeDB, 'client_registrations'));
    let data=snap.val()||{};
    let html='';
    Object.values(data).forEach(c=>{
      html+=`<div class="item"><b>${c.fullName||'Client'} - ${c.country||''} - ${c.city||''}</b><div class="small">${c.email||''} | ${c.phone||''} | ${c.address||''}</div>${c.photo?.url?`<a href="${c.photo.url}" target="_blank">Photo</a>`:''} ${c.nationalId?.url?`<a href="${c.nationalId.url}" target="_blank">ID</a>`:''}</div>`;
    });
    list.innerHTML=html||'<div class="empty">No clients yet</div>';
    document.getElementById('count_clients').innerText=Object.keys(data).length;
  }catch(e){ list.innerHTML='Error: '+e.message; }
}

window.loadBookings=async function(){
  let list=document.getElementById('bookingsList');
  list.innerHTML='Loading...';
  try{
    let snap=await get(dbRef(realtimeDB, 'bookings'));
    let data=snap.val()||{};
    let html='';
    Object.values(data).reverse().slice(0,50).forEach(b=>{
      html+=`<div class="item"><b>${b.clientName||'Client'} -> ${b.nurseName||'Nurse'} - ${b.country||''} - ${b.total||''}</b><div class="small">${b.sDate||''} to ${b.eDate||''} | ${b.serviceType||''} | ${b.status||''} | ${b.nurseStatus||''}</div><div class="small">${b.address||''} | ${b.lat||''},${b.lng||''}</div>${b.audioUrl?`<a href="${b.audioUrl}" target="_blank">Audio</a>`:''}</div>`;
    });
    list.innerHTML=html||'<div class="empty">No bookings yet</div>';
    document.getElementById('count_bookings').innerText=Object.keys(data).length;
  }catch(e){ list.innerHTML='Error: '+e.message; }
}

window.loadPayouts=async function(){
  let list=document.getElementById('payoutsList');
  list.innerHTML='Loading...';
  try{
    let snap=await get(dbRef(realtimeDB, 'withdrawal_methods'));
    let data=snap.val()||{};
    let html='';
    Object.entries(data).forEach(([nurseId, m])=>{
      html+=`<div class="item"><b>${m.nurseName||nurseId} - ${m.country||''}</b><div class="small">Momo: ${m.momoNumber||'-'} | Debit: ****${m.debitLast4||'-'} | Virtual: ${m.virtualProvider||'-'} ${m.virtualNumber||''} | PayPal: ${m.paypalEmail||'-'}</div></div>`;
    });
    list.innerHTML=html||'<div class="empty">No withdrawal methods yet</div>';
  }catch(e){ list.innerHTML='Error: '+e.message; }
}

window.loadAI=async function(){
  let list=document.getElementById('aiList');
  list.innerHTML='Loading...';
  try{
    let snap=await get(dbRef(realtimeDB, 'ai_support_chats'));
    let data=snap.val()||{};
    let html='';
    Object.entries(data).slice(0,20).forEach(([clientId, msgs])=>{
      let last=Object.values(msgs||{}).slice(-2);
      html+=`<div class="item"><b>${clientId}</b><div class="small">${last.map(m=>`${m.role||''}: ${(m.text||'').substring(0,80)}`).join('<br>')}</div></div>`;
    });
    list.innerHTML=html||'<div class="empty">No chats yet</div>';
  }catch(e){ list.innerHTML='Error: '+e.message; }
}
</script>
