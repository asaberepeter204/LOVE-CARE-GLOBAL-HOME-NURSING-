<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Bookings</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icon-transparent-512.png">
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0e0a1c;color:#e8e0ff;overflow-x:hidden;min-height:100vh;padding-bottom:80px}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 380px at 14% 10%, rgba(76,29,149,.22) 0%, transparent 65%),radial-gradient(500px 340px at 86% 14%, rgba(107,33,168,.14) 0%, transparent 60%),linear-gradient(180deg,#0e0a1c 0%, #120e26 40%, #0a0714 100%)}
.topbar{position:sticky;top:0;z-index:50;background:rgba(14,10,28,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(168,85,247,.12);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.left{display:flex;align-items:center;gap:12px}
.hamburger{width:42px;height:42px;border-radius:50%;border:1px solid rgba(168,85,247,.18);background:rgba(76,29,149,.16);display:grid;place-items:center;cursor:pointer}
.hamburger span{display:block;width:18px;height:2px;background:#e9d5ff;border-radius:99px}.hamburger span+span{margin-top:4px}
.logoBox{display:flex;align-items:center;gap:10px}.logoImg{width:42px;height:42px;border-radius:50%;object-fit:contain;background:#3b0f6e;border:1px solid rgba(168,85,247,.18)}
.brand{font-family:Plus Jakarta Sans,sans-serif;font-weight:800;font-size:13px;letter-spacing:.05em;line-height:1.1;color:#f3e8ff}
.sosBtn{background:linear-gradient(135deg,#ef4444,#dc2626);color:white;padding:8px 14px;border-radius:999px;font-weight:900;font-size:11px;border:none;text-decoration:none}
.card{background:rgba(28,18,56,.78);border:1px solid rgba(168,85,247,.12);border-radius:20px;padding:18px;margin:14px;backdrop-filter:blur(14px)}
.bottom-tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(18,12,36,.98);border-top:1px solid rgba(168,85,247,.12);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 0;z-index:60}
.btab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:#a78bfa;cursor:pointer;padding:6px}
.btab.active{color:#d8b4fe;background:rgba(168,85,247,.12);border-radius:12px;margin:0 4px}
</style></head><body><div class="bg"></div>
<div class="topbar"><div class="left"><div class="logoBox"><img src="icon-transparent-512.png" class="logoImg"><div class="brand">LOVE CARE GLOBAL<br>HOME NURSING</div></div></div><a href="sos.html" class="sosBtn">SOS</a></div>
<div style="padding:14px"><div class="card"><p>No booking found. <a href="book-nurse.html" style="color:#d8b4fe">Book Now</a></p></div><div id="list"></div></div>
<div class="bottom-tabs">
<div class="btab active">📅 My<br>Bookings</div>
<div class="btab" onclick="location.href='book-nurse.html'">➕ Book</div>
<div class="btab" onclick="location.href='alerts.html'">🔔 Alerts</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
const app=initializeApp(firebaseConfig);const db=getDatabase(app);
const uid=localStorage.getItem('lcg_client_uid')||localStorage.getItem('currentClientId');
if(uid){onValue(ref(db,'clientBookings/'+uid), snap=>{const el=document.getElementById('list'); if(!snap.exists()){el.innerHTML='<div class=card>No bookings yet</div>'; return;} el.innerHTML=''; snap.forEach(c=>{const b=c.val(); el.innerHTML+=`<div class=card><b>${b.bookingId||c.key}</b><br>${b.nurseName||''} - ${b.status||''}<br>₵${b.amount||0}</div>`;});});}
</script></body></html>
