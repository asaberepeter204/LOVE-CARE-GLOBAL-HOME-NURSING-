<title>LOVE CARE GLOBAL HOME NURSING - 8 Countries - Heart</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:#0f0f0f;color:white;line-height:1.5;overflow-x:hidden}
.topbar{background:#111827;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:200;border-bottom:1px solid #1f2937}
.logoWrap{display:flex;gap:10px;align-items:center}
.logoBox{width:42px;height:42px;border-radius:12px;background:#7c3aed;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;overflow:hidden}
.logoBox img{width:100%;height:100%;object-fit:cover}
.menuBtn{width:40px;height:40px;border-radius:10px;background:#1f2937;border:1px solid #2a2a2a;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;cursor:pointer}
.menuBtn span{width:20px;height:2px;background:white;border-radius:2px;display:block;transition:.2s}
.drawer{position:fixed;top:0;left:-100%;width:82%;max-width:320px;height:100vh;background:#111827;border-right:1px solid #2a2a2a;z-index:300;padding:16px;transition:left .3s ease;overflow-y:auto}
.drawer.open{left:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:250;display:none}
.overlay.show{display:block}
.drawerItem{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:#1a1a1a;border:1px solid #2a2a2a;margin:6px 0;text-decoration:none;color:#d1d5db;font-weight:700;font-size:13px}
.drawerItem:hover{background:#1f2937;border-color:#7c3aed}
.btn{padding:10px 16px;border-radius:999px;font-weight:800;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;text-decoration:none}
.btnGreen{background:#16a34a;color:white}.btnPurple{background:#7c3aed;color:white}.btnLight{background:#1f2937;border:1px solid #2a2a2a;color:#d1d5db}
.hero{max-width:1100px;margin:0 auto;padding:24px 16px}
.card{background:#1a1a1a;border-radius:18px;padding:16px;border:1px solid #2a2a2a;margin-bottom:12px}
</style>
</head>
<body>

<div class="topbar">
<div class="logoWrap">
<!-- MENU BUTTON - DRAWER LIST - AS YOU REQUESTED -->

<span></span><span></span><span></span>
</button>
