<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>List Names From High Rating - Everyone - High to Down</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0e0a1c;color:#e8e0ff;min-height:100vh;padding:20px}
.card{background:rgba(28,18,56,.92);border:1px solid rgba(168,85,247,.15);border-radius:20px;padding:16px;margin:12px auto;max-width:600px}
.item{padding:12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(168,85,247,.12);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.rank{width:32px;height:32px;border-radius:50%;background:#facc15;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head><body>
<div class="card">
<b>List Names From High Rating - High to Down - Everyone Ratings Comes</b><br>
<small style="color:#a78bfa">Sorted 5 stars top - Whoever comes to app sees - Live listener</small>
<div id="list" style="margin-top:12px">Loading high rating list...</div>
</div>

<script>
const cfg={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(cfg); const db=firebase.database();

function load(){
  db.ref('ratings').on('value', snap=>{
    const el=document.getElementById('list');
    if(!snap.exists()){ el.innerHTML='<small>No ratings yet - When client rates, list shows high to down</small>'; return; }
    const list=[];
    snap.forEach(nurseCh=>{
      let total=0,count=0,latest=null;
      nurseCh.forEach(r=>{
        const v=r.val();
        const stars=parseFloat(v.stars||v.rating||v.ratingValue||0);
        total+=stars; count++;
        if(!latest||(v.time||0)>(latest.time||0)) latest=v;
      });
      if(count>0){
        const avg=total/count;
        list.push({nurseId:nurseCh.key, nurseName:latest.nurseName||latest.nurse||nurseCh.key, avg, count, latest});
      }
    });
    // Sort high to down
    list.sort((a,b)=>{ if(b.avg!==a.avg) return b.avg-a.avg; return b.count-a.count; });
    el.innerHTML=list.map((n,i)=>`<div class="item"><div style="display:flex;gap:10px;align-items:center"><div class="rank">${i+1}</div><div><b>${n.nurseName.toUpperCase()}</b><br><small style="color:#facc15">★ ${n.avg.toFixed(1)} (${n.count} reviews) - High to down rank ${i+1}</small></div></div><small style="color:#a78bfa">ID ${n.nurseId.slice(0,6)}</small></div>`).join('');
    if(list.length===0) el.innerHTML='<small>No ratings yet</small>';
  });
}

window.onload=load;
</script>
</body></html>
