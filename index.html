<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Love Care Global</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#f8fafc}
.topbar{background:linear-gradient(90deg,#22c55e,#16a34a);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;color:white;position:sticky;top:0;z-index:100}
.left{display:flex;align-items:center;gap:10px}
.menuBtn{width:40px;height:40px;background:#facc15;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#000;font-weight:900;border:none;cursor:pointer}
.brand{font-weight:900;font-size:16px}
.right{display:flex;gap:8px;align-items:center}
.sosTop{background:#ef4444;color:white;padding:8px 14px;border-radius:999px;font-weight:900;font-size:12px;border:none;cursor:pointer}
.dotsBtn{background:rgba(255,255,255,0.2);color:white;width:32px;height:32px;border-radius:50%;border:none;font-weight:900;font-size:18px;cursor:pointer}

/* DRAWER - SAME AS YOUR SCREENSHOT */
#drawerOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200}
#drawerOverlay.show{display:block}
#drawer{position:fixed;left:0;top:0;bottom:0;width:280px;background:white;z-index:300;transform:translateX(-100%);transition:transform 0.3s ease;padding:14px;box-shadow:4px 0 20px rgba(0,0,0,0.2);overflow-y:auto}
#drawer.open{transform:translateX(0)}
.drawerTitle{font-weight:900;font-size:18px;margin-bottom:14px;color:#111827}
.drawerItem{display:flex;align-items:center;gap:10px;padding:14px 12px;border-radius:12px;margin:8px 0;font-weight:800;font-size:14px;cursor:pointer;text-decoration:none;color:#111827;border:2px solid}
.drawerItem.home{border-color:#22c55e;background:#f0fdf4}
.drawerItem.book{border-color:#3b82f6;background:#eff6ff}
.drawerItem.sos{border-color:#ef4444;background:#fef2f2;color:#dc2626}
.drawerItem.support{border-color:#e5e7eb;background:#f9fafb}
.closeBtn{width:100%;padding:14px;background:#6b7280;color:white;border:none;border-radius:12px;font-weight:900;margin-top:12px;cursor:pointer}

/* CONTENT */
.content{padding:14px}
.card{background:white;border-radius:16px;padding:16px;margin:10px 0;border:1px solid #e5e7eb}
.btnMain{width:100%;padding:16px;background:#16a34a;color:white;border:none;border-radius:12px;font-weight:900;font-size:15px;cursor:pointer;margin-top:10px}

/* 3 DOTS MENU */
#dotsMenu{display:none;position:absolute;right:14px;top:56px;background:white;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.15);border:1px solid #e5e7eb;z-index:150;min-width:160px;overflow:hidden}
#dotsMenu.show{display:block}
.dotsItem{padding:12px 14px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;color:#111827}
.dotsItem:hover{background:#f3f4f6}
.dotsItem.exit{color:#ef4444}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="left">
    <button class="menuBtn" onclick="openDrawer()">☰</button>
    <div class="brand">LOVE CARE GLOBAL</div>
  </div>
  <div class="right">
    <button class="sosTop" onclick="doSOS()">SOS</button>
    <button class="dotsBtn" onclick="toggleDots(event)">⋮</button>
  </div>
</div>

<!-- 3 DOTS EXIT MENU -->
<div id="dotsMenu">
  <div class="dotsItem" onclick="location.href='index.html'">🏠 Home</div>
  <div class="dotsItem" onclick="location.href='book-nurse.html'">📅 Book Nurse</div>
  <div class="dotsItem" onclick="doSOS()">🚨 SOS</div>
  <div class="dotsItem exit" onclick="doExit()">❌ Exit App</div>
</div>

<!-- DRAWER OVERLAY -->
<div id="drawerOverlay" onclick="closeDrawer()"></div>

<!-- DRAWER - EXACTLY LIKE YOUR SCREENSHOT -->
<div id="drawer">
  <div class="drawerTitle">LOVE CARE GLOBAL</div>
  
  <a class="drawerItem home" href="index.html" onclick="closeDrawer()">
    <span>🏠</span> Home
  </a>
  
  <a class="drawerItem book" href="book-nurse.html" onclick="closeDrawer()">
    <span>📅</span> Book Nurse
  </a>
  
  <div class="drawerItem sos" onclick="doSOS(); closeDrawer();">
    <span>🚨</span> SOS
  </div>
  
  <div class="drawerItem support" onclick="contactSupport(); closeDrawer();">
    <span>💬</span> Contact Support
  </div>
  
  <button class="closeBtn" onclick="closeDrawer()">✕ Close</button>
</div>

<!-- MAIN CONTENT - SIMPLE ONLY -->
<div class="content">
  <div class="card">
    <h3 style="font-weight:900;font-size:16px;margin-bottom:8px">Welcome to Love Care Global ❤️</h3>
    <p style="font-size:13px;color:#6b7280;line-height:1.5">Professional nursing care at home - 13 services available across Ghana, Nigeria, Kenya, South Africa.</p>
    <button class="btnMain" onclick="location.href='book-nurse.html'">📅 Book Nurse Now</button>
    <button class="btnMain" style="background:#ef4444" onclick="doSOS()">🚨 Emergency SOS</button>
  </div>
</div>

<script>
function openDrawer(){
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('show');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('show');
}
function toggleDots(e){
  e.stopPropagation();
  document.getElementById('dotsMenu').classList.toggle('show');
}
document.addEventListener('click', function(){
  document.getElementById('dotsMenu').classList.remove('show');
});
function doSOS(){
  alert('🚨 SOS Activated!\n✓ Calling 112\n✓ Notifying security\n✓ Sharing GPS location');
  window.location.href='tel:112';
}
function contactSupport(){
  alert('💬 Contact Support:\nWhatsApp: +233...\nEmail: support@lovecareglobal.com');
}
function doExit(){
  if(confirm('Exit Love Care Global App?')){
    alert('App closed. Thank you!');
    window.close();
    // For PWA / GitHub pages
    location.href='about:blank';
  }
}
</script>
</body>
</html>
