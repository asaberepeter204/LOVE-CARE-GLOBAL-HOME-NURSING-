<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Login - Must Login Before Booking</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyYOUR_API_KEY",
  authDomain: "love-care-global.firebaseapp.com",
  databaseURL: "https://love-care-global-default-rtdb.firebaseio.com",
  projectId: "love-care-global",
  storageBucket: "love-care-global.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef"
};
const app = initializeApp(firebaseConfig);
const realtimeDB = getDatabase(app);
const firestore = getFirestore(app);
window.loginClient=async function(){
  let email=document.getElementById('email').value.trim();
  let password=document.getElementById('password').value;
  let msg=document.getElementById('msg');
  if(!email||!password){msg.style.display='block';msg.innerHTML='Enter email and password';return;}
  if(email==='client@test.com' && password==='123456'){
    localStorage.setItem('currentClientId','demo_client_1');localStorage.setItem('currentClientName','Demo Client');localStorage.setItem('currentClientEmail',email);localStorage.setItem('currentClientCountry','GH');localStorage.setItem('currentClientPhone','+233241234567');
    msg.style.display='block';msg.style.background='#dcfce7';msg.innerHTML='✅ Demo login success - Redirecting to Book Nurse...';setTimeout(()=>location.href='book-nurse.html',800);return;
  }
  let localClients=JSON.parse(localStorage.getItem('client_registrations')||'[]');
  let localClient=localClients.find(c=>c.email===email && c.password===password);
  if(localClient){
    localStorage.setItem('currentClientId',localClient.id);localStorage.setItem('currentClientName',localClient.fullName);localStorage.setItem('currentClientEmail',localClient.email);localStorage.setItem('currentClientCountry',localClient.country);localStorage.setItem('currentClientPhone',localClient.phone);
    msg.style.display='block';msg.style.background='#dcfce7';msg.innerHTML=`✅ Login success (local) - Welcome ${localClient.fullName} - Redirecting...`;setTimeout(()=>location.href='book-nurse.html',800);return;
  }
  try{
    let rtSnap=await get(ref(realtimeDB, 'client_registrations'));let rtData=rtSnap.val()||{};let found=null;Object.values(rtData).forEach(c=>{if(c.email===email && c.password===password) found=c;});
    if(found){localStorage.setItem('currentClientId',found.id);localStorage.setItem('currentClientName',found.fullName);localStorage.setItem('currentClientEmail',found.email);localStorage.setItem('currentClientCountry',found.country);localStorage.setItem('currentClientPhone',found.phone);msg.style.display='block';msg.style.background='#dcfce7';msg.innerHTML=`✅ Login Realtime DB - Welcome ${found.fullName} - Redirecting...`;setTimeout(()=>location.href='book-nurse.html',800);return;}
  }catch(e){}
  try{
    let q=query(collection(firestore, 'clients'), where('email','==',email), where('password','==',password));let fsSnap=await getDocs(q);
    if(!fsSnap.empty){let found=fsSnap.docs[0].data();localStorage.setItem('currentClientId',found.id);localStorage.setItem('currentClientName',found.fullName);localStorage.setItem('currentClientEmail',found.email);localStorage.setItem('currentClientCountry',found.country);msg.style.display='block';msg.style.background='#dcfce7';msg.innerHTML=`✅ Login Firestore - Welcome ${found.fullName} - Redirecting...`;setTimeout(()=>location.href='book-nurse.html',800);return;}
  }catch(e){}
  msg.style.display='block';msg.style.background='#fef2f2';msg.innerHTML=`❌ No client found for ${email}<br>Register first<br>Demo: client@test.com / 123456`;
}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#f8fafc;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:white;border-radius:16px;padding:20px;border:1px solid #e5e7eb;max-width:400px;width:95%}
label{font-size:12px;font-weight:800;margin:8px 0 4px;display:block}
input{width:100%;padding:12px;border-radius:10px;border:1.5px solid #e5e7eb}
.btn{width:100%;padding:13px;border-radius:11px;font-weight:900;border:none;cursor:pointer;margin-top:10px}
.btnG{background:#3b82f6;color:white}.btnGr{background:#f3f4f6;border:1px solid #e5e7eb}
</style>
</head>
<body>
<div class="card">
<h2 style="text-align:center">🧑‍💼 Client Login - Must Login Before Booking</h2>
<div style="text-align:center;background:#eff6ff;padding:8px;border-radius:8px;border:1px solid #bfdbfe;font-size:11px;margin:10px 0"><b>Must login before booking!</b><br>Login → Select nurse from map → Book → Paystack → Nurse receives job + GPS + Accept/Reject + Map directions</div>
<label>Email</label><input type="email" id="email" placeholder="client@email.com">
<label>Password</label><input type="password" id="password" placeholder="Password">
<button class="btn btnG" onclick="loginClient()">🔐 Login → Book Nurse</button>
<div id="msg" style="margin-top:10px;padding:10px;border-radius:8px;display:none;font-size:12px"></div>
<button class="btn btnGr" style="margin-top:12px" onclick="location.href='client-registration.html'">📝 Register as Client - 8 Countries</button>
<button class="btn btnGr" onclick="location.href='index.html'">← Home</button>
<div style="margin-top:10px;padding:10px;background:#eff6ff;border-radius:8px;font-size:11px"><b>Demo:</b> client@test.com / 123456</div>
</div>
</body>
</html>
