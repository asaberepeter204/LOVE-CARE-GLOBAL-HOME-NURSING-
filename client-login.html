<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Login — LOVE CARE GLOBAL</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Roboto,sans-serif;background:#0c0a1e;color:#ece8ff;min-height:100vh;display:grid;place-items:center;padding:16px}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 10% 10%, rgba(76,29,149,.28), transparent 70%),linear-gradient(180deg,#0c0a1e,#120e26)}
.card{width:100%;max-width:380px;background:#1e1a3a;border:1px solid rgba(255,255,255,.08);border-radius:0;padding:24px;display:flex;flex-direction:column;gap:16px}
h2{text-align:center;font-size:24px;font-weight:800}
input{padding:14px 16px;border-radius:0;border:1px solid rgba(255,255,255,.08);background:rgba(12,10,30,.8);color:#ece8ff;width:100%;font-size:14px;outline:none}
.btn{padding:14px;border-radius:0;border:none;font-weight:800;cursor:pointer;font-size:14px}
.btnLogin{background:linear-gradient(135deg,#facc15,#fde68a);color:#000}
.btnGoogle{background:#ffffff;color:#1f1f1f;border:1px solid #747775;display:flex;gap:12px;align-items:center;justify-content:center;font-family:Roboto,sans-serif;font-weight:500;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.btnGoogle:hover{background:#f8f9fa}
.google-icon{width:20px;height:20px;display:block}
.divider{display:flex;align-items:center;gap:12px;margin:4px 0}
.divider span{flex:1;height:1px;background:rgba(255,255,255,.08)}
.divider b{font-size:11px;color:#9a95b8}
.status{padding:10px;border-radius:0;font-size:11px;display:none;text-align:center}
.status.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#86efac}
.status.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.link{font-size:12px;text-align:center;text-decoration:none}
.linkRegister{color:#a78bfa}
.linkHome{color:#9a95b8}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
<h2>Client Login</h2>
<input id="email" type="email" placeholder="Enter email">
<input id="pass" type="password" placeholder="Enter password">
<div id="status" class="status"></div>
<button class="btn btnLogin" onclick="emailLogin()">Login</button>
<div class="divider"><span></span><b>OR</b><span></span></div>
<button class="btn btnGoogle" onclick="googleLogin()">
<svg class="google-icon" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
Continue with Google
</button>
<a href="client-register.html" class="link linkRegister">No account? Register</a>
<a href="index.html" class="link linkHome">Home</a>
</div>
<script>
// STRICT LOGIC SAME AS BEFORE - BLOCKS NEW USERS
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth();const db=firebase.database();const dbFS=firebase.firestore();
function showStatus(m,o){const el=document.getElementById('status');el.textContent=m;el.className='status '+(o?'ok':'err');el.style.display='block';}
async function checkClientRegistered(e){e=e.toLowerCase().trim();for(const p of ['clients','clientUsers','client_registrations']){try{const s=await db.ref(p).once('value');let f=false;s.forEach(ch=>{const v=ch.val()||{};const r=v.profile||v.data||v;const em=(r.email||'').toLowerCase();if(em===e)f=true;});if(f)return true;}catch{}}try{const fs=await dbFS.collection('clients').where('email','==',e).get();if(!fs.empty)return true;}catch{}return false;}
async function isNurse(e){e=e.toLowerCase().trim();for(const p of ['nurses','nurseUsers','nurse_registrations']){try{const s=await db.ref(p).once('value');let f=false;s.forEach(ch=>{const v=ch.val()||{};const em=(v.email||'').toLowerCase();if(em===e)f=true;});if(f)return true;}catch{}}return false;}
async function checkBlocked(e){e=e.toLowerCase().trim();for(const p of ['clients','blockedClients']){try{const s=await db.ref(p).once('value');let b=false;s.forEach(ch=>{const v=ch.val()||{};const r=v.profile||v.data||v;const em=(r.email||'').toLowerCase();if(em===e&&(r.isBlocked||r.blocked||r.status==='blocked'))b=true;});if(b)return true;}catch{}}return false;}
async function googleLogin(){showStatus('Checking Google...',true);try{const provider=new firebase.auth.GoogleAuthProvider();const result=await auth.signInWithPopup(provider);const user=result.user;const email=(user.email||'').toLowerCase();const name=user.displayName||'';if(await checkBlocked(email)){showStatus('❌ BLOCKED by CEO',false);try{await user.delete();}catch{}await auth.signOut();return;}if(await isNurse(email)){showStatus('❌ You are NURSE — Use Nurse Login',false);await auth.signOut();return;}if(!await checkClientRegistered(email)){showStatus('❌ Not registered — Must register first',false);try{await user.delete();}catch{}await auth.signOut();localStorage.setItem('pendingGoogleEmail',email);setTimeout(()=>{location.href='client-register.html?from=google&email='+encodeURIComponent(email);},1500);return;}localStorage.setItem('clientLoggedIn','true');localStorage.setItem('clientEmail',email);localStorage.setItem('clientName',name);showStatus('Welcome '+name,true);setTimeout(()=>{location.replace('client-dashboard.html');},600);}catch(e){showStatus('Google failed: '+e.message,false);}}
function emailLogin(){const email=document.getElementById('email').value.trim().toLowerCase();const pass=document.getElementById('pass').value.trim();if(!email||!pass){showStatus('Enter email & password',false);return;}auth.signInWithEmailAndPassword(email,pass).then(async()=>{if(await checkBlocked(email)){showStatus('❌ BLOCKED',false);await auth.signOut();return;}if(await isNurse(email)){showStatus('❌ NURSE — Use Nurse Login',false);await auth.signOut();return;}if(!await checkClientRegistered(email)){showStatus('❌ Not registered — Please register',false);await auth.signOut();setTimeout(()=>{location.href='client-register.html?email='+encodeURIComponent(email);},1500);return;}localStorage.setItem('clientLoggedIn','true');localStorage.setItem('clientEmail',email);showStatus('Login success',true);setTimeout(()=>{location.replace('client-dashboard.html');},500);}).catch(e=>showStatus(e.message,false));}
</script>
</body>
</html>
