<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Login</title>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,Roboto,sans-serif;background:#0c0a1e;color:#ece8ff;min-height:100vh;display:grid;place-items:center;padding:16px}.card{width:100%;max-width:380px;background:#1e1a3a;border:1px solid rgba(255,255,255,.08);border-radius:0;padding:24px;display:flex;flex-direction:column;gap:14px}h2{text-align:center;font-size:24px;font-weight:800}input{padding:14px 16px;border-radius:0;border:1px solid rgba(255,255,255,.08);background:rgba(12,10,30,.8);color:#ece8ff;width:100%;font-size:14px;outline:none}.btn{padding:14px;border-radius:0;border:none;font-weight:800;cursor:pointer;font-size:14px}.btnLogin{background:#facc15;color:#000}.btnGoogle{background:#fff;color:#1f1f1f;border:1px solid #747775;display:flex;gap:12px;align-items:center;justify-content:center;font-weight:500}.google-icon{width:20px;height:20px}.divider{display:flex;align-items:center;gap:12px}.divider span{flex:1;height:1px;background:rgba(255,255,255,.08)}.status{padding:10px;border-radius:0;font-size:11px;display:none;text-align:center}.status.ok{background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.3)}.status.err{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}.link{font-size:12px;text-align:center;text-decoration:none;color:#a78bfa}</style></head><body><div class="card"><h2>Client Login</h2><input id="email" type="email" placeholder="Enter email"><input id="pass" type="password" placeholder="Enter password"><div id="status" class="status"></div><button class="btn btnLogin" onclick="emailLogin()">Login</button><div class="divider"><span></span><b>OR</b><span></span></div><button class="btn btnGoogle" onclick="googleLogin()"><svg class="google-icon" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Continue with Google</button><a href="client-registration.html" class="link">No account? Register</a></div>
<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();
const dbFS=firebase.firestore();

function showStatus(m,ok){
  const el=document.getElementById('status');
  el.textContent=m;
  el.className='status '+(ok?'ok':'err');
  el.style.display='block';
}
function sanitizeEmail(email){ return email.toLowerCase().trim().replace(/[.#$@\[\]]/g,'_'); }
function clearClientSessionOnly(){
  const keys=['clientLoggedIn','clientEmail','clientName','clientPhone','clientPhoto','clientUid','loginMethod','pendingGoogleEmail','pendingGoogleName','pendingGooglePhoto'];
  keys.forEach(k=>localStorage.removeItem(k));
  sessionStorage.clear();
}

// ===== IMPROVED: Check ALL places, more tolerant for Michael =====
async function isFullyRegistered(email){
  const eLower = email.toLowerCase().trim();
  if(!eLower) return {ok:false, reason:'empty_email'};
  const key=sanitizeEmail(eLower);
  console.log('Checking registration for', eLower, 'key', key);

  // 1. RTDB allowedClients
  try{
    const snap=await db.ref('allowedClients/'+key).once('value');
    if(snap.exists()){
      const v=snap.val();
      console.log('Found allowedClients', v);
      if(v.email && (v.name||v.fullName) && v.phone){
        const phoneLen = String(v.phone).replace(/\D/g,'').length;
        if(phoneLen>=8){ // relaxed to 8 for Ghana numbers
          return {ok:true, data:v};
        } else {
          return {ok:false, reason:'phone_short_allowedClients', data:v};
        }
      } else {
        return {ok:false, reason:'missing_fields_allowedClients', data:v};
      }
    }
  }catch(e){ console.log('allowedClients err', e.message); }

  // 2. RTDB clients - try orderByChild first, then full scan (more reliable)
  try{
    const snap=await db.ref('clients').once('value');
    if(snap.exists()){
      let found=null;
      snap.forEach(ch=>{
        const v=ch.val()||{};
        const real=v.profile||v;
        const em=(real.email||v.email||real.clientEmail||'').toLowerCase().trim();
        if(em===eLower){
          console.log('Found in clients', real);
          // Check required fields but be tolerant
          const hasName = !!(real.name||real.fullName||v.name);
          const hasPhone = !!(real.phone||v.phone);
          const hasPhoto = !!(real.photoUrl||real.photo||v.photoUrl||real.clientPhotoUrl);
          const phoneVal = real.phone||v.phone||'';
          const phoneLen = String(phoneVal).replace(/\D/g,'').length;
          if(hasName && hasPhone && phoneLen>=8){
            // photo optional for login re-entry? CEO wants photo but don't block existing user
            found={ok:true, data:real};
          } else if(hasName && hasPhone){
            found={ok:true, data:real}; // allow even if photo missing for re-login
          } else {
            found={ok:false, reason:'missing_fields_clients', data:real};
          }
        }
      });
      if(found) return found;
    }
  }catch(e){ console.log('clients scan err', e.message); }

  // 3. RTDB clientRegistrations
  try{
    const snap=await db.ref('clientRegistrations/'+key).once('value');
    if(snap.exists()){
      const v=snap.val();
      console.log('Found clientRegistrations', v);
      if(v.email && (v.fullName||v.name) && v.phone){
        if(String(v.phone).replace(/\D/g,'').length>=8) return {ok:true, data:v};
      }
    }
  }catch(e){}

  // 4. Firestore checks
  try{
    const docSnap = await dbFS.collection('allowedClients').doc(key).get();
    if(docSnap.exists){ return {ok:true, data:docSnap.data()}; }
  }catch(e){}
  try{
    const q=await dbFS.collection('clients').where('email','==', eLower).limit(1).get();
    if(!q.empty){ return {ok:true, data:q.docs[0].data()}; }
  }catch(e){}
  try{
    const q=await dbFS.collection('clientRegistrations').where('email','==', eLower).limit(1).get();
    if(!q.empty){ return {ok:true, data:q.docs[0].data()}; }
  }catch(e){}

  console.log('NOT found as registered client', eLower);
  return {ok:false, reason:'not_found_anywhere', data:null};
}

// ROLE ISOLATION
async function isNurseAccount(email, uid=null){
  const eLower = email.toLowerCase().trim();
  const key = sanitizeEmail(eLower);
  if(uid){
    try{ const s=await dbFS.collection('nurses').doc(uid).get(); if(s.exists) return true; }catch(e){}
    try{ const s=await db.ref('nurses/'+uid).once('value'); if(s.exists()) return true; }catch(e){}
  }
  try{ const q=await dbFS.collection('nurses').where('email','==', eLower).limit(1).get(); if(!q.empty) return true; }catch(e){}
  try{ const s=await db.ref('nurses').orderByChild('email').equalTo(eLower).once('value'); if(s.exists()) return true; }catch(e){}
  // full scan nurses for Michael case
  try{
    const snap=await db.ref('nurses').once('value');
    if(snap.exists()){
      let isNurse=false;
      snap.forEach(ch=>{
        const v=ch.val()||{};
        const em=(v.email||'').toLowerCase().trim();
        if(em===eLower) isNurse=true;
      });
      if(isNurse) return true;
    }
  }catch(e){}
  try{ const s=await db.ref('allowedNurses/'+key).once('value'); if(s.exists()) return true; }catch(e){}
  return false;
}

async function recoverAuthUser(email){
  // If user exists in Auth list, Firebase console must restore. We can't auto-recreate password, but we can guide.
  console.log('Recovery check for', email);
  return false;
}

async function googleLogin(){
  showStatus('Checking Google...', true);
  try{
    const provider=new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});
    const result=await auth.signInWithPopup(provider);
    const user=result.user;
    const email=(user.email||'').toLowerCase().trim();
    const name=user.displayName||'';
    const photo=user.photoURL||'';

    if(await isNurseAccount(email, user.uid)){
      showStatus('❌ This email is a NURSE account. Use Nurse Login.', false);
      await auth.signOut(); clearClientSessionOnly(); return;
    }

    const regCheck=await isFullyRegistered(email);
    if(!regCheck.ok){
      showStatus('❌ Not fully registered: '+(regCheck.reason||'')+' Redirecting to registration to complete...', false);
      // DO NOT DELETE for Google either anymore - just sign out and redirect to complete profile
      await auth.signOut();
      clearClientSessionOnly();
      localStorage.setItem('pendingGoogleEmail', email);
      localStorage.setItem('pendingGoogleName', name);
      localStorage.setItem('pendingGooglePhoto', photo);
      setTimeout(()=>{
        location.href='client-registration.html?from=google_block&email='+encodeURIComponent(email)+'&name='+encodeURIComponent(name)+'&photo='+encodeURIComponent(photo)+'&needRegistration=true&reason='+encodeURIComponent(regCheck.reason||'not_found');
      },1500);
      return;
    }
    localStorage.setItem('clientLoggedIn','true');
    localStorage.setItem('clientEmail', email);
    localStorage.setItem('clientName', regCheck.data.name||regCheck.data.fullName||name);
    localStorage.setItem('clientPhone', regCheck.data.phone||'');
    localStorage.setItem('clientPhoto', regCheck.data.photoUrl||regCheck.data.photo||regCheck.data.clientPhotoUrl||photo||'');
    localStorage.setItem('clientUid', user.uid);
    localStorage.setItem('loginMethod','google');
    localStorage.removeItem('lcg_nurse_uid'); localStorage.removeItem('nurseUid'); localStorage.removeItem('lcg_role');
    showStatus('✅ Welcome back '+name, true);
    setTimeout(()=>{location.replace('client-dashboard.html');}, 800);
  }catch(e){
    console.error(e);
    showStatus('Google login failed: '+e.message, false);
    try{ await auth.signOut(); }catch(_){}
    clearClientSessionOnly();
  }
}

async function emailLogin(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const pass=document.getElementById('pass').value.trim();
  if(!email||!pass){showStatus('Enter email & password', false);return;}
  showStatus('Checking...', true);

  if(await isNurseAccount(email)){
    showStatus('❌ This is a NURSE account. Please use Nurse Login page.', false);
    return;
  }

  try{
    // First try Auth login
    const cred=await auth.signInWithEmailAndPassword(email,pass);
    const user=cred.user;
    console.log('Auth login success', user.email);

    if(await isNurseAccount(email, user.uid)){
      showStatus('❌ Nurse account detected. Access denied on Client Login.', false);
      await auth.signOut(); return;
    }

    const regCheck=await isFullyRegistered(email);
    if(!regCheck.ok){
      console.log('Auth ok but not registered in DB', regCheck);
      showStatus('⚠️ Auth found but registration incomplete ('+regCheck.reason+'). Redirecting to complete registration...', false);
      // IMPORTANT FIX FOR MICHAEL: DO NOT DELETE USER. Keep him in Auth so he can finish registration
      // Just redirect to registration to complete profile
      clearClientSessionOnly();
      localStorage.setItem('pendingGoogleEmail', email);
      localStorage.setItem('pendingGoogleName', regCheck.data?.name||regCheck.data?.fullName||'');
      localStorage.setItem('pendingGooglePhoto', regCheck.data?.photoUrl||'');
      setTimeout(()=>{
        location.href='client-registration.html?from=auth_exists_incomplete&email='+encodeURIComponent(email)+'&needRegistration=true&reason='+encodeURIComponent(regCheck.reason);
      },1500);
      return;
    }

    localStorage.setItem('clientLoggedIn','true');
    localStorage.setItem('clientEmail',email);
    localStorage.setItem('clientName', regCheck.data.name||regCheck.data.fullName||'');
    localStorage.setItem('clientPhone', regCheck.data.phone||'');
    localStorage.setItem('clientPhoto', regCheck.data.photoUrl||regCheck.data.photo||regCheck.data.clientPhotoUrl||'');
    localStorage.setItem('clientUid', user.uid);
    localStorage.setItem('loginMethod','email');
    localStorage.removeItem('lcg_nurse_uid'); localStorage.removeItem('nurseUid'); localStorage.removeItem('lcg_role');
    showStatus('✅ Login success', true);
    setTimeout(()=>{location.replace('client-dashboard.html');},500);

  }catch(e){
    console.log('Auth login error', e.code, e.message);
    // FIX FOR MICHAEL: If user-not-found but email exists in DB, tell him to reset password or check Firebase Console
    if(e.code==='auth/user-not-found'){
      const regCheck=await isFullyRegistered(email);
      if(regCheck.ok){
        showStatus('❌ Auth was deleted but you ARE registered. Please reset password or contact admin to restore Auth. Your data is still in DB.', false);
      } else {
        showStatus('❌ Account not found in Auth. Please register again.', false);
        setTimeout(()=>{
          location.href='client-registration.html?from=not_found&email='+encodeURIComponent(email);
        },1500);
      }
    } else if(e.code==='auth/wrong-password' || e.code==='auth/invalid-credential'){
      showStatus('❌ Wrong password. Try again or use Forgot Password.', false);
    } else {
      showStatus(e.message,false);
    }
  }
}
</script></body></html>
