<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Login - Love Care Global</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{background:#f8f5ff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .card{background:white;width:100%;max-width:400px;padding:32px;border-radius:24px;box-shadow:0 10px 30px rgba(108,43,217,0.15)}
  .logo{text-align:center;margin-bottom:24px}
  .logo h1{color:#6C2BD9;font-size:24px}
  .logo p{color:#666;font-size:13px;margin-top:4px}
  input{width:100%;padding:14px 16px;border:1.5px solid #e9e0ff;border-radius:12px;margin-bottom:14px;font-size:15px;outline:none}
  input:focus{border-color:#6C2BD9}
  .btn{width:100%;padding:14px;background:#6C2BD9;color:white;border:none;border-radius:12px;font-weight:600;font-size:16px;cursor:pointer}
  .btn:hover{background:#5a23b8}
  .link{text-align:center;margin-top:16px;font-size:14px}
  .link a{color:#6C2BD9;text-decoration:none;font-weight:600}
  .note{background:#f3efff;padding:12px;border-radius:10px;font-size:12px;color:#6C2BD9;margin-bottom:16px;text-align:center}
</style>
<script>
/* ===== 30 MIN SESSION CHECK - FIXED ORDER ===== */
(function(){
 try{
  const expiry = parseInt(localStorage.getItem('lcg_expiry') || '0');
  const logged = localStorage.getItem('lcg_logged');
  const role = localStorage.getItem('lcg_role');
  const uid = localStorage.getItem('lcg_client_uid') || localStorage.getItem('lcg_uid');

  // 1. Check expiry FIRST - if expired, clear and stay on login
  if(expiry && Date.now() > expiry){
    localStorage.clear();
    return;
  }
  // 2. If still valid, auto-go to dashboard
  if(logged==='true' && role==='client' && uid){
    window.location.replace('client-dashboard.html');
  }
 }catch(e){ console.log(e); }
})();
</script>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>Love Care Global</h1>
    <p>Client Login</p>
  </div>

  <div class="note">👁️ 30-min secure session for your eye health & security</div>

  <input type="email" id="email" placeholder="Email address">
  <input type="password" id="password" placeholder="Password">

  <button class="btn" id="loginBtn" onclick="loginClient()">Login</button>

  <div class="link">
    No account? <a href="client-register.html">Register</a><br>
    <a href="forgot-password.html" style="font-size:12px;margin-top:8px;display:inline-block">Forgot password?</a>
  </div>

  <p id="msg" style="text-align:center;margin-top:12px;font-size:13px;color:red"></p>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// YOUR FIREBASE CONFIG - KEEP YOURS
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "...",
  appId: "..."
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);

async function loginClient(){
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value.trim();
  const msg = document.getElementById('msg');
  const btn = document.getElementById('loginBtn');

  if(!email || !pass){ msg.textContent = "Enter email and password"; return; }

  btn.textContent = "Logging in..."; btn.disabled=true;

  try{
    const cred = await firebase.auth().signInWithEmailAndPassword(email, pass);
    const uid = cred.user.uid;

    // Check if client exists in DB
    const snap = await firebase.database().ref('clients/'+uid).once('value');
    if(!snap.exists()){
      msg.textContent = "Not a client account. Use nurse login.";
      await firebase.auth().signOut();
      btn.textContent="Login"; btn.disabled=false;
      return;
    }

    // ===== SET 30 MIN SESSION =====
    localStorage.setItem('lcg_logged','true');
    localStorage.setItem('lcg_role','client');
    localStorage.setItem('lcg_client_uid', uid);
    localStorage.setItem('lcg_uid', uid);
    localStorage.setItem('lcg_email', email);
    localStorage.setItem('lcg_expiry', (Date.now() + 30*60*1000).toString()); // 30 mins from now

    window.location.replace('client-dashboard.html');

  }catch(err){
    msg.textContent = err.message;
    btn.textContent="Login"; btn.disabled=false;
  }
}
</script>
</body>
</html>
