<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Client Account - COMPRESS ANY PHOTO</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:#0e0a1c;color:#ece8ff;min-height:100vh;padding:14px}
.card{max-width:480px;margin:0 auto;background:#1e1a3a;border:1px solid rgba(168,85,247,.12);border-radius:20px;padding:20px}
h2{text-align:center;font-weight:900;font-size:22px;margin-bottom:4px}
.sub{font-size:11px;color:#8b7ab8;text-align:center;margin-bottom:12px}
.label{font-size:11px;color:#facc15;font-weight:800;margin:12px 0 6px;display:block}
input,select{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(168,85,247,.15);background:rgba(12,10,30,.8);color:#ece8ff;font-size:14px;outline:none}
input:focus,select:focus{border-color:#a855f7}
.btn{width:100%;padding:14px;border-radius:14px;border:none;font-weight:800;font-size:14px;cursor:pointer;margin-top:16px}
.btnCreate{background:#facc15;color:#000}
.btn:disabled{opacity:.5;cursor:not-allowed}
.photoBox{border:2px dashed rgba(168,85,247,.3);border-radius:14px;padding:16px;text-align:center;cursor:pointer;background:rgba(12,10,30,.4);position:relative;overflow:hidden}
.photoBox.hasPhoto{border-style:solid;border-color:#22c55e;background:rgba(34,197,94,.08)}
.previewImg{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #facc15;margin:0 auto 8px;display:block}
.status{padding:10px;border-radius:10px;font-size:11px;text-align:center;display:none;margin-top:10px}
.status.ok{background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.3)}
.status.err{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.progress{height:4px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;margin-top:8px;display:none}
.progressBar{height:100%;background:#facc15;width:0%;transition:.3s}
</style>
</head>
<body>
<div class="card">
<h2>Create Client Account</h2>
<div class="sub">CEO tracking requires Name+Phone+Photo+Email — ALL 4 MANDATORY</div>

<div id="compressInfo" style="font-size:10px;color:#22c55e;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);padding:8px 10px;border-radius:10px;text-align:center">
  📸 Photo: ANY SIZE allowed — will auto-compress to ~200KB. Max original: unlimited.
</div>

<label class="label">FULL NAME *</label>
<input id="fullName" placeholder="Enter full name" value="">

<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<div><label class="label">EMAIL *</label><input id="email" type="email" placeholder="email@gmail.com"></div>
<div><label class="label">PHONE *</label><input id="phone" type="tel" placeholder="0596672863"></div>
</div>

<label class="label">PASSWORD *</label>
<div style="position:relative"><input id="password" type="password" placeholder="Min 6 chars"><span onclick="togglePass()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer">👁️</span></div>

<label class="label">COUNTRY *</label>
<select id="country"><option value="Ghana" selected>Ghana</option><option value="Nigeria">Nigeria</option><option value="USA">USA</option><option value="UK">UK</option><option value="Other">Other</option></select>

<label class="label">PROFILE PHOTO * REQUIRED — ANY SIZE OK, AUTO COMPRESS</label>
<div class="photoBox" id="photoBox" onclick="document.getElementById('photoInput').click()">
  <input type="file" id="photoInput" accept="image/*" style="display:none">
  <img id="preview" class="previewImg" style="display:none">
  <div id="photoIcon" style="font-size:40px">👤</div>
  <div id="photoText" style="font-size:11px;color:#a78bfa;margin-top:6px">📁 Tap to upload — ANY photo size<br><span style="font-size:10px;color:#22c55e">Will compress automatically to save</span></div>
  <div id="photoDetails" style="font-size:10px;color:#c4b5fd;margin-top:6px;display:none"></div>
</div>
<div class="progress" id="progress"><div class="progressBar" id="progressBar"></div></div>

<div id="status" class="status"></div>

<button class="btn btnCreate" id="createBtn" onclick="createAccount()">Create Account — ALL 4 Required</button>
<a href="client-login.html" style="display:block;text-align:center;font-size:12px;color:#a78bfa;margin-top:12px;text-decoration:none">Already have account? Login</a>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();
const storage=firebase.storage();

function togglePass(){const el=document.getElementById('password'); el.type=el.type==='password'?'text':'password';}
function showStatus(m,ok){const el=document.getElementById('status'); el.textContent=m; el.className='status '+(ok?'ok':'err'); el.style.display='block';}
function sanitizeEmail(e){return e.toLowerCase().trim().replace(/[.#$@\[\]]/g,'_');}

// COMPRESS ANY PHOTO TO ~200KB
let compressedDataUrl='';
let compressedBlob=null;
let originalSize=0;

async function compressImage(file, maxWidth=800, quality=0.7){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        let width=img.width;
        let height=img.height;
        if(width>maxWidth){
          height=Math.round((height*maxWidth)/width);
          width=maxWidth;
        }
        // Also limit height
        if(height>1000){
          width=Math.round((width*1000)/height);
          height=1000;
        }
        canvas.width=width;
        canvas.height=height;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,width,height);
        // Try quality levels to get under 300KB
        let q=quality;
        let dataUrl=canvas.toDataURL('image/jpeg', q);
        // If still >300KB, reduce quality further
        while(dataUrl.length>400000 && q>0.1){
          q-=0.1;
          dataUrl=canvas.toDataURL('image/jpeg', q);
        }
        // Convert to blob for storage
        canvas.toBlob((blob)=>{
          resolve({dataUrl, blob, width, height, quality:q});
        },'image/jpeg', q);
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('photoInput').addEventListener('change', async function(e){
  const file=e.target.files[0];
  if(!file) return;
  originalSize=file.size;
  const photoBox=document.getElementById('photoBox');
  const details=document.getElementById('photoDetails');
  const text=document.getElementById('photoText');
  const progress=document.getElementById('progress');
  const bar=document.getElementById('progressBar');

  progress.style.display='block';
  bar.style.width='20%';
  showStatus('Compressing '+ (originalSize/1024/1024).toFixed(2) +'MB photo...', true);
  text.textContent='⏳ Compressing...';

  try{
    bar.style.width='50%';
    const result=await compressImage(file, 800, 0.7);
    compressedDataUrl=result.dataUrl;
    compressedBlob=result.blob;
    
    bar.style.width='100%';
    const compressedSize=result.dataUrl.length;
    const saved=Math.round((1-compressedSize/(originalSize*1.37))*100);

    // Show preview
    document.getElementById('preview').src=compressedDataUrl;
    document.getElementById('preview').style.display='block';
    document.getElementById('photoIcon').style.display='none';
    photoBox.classList.add('hasPhoto');
    
    details.style.display='block';
    details.innerHTML=`Original: ${(originalSize/1024/1024).toFixed(2)}MB → Compressed: ${(compressedSize/1024).toFixed(0)}KB (${saved}% saved) • ${result.width}x${result.height} • Quality: ${Math.round(result.quality*100)}%`;
    text.innerHTML=`✅ Photo ready — Tap to change`;
    text.style.color='#22c55e';

    showStatus('✅ Photo compressed! Original '+(originalSize/1024/1024).toFixed(2)+'MB → '+(compressedSize/1024).toFixed(0)+'KB', true);
    
    setTimeout(()=>{ progress.style.display='none'; bar.style.width='0%'; },1000);

  }catch(err){
    showStatus('❌ Photo compression failed: '+err.message, false);
    progress.style.display='none';
  }
});

// Auto-fill from Google block redirect
(function autoFill(){
  const params=new URLSearchParams(location.search);
  const email=params.get('email');
  const name=params.get('name');
  if(email) document.getElementById('email').value=email;
  if(name) document.getElementById('fullName').value=name;
  const pendingEmail=localStorage.getItem('pendingGoogleEmail');
  const pendingName=localStorage.getItem('pendingGoogleName');
  if(!email && pendingEmail) document.getElementById('email').value=pendingEmail;
  if(!name && pendingName) document.getElementById('fullName').value=pendingName;
})();

async function createAccount(){
  const fullName=document.getElementById('fullName').value.trim();
  const email=document.getElementById('email').value.trim().toLowerCase();
  const phone=document.getElementById('phone').value.trim();
  const password=document.getElementById('password').value.trim();
  const country=document.getElementById('country').value;
  const btn=document.getElementById('createBtn');

  // ALL 4 REQUIRED VALIDATION
  if(!fullName || fullName.length<2){ showStatus('❌ Full Name required (min 2 chars)', false); return; }
  if(!email || !email.includes('@')){ showStatus('❌ Valid Email required', false); return; }
  if(!phone || phone.length<7){ showStatus('❌ Valid Phone required (min 7 digits)', false); return; }
  if(!password || password.length<6){ showStatus('❌ Password required (min 6 chars)', false); return; }
  if(!compressedDataUrl){ showStatus('❌ Profile Photo REQUIRED — please upload any photo (will auto-compress)', false); document.getElementById('photoBox').style.borderColor='#ef4444'; return; }

  btn.textContent='Creating Account...'; btn.disabled=true;
  showStatus('Creating account with ALL 4 fields + compressed photo...', true);

  try{
    // Create Auth user
    const cred=await auth.createUserWithEmailAndPassword(email, password);
    const user=cred.user;
    const uid=user.uid;
    const emailKey=sanitizeEmail(email);

    // Upload compressed photo to Storage
    let photoUrl=compressedDataUrl;
    try{
      if(compressedBlob){
        const storageRef=storage.ref('clientAvatars/'+emailKey+'/'+Date.now()+'.jpg');
        const uploadTask=await storageRef.put(compressedBlob);
        photoUrl=await uploadTask.ref.getDownloadURL();
      }
    }catch(e){
      console.warn('Storage upload failed, using data URL', e);
      // Keep data URL as fallback
    }

    const clientData={
      uid:uid,
      name:fullName,
      fullName:fullName,
      email:email,
      phone:phone,
      country:country,
      photoUrl:photoUrl,
      photo:photoUrl,
      avatarUrl:photoUrl,
      hasAll4:true,
      createdAt:Date.now(),
      timestamp:Date.now(),
      registeredAt:firebase.database.ServerValue.TIMESTAMP,
      isBlocked:false,
      provider:'email'
    };

    // Save to all relevant nodes for compatibility
    await db.ref('clients/'+emailKey).set(clientData);
    await db.ref('client_registrations/'+emailKey).set(clientData);
    await db.ref('allClients/'+emailKey).set(clientData);
    await db.ref('clientUsers/'+uid).set(clientData);

    // WHITELIST - makes login work on ALL phones
    await db.ref('allowedClients/'+emailKey).set({
      email:email,
      name:fullName,
      fullName:fullName,
      phone:phone,
      photoUrl:photoUrl,
      photo:photoUrl,
      country:country,
      registeredAt:Date.now(),
      hasAll4:true,
      uid:uid
    });

    await db.ref('registeredClientEmails/'+email.replace(/\./g,'_dot_')).set({email:email, registeredAt:Date.now()});

    // Update Auth profile
    try{ await user.updateProfile({displayName:fullName, photoURL:photoUrl}); }catch(e){}

    localStorage.setItem('clientLoggedIn','true');
    localStorage.setItem('clientEmail', email);
    localStorage.setItem('clientName', fullName);
    localStorage.setItem('clientPhone', phone);
    localStorage.setItem('clientPhoto', photoUrl);
    localStorage.setItem('clientUid', uid);
    localStorage.removeItem('pendingGoogleEmail');
    localStorage.removeItem('pendingGoogleName');

    showStatus('✅ Account created with ALL 4! Name+Email+Phone+Photo saved. Redirecting...', true);
    setTimeout(()=>{ location.replace('client-dashboard.html'); },1200);

  }catch(e){
    console.error(e);
    let msg=e.message;
    if(e.code==='auth/email-already-in-use') msg='Email already registered. Please login.';
    showStatus('❌ '+msg, false);
    btn.textContent='Create Account — ALL 4 Required'; btn.disabled=false;
  }
}
</script>
</body>
</html>
