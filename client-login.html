<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Login - Love Care Global</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyYOUR_API_KEY",
  authDomain: "love-care-global.firebaseapp.com",
  databaseURL: "https://love-care-global-default-rtdb.firebaseio.com",
  projectId: "love-care-global",
  storageBucket: "love-care-global.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef"
};

const app = initializeApp(firebaseConfig);
const realtimeDB = getDatabase(app);
const firestore = getFirestore(app);

window.loginClient = async function(){
  let email = document.getElementById('email').value.trim();
  let password = document.getElementById('password').value;
  let msg = document.getElementById('msg');
  let btn = document.getElementById('loginBtn');
  
  if(!email || !password){
    msg.style.display='block';
    msg.className='msg err';
    msg.innerHTML='Please enter email and password';
    return;
  }

  btn.textContent='Logging in...';
  btn.disabled=true;

  // Local storage check
  let localClients = JSON.parse(localStorage.getItem('client_registrations')||'[]');
  let localClient = localClients.find(c=>c.email===email && c.password===password);
  if(localClient){
    localStorage.setItem('currentClientId', localClient.id);
    localStorage.setItem('currentClientName', localClient.fullName);
    localStorage.setItem('currentClientEmail', localClient.email);
    localStorage.setItem('currentClientCountry', localClient.country);
    localStorage.setItem('currentClientPhone', localClient.phone);
    msg.style.display='block';
    msg.className='msg ok';
    msg.innerHTML=`Welcome ${localClient.fullName}`;
    setTimeout(()=>location.href='book-nurse.html',800);
    return;
  }

  try{
    let rtSnap = await get(ref(realtimeDB, 'client_registrations'));
    let rtData = rtSnap.val()||{};
    let found=null;
    Object.values(rtData).forEach(c=>{ if(c.email===email && c.password===password) found=c; });
    if(found){
      localStorage.setItem('currentClientId',found.id);
      localStorage.setItem('currentClientName',found.fullName);
      localStorage.setItem('currentClientEmail',found.email);
      localStorage.setItem('currentClientCountry',found.country);
      localStorage.setItem('currentClientPhone',found.phone);
      msg.style.display='block';
      msg.className='msg ok';
      msg.innerHTML=`Welcome ${found.fullName}`;
      setTimeout(()=>location.href='book-nurse.html',800);
      return;
    }
  }catch(e){}

  try{
    let q = query(collection(firestore, 'clients'), where('email','==',email), where('password','==',password));
    let fsSnap = await getDocs(q);
    if(!fsSnap.empty){
      let found = fsSnap.docs[0].data();
      localStorage.setItem('currentClientId',found.id);
      localStorage.setItem('currentClientName',found.fullName);
      localStorage.setItem('currentClientEmail',found.email);
      localStorage.setItem('currentClientCountry',found.country);
      msg.style.display='block';
      msg.className='msg ok';
      msg.innerHTML=`Welcome ${found.fullName}`;
      setTimeout(()=>location.href='book-nurse.html',800);
      return;
    }
  }catch(e){}

  msg.style.display='block';
  msg.className='msg err';
  msg.innerHTML=`Invalid email or password. Please check your credentials or register.`;
  btn.textContent='Login';
  btn.disabled=false;
}
</script>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#f8fafc;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;color:#111827}

.logo{width:56px;height:56px;background:linear-gradient(135deg,#22c55e,#16a34a);border-radius:14px;display:flex;align-items:center;justify-content:center;color:white;font-weight:900;font-size:24px;margin:0 auto 12px}
h2{text-align:center;font-weight:900;font-size:22px;margin-bottom:4px}
.sub{text-align:center;color:#6b7280;font-size:13px;margin-bottom:20px}
label{font-size:12px;font-weight:700;margin:14px 0 6px;display:block;color:#374151}
input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid #e5e7eb;font-size:14px;outline:none;transition:.2s}
input:focus{border-color:#22c55e;background:#f0fdf4}
.btn{width:100%;padding:14px;border-radius:12px;font-weight:900;border:none;cursor:pointer;font-size:14px;transition:.2s}
.btnG{background:#16a34a;color:white;margin-top:18px}
.btnG:hover{background:#15803d}
.btnG:disabled{opacity:.6}
.btnGr{background:#f9fafb;border:1px solid #e5e7eb;color:#111827;margin-top:10px}
.btnGr:hover{background:#f3f4f6}
.msg{margin-top:14px;padding:12px;border-radius:10px;display:none;font-size:13px;font-weight:600;text-align:center}
.msg.ok{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.msg.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.links{display:flex;justify-content:space-between;margin-top:14px;font-size:12px}
.links a{color:#16a34a;font-weight:700;text-decoration:none}
.links a:hover{text-decoration:underline}
</style>
</head>
