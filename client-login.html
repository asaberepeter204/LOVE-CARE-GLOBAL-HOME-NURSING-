>import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);function showMsg(text, type='alert-error'){  const el=document.getElementById('msg');  el.textContent=text;  el.className='alert show '+type;}window.emailLogin=async()=>{  const email=document.getElementById('email').value.trim();  const password=document.getElementById('password').value;  if(!email||!password){showMsg('Enter email and password','alert-error'); return;}  try{    showMsg('Checking account...','alert-info');    const cred=await signInWithEmailAndPassword(auth, email, password);    const user=cred.user;    localStorage.setItem('lcg_client_uid', user.uid);    localStorage.setItem('lcg_logged_in','true');    localStorage.setItem('lcg_role','client');    showMsg('Success! Redirecting...','alert-success');    setTimeout(()=>{ location.href='client-dashboard.html'; }, 700);  }catch(e){ showMsg('Login failed: '+e.message,'alert-error'); }}window.googleLogin=async()=>{  try{    showMsg('Opening Google...','alert-info');    const provider=new GoogleAuthProvider();    const cred=await signInWithPopup(auth, provider);    const user=cred.user;    localStorage.setItem('lcg_client_uid', user.uid);    localStorage.setItem('lcg_logged_in','true');    localStorage.setItem('lcg_role','client');    showMsg('Google success! Redirecting...','alert-success');    setTimeout(()=>{ location.href='client-dashboard.html'; }, 700);  }catch(e){ showMsg('Google login failed: '+e.message,'alert-error'); }}</script></body></html>
