<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Login — LOVE CARE GLOBAL</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Roboto,sans-serif;background:#0c0a1e;color:#ece8ff;min-height:100vh;display:grid;place-items:center;padding:16px}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 10% 10%, rgba(76,29,149,.28), transparent 70%),linear-gradient(180deg,#0c0a1e,#120e26)}
.card{width:100%;max-width:380px;background:#1e1a3a;border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
h2{text-align:center;font-size:24px;font-weight:800;color:#ece8ff}
input{padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(12,10,30,.8);color:#ece8ff;width:100%;font-size:14px;outline:none}
input:focus{border-color:#a78bfa}
input::placeholder{color:#6b6788}
.btn{padding:14px;border-radius:999px;border:none;font-weight:800;cursor:pointer;font-size:14px;transition:.15s}
.btnLogin{background:linear-gradient(135deg,#facc15,#fde68a);color:#000}
.btnLogin:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(250,204,21,.3)}
.btnGoogle{
  background:#ffffff;
  color:#1f1f1f;
  border:1px solid #747775;
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:center;
  font-family:Roboto, sans-serif;
  font-weight:500;
  font-size:14px;
  letter-spacing:.25px;
  box-shadow:0 1px 2px rgba(0,0,0,.1);
}
.btnGoogle:hover{background:#f8f9fa;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.google-icon{width:20px;height:20px;display:block}
.divider{display:flex;align-items:center;gap:12px;margin:4px 0}
.divider span{flex:1;height:1px;background:rgba(255,255,255,.08)}
.divider b{font-size:11px;color:#9a95b8;font-weight:600}
.status{padding:10px;border-radius:10px;font-size:11px;display:none;text-align:center}
.status.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#86efac}
.status.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.link{font-size:12px;text-align:center;text-decoration:none}
.linkRegister{color:#a78bfa}
.linkHome{color:#9a95b8}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
<h2>Client Login</h2>
<input id="email" type="email" placeholder="Enter email" autocomplete="off">
<input id="pass" type="password" placeholder="Enter password" autocomplete="off">
<div id="status" class="status"></div>
<button class="btn btnLogin" onclick="emailLogin()">Login</button>

<div class="divider"><span></span><b>OR</b><span></span></div>

<button class="btn btnGoogle" onclick="googleLogin()">
  <svg class="google-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"/>
    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    <path fill="none" d="M0 0h48v48H0z"/>
  </svg>
  Continue with Google
</button>

<a href="client-register.html" class="link linkRegister">No account? Register</a>
<a href="index.html" class="link linkHome">Home</a>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();
const dbFS=firebase.firestore();

function showStatus(msg, ok){const el=document.getElementById('status');el.textContent=msg;el.className='status '+(ok?'ok':'err');el.style.display='block';}

async function checkClientRegistered(email){
  const eLower=email.toLowerCase().trim();
  const paths=['clients','clientUsers','client_registrations','clientRegistrations','googleClients','clientsGoogle','clientGoogleUsers','users','authUsers','clientAuthUsers','clientsByGoogle','googleSignInClients'];
  for(const path of paths){
    try{
      const snap=await db.ref(path).once('value');
      if(snap.exists()){
        let found=false;
        snap.forEach(ch=>{
          const v=ch.val()||{};
          const real=v.profile||v.data||v;
          const em=(real.email||real.clientEmail||'').toLowerCase();
          if(em===eLower) found=true;
        });
        if(found) return true;
      }
    }catch(err){}
  }
  try{
    const fsSnap=await dbFS.collection('clients').where('email','==',eLower).get();
    if(!fsSnap.empty) return true;
  }catch(e){}
  return false;
}

async function checkBlocked(email, uid){
  const eLower=email.toLowerCase().trim();
  const checkPaths=['clients','client_registrations','clientUsers','users','googleClients'];
  for(const p of checkPaths){
    try{
      if(uid){
        const s1=await db.ref(p+'/'+uid).once('value');
        const v1=s1.val();
        if(v1){
          const real=v1.profile||v1.data||v1;
          if(real.isBlocked===true || real.blocked===true || real.status==='blocked'){
            return true;
          }
        }
      }
      const snap=await db.ref(p).once('value');
      if(snap.exists()){
        let blocked=false;
        snap.forEach(ch=>{
          const v=ch.val()||{};
          const real=v.profile||v.data||v;
          const em=(real.email||real.clientEmail||'').toLowerCase();
          if(em===eLower && (real.isBlocked===true || real.blocked===true || real.status==='blocked')){
            blocked=true;
          }
        });
        if(blocked) return true;
      }
    }catch(e){}
  }
  try{
    if(uid){
      const doc=await dbFS.collection('clients').doc(uid).get();
      if(doc.exists){
        const d=doc.data();
        if(d.isBlocked===true || d.blocked===true || d.status==='blocked') return true;
      }
    }
    const fsSnap=await dbFS.collection('clients').where('email','==',eLower).get();
    let foundBlocked=false;
    fsSnap.forEach(doc=>{
      const d=doc.data();
      if(d.isBlocked===true || d.blocked===true || d.status==='blocked') foundBlocked=true;
    });
    if(foundBlocked) return true;
  }catch(e){}
  return false;
}

async function googleLogin(){
  showStatus('Checking Google...', true);
  try{
    const provider=new firebase.auth.GoogleAuthProvider();
    const result=await auth.signInWithPopup(provider);
    const user=result.user;
    const email=(user.email||'').toLowerCase();
    const name=user.displayName||'';
    const photo=user.photoURL||'';
    const uid=user.uid;

    // BLOCK CHECK FIRST
    const isBlocked = await checkBlocked(email, uid);
    if(isBlocked){
      showStatus('❌ Account BLOCKED by CEO — Contact support', false);
      await auth.signOut();
      return;
    }

    const isRegistered=await checkClientRegistered(email);
    if(!isRegistered){
      localStorage.setItem('googlePendingRegister', JSON.stringify({email:email,name:name,photo:photo,uid:uid,provider:'google',createdAt:Date.now()}));
      localStorage.setItem('pendingGoogleEmail', email);
      localStorage.setItem('pendingGoogleName', name);
      await db.ref('googleLoginAttempts').push({email:email,name:name,status:'new_redirect_to_register',timestamp:Date.now(),time:new Date().toLocaleString()});
      showStatus('New client — Please register first — Redirecting...', false);
      setTimeout(()=>{location.href='client-register.html?from=google&email='+encodeURIComponent(email)+'&name='+encodeURIComponent(name);}, 1200);
      return;
    }

    // FIXED: Clean old keys to stop redirect loop
    const cleanKeys=['clientPhone','lcg_client_phone','currentClientPhone','lcg_phone','phone','clientLoggedIn','clientEmail','clientName','clientPhoto','clientUid','isGoogleLogin','lcg_client_name','clientPhoneKey'];
    cleanKeys.forEach(k=>localStorage.removeItem(k));
    sessionStorage.clear();

    // Fetch phone
    let clientPhoneToSave='';
    try{
      const paths=['clients','clientUsers','client_registrations','clientRegistrations','googleClients','users'];
      for(const p of paths){
        const s=await db.ref(p).once('value');
        if(s.exists()){
          s.forEach(ch=>{
            const v=ch.val()||{};
            const real=v.profile||v.data||v;
            const em=(real.email||real.clientEmail||'').toLowerCase();
            if(em===email){
              const ph=(real.phone||real.clientPhone||real.phoneNumber||'').toString().replace(/[^0-9]/g,'');
              if(ph.length>=9) clientPhoneToSave=ph;
            }
          });
          if(clientPhoneToSave) throw 'found';
        }
      }
    }catch(e){ if(e!=='found') console.log(e); }
    try{
      if(!clientPhoneToSave){
        const fsSnap=await dbFS.collection('clients').where('email','==',email).get();
        fsSnap.forEach(doc=>{
          const d=doc.data();
          const ph=(d.phone||d.clientPhone||'').toString().replace(/[^0-9]/g,'');
          if(ph.length>=9) clientPhoneToSave=ph;
        });
      }
    }catch(e){}

    if(clientPhoneToSave) localStorage.setItem('clientPhone', clientPhoneToSave);
    localStorage.setItem('clientLoggedIn','true');
    localStorage.setItem('clientEmail', email);
    localStorage.setItem('clientName', name);
    localStorage.setItem('clientPhoto', photo);
    localStorage.setItem('clientUid', uid);
    localStorage.setItem('isGoogleLogin','true');
    
    await db.ref('googleClients/'+uid).set({email:email,name:name,photo:photo,uid:uid,lastLogin:Date.now(),provider:'google',isGoogleLogin:true});
    await db.ref('clientGoogleLogins').push({email:email,name:name,uid:uid,loginAt:Date.now(),time:new Date().toLocaleString()});

    showStatus('Welcome '+name+' — Google login success', true);
    setTimeout(()=>{ location.replace('client-dashboard.html'); }, 500);
  }catch(e){
    showStatus('Google login failed: '+e.message, false);
  }
}

function emailLogin(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const pass=document.getElementById('pass').value.trim();
  if(!email || !pass){showStatus('Enter email & password', false);return;}
  auth.signInWithEmailAndPassword(email, pass).then(async()=>{
    // BLOCK CHECK
    const isBlocked = await checkBlocked(email, auth.currentUser?.uid);
    if(isBlocked){
      showStatus('❌ Account BLOCKED by CEO — Contact support', false);
      await auth.signOut();
      return;
    }
    const isRegistered=await checkClientRegistered(email);
    if(!isRegistered){
      showStatus('Not registered — Please register first', false);
      setTimeout(()=>{location.href='client-register.html?email='+encodeURIComponent(email);}, 1200);
      return;
    }
    const cleanKeys2=['clientPhone','lcg_client_phone','currentClientPhone','lcg_phone','phone','clientLoggedIn','clientEmail','clientName','clientPhoto','clientUid','isGoogleLogin','lcg_client_name','clientPhoneKey'];
    cleanKeys2.forEach(k=>localStorage.removeItem(k));
    sessionStorage.clear();
    let clientPhoneToSave2='';
    try{
      const paths2=['clients','clientUsers','client_registrations','clientRegistrations','googleClients','users'];
      for(const p of paths2){
        const s=await db.ref(p).once('value');
        if(s.exists()){
          s.forEach(ch=>{
            const v=ch.val()||{};
            const real=v.profile||v.data||v;
            const em=(real.email||real.clientEmail||'').toLowerCase();
            if(em===email){
              const ph=(real.phone||real.clientPhone||real.phoneNumber||'').toString().replace(/[^0-9]/g,'');
              if(ph.length>=9) clientPhoneToSave2=ph;
            }
          });
          if(clientPhoneToSave2) throw 'found2';
        }
      }
    }catch(e2){ if(e2!=='found2') console.log(e2); }
    if(clientPhoneToSave2) localStorage.setItem('clientPhone', clientPhoneToSave2);
    localStorage.setItem('clientLoggedIn','true');
    localStorage.setItem('clientEmail', email);
    localStorage.setItem('clientName', email.split('@')[0]);
    showStatus('Login success', true);
    setTimeout(()=>{ location.replace('client-dashboard.html'); }, 500);
  }).catch(e=>showStatus(e.message,false));
}
</script>
</body>
</html>
