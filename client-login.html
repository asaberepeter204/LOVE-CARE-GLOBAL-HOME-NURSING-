<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Login</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0c0a1e;color:#ece8ff;min-height:100vh;display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:380px;background:#1e1a3a;border:1px solid rgba(168,85,247,.15);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px}
h2{text-align:center} input{padding:13px;border-radius:12px;border:1px solid rgba(168,85,247,.2);background:rgba(12,10,30,.8);color:white;width:100%}
.btn{padding:14px;border-radius:12px;border:none;font-weight:900;cursor:pointer}
.btnYellow{background:linear-gradient(135deg,#facc15,#f59e0b);color:#000}
.btnDark{background:#2a2250;color:#a78bfa}
.status{padding:10px;border-radius:10px;font-size:11px;display:none;text-align:center}
.status.ok{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.3)}
.status.err{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
#recaptcha-container{margin:6px 0}
.otpBox{display:none;flex-direction:column;gap:10px;background:rgba(14,10,28,.9);border:1px solid #facc15;border-radius:12px;padding:14px}
</style>
</head><body>
<div class="card">
<h2>Client Login</h2>
<input id="username" placeholder="Username (e.g. michael1005)" oninput="this.value=this.value.toLowerCase().replace(/\s/g,'')">
<input id="pass" type="password" placeholder="Password">
<div id="status" class="status"></div>
<button class="btn btnYellow" onclick="login()">Login with Password</button>
<div id="recaptcha-container"></div>

<div id="otpBox" class="otpBox">
<b style="text-align:center;color:#facc15">Code sent to <span id="phoneDisplay"></span></b>
<small style="font-size:10px;color:#a78bfa;text-align:center">Enter 6-digit SMS code to verify phone and enter dashboard</small>
<input id="otp" type="text" placeholder="6-digit code" maxlength="6" style="text-align:center;font-size:18px;letter-spacing:4px">
<button class="btn btnYellow" onclick="verifyPhoneOTP()">Verify Code & Enter</button>
<button class="btn btnDark" onclick="resendOTP()">Resend Code</button>
</div>

<div style="display:flex;justify-content:space-between"><a href="client-registration.html" style="color:#a78bfa;font-size:12px;text-decoration:none">No account? Register</a><a href="#" onclick="resetPass()" style="color:#facc15;font-size:12px;text-decoration:none">Forgot password?</a></div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();

let confirmationResult=null;
let recaptchaVerifier=null;
let currentClient=null;

function showStatus(m,ok){ const el=document.getElementById('status'); el.textContent=m; el.className='status '+(ok?'ok':'err'); el.style.display='block'; }
function hashPassword(p){ return btoa(p).split('').reverse().join('') + '_' + p.length; }

window.onload=()=>{
  recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {size:'invisible'});
  recaptchaVerifier.render();
};

async function login(){
  const username=document.getElementById('username').value.trim().toLowerCase();
  const pass=document.getElementById('pass').value.trim();
  if(!username||!pass){ showStatus('Enter username & password', false); return; }
  showStatus('Checking username...', true);
  try{
    const snap=await db.ref('allowedClients/'+username).once('value');
    if(!snap.exists()){ showStatus('Username not found - Register first', false); return; }
    const data=snap.val();
    if(data.isBlocked===true){ showStatus('Account blocked by CEO', false); return; }

    const hashed=hashPassword(pass);
    // Accept both hashed and plain for backward compat
    if(data.passwordHash && data.passwordHash!==hashed && data.passwordHash!==pass){
      showStatus('Wrong password', false);
      return;
    }
    if(!data.passwordHash && data.password && data.password!==pass){
      showStatus('Wrong password', false);
      return;
    }

    currentClient=data;
    showStatus('Password OK - Sending SMS to '+data.phone+'...', true);
    confirmationResult=await auth.signInWithPhoneNumber(data.phone, recaptchaVerifier);
    document.getElementById('phoneDisplay').textContent=data.phone + ' (' + (data.countryCode||'') + ')';
    document.getElementById('otpBox').style.display='flex';
    showStatus('Code sent to '+data.phone, true);

  }catch(e){
    console.error(e);
    showStatus('Login failed: '+e.message, false);
  }
}

async function verifyPhoneOTP(){
  const code=document.getElementById('otp').value.trim();
  if(code.length!==6){ showStatus('Enter 6-digit code', false); return; }
  showStatus('Verifying...', true);
  try{
    await confirmationResult.confirm(code);
    // Success
    localStorage.setItem('clientLoggedIn','true');
    localStorage.setItem('clientUsername', currentClient.username);
    localStorage.setItem('clientName', currentClient.fullName||currentClient.username);
    localStorage.setItem('clientPhone', currentClient.phone);
    localStorage.setItem('clientCountryCode', currentClient.countryCode||'+233');
    localStorage.setItem('clientPhoto', currentClient.photoUrl||currentClient.photo||'');
    localStorage.setItem('clientHasAll4','true');
    localStorage.setItem('loginMethod','username+phoneOTP');

    showStatus('Verified! Welcome '+currentClient.username, true);
    await auth.signOut();
    setTimeout(()=>location.replace('client-dashboard.html'),600);
  }catch(e){
    showStatus('Wrong code: '+e.message, false);
  }
}

async function resendOTP(){
  if(!currentClient){ showStatus('Login first', false); return; }
  showStatus('Resending...', true);
  try{ confirmationResult=await auth.signInWithPhoneNumber(currentClient.phone, recaptchaVerifier); showStatus('New code sent to '+currentClient.phone, true); }
  catch(e){ showStatus('Resend failed: '+e.message, false); }
}

async function resetPass(){
  const username=document.getElementById('username').value.trim().toLowerCase();
  if(!username){ showStatus('Enter username to reset', false); return; }
  try{
    const snap=await db.ref('allowedClients/'+username).once('value');
    if(!snap.exists()){ showStatus('Username not found', false); return; }
    const data=snap.val();
    showStatus('Sending reset code to '+data.phone+'...', true);
    confirmationResult=await auth.signInWithPhoneNumber(data.phone, recaptchaVerifier);
    const newPass=prompt('Enter new strong password (must have small, BIG, number, @&+#$ etc):\nExample: Michael@2026');
    if(!newPass) return;
    const code=prompt('Enter 6-digit code sent to '+data.phone+':');
    if(!code) return;
    await confirmationResult.confirm(code);
    // Check strong
    const hasLen=newPass.length>=8, hasSmall=/[a-z]/.test(newPass), hasBig=/[A-Z]/.test(newPass), hasNum=/[0-9]/.test(newPass), hasSpecial=/[@&+#$\-"!%*?_^=<>~`':;|\\\/\(\)\[\]\{\}]/.test(newPass);
    if(!(hasLen && hasSmall && hasBig && hasNum && hasSpecial)){ alert('Weak password! Must have 8+ chars, small, BIG, number, special @&+#$ etc.'); return; }
    const hashed=hashPassword(newPass);
    await db.ref('allowedClients/'+username).update({passwordHash:hashed});
    await db.ref('clients/'+username).update({passwordHash:hashed});
    showStatus('Password reset success - Login with new password', true);
    await auth.signOut();
  }catch(e){ showStatus('Reset failed: '+e.message, false); }
}
</script>
</body></html>
