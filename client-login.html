<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Login</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,Roboto,sans-serif;background:#0c0a1e;color:#ece8ff;min-height:100vh;display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:380px;background:#1e1a3a;border:1px solid rgba(255,255,255,.08);border-radius:0;padding:24px;display:flex;flex-direction:column;gap:14px}
h2{text-align:center;font-size:24px;font-weight:800}input{padding:14px 16px;border-radius:0;border:1px solid rgba(255,255,255,.08);background:rgba(12,10,30,.8);color:#ece8ff;width:100%;font-size:14px;outline:none}
.btn{padding:14px;border-radius:0;border:none;font-weight:800;cursor:pointer;font-size:14px}
.btnLogin{background:#facc15;color:#000}.btnGoogle{background:#fff;color:#1f1f1f;border:1px solid #747775;display:flex;gap:12px;align-items:center;justify-content:center;font-weight:500}
.google-icon{width:20px;height:20px}.divider{display:flex;align-items:center;gap:12px}.divider span{flex:1;height:1px;background:rgba(255,255,255,.08)}.status{padding:10px;border-radius:0;font-size:11px;display:none;text-align:center}.status.ok{background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.3)}.status.err{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}.link{font-size:12px;text-align:center;text-decoration:none;color:#a78bfa}
</style>
</head>
<body>
<div class="card">
<h2>Client Login</h2>
<input id="email" type="email" placeholder="Enter email"><input id="pass" type="password" placeholder="Enter password">
<div id="status" class="status"></div>
<button class="btn btnLogin" onclick="emailLogin()">Login</button>
<div class="divider"><span></span><b>OR</b><span></span></div>
<button class="btn btnGoogle" onclick="googleLogin()">
<svg class="google-icon" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
Continue with Google
</button>
<a href="client-register.html" class="link">No account? Register</a>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth();const db=firebase.database();const dbFS=firebase.firestore();
function showStatus(m,o){const el=document.getElementById('status');el.textContent=m;el.className='status '+(o?'ok':'err');el.style.display='block';console.log(m);}

async function checkClientRegistered(email){
  const eLower=email.toLowerCase().trim();
  console.log("CHECKING REGISTRATION FOR:", eLower);
  const paths=['clients','clientUsers','client_registrations','clientRegistrations','allClients'];
  for(const p of paths){
    try{
      const snap=await db.ref(p).once('value');
      if(snap.exists()){
        let found=false;
        snap.forEach(ch=>{
          const v=ch.val()||{}; const real=v.profile||v.data||v.clientData||v;
          const em=(real.email||real.clientEmail||v.email||'').toLowerCase().trim();
          if(em===eLower){found=true; console.log("✅ FOUND IN", p, em);}
        });
        if(found) return true;
      }
    }catch(e){console.log("Error checking", p, e.message)}
  }
  try{
    const fsSnap=await dbFS.collection('clients').where('email','==',eLower).get();
    if(!fsSnap.empty){console.log("✅ FOUND IN Firestore clients"); return true;}
    const fs2=await dbFS.collection('client_registrations').where('email','==',eLower).get();
    if(!fs2.empty){console.log("✅ FOUND IN Firestore client_registrations"); return true;}
  }catch(e){console.log("Firestore check error", e.message)}
  console.log("⛔ NOT FOUND - NEW USER");
  return false;
}

async function googleLogin(){
  showStatus('Checking Google...', true);
  try{
    const provider=new firebase.auth.GoogleAuthProvider();
    const result=await auth.signInWithPopup(provider);
    const user=result.user;
    const email=(user.email||'').toLowerCase();
    const name=user.displayName||'';
    console.log("GOOGLE EMAIL:", email);

    // ULTRA STRICT CHECK
    const isRegistered=await checkClientRegistered(email);
    
    if(!isRegistered){
      console.log("⛔ NEW USER BLOCKED - DELETING AUTH");
      showStatus('❌ New Gmail not registered! You must Register first — Redirecting...', false);
      try{ await user.delete(); console.log("Auth deleted"); }catch(e){console.log("Delete failed", e.message);}
      await auth.signOut();
      localStorage.clear(); sessionStorage.clear();
      localStorage.setItem('pendingGoogleEmail', email);
      localStorage.setItem('pendingGoogleName', name);
      setTimeout(()=>{location.href='client-register.html?from=google&email='+encodeURIComponent(email)+'&name='+encodeURIComponent(name);}, 1500);
      return;
    }

    // REGISTERED - ALLOW
    console.log("✅ ALLOWED - REGISTERED CLIENT");
    localStorage.setItem('clientLoggedIn','true');
    localStorage.setItem('clientEmail', email);
    localStorage.setItem('clientName', name);
    localStorage.setItem('clientUid', user.uid);
    showStatus('Welcome '+name, true);
    setTimeout(()=>{location.replace('client-dashboard.html');}, 800);
  }catch(e){
    showStatus('Google failed: '+e.message, false);
    console.error(e);
  }
}

function emailLogin(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const pass=document.getElementById('pass').value.trim();
  if(!email||!pass){showStatus('Enter email & password', false);return;}
  auth.signInWithEmailAndPassword(email,pass).then(async()=>{
    const reg=await checkClientRegistered(email);
    if(!reg){showStatus('❌ Not registered — Please register', false);await auth.signOut();setTimeout(()=>{location.href='client-register.html?email='+encodeURIComponent(email);},1500);return;}
    localStorage.setItem('clientLoggedIn','true');localStorage.setItem('clientEmail',email);
    showStatus('Login success', true);setTimeout(()=>{location.replace('client-dashboard.html');},500);
  }).catch(e=>showStatus(e.message,false));
}
</script>
</body>
</html>
