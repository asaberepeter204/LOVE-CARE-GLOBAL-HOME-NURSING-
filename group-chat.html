
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nurses Group Chat - LOVE CARE GLOBAL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#f1f5f9;height:100vh;display:flex;flex-direction:column}
.header{position:sticky;top:0;z-index:1000;background:linear-gradient(90deg,#2563eb,#16a34a);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.chatBox{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px;background:#eef2ff}
.msg{background:#fff;border-radius:14px;padding:10px 12px;max-width:82%;box-shadow:0 2px 8px rgba(0,0,0,.06);border:1px solid #e5e7eb;position:relative}
.msg.me{align-self:flex-end;background:linear-gradient(90deg,#2563eb,#16a34a);color:white;border:none}
.msg.blocked{opacity:.5;border:2px solid #ef4444}
.name{font-weight:900;font-size:10px;color:#2563eb}
.txt{font-size:13px;margin:4px 0;word-break:break-word}
.time{font-size:9px;color:#6b7280;display:flex;justify-content:space-between}
.actions{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.actions button{border:none;padding:4px 8px;border-radius:6px;font-size:10px;font-weight:800;cursor:pointer}
.del{background:#fee2e2;color:#ef4444}.edit{background:#fef3c7;color:#d97706}.blockBtn{background:#111827;color:white}
.inputArea{background:#fff;padding:10px;border-top:2px solid #e5e7eb;display:flex;gap:8px}
.inputArea input{flex:1;padding:13px;border:2px solid #e5e7eb;border-radius:24px;outline:none}
.btnSend{background:linear-gradient(90deg,#2563eb,#16a34a);color:white;border:none;padding:11px 16px;border-radius:24px;font-weight:900;cursor:pointer}
.blockedBanner{background:#fee2e2;border:2px solid #ef4444;color:#991b1b;padding:12px;text-align:center;font-weight:900;font-size:12px;display:none}
.ceoPanel{background:#111827;color:white;padding:10px;border-radius:12px;margin:8px;font-size:11px;display:none}
.loginBlock{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
</style>
</head>
<body>

<div class="header">
<div style="display:flex;align-items:center;gap:8px">
<button onclick="location.href='./nurse-dashboard.html'" style="background:white;color:#2563eb;border:none;padding:6px 10px;border-radius:8px;font-weight:900">←</button>
<div><div style="font-weight:900;font-size:13px">👩‍⚕️ Nurses Group Chat</div><div style="font-size:10px;opacity:.9" id="onlineCount">Secure Chat</div></div>
</div>
<div style="display:flex;gap:5px">
<button onclick="openCeoPanel()" style="background:#facc15;color:#111;border:none;padding:6px 10px;border-radius:8px;font-size:10px;font-weight:900">👑 CEO</button>
<a href="index.html" style="background:white;color:#2563eb;padding:6px 10px;border-radius:8px;text-decoration:none;font-weight:900;font-size:11px">🏠</a>
</div>
</div>

<div id="blockedBanner" class="blockedBanner">🚫 You are BLOCKED by CEO - You can read but cannot chat. Contact CEO: +233 544121814</div>

<div id="ceoPanel" class="ceoPanel">
<div style="font-weight:900;margin-bottom:6px">👑 CEO CONTROL PANEL - PIN: 204204</div>
<div style="display:flex;gap:6px;flex-wrap:wrap">
<button onclick="ceoWipe()" style="background:#ef4444;color:white;border:none;padding:8px 12px;border-radius:8px;font-weight:900;font-size:11px">🧹 WIPE ALL MESSAGES</button>
<button onclick="showBlockList()" style="background:#f59e0b;color:white;border:none;padding:8px 12px;border-radius:8px;font-weight:900;font-size:11px">🚫 BLOCKED LIST</button>
<button onclick="unblockAll()" style="background:#16a34a;color:white;border:none;padding:8px 12px;border-radius:8px;font-weight:900;font-size:11px">✅ UNBLOCK ALL</button>
<button onclick="closeCeoPanel()" style="background:#6b7280;color:white;border:none;padding:8px 12px;border-radius:8px;font-weight:900">Close</button>
</div>
<div id="blockList" style="margin-top:10px;max-height:120px;overflow:auto;background:#1f2937;padding:8px;border-radius:8px;display:none"></div>
</div>

<div id="chatBox" class="chatBox" style="display:none"></div>
<div id="loginBlock" class="loginBlock">
<h2 style="color:#2563eb">🔒 Login Required</h2>
<p style="font-size:13px;color:#6b7280;margin:12px 0">Login as Nurse or Client before chatting</p>
<button onclick="location.href='./nurse-login.html'" style="background:#2563eb;color:white;border:none;padding:12px 20px;border-radius:10px;font-weight:900;margin:6px">👩‍⚕️ Nurse Login</button>
<button onclick="location.href='./client-login.html'" style="background:#16a34a;color:white;border:none;padding:12px 20px;border-radius:10px;font-weight:900;margin:6px">👤 Client Login</button>
</div>

<div id="inputArea" class="inputArea" style="display:none">
<input id="msgInput" placeholder="Type message..." onkeypress="if(event.key==='Enter')sendMsg()">
<button class="btnSend" onclick="sendMsg()">Send ➤</button>
</div>

<script>
let me=null, editId=null;

function getBlocked(){return JSON.parse(localStorage.getItem('loveCareBlocked')||'[]');}
function isBlocked(id,phone){const b=getBlocked();return b.some(x=>x.id===id || x.phone===phone);}

function checkLogin(){
  me=JSON.parse(localStorage.getItem('currentNurse')||'null')||JSON.parse(localStorage.getItem('currentClient')||'null')||JSON.parse(localStorage.getItem('ceoLogged')||'null');
  if(!me){
    document.getElementById('loginBlock').style.display='flex';
    document.getElementById('chatBox').style.display='none';
    document.getElementById('inputArea').style.display='none';
    return false;
  }
  document.getElementById('loginBlock').style.display='none';
  document.getElementById('chatBox').style.display='flex';
  // Check if blocked
  if(isBlocked(me.id,me.phone) &&!me.isCEO){
    document.getElementById('inputArea').style.display='none';
    document.getElementById('blockedBanner').style.display='block';
  } else {
    document.getElementById('inputArea').style.display='flex';
    document.getElementById('blockedBanner').style.display='none';
  }
  return true;
}

function loadChats(){
  if(!checkLogin()) return;
  const chats=JSON.parse(localStorage.getItem('nursesGroupChat')||'[]');
  const box=document.getElementById('chatBox');
  box.innerHTML='';
  if(chats.length===0){
    box.innerHTML=`<div style="text-align:center;color:#6b7280;margin-top:30px;font-size:13px">👋 Welcome ${me.name}!<br>Start chatting<br>CEO can block any nurse</div>`;
  } else {
    chats.forEach((c,idx)=>{
      const isMe = (c.senderId===me.id)||(c.senderId===me.phone);
      const isCEO = me.isCEO;
      const senderBlocked = isBlocked(c.senderId,c.senderPhone);
      box.innerHTML+=`<div class="msg ${isMe?'me':''} ${senderBlocked?'blocked':''}">
        <div class="name">${isMe?'You':c.senderName} ${c.specialty?`• ${c.specialty}`:''} ${senderBlocked?'🚫 BLOCKED':''}</div>
        <div class="txt">${c.text}</div>
        <div class="time"><span>${new Date(c.time).toLocaleTimeString()}</span><span>${c.edited?'(edited)':''}</span></div>
        <div class="actions">
          ${isMe?`<button class="edit" onclick="editMsg(${idx})">✏️ Edit</button><button class="del" onclick="deleteMsg(${idx})">🗑️ Delete</button>`:''}
          ${isCEO?`<button class="blockBtn" onclick="blockUser('${c.senderId}','${c.senderPhone}','${c.senderName}')">${senderBlocked?'✅ Unblock':'🚫 Block'} ${c.senderName}</button><button class="del" onclick="deleteMsg(${idx})">👑 Delete</button>`:''}
        </div>
      </div>`;
    });
  }
  box.scrollTop=box.scrollHeight;
  const nurses=JSON.parse(localStorage.getItem('loveCareNurses')||'[]');
  document.getElementById('onlineCount').innerText=`${me.name} • ${nurses.length} Nurses • ${getBlocked().length} Blocked`;
}

function sendMsg(){
  if(!checkLogin()) return;
  if(isBlocked(me.id,me.phone) &&!me.isCEO){alert('🚫 You are BLOCKED by CEO - Cannot send message');return;}
  const input=document.getElementById('msgInput');
  const text=input.value.trim();
  if(!text) return;
  let chats=JSON.parse(localStorage.getItem('nursesGroupChat')||'[]');
  if(editId!==null){
    chats[editId].text=text;chats[editId].edited=true;chats[editId].time=new Date().toISOString();editId=null;input.placeholder='Type message...';
  } else {
    chats.push({senderId:me.id||me.phone,senderPhone:me.phone||me.id,senderName:me.name,specialty:me.specialty||me.country||'Member',text,time:new Date().toISOString(),edited:false});
  }
  if(chats.length>200) chats.shift();
  localStorage.setItem('nursesGroupChat',JSON.stringify(chats));
  input.value='';loadChats();
}

function editMsg(idx){let chats=JSON.parse(localStorage.getItem('nursesGroupChat')||'[]');const c=chats[idx];if(c.senderId!==me.id && c.senderId!==me.phone &&!me.isCEO){alert('Only your message');return;}document.getElementById('msgInput').value=c.text;document.getElementById('msgInput').placeholder='Editing...';editId=idx;}

function deleteMsg(idx){
  let chats=JSON.parse(localStorage.getItem('nursesGroupChat')||'[]');
  const c=chats[idx];
  if(c.senderId!==me.id && c.senderId!==me.phone &&!me.isCEO){alert('Only your own');return;}
  if(!confirm('Delete message?')) return;
  chats.splice(idx,1);localStorage.setItem('nursesGroupChat',JSON.stringify(chats));loadChats();
}

function blockUser(id,phone,name){
  const pin=prompt('👑 CEO PIN to Block/Unblock:');if(pin!=='204204' && pin!=='0544121814' && pin!=='asabere'){alert('Wrong PIN');return;}
  let blocked=getBlocked();
  const exists=blocked.find(b=>b.id===id || b.phone===phone);
  if(exists){
    blocked=blocked.filter(b=>b.id!==id && b.phone!==phone);
    alert(`✅ Unblocked ${name}`);
  } else {
    if(!confirm(`🚫 Block ${name} (${phone})?\nHe can read but cannot chat`)) return;
    blocked.push({id,phone,name,time:new Date().toISOString()});
    alert(`🚫 Blocked ${name} - Cannot chat again`);
  }
  localStorage.setItem('loveCareBlocked',JSON.stringify(blocked));
  me={id:'CEO',name:'👑 CEO Peter Asabere',isCEO:true,phone:'CEO'};localStorage.setItem('ceoLogged',JSON.stringify(me));
  loadChats();showBlockList();
}

function openCeoPanel(){
  const pin=prompt('👑 CEO PIN (204204):');if(pin!=='204204' && pin!=='0544121814' && pin!=='asabere'){alert('❌ Wrong PIN');return;}
  document.getElementById('ceoPanel').style.display='block';
  me={id:'CEO',name:'👑 CEO Peter Asabere',isCEO:true,phone:'CEO'};localStorage.setItem('ceoLogged',JSON.stringify(me));
  loadChats();
}
function closeCeoPanel(){document.getElementById('ceoPanel').style.display='none';}
function showBlockList(){
  const blocked=getBlocked();
  const div=document.getElementById('blockList');
  div.style.display='block';
  if(blocked.length===0){div.innerHTML='No blocked nurses - All can chat';return;}
  div.innerHTML=blocked.map((b,i)=>`<div style="display:flex;justify-content:space-between;padding:4px;border-bottom:1px solid #374151"><span>${b.name} - ${b.phone} 🚫</span><button onclick="unblockOne('${b.id}')" style="background:#16a34a;color:white;border:none;padding:2px 8px;border-radius:6px;font-size:10px">Unblock</button></div>`).join('');
}
function unblockOne(id){let b=getBlocked();b=b.filter(x=>x.id!==id);localStorage.setItem('loveCareBlocked',JSON.stringify(b));alert('Unblocked');showBlockList();loadChats();}
function unblockAll(){const pin=prompt('CEO PIN to UNBLOCK ALL:');if(pin!=='204204' && pin!=='0544121814'){alert('Wrong');return;}if(!confirm('Unblock ALL nurses?')) return;localStorage.removeItem('loveCareBlocked');alert('✅ All unblocked');closeCeoPanel();loadChats();}
function ceoWipe(){const pin=prompt('CEO PIN to WIPE ALL:');if(pin!=='204204' && pin!=='0544121814' && pin!=='asabere'){alert('Wrong');return;}if(!confirm('⚠️ WIPE ALL MESSAGES?')) return;localStorage.removeItem('nursesGroupChat');localStorage.setItem('nursesGroupChat',JSON.stringify([{senderId:'CEO',senderName:'👑 CEO',specialty:'CEO',senderPhone:'CEO',text:'🧹 CEO wiped all - Fresh start! Keep professional.',time:new Date().toISOString()}]));loadChats();}

setInterval(loadChats,3000);
window.addEventListener('DOMContentLoaded',()=>{checkLogin();loadChats();let chats=JSON.parse(localStorage.getItem('nursesGroupChat')||'[]');if(chats.length===0){chats.push({senderId:'admin',senderName:'Admin',specialty:'Admin',senderPhone:'admin',text:'👋 Welcome! Login required. CEO can Block/Wipe. You can Edit/Delete own.',time:new Date().toISOString()});localStorage.setItem('nursesGroupChat',JSON.stringify(chats));loadChats();}});
</script>
</body>
</html>
