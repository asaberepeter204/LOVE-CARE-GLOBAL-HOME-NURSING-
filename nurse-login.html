<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nurse Login - GLOBAL FIX</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,Roboto,sans-serif;background:#0c0a1e;color:#ece8ff;min-height:100vh;display:grid;place-items:center;padding:16px}.card{width:100%;max-width:380px;background:#1e1a3a;border:1px solid rgba(255,255,255,.08);border-radius:0;padding:24px;display:flex;flex-direction:column;gap:14px}h2{text-align:center;font-size:24px;font-weight:800}input{padding:14px 16px;border-radius:0;border:1px solid rgba(255,255,255,.08);background:rgba(12,10,30,.8);color:#ece8ff;width:100%;font-size:14px;outline:none}.btn{padding:14px;border-radius:0;border:none;font-weight:800;cursor:pointer;font-size:14px}.btnLogin{background:#a855f7;color:#fff}.btnGoogle{background:#fff;color:#1f1f1f;border:1px solid #747775;display:flex;gap:12px;align-items:center;justify-content:center;font-weight:500}.google-icon{width:20px;height:20px}.divider{display:flex;align-items:center;gap:12px}.divider span{flex:1;height:1px;background:rgba(255,255,255,.08)}.status{padding:10px;border-radius:0;font-size:11px;display:none;text-align:center}.status.ok{background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.3)}.status.err{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}.link{font-size:12px;text-align:center;text-decoration:none;color:#a78bfa}</style></head><body><div class="card"><h2>Nurse Login</h2><input id="email" type="email" placeholder="Enter nurse email"><input id="pass" type="password" placeholder="Enter password"><div id="status" class="status"></div><button class="btn btnLogin" onclick="emailLogin()">Login</button><div class="divider"><span></span><b>OR</b><span></span></div><button class="btn btnGoogle" onclick="googleLogin()"><svg class="google-icon" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Continue with Google</button><a href="nurse-registration.html" class="link">No account? Register as Nurse</a></div><script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();
const dbFS=firebase.firestore();

function showStatus(m,ok){const el=document.getElementById('status');el.textContent=m;el.className='status '+(ok?'ok':'err');el.style.display='block';}
function sanitizeEmail(email){ return email.toLowerCase().trim().replace(/[.#$@\[\]]/g,'_'); }

// GLOBAL FIX FOR NURSES: Check registration + CEO acceptance
// Returns: {registered:false} | {registered:true, accepted:false} | {registered:true, accepted:true}
async function checkNurseStatus(email){
  const eLower=email.toLowerCase().trim();
  if(!eLower) return {registered:false, accepted:false};
  const key=sanitizeEmail(eLower);

  // 1. FASTEST: Check allowedNurses whitelist (CEO accepted nurses)
  try{
    const snap=await db.ref('allowedNurses/'+key).once('value');
    if(snap.exists()) return {registered:true, accepted:true, data:snap.val()};
  }catch(e){}

  // 2. Check verified nodes directly
  const verifiedPaths=['verified_nurses','verifiedNurses'];
  for(const p of verifiedPaths){
    try{
      const snap=await db.ref(p+'/'+key).once('value');
      if(snap.exists()) return {registered:true, accepted:true, data:snap.val()};
      const qSnap=await db.ref(p).orderByChild('email').equalTo(eLower).once('value');
      if(qSnap.exists()) return {registered:true, accepted:true};
    }catch(e){}
  }

  // 3. Check nurses node with status
  try{
    const snap=await db.ref('nurses/'+key).once('value');
    if(snap.exists()){
      const v=snap.val();
      const status=(v.status||v.approvalStatus||'').toLowerCase();
      if(status==='verified' || status==='approved' || status==='accepted' || v.isVerified===true || v.isApproved===true){
        return {registered:true, accepted:true, data:v};
      }else{
        return {registered:true, accepted:false, data:v};
      }
    }
    const qSnap=await db.ref('nurses').orderByChild('email').equalTo(eLower).once('value');
    if(qSnap.exists()){
      let accepted=false; let data=null;
      qSnap.forEach(ch=>{
        const v=ch.val();
        const status=(v.status||'').toLowerCase();
        if(status==='verified' || status==='approved' || status==='accepted' || v.isVerified===true) accepted=true;
        data=v;
      });
      return {registered:true, accepted:accepted, data:data};
    }
  }catch(e){}

  // 4. Check pending nodes - registered but not yet accepted
  const pendingPaths=['pending_nurses','pendingNurses','nurseApplications','nurse_registrations','nurseRegistrations'];
  for(const p of pendingPaths){
    try{
      const snap=await db.ref(p+'/'+key).once('value');
      if(snap.exists()) return {registered:true, accepted:false, data:snap.val()};
      const qSnap=await db.ref(p).orderByChild('email').equalTo(eLower).once('value');
      if(qSnap.exists()) return {registered:true, accepted:false};
      const qSnap2=await db.ref(p).orderByChild('email').equalTo(eLower).once('value');
      if(qSnap2.exists()) return {registered:true, accepted:false};
    }catch(e){}
  }

  // 5. Firestore fallback
  try{
    const fs1=await dbFS.collection('nurses').where('email','==',eLower).get();
    if(!fs1.empty){
      let accepted=false;
      fs1.forEach(doc=>{
        const v=doc.data();
        if(v.status==='verified' || v.isVerified) accepted=true;
      });
      return {registered:true, accepted:accepted};
    }
    const fs2=await dbFS.collection('nurseApplications').where('email','==',eLower).get();
    if(!fs2.empty) return {registered:true, accepted:false};
  }catch(e){}

  return {registered:false, accepted:false};
}

async function googleLogin(){
  showStatus('Checking Google...', true);
  try{
    const provider=new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});
    const result=await auth.signInWithPopup(provider);
    const user=result.user;
    const email=(user.email||'').toLowerCase().trim();
    const name=user.displayName||'';

    const status=await checkNurseStatus(email);
    
    if(!status.registered){
      showStatus('❌ Not registered as nurse. Redirecting...', false);
      try{
        await db.ref('blockedNurseLogins/'+sanitizeEmail(email)).set({
          email:email, name:name, blockedAt:Date.now(), reason:'Google login without nurse registration', uid:user.uid
        });
      }catch(e){}
      await auth.signOut();
      localStorage.clear();
      sessionStorage.clear();
      localStorage.setItem('pendingNurseEmail', email);
      localStorage.setItem('pendingNurseName', name);
      setTimeout(()=>{
        location.href='nurse-registration.html?from=google_block&email='+encodeURIComponent(email)+'&name='+encodeURIComponent(name);
      },1500);
      return;
    }

    if(!status.accepted){
      showStatus('⏳ Registered but not yet accepted by CEO. Pending approval...', false);
      await auth.signOut();
      localStorage.clear();
      setTimeout(()=>{
        alert('⏳ Your nurse registration is pending CEO approval.\n\nEmail: '+email+'\n\nYou registered but CEO has not yet verified you.\nPlease wait for CEO acceptance. You will be notified.');
        location.href='nurse-registration.html?from=pending&email='+encodeURIComponent(email);
      },1500);
      return;
    }

    // ALLOWED: Registered + Accepted
    localStorage.setItem('nurseLoggedIn','true');
    localStorage.setItem('nurseEmail', email);
    localStorage.setItem('nurseName', status.data?.name || name);
    localStorage.setItem('nurseUid', user.uid);
    localStorage.setItem('loginMethod','google');

    showStatus('Welcome '+name+' - Login success', true);
    setTimeout(()=>{location.replace('nurse-dashboard.html');}, 800);

  }catch(e){
    console.error(e);
    showStatus('Google login failed: '+e.message, false);
    try{ await auth.signOut(); }catch(_){}
  }
}

async function emailLogin(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const pass=document.getElementById('pass').value.trim();
  if(!email||!pass){showStatus('Enter email & password', false);return;}
  
  showStatus('Checking...', true);
  
  const status=await checkNurseStatus(email);
  if(!status.registered){
    showStatus('❌ Email not registered as nurse. Please register first.', false);
    setTimeout(()=>{
      localStorage.setItem('pendingNurseEmail', email);
      location.href='nurse-registration.html?from=email_block&email='+encodeURIComponent(email);
    },1500);
    return;
  }
  if(!status.accepted){
    showStatus('⏳ Not yet accepted by CEO. Pending approval.', false);
    setTimeout(()=>{
      alert('⏳ Your application is pending CEO approval.\nEmail: '+email);
    },800);
    return;
  }

  auth.signInWithEmailAndPassword(email,pass).then(()=>{
    localStorage.setItem('nurseLoggedIn','true');
    localStorage.setItem('nurseEmail',email);
    localStorage.setItem('loginMethod','email');
    showStatus('Login success', true);
    setTimeout(()=>{location.replace('nurse-dashboard.html');},500);
  }).catch(e=>showStatus(e.message,false));
}
</script></body></html>
