<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nurse Login — LOVE CARE GLOBAL — Auto Dashboard</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet"><script>// Auto-redirect if already logged in as nurse — Direct to nurses-dashboard.html(function(){  try{    const uid=localStorage.getItem('lcg_nurse_uid') || localStorage.getItem('nurseUid');    const logged=localStorage.getItem('lcg_logged_in');    const role=(localStorage.getItem('lcg_role')||'').toLowerCase();    const expiry=parseInt(localStorage.getItem('lcg_session_expiry')||'0');    const now=Date.now();    if(uid && (role==='nurse' || logged==='true')){      if(!expiry || now < expiry){        console.log('Already logged in as nurse — Redirecting directly to nurses-dashboard.html');        window.location.replace('nurses-dashboard.html');        return;      }    }  }catch(e){}})();function toggleEye(id, btn){  const input=document.getElementById(id);  const open=btn.querySelector('.eye-open');  const closed=btn.querySelector('.eye-closed');  if(input.type==='password'){input.type='text'; open.style.display='none'; closed.style.display='block';}  else{input.type='password'; open.style.display='block'; closed.style.display='none';}}window.toggleEye=toggleEye;</script><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0e0a1c;color:#e8e0ff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 380px at 14% 10%, rgba(76,29,149,.22) 0%, transparent 65%),linear-gradient(180deg,#0e0a1c 0%, #120e26 100%)}.wrap{width:100%;max-width:440px}.card{background:rgba(28,18,56,.92);border:1px solid rgba(168,85,247,.18);border-radius:24px;padding:26px;box-shadow:0 20px 50px rgba(0,0,0,.6)}.logo{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#d8b4fe);display:grid;place-items:center;margin:0 auto 12px;font-size:28px}h1{text-align:center;font-weight:800;font-size:22px;color:#f3e8ff}.sub{text-align:center;font-size:11px;color:#a78bfa;margin:6px 0 18px}label{font-size:11px;font-weight:800;margin:12px 0 6px;display:block;color:#c4b5fd;text-transform:uppercase}.inputWrap{position:relative;display:flex;align-items:center}.inputWrap input{width:100%;padding:13px 44px 13px 14px;border-radius:14px;border:1.5px solid rgba(168,85,247,.18);background:rgba(14,10,28,.6);color:#f3e8ff;font-size:13px;outline:none}input{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid rgba(168,85,247,.18);background:rgba(14,10,28,.6);color:#f3e8ff;font-size:13px;outline:none}input:focus{border-color:#a855f7;background:rgba(14,10,28,.9)}.eyeBtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:rgba(76,29,149,.25);border:1px solid rgba(168,85,247,.25);width:36px;height:36px;border-radius:10px;cursor:pointer;display:grid;place-items:center}.btn{width:100%;padding:13px;border-radius:14px;font-weight:800;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;margin-top:12px;text-decoration:none;transition:.2s;min-height:48px;pointer-events:auto!important}.btnPrimary{background:linear-gradient(135deg,#a855f7,#d8b4fe);color:#1e0a3a}.btnDark{background:rgba(14,10,28,.8);border:1px solid rgba(168,85,247,.18);color:#e9d5ff}.btnGoogle{background:#FFFFFF;color:#1F1F1F;border:1px solid #747775;border-radius:20px;height:44px;font-family:'Roboto',Inter,Arial,sans-serif;font-size:14px;font-weight:500;letter-spacing:0.25px;box-shadow:0 1px 2px rgba(0,0,0,0.08), 0 1px 3px 1px rgba(0,0,0,0.08);display:flex;align-items:center;justify-content:center;gap:12px;padding:0 16px}.btnGoogle:hover{background:#F8FAFF}.google-icon-wrap{width:20px;height:20px;background:#FFFFFF;border-radius:50%;display:grid;place-items:center;flex-shrink:0}.divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:#6b5b8a;font-size:11px;font-weight:800}.divider::before,.divider::after{content:"";flex:1;height:1px;background:rgba(168,85,247,.15)}.alert{padding:11px;border-radius:10px;font-size:11px;font-weight:700;margin:10px 0;border:1px solid;display:none}.alert.show{display:block}.alert-error{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.3);color:#fca5a5}.alert-success{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.3);color:#86efac}.alert-info{background:rgba(59,130,246,.14);border-color:rgba(59,130,246,.3);color:#93c5fd}</style></head><body><div class="bg"></div><div class="wrap"><div class="card"><div class="logo">👩‍⚕️</div><h1>Nurse Login</h1><p class="sub">LOVE CARE GLOBAL HOME NURSING</p><button class="btn btnGoogle" onclick="googleLogin()" type="button">  <span class="google-icon-wrap">    <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"/>      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>      <path fill="none" d="M0 0h48v48H0z"/>    </svg>  </span>  Continue with Google</button><div class="divider">OR</div><label>Email Address</label><input id="email" type="email" placeholder="nurse@email.com"><label>Password</label><div class="inputWrap"> gin failed: '+e.message,'alert-error'); }}window.googleLogin=async()=>{  try{    showMsg('Opening Google... Direct to nurses-dashboard.html on success','alert-info');    const provider=new GoogleAuthProvider();    const cred=await signInWithPopup(auth, provider);    const user=cred.user;    localStorage.setItem('lcg_nurse_uid', user.uid);    localStorage.setItem('nurseUid', user.uid);    localStorage.setItem('currentNurseId', user.uid);    localStorage.setItem('lcg_logged_in','true');    localStorage.setItem('lcg_role','nurse');    localStorage.setItem('lcg_session_expiry', (Date.now()+30*60*1000).toString());    localStorage.removeItem('lcg_client_uid');    showMsg('Google success! Going directly to nurses-dashboard.html...','alert-success');    setTimeout(()=>{ redirectToNursesDashboard(); }, 700);  }catch(e){ showMsg('Google login failed: '+e.message,'alert-error'); }}</script></body></html>
