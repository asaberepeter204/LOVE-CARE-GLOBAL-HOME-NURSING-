<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";

const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const rtdb=getDatabase(app);

function showMsg(t,type='alert-error'){const el=document.getElementById('msg');el.textContent=t;el.className='alert show '+type;}
function sanitizeEmail(e){return e.toLowerCase().trim().replace(/[.#$@\[\]]/g,'_');}
function toggleEye(){const i=document.getElementById('password');i.type=i.type==='password'?'text':'password';}
window.toggleEye=toggleEye;

function extractField(obj, keys){
  if(!obj) return null;
  for(const k of keys){const v=obj[k]; if(v && typeof v==='string' && v.trim().length>3) return v.trim();}
  return null;
}

// ===== FIXED CHECK: PHOTO + PHONE + VIDEO + CEO APPROVAL - CHECKS ALL PATHS =====
async function checkNurseCompleteAndApproved(uid, email){
  let merged={}; let found=false;
  const eLower=(email||'').toLowerCase().trim();
  const emailKey=sanitizeEmail(eLower);
  
  // Helper to merge
  function mergeData(newData){
    if(newData && typeof newData==='object'){
      merged={...merged, ...newData};
      found=true;
    }
  }
  
  // 1. Firestore nurses/{uid}
  try{const s=await getDoc(doc(db,'nurses',uid)); if(s.exists()){mergeData(s.data()); console.log('Found in Firestore nurses/'+uid);}}catch(e){console.log('Firestore nurses/'+uid+' error', e.message);}
  if(eLower){
    try{
      const q=query(collection(db,'nurses'),where('email','==',eLower),limit(1)); 
      const qs=await getDocs(q); 
      if(!qs.empty){mergeData(qs.docs[0].data()); console.log('Found in Firestore nurses by email');}
    }catch(e){}
  }
  
  // 2. RTDB nurses/{uid} - MAIN
  try{const s=await get(ref(rtdb,'nurses/'+uid)); if(s.exists()){mergeData(s.val()); console.log('Found in RTDB nurses/'+uid);}}catch{}
  
  // 3. allowedNurses - CEO whitelist - MOST IMPORTANT FOR APPROVAL
  if(eLower){
    try{const s=await get(ref(rtdb,'allowedNurses/'+emailKey)); if(s.exists()){mergeData(s.val()); console.log('Found in allowedNurses/'+emailKey);}}catch{}
  }
  try{const s=await get(ref(rtdb,'allowedNursesByUid/'+uid)); if(s.exists()){mergeData(s.val()); console.log('Found in allowedNursesByUid/'+uid);}}catch{}
  
  // 4. Check other RTDB paths
  const otherPaths=[
    'pending_nurses/'+uid,
    'pendingNurses/'+uid,
    'allNurses/'+uid,
    'nurse_registrations/'+uid,
    'nurseApplications/'+uid,
    'nurseUsers/'+uid,
    'ceoNurseUpdates/'+uid,
    'ceoRegistrationCenter/nurses/'+uid,
    'verified_nurses/'+uid,
    'allowedNurses/'+uid
  ];
  for(const path of otherPaths){
    try{
      const s=await get(ref(rtdb,path)); 
      if(s.exists()){
        mergeData(s.val()); 
        console.log('Found in '+path);
      }
    }catch{}
  }
  
  // 5. Firestore ceoRegistrationCenter
  try{const s=await getDoc(doc(db,'ceoRegistrationCenter/nurses/'+uid)); if(s.exists()){mergeData(s.data()); console.log('Found in Firestore ceoRegistrationCenter/nurses/'+uid);}}catch{}
  if(eLower){
    try{
      const q=query(collection(db,'ceoRegistrationCenter/nurses'),where('email','==',eLower),limit(1));
      const qs=await getDocs(q);
      if(!qs.empty){mergeData(qs.docs[0].data()); console.log('Found in Firestore ceoRegistrationCenter by email');}
    }catch{}
  }

  // Extract fields - check MANY possible keys
  let photo = extractField(merged, ['photoURL','photoUrl','photo','clientPhotoUrl','profilePhoto','avatar','image','photoURL_firestore','nursePhoto']);
  let video = extractField(merged, ['videoURL','videoUrl','video','introVideo','videoFile','nurseVideo']);
  let phone = extractField(merged, ['phone','phoneNumber','clientPhone','mobile','tel','phoneNo','nursePhone']);
  
  // Check approval - ANY true means approved - VERY LENIENT
  let approved=false;
  let approvalSource='none';
  
  const approvedChecks=[
    {val: merged.isApproved, source: 'isApproved'},
    {val: merged.approved, source: 'approved'},
    {val: merged.canLogin, source: 'canLogin'},
    {val: merged.isVerified, source: 'isVerified'},
    {val: merged.ceoApproved, source: 'ceoApproved'},
    {val: merged.status==='approved', source: 'status=approved'},
    {val: merged.status==='Approved', source: 'status=Approved'},
    {val: merged.verified, source: 'verified'},
  ];
  
  for(const check of approvedChecks){
    if(check.val===true){
      approved=true;
      approvalSource=check.source;
      console.log('APPROVED via', check.source);
      break;
    }
  }
  
  // Also check if exists in allowedNurses = approved
  if(!approved){
    try{
      const allowedSnap=await get(ref(rtdb,'allowedNurses/'+emailKey));
      if(allowedSnap.exists()){
        approved=true;
        approvalSource='allowedNurses exists';
        console.log('APPROVED via allowedNurses exists');
      }
    }catch{}
  }
  if(!approved){
    try{
      const allowedUidSnap=await get(ref(rtdb,'allowedNursesByUid/'+uid));
      if(allowedUidSnap.exists()){
        approved=true;
        approvalSource='allowedNursesByUid exists';
        console.log('APPROVED via allowedNursesByUid exists');
      }
    }catch{}
  }
  
  console.log('Final check:', {uid, email:eLower, found, approved, approvalSource, photo:!!photo, phone:!!phone, video:!!video, mergedKeys:Object.keys(merged)});
  
  // Check if registered - has ANY data in nurse paths
  const isRegistered = found || !!merged.email || !!merged.fullName || !!merged.name || Object.keys(merged).length > 0;
  
  // Missing check - ONLY require photo and phone, video optional if CEO approved
  let missing=[];
  if(!photo) missing.push('photo');
  if(!phone) missing.push('phone');
  // Video is nice to have but not blocking if approved
  if(!video && !approved){
    missing.push('video');
  }
  
  const complete = missing.length===0 || (approved && photo && phone); // If approved and has photo+phone, allow even if video missing
  return {complete, approved, missing, data:merged, photo, video, phone, approvalSource, approvedValue:approved, isRegistered, found};
}
  
  if(!found) return {complete:false, approved:false, missing:['profile'], reason:'No nurse profile - Register first', data:{}};

  const photo=extractField(merged,['photoURL','photoUrl','photo','image','nursePhoto','nursePhotoUrl']);
  const video=extractField(merged,['videoURL','videoUrl','video','introVideo','profileVideo','nurseVideo','introVideoUrl']);
  const phone=extractField(merged,['phone','phoneNumber','mobile','nursePhone']);

  const missing=[];
  if(!photo) missing.push('photo');
  if(!video) missing.push('video');
  if(!phone) missing.push('phone');

  // CEO APPROVAL CHECK from ceo-registration-center
  let approved=false;
  let approvalSource='';
  // Check 1: nurses/{uid} isApproved / canLogin / status
  if(merged.isApproved===true || merged.approved===true || merged.canLogin===true || merged.status==='approved' || merged.isApproved==='true') {approved=true; approvalSource='nurses/'+uid;}
  // Check 2: ceoRegistrationCenter/nurses/{uid}
  if(!approved){
    try{const s=await get(ref(rtdb,'ceoRegistrationCenter/nurses/'+uid)); if(s.exists()){const v=s.val(); if(v.isApproved===true || v.approved===true || v.canLogin===true || v.status==='approved' || v.isApproved==='true'){approved=true; approvalSource='ceoRegistrationCenter/nurses'; merged={...merged,...v};}}}catch{}
  }
  // Check 3: ceoNurseUpdates/{uid}
  if(!approved){
    try{const s=await get(ref(rtdb,'ceoNurseUpdates/'+uid)); if(s.exists()){const v=s.val(); if(v.isApproved===true || v.approved===true || v.canLogin===true || v.status==='approved'){approved=true; approvalSource='ceoNurseUpdates';}}}catch{}
  }
  // Check 4: allowedNurses has approval
  if(!approved && eLower){
    try{const k=sanitizeEmail(eLower); const s=await get(ref(rtdb,'allowedNurses/'+k)); if(s.exists()){const v=s.val(); if(v.isApproved===true || v.approved===true || v.canLogin===true || v.status==='approved'){approved=true; approvalSource='allowedNurses';}}}catch{}
  }
  // Check 5: Firestore ceoRegistrationCenter/nurses/{uid}
  if(!approved){
    try{const s=await getDoc(doc(db,'ceoRegistrationCenter','nurses',uid)); if(s.exists()){const v=s.data(); if(v.isApproved===true || v.approved===true){approved=true; approvalSource='firestore ceoRegistrationCenter';}}}catch{}
    try{const s=await getDoc(doc(db,'ceoRegistrationCenter/nurses/'+uid));}catch{}
  }

  const complete = missing.length===0;
  return {complete, approved, missing, data:merged, photo, video, phone, approvalSource, approvedValue:approved};
}

async function handleFailedLogin(user, missing, approved, reason, isRegistered=false){
  const email=user.email||'';
  const uid=user.uid||'';
  console.log('FAILED LOGIN - Smart delete check', {missing, approved, email, isRegistered, reason});
  
  if(!approved){
    if(isRegistered){
      // CASE 1: Nurse already registered, waiting for CEO approval - DON'T DELETE, just block
      showMsg(`â³ WAITING FOR CEO APPROVAL\n\nYou have registered as nurse.\nEmail: ${email}\n\nCEO has NOT approved you yet in ceo-registration-center.html\n\n${missing.length? 'Missing: '+missing.join(', ')+'. ' : ''}Reason: ${reason||'Pending CEO approval'}\n\nYour account is SAFE and saved. Wait for CEO approval, then login again. You will NOT need to re-register.`, 'alert-error');
      try{ await signOut(auth); }catch{}
      // Keep auth user, keep local data for retry
      localStorage.setItem('pendingApprovalEmail', email);
      localStorage.setItem('pendingApprovalUid', uid);
      console.log('Registered nurse waiting approval - Auth KEPT, not deleted');
    } else {
      // CASE 2: Random Google login, never registered as nurse - DELETE to prevent email save
      showMsg(`âŒ NOT A REGISTERED NURSE\n\nEmail ${email} never registered as nurse.\n\nYou must first register at nurse-registration.html with Photo + ID + Licence + Video.\n\nThis login attempt will be removed to prevent unauthorized access.\n\nReason: ${reason||'Not registered'}`, 'alert-error');
      try{
        console.log('Random unregistered Google login - DELETING auth user to prevent email save');
        await deleteUser(user);
        console.log('Auth user DELETED - unregistered email not saved');
      }catch(delErr){
        console.log('Delete failed, signing out', delErr.message);
        try{await signOut(auth);}catch{}
      }
      // Clear all nurse localStorage
      try{
        const keys=['lcg_nurse_uid','nurseUid','currentNurseId','uid','lcg_nurse_email','currentNurseEmail','nurseEmail','nurseName','fullName','currentNurseName','lcg_logged_in','lcg_role','lcg_session_expiry','nurseProfile','nursePhoto','nursePhotoUrl','nurseVideo','nursePhone'];
        keys.forEach(k=>{try{localStorage.removeItem(k); sessionStorage.removeItem(k);}catch{}});
      }catch{}
      setTimeout(()=>{ window.location.href=`nurse-registration.html?error=not_registered&email=${encodeURIComponent(email)}`; }, 2500);
    }
  } else {
    // Approved but missing fields
    showMsg(`âŒ LOGIN BLOCKED - Approved but ${missing.length? 'Missing: '+missing.join(', ')+'. ' : ''}Reason: ${reason||''}\n\nYour account is SAFE. Please complete profile.`, 'alert-error');
    try{ await signOut(auth); }catch{}
  }
}

async function isClientAccount(email){
  const eLower=email.toLowerCase().trim(); const key=sanitizeEmail(eLower);
  try{const s=await get(ref(rtdb,'allowedClients/'+key)); if(s.exists()) return true;}catch{}
  try{const s=await get(ref(rtdb,'clients')); if(s.exists()){let f=false; s.forEach(ch=>{const v=ch.val()||{}; const em=(v.email||v.profile?.email||'').toLowerCase(); if(em===eLower) f=true;}); if(f) return true;}}catch{}
  try{const q=query(collection(db,'clients'),where('email','==',eLower),limit(1)); const qs=await getDocs(q); if(!qs.empty) return true;}catch{}
  return false;
}

function saveNurseSession(user, name){
  localStorage.setItem('lcg_nurse_uid',user.uid); localStorage.setItem('nurseUid',user.uid);
  localStorage.setItem('currentNurseId',user.uid); localStorage.setItem('nurseName',name);
  localStorage.setItem('lcg_nurse_email',user.email||''); localStorage.setItem('nurseEmail',user.email||'');
  localStorage.setItem('lcg_logged_in','true'); localStorage.setItem('lcg_role','nurse');
  localStorage.setItem('lcg_session_expiry',(Date.now()+24*60*60*1000).toString());
  ['lcg_client_uid','currentClientId'].forEach(k=>localStorage.removeItem(k));
}

function redirectToDashboard(){ showMsg('âœ… Approved! Redirecting to dashboard...','alert-success'); setTimeout(()=>{window.location.replace('nurses-dashboard.html');}, 800);}

onAuthStateChanged(auth, async (user)=>{
  if(user && (localStorage.getItem('lcg_nurse_uid')||localStorage.getItem('lcg_role')==='nurse')){
    if(localStorage.getItem('lcg_client_uid')) return;
    const check=await checkNurseCompleteAndApproved(user.uid, user.email);
    if(!check.approved){
      console.log('Auto-login: not approved yet, staying on login page');
      // Don't block auto-login aggressively, just show message and stay
      showMsg(`â³ Waiting for CEO approval â€” Your account exists but CEO hasn't approved yet.\nApproval source checked: ${check.approvalSource||'none'}. Please wait or contact CEO.`, 'alert-info');
      return;
    }
    if(!check.complete){
      console.log('Auto-login: approved but incomplete', check.missing, 'isRegistered', check.isRegistered);
      if(check.approved && check.photo && check.phone){
        console.log('Approved + has photo+phone, allowing login despite missing', check.missing);
      } else if(!check.isRegistered){
        console.log('Auto-login: not registered at all, blocking');
        await handleFailedLogin(user, check.missing, check.approved, 'Auto-login blocked - not registered', false);
        return;
      } else {
        showMsg(`âš ï¸ Profile incomplete: ${check.missing.join(', ')}. But CEO approved, so you can login. Please complete profile later.`, 'alert-info');
      }
    }
    try{localStorage.setItem('nursePhoto',check.photo||''); localStorage.setItem('nurseVideo',check.video||''); localStorage.setItem('nursePhone',check.phone||'');}catch{}
    redirectToDashboard();
  }
});

window.emailLogin=async()=>{
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  if(!email||!password){showMsg('Enter email and password','alert-error'); return;}
  try{
    showMsg('Checking CLIENT block + CEO approval...','alert-info');
    if(await isClientAccount(email)){showMsg('âŒ CLIENT email - Use Client Login','alert-error'); return;}
    const cred=await signInWithEmailAndPassword(auth,email,password);
    const user=cred.user;
    if(await isClientAccount(user.email||email)){showMsg('âŒ CLIENT account blocked','alert-error'); await signOut(auth); return;}
    
    const check=await checkNurseCompleteAndApproved(user.uid, user.email||email);
    console.log('Login check result:', check);
    
    if(!check.approved){
      await handleFailedLogin(user, check.missing, false, 'No CEO approval yet - CEO must approve in ceo-registration-center.html. Found data: '+(check.data?Object.keys(check.data).join(','):'none')+' Approval source: '+(check.approvalSource||'none'), check.isRegistered);
      return;
    }
    // If approved, allow login even if some fields missing (CEO approval is main gate)
    if(!check.complete){
      if(check.photo && check.phone){
        console.log('Approved and has photo+phone, allowing login despite missing:', check.missing);
        showMsg(`âœ… CEO Approved! Profile has minor missing: ${check.missing.join(', ')}. Logging in anyway...`, 'alert-success');
      } else {
        await handleFailedLogin(user, check.missing, true, `Approved but missing critical: ${check.missing.join(', ')} - Please add photo/phone`, check.isRegistered);
        return;
      }
    }
    let displayName=check.data.fullName||check.data.name||user.displayName||email.split('@')[0];
    saveNurseSession(user, displayName);
    localStorage.setItem('nursePhoto',check.photo); localStorage.setItem('nurseVideo',check.video); localStorage.setItem('nursePhone',check.phone);
    redirectToDashboard();
  }catch(e){
    let m=e.message; if(m.includes('invalid-credential')) m='Wrong email/password';
    showMsg('Login failed: '+m,'alert-error');
  }
}

window.googleLogin=async()=>{
  try{
    showMsg('Opening Google...','alert-info');
    const provider=new GoogleAuthProvider();
    const cred=await signInWithPopup(auth,provider);
    const user=cred.user;
    if(await isClientAccount(user.email)){showMsg('âŒ CLIENT email - Use Client Login','alert-error'); await handleFailedLogin(user, ['client'], false, 'Client email blocked'); return;}
    
    showMsg('ðŸ” Checking photo, video, phone + CEO approval...','alert-info');
    const check=await checkNurseCompleteAndApproved(user.uid, user.email);
    if(!check.approved){
      await handleFailedLogin(user, check.missing, false, 'CEO approval pending - ceo-registration-center must approve. Source: '+(check.approvalSource||'none'), check.isRegistered);
      return;
    }
    if(!check.complete && (!check.photo || !check.phone)){
      await handleFailedLogin(user, check.missing, true, 'Approved but missing photo/phone', check.isRegistered);
      return;
    }
    const displayName=check.data.fullName||user.displayName||user.email.split('@')[0];
    saveNurseSession(user, displayName);
    localStorage.setItem('nursePhoto',check.photo); localStorage.setItem('nurseVideo',check.video); localStorage.setItem('nursePhone',check.phone);
    redirectToDashboard();
  }catch(e){showMsg('Google login failed: '+e.message,'alert-error');}
}
</script>
