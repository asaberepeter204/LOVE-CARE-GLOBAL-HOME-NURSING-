<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nurse Login - LOVE CARE GLOBAL HOME NURSING</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2563eb">
<style>
body{font-family:Inter,system-ui,sans-serif;margin:0;background:linear-gradient(135deg,#f0fdf4,#eff6ff);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:70px 20px 20px}
.card{max-width:400px;width:100%;background:white;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(37,99,235,0.15);border-top:5px solid #2563eb}
h1{color:#2563eb;text-align:center;margin:0}
input{width:100%;padding:14px;margin:8px 0;border:2px solid #e5e7eb;border-radius:10px;box-sizing:border-box;font-size:15px}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#2563eb,#7c3aed);color:white;border:none;border-radius:10px;font-weight:900;font-size:16px;cursor:pointer;margin-top:10px}
a{color:#7c3aed;font-weight:800;text-decoration:none}
.header{position:fixed;top:0;left:0;right:0;background:linear-gradient(90deg,#16a34a,#2563eb);color:white;padding:12px 16px;display:flex;justify-content:space-between;z-index:1000}
.status-pending{background:#fef3c7;color:#92400e;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:800}
.status-approved{background:#d1fae5;color:#065f46;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:800}
</style>
</head>
<body>
<div class="header"><div><strong>LOVE CARE GLOBAL HOME NURSING</strong><br><small>Nurse Portal</small></div><div><a href="index.html" style="color:white">🏠 Home</a></div></div>
<div class="card">
<h1>👩‍⚕️ Nurse Login</h1>
<p style="text-align:center;font-size:12px;color:#666">Official: https://asaberepeter204.github.io/LOVE-CARE-GLOBAL-HOME-NURSING-/</p>
<input type="tel" id="nPhone" placeholder="Phone Number *">
<input type="password" id="nPass" placeholder="Password / Phone again">
<button class="btn" onclick="nurseLogin()">Login to Dashboard</button>
<div id="statusMsg" style="margin-top:15px;text-align:center"></div>
<p style="text-align:center;margin-top:15px">Not registered? <a href="nurse-public.html">Join as Nurse</a></p>
<p style="text-align:center"><a href="index.html">Home</a> | <a href="privacy-policy.html">Privacy</a> | <a href="contact.html">Contact</a></p>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
const app=initializeApp({databaseURL:"https://love-care-global-default-rtdb.firebaseio.com"}); 
const db=getDatabase(app);
window.nurseLogin=async function(){
 const phone=document.getElementById('nPhone').value;
 if(!phone){alert('Enter phone');return;}
 const id=phone.replace(/[^0-9]/g,'');
 const snap=await get(ref(db,'nurses/'+id));
 const msg=document.getElementById('statusMsg');
 if(!snap.exists()){msg.innerHTML='<span class="status-pending">❌ Not found. Please register first.</span>';return;}
 const data=snap.val();
 localStorage.setItem('nursePhone',phone);
 localStorage.setItem('nurseName',data.name||'Nurse');
 if(data.status==='pending'){msg.innerHTML='<span class="status-pending">⏳ Application Pending - CEO Reviewing</span><br><br><a href="nurse-dashboard.html">View Dashboard Anyway</a>';}
 else {msg.innerHTML='<span class="status-approved">✅ Approved - Redirecting...</span>'; setTimeout(()=>window.location.href='nurse-dashboard.html',1000);}
}
</script>
</body>
</html>
