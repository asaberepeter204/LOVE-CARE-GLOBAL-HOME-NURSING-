<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nurse Login - FIXED ALL 5 Check</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0e0a1c;color:#e8e0ff;min-height:100vh;display:grid;place-items:center;padding:16px}.card{width:100%;max-width:380px;background:#1e1238;border:1px solid rgba(168,85,247,.15);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px}input{padding:14px;border-radius:12px;border:1px solid rgba(168,85,247,.2);background:rgba(14,10,28,.8);color:white;width:100%}.btn{padding:14px;border-radius:12px;border:none;font-weight:900;cursor:pointer}.btnLogin{background:linear-gradient(135deg,#a855f7,#d8b4fe);color:#1e0a3a}.btnGoogle{background:white;color:#1f1f1f;display:flex;gap:10px;align-items:center;justify-content:center}.status{padding:10px;border-radius:10px;font-size:11px;display:none;text-align:center}.status.ok{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.3)}.status.err{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}</style>
</head><body>
<div class="card">
<h2 style="text-align:center">Nurse Login - FIXED</h2>
<input id="email" type="email" placeholder="Enter email">
<input id="pass" type="password" placeholder="Enter password">
<div id="status" class="status"></div>
<button class="btn btnLogin" onclick="emailLogin()">Login</button>
<button class="btn btnGoogle" onclick="googleLogin()">Continue with Google</button>
<a href="nurses-registration.html" style="text-align:center;color:#a78bfa;font-size:12px;text-decoration:none">No account? Register as Nurse</a>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();
const fs=firebase.firestore();

function showStatus(m,ok){ const el=document.getElementById('status'); el.textContent=m; el.className='status '+(ok?'ok':'err'); el.style.display='block'; }
function sanitizeEmail(email){ return email.toLowerCase().trim().replace(/[.#$@\[\]]/g,'_'); }

// ===== FIXED: CHECK ALL 5 EXACTLY LIKE CEO DASHBOARD DOES =====
async function isNurseFullyRegistered(email, uid=null){
  const eLower = email.toLowerCase().trim();
  const key = sanitizeEmail(eLower);
  let result = {ok:false, data:null, checks:{email:false,name:false,photo:false,phone:false,video:false, id:false, licence:false, approved:false}};

  // Helper to evaluate a nurse object for ALL 5
  function evaluate(v){
    const real = v.profile || v;
    const hasEmail = !!(real.email || v.email || real.nurseEmail);
    const hasName = !!(real.fullName || real.name || real.displayName || v.fullName || v.name);
    const hasPhone = !!(real.phone || real.phoneNumber || real.mobile || v.phone || v.phoneNumber);
    const hasPhoto = !!(real.photoUrl || real.photo || real.photoURL || real.avatar || v.photoUrl || v.photo || real.profilePhoto || v.profilePhoto || real.nursePhoto || v.nursePhoto);
    const hasVideo = !!(real.videoUrl || real.video || real.videoURL || real.selfieVideo || real.introVideo || v.videoUrl || v.video || real.videoLink || v.videoLink || real.nurseVideo || v.nurseVideo);
    const hasID = !!(real.idUrl || real.idCard || real.ghanaCard || real.nationalId || v.idUrl || real.idPhoto);
    const hasLicence = !!(real.licenceUrl || real.licenseUrl || real.licence || real.license || real.nmcLicence || v.licenceUrl);
    const phoneLen = String(real.phone || real.phoneNumber || v.phone || '').replace(/\D/g,'').length >= 9;
    
    // CEO marks ALL 5 as: Email, Name, Photo, ID, Licence, Video? Your CEO shows PHOTO, ID, LICENCE, VIDEO = 4 + Name/Email/Phone = 7?
    // But login requires 5: Email, Name, Photo, Phone, Video
    const checks = {
      email: hasEmail,
      name: hasName,
      photo: hasPhoto,
      phone: hasPhone && phoneLen,
      video: hasVideo,
      id: hasID,
      licence: hasLicence,
      approved: !!(real.isApproved || real.approved || v.isApproved || v.approved || real.status==='approved')
    };
    // For login, require at least Email+Name+Photo+Phone+Video (ID and Licence optional but CEO checks them)
    const ok = checks.email && checks.name && checks.photo && checks.phone && checks.video;
    return {ok, checks, data:real};
  }

  // 1. Check by UID in Firestore (this is where CEO shows data for Asabere Peter)
  if(uid){
    try{
      const snap = await fs.collection('nurses').doc(uid).get();
      if(snap.exists){
        const r = evaluate(snap.data());
        if(r.ok){ result={ok:true, data:r.data, checks:r.checks}; return result; }
        // Even if not full, save checks for debug
        result.checks = r.checks; result.data = r.data;
      }
    }catch(e){}
    try{
      const snap = await db.ref('nurses/'+uid).once('value');
      if(snap.exists()){
        const r = evaluate(snap.val());
        if(r.ok){ result={ok:true, data:r.data, checks:r.checks}; return result; }
        result.checks = r.checks;
      }
    }catch(e){}
  }

  // 2. Check Firestore by email query
  try{
    const q = await fs.collection('nurses').where('email','==', eLower).limit(1).get();
    if(!q.empty){
      const r = evaluate(q.docs[0].data());
      if(r.ok){ result={ok:true, data:r.data, checks:r.checks}; return result; }
      result.checks = r.checks;
    }
  }catch(e){}
  try{
    const q = await fs.collection('nurses').where('email','==', email.trim()).limit(1).get();
    if(!q.empty){
      const r = evaluate(q.docs[0].data());
      if(r.ok){ result={ok:true, data:r.data, checks:r.checks}; return result; }
    }
  }catch(e){}

  // 3. Check RTDB nurses by email scan
  try{
    const snap = await db.ref('nurses').orderByChild('email').equalTo(eLower).once('value');
    if(snap.exists()){
      let found=null;
      snap.forEach(ch=>{
        const r = evaluate(ch.val());
        if(r.ok) found={ok:true, data:r.data, checks:r.checks};
      });
      if(found) return found;
    }
  }catch(e){}

  // 4. Check allowedNurses / nurseRegistrations / etc (CEO may have approved there)
  const paths = [
    'allowedNurses/'+key,
    'nurseRegistrations/'+key,
    'nursesRegistrations/'+key,
    'nurse_registrations/'+key,
    'nurses-registration/'+key
  ];
  for(const p of paths){
    try{
      const snap = await db.ref(p).once('value');
      if(snap.exists()){
        const r = evaluate(snap.val());
        if(r.ok){ result={ok:true, data:r.data, checks:r.checks}; return result; }
      }
    }catch(e){}
  }

  // 5. Check Firestore allowedNurses
  try{
    const snap = await fs.collection('allowedNurses').doc(key).get();
    if(snap.exists){
      const r = evaluate(snap.data());
      if(r.ok){ result={ok:true, data:r.data, checks:r.checks}; return result; }
    }
  }catch(e){}
  try{
    const snap = await fs.collection('nurseRegistrations').doc(key).get();
    if(snap.exists){
      const r = evaluate(snap.data());
      if(r.ok){ result={ok:true, data:r.data, checks:r.checks}; return result; }
    }
  }catch(e){}

  // 6. Full scan of nurses node (last resort, like CEO)
  try{
    const snap = await db.ref('nurses').once('value');
    if(snap.exists()){
      let found=null;
      snap.forEach(ch=>{
        const v=ch.val()||{};
        const em=(v.email||v.profile?.email||'').toLowerCase();
        if(em===eLower){
          const r = evaluate(v);
          if(r.ok) found={ok:true, data:r.data, checks:r.checks};
        }
      });
      if(found) return found;
    }
  }catch(e){}

  return result; // will contain checks for debug
}

async function googleLogin(){
  showStatus('Checking...', true);
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});
    const result = await auth.signInWithPopup(provider);
    const user=result.user;
    const email=(user.email||'').toLowerCase().trim();
    
    const regCheck = await isNurseFullyRegistered(email, user.uid);
    if(!regCheck.ok){
      const c=regCheck.checks;
      showStatus('Missing: '+( !c.email?'Email ':'')+(!c.name?'Name ':'')+(!c.phone?'Phone ':'')+(!c.photo?'Photo ':'')+(!c.video?'Video':''), false);
      // Show detailed modal like your screenshot
      const missing=[];
      if(!c.email) missing.push('Email'); if(!c.name) missing.push('Name'); if(!c.phone) missing.push('Phone'); if(!c.photo) missing.push('Photo'); if(!c.video) missing.push('Video');
      if(confirm('Missing: '+missing.join(', ')+' - Go to registration to complete?')){
        location.href='nurses-registration.html?email='+encodeURIComponent(email)+'&missing='+missing.join(',');
      }else{
        await auth.signOut();
      }
      return;
    }
    // SUCCESS - Save session LONG (no 30min expiry)
    localStorage.setItem('lcg_logged_in','true');
    localStorage.setItem('lcg_role','nurse');
    localStorage.setItem('lcg_nurse_uid', user.uid);
    localStorage.setItem('uid', user.uid);
    localStorage.setItem('nurseEmail', email);
    localStorage.setItem('nurseName', regCheck.data.fullName||regCheck.data.name||user.displayName||'Nurse');
    localStorage.setItem('nursePhone', regCheck.data.phone||regCheck.data.phoneNumber||'');
    localStorage.setItem('nursePhotoURL', regCheck.data.photoUrl||regCheck.data.photo||user.photoURL||'');
    localStorage.setItem('nurseProfile', JSON.stringify(regCheck.data));
    // LONG SESSION - 7 days
    localStorage.setItem('lcg_session_expiry', Date.now()+7*24*60*60*1000+'');
    showStatus('Approved! All 5 verified. Welcome '+ (regCheck.data.fullName||'Nurse'), true);
    setTimeout(()=>location.href='nurses-dashboard.html',800);
  }catch(e){
    console.error(e);
    showStatus('Google login failed: '+e.message, false);
  }
}

async function emailLogin(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const pass=document.getElementById('pass').value.trim();
  if(!email||!pass){ showStatus('Enter email & password', false); return; }
  showStatus('Checking registration...', true);
  try{
    // First check if fully registered WITHOUT needing auth (like CEO does)
    const preCheck = await isNurseFullyRegistered(email);
    if(!preCheck.ok){
      const c=preCheck.checks;
      showStatus('X Missing ALL 5? CEO says APPROVED but login checks different field. Missing: '+( !c.phone?'Phone ':'')+(!c.video?'Video':''), false);
      // Still try to login to get UID, then re-check with UID
    }

    const cred = await auth.signInWithEmailAndPassword(email,pass);
    const regCheck = await isNurseFullyRegistered(email, cred.user.uid);
    if(!regCheck.ok){
      const c=regCheck.checks;
      let msg='Missing ALL 5?\\n';
      msg+='Email: '+(c.email?'OK':'MISSING')+'\\n';
      msg+='Name: '+(c.name?'OK':'MISSING')+'\\n';
      msg+='Phone: '+(c.phone?'OK':'MISSING')+'\\n';
      msg+='Photo: '+(c.photo?'OK':'MISSING')+'\\n';
      msg+='Video: '+(c.video?'OK':'MISSING')+'\\n';
      msg+='ID: '+(c.id?'OK':'missing')+' Licence: '+(c.licence?'OK':'missing');
      alert(msg);
      if(!c.phone || !c.video){
        if(confirm('Your CEO shows APPROVED but Phone/Video field name mismatch. Go to registration to fix field names?')){
          location.href='nurses-registration.html?email='+encodeURIComponent(email)+'&fix=phone_video';
          return;
        }
      }
      await auth.signOut();
      showStatus('Missing: Phone='+c.phone+' Video='+c.video+' - CEO APPROVED but login field name mismatch. Check console.', false);
      return;
    }
    // SUCCESS
    localStorage.setItem('lcg_logged_in','true');
    localStorage.setItem('lcg_role','nurse');
    localStorage.setItem('lcg_nurse_uid', cred.user.uid);
    localStorage.setItem('uid', cred.user.uid);
    localStorage.setItem('nurseEmail', email);
    localStorage.setItem('nurseName', regCheck.data.fullName||regCheck.data.name||'Nurse');
    localStorage.setItem('nursePhone', regCheck.data.phone||regCheck.data.phoneNumber||'');
    localStorage.setItem('nursePhotoURL', regCheck.data.photoUrl||regCheck.data.photo||'');
    localStorage.setItem('nurseProfile', JSON.stringify(regCheck.data));
    localStorage.setItem('lcg_session_expiry', Date.now()+7*24*60*60*1000+'');
    showStatus('APPROVED! All 5 verified - Welcome', true);
    setTimeout(()=>location.href='nurses-dashboard.html',600);
  }catch(e){
    showStatus(e.message, false);
  }
}
</script>
</body></html>
