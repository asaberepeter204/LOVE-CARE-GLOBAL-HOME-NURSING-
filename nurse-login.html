<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nurse Login - LOVE CARE GLOBAL</title>
<style>body{font-family:Inter,sans-serif;background:#eff6ff;margin:0}.card{max-width:420px;margin:30px auto;background:white;padding:22px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.1)}input{width:100%;padding:12px;border-radius:10px;border:1px solid #d1d5db;margin:6px 0 12px;box-sizing:border-box}.btn{width:100%;padding:12px;border-radius:12px;border:none;font-weight:800;cursor:pointer}.btn-blue{background:#2563eb;color:white}.btn-white{background:white;border:1px solid #d1d5db;margin-top:10px}</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg", authDomain: "web-care-618e8.firebaseapp.com", databaseURL: "https://web-care-618e8-default-rtdb.firebaseio.com", projectId: "web-care-618e8", storageBucket: "web-care-618e8.firebasestorage.app", messagingSenderId: "1062578660694", appId: "1:1062578660694:web:f94dfe12c929df05bce2f7" };
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getDatabase(app); const provider=new GoogleAuthProvider();

window.loginEmail=async()=>{
 const e=document.getElementById('email').value.trim(); const p=document.getElementById('pass').value;
 if(!e||!p){alert('Enter email & password');return;}
 try{
  let cred=await signInWithEmailAndPassword(auth,e,p);
  let snap=await get(ref(db,'nurses/'+cred.user.uid));
  if(!snap.exists()){ alert('No nurse profile - Register first'); location.href='nurse-registration.html'; return; }
  localStorage.setItem('currentNurseId',cred.user.uid);
  location.href='nurse-dashboard.html';
 }catch(err){alert(err.message)}
};

window.loginGoogle=async()=>{
 try{
  let result=await signInWithPopup(auth,provider);
  let uid=result.user.uid;
  let snap=await get(ref(db,'nurses/'+uid));
  if(snap.exists()){
    localStorage.setItem('currentNurseId',uid);
    location.href='nurse-dashboard.html';
  }else{
    // FIRST TIMER NURSE - POINT TO REGISTRATION
    localStorage.setItem('tempNurseUid',uid);
    localStorage.setItem('tempNurseEmail',result.user.email||'');
    localStorage.setItem('tempNurseName',result.user.displayName||'');
    alert('Welcome Nurse! First time - Complete your nurse registration (one time only)');
    location.href='nurse-registration.html?google=1';
  }
 }catch(err){alert('Google Failed: '+err.message)}
};
</script></head><body><div class="card"><h2>Nurse Login 👩‍⚕️ 🌍</h2><p style="font-size:12px;color:#6b7280">First time nurses via Google will be auto-sent to nurse registration - 8 Countries</p><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="btn btn-blue" onclick="loginEmail()">🔐 Nurse Login</button><button class="btn btn-white" onclick="loginGoogle()">G Google Login as Nurse</button><div style="text-align:center;margin-top:12px;font-size:12px"><a href="nurse-registration.html">New Nurse? Register Here</a> | <a href="index.html">Home</a></div></div></body></html>
