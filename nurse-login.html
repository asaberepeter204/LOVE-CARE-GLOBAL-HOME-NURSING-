<script>
// --- 30 MIN SESSION AUTO-LOGIN ---
(function(){
  const SESSION_MS = 30*60*1000;
  const expiry = localStorage.getItem('lcg_session_expiry');
  const role = localStorage.getItem('lcg_role');
  const logged = localStorage.getItem('lcg_logged_in');
  if(logged==='true' && expiry && Date.now() < parseInt(expiry)){
    const r = (role||'').toLowerCase();
    if(r==='client'){ window.location.replace('client-dashboard.html'); return; }
    if(r==='nurse'){ 
      // support both filenames
      window.location.replace('nurse-dashboard.html'); return; 
    }
  } else if(expiry && Date.now() >= parseInt(expiry)){
    // expired - clear
    localStorage.removeItem('lcg_logged_in');
    localStorage.removeItem('lcg_session_expiry');
  }
})();
function setSession(role){
  const now = Date.now();
  localStorage.setItem('lcg_login_time', now.toString());
  localStorage.setItem('lcg_session_expiry', (now + 30*60*1000).toString());
  localStorage.setItem('lcg_role', role);
  localStorage.setItem('lcg_logged_in','true');
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const provider=new GoogleAuthProvider();

window.toggleEye=(id,btn)=>{
  const input=document.getElementById(id);
  const openIcon=document.getElementById(`eye-${id}-open`);
  const closedIcon=document.getElementById(`eye-${id}-closed`);
  if(input.type==='password'){
    input.type='text';
    if(openIcon)openIcon.style.display='none';
    if(closedIcon)closedIcon.style.display='block';
  }else{
    input.type='password';
    if(openIcon)openIcon.style.display='block';
    if(closedIcon)closedIcon.style.display='none';
  }
}
window.getGPS=()=>{
  const nameEl=document.getElementById('gpsName');
  nameEl.value='Locating...';
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude; const lng=pos.coords.longitude;
    document.getElementById('lat').value=lat.toFixed(6); document.getElementById('lng').value=lng.toFixed(6);
    document.getElementById('mapPreview').style.display='block';
    document.getElementById('mapFrame').src=`https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed`;
    try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18`); const d=await r.json(); nameEl.value=d.display_name||`${lat},${lng}`;}catch{ nameEl.value=`${lat.toFixed(6)}, ${lng.toFixed(6)}`; }
  },()=>{nameEl.value='Enable GPS';},{enableHighAccuracy:true, timeout:15000});
}
window.loginWithGoogle=async()=>{
  const country=document.getElementById('country').value;
  if(!country){alert('Select country'); return;}
  try{
    const result=await signInWithPopup(auth,provider);
    const user=result.user;
    const lat=document.getElementById('lat').value; const lng=document.getElementById('lng').value; const gpsName=document.getElementById('gpsName').value;
    const snap=await getDoc(doc(db,'nurses',user.uid));
    if(!snap.exists()){
      await setDoc(doc(db,'nurses',user.uid),{uid:user.uid, fullName:user.displayName||'Nurse', email:user.email, phone:user.phoneNumber||'', country, countryName:document.getElementById('country').options[document.getElementById('country').selectedIndex].text, lat:lat?parseFloat(lat):null, lng:lng?parseFloat(lng):null, gpsActualName:gpsName, role:'nurse', isApproved:false, rating:0, reviewCount:0, createdAt:serverTimestamp(), provider:'google'});
    }else{
      await updateDoc(doc(db,'nurses',user.uid),{country, lat:lat?parseFloat(lat):null, lng:lng?parseFloat(lng):null, gpsActualName:gpsName, lastLoginAt:serverTimestamp()});
    }
    localStorage.setItem('lcg_nurse_uid',user.uid); setSession('nurse'); localStorage.setItem('currentNurseId',user.uid); localStorage.setItem('currentNurseCountry',country);
    location.href='nurse-dashboard.html';
  }catch(e){alert('Google login failed: '+e.message);}
}
window.loginEmail=async()=>{
  const country=document.getElementById('country').value; const email=document.getElementById('email').value.trim(); const pass=document.getElementById('password').value;
  const lat=document.getElementById('lat').value; const lng=document.getElementById('lng').value; const gpsName=document.getElementById('gpsName').value;
  if(!country){alert('Select country'); return;} if(!email||!pass){alert('Email & password required'); return;} if(!lat){getGPS(); alert('Wait for location'); return;}
  try{
    const cred=await signInWithEmailAndPassword(auth,email,pass);
    await updateDoc(doc(db,'nurses',cred.user.uid),{country, lat:parseFloat(lat), lng:parseFloat(lng), gpsActualName:gpsName, lastLoginAt:serverTimestamp()});
    localStorage.setItem('lcg_nurse_uid',cred.user.uid); setSession('nurse'); localStorage.setItem('currentNurseId',cred.user.uid); localStorage.setItem('currentNurseCountry',country);
    location.href='nurse-dashboard.html';
  }catch(e){alert(e.message);}
}
window.addEventListener('DOMContentLoaded',()=>{getGPS();});
</script>
<script>function openD(){document.getElementById('drawer').classList.add('open');document.getElementById('overlay').classList.add('show')}function closeD(){document.getElementById('drawer').classList.remove('open');document.getElementById('overlay').classList.remove('show')}</script>
