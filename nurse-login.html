<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nurse Login - Fixed setSession - LOVE CARE GLOBAL HOME NURSING</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0f0f0f;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{width:100%;max-width:420px;padding:16px}
.card{background:#1a1a1a;border-radius:20px;padding:22px;border:1px solid #2a2a2a;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.logo{width:48px;height:48px;border-radius:14px;background:#7c3aed;display:flex;align-items:center;justify-content:center;color:white;font-weight:900;margin:0 auto 10px;font-size:22px}
h1{text-align:center;font-weight:900;font-size:22px} .sub{text-align:center;font-size:11px;color:#9ca3af;margin:6px 0 14px}
label{font-size:11px;font-weight:800;margin:10px 0 5px;display:block;color:#d1d5db}
.inputWrap{position:relative}
input{width:100%;padding:12px 42px 12px 12px;border-radius:12px;border:1.5px solid #2a2a2a;background:#0f0f0f;color:white;font-size:13px;outline:none}
input:focus{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.eyeBtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:#1a1a1a;border:1px solid #2a2a2a;width:34px;height:34px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.7}
.btn{width:100%;padding:12px;border-radius:12px;font-weight:900;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;margin-top:10px}
.btnPurple{background:#7c3aed;color:white}.btnLight{background:#2a2a2a;border:1px solid #3a3a3a;color:#d1d5db}.btnGoogle{background:white;color:#111827}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="logo">👩‍⚕️</div>
<h1>Nurse Login</h1>
<p class="sub">LOVE CARE GLOBAL HOME NURSING • Fixed setSession is not defined • 8 Countries</p>

<button class="btn btnGoogle" onclick="googleLogin()">
<svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
Continue with Google
</button>

<div style="text-align:center;margin:12px 0;color:#6b7280;font-size:12px;font-weight:800">OR</div>

<label>Email *</label><input id="email" type="email" placeholder="nurse@email.com">
<label>Password - Eye Toggle Fading With Slash *</label>
<div class="inputWrap">
<input id="password" type="password" placeholder="Password - eye toggle fading drawing with slash line">
<button class="eyeBtn" type="button" onclick="toggleEye('password',this)">
<svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
<svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
</button>
</div>

<div style="background:#111;border:1px solid #2a2a2a;border-radius:10px;padding:10px;margin-top:10px;font-size:11px">
<div><b>GPS Actual Name:</b> <span id="gpsName" style="color:#22c55e">Loading actual name...</span></div>
<div><span id="latlng" style="font-size:10px;color:#6b7280"></span></div>
<button class="btn btnLight" onclick="getGPS()" type="button">📍 Enable GPS - Actual Name Required</button>
</div>

<button class="btn btnPurple" onclick="emailLogin()">🔐 Login - Professional + GPS Actual Name</button>
<a href="nurse-register.html" class="btn btnLight">📝 Create Account - Nurse - 8 Countries + GPS</a>
<div style="display:flex;gap:8px;margin-top:8px">
<a href="index.html" class="btn btnLight" style="flex:1">🏠 Home</a>
<a href="client-login.html" class="btn btnLight" style="flex:1">👤 Client Login</a>
</div>
<div id="msg" style="font-size:11px;margin-top:10px;text-align:center;color:#fca5a5"></div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentLat=null, currentLng=null, currentGPSName='';

// FIX - setSession IS NOW DEFINED - THIS WAS MISSING AND CAUSED YOUR SCREENSHOT ERROR
window.setSession = function(user, extraData={}){
  const uid=user.uid;
  const email=user.email||'';
  localStorage.setItem('lcg_nurse_uid', uid);
  localStorage.setItem('currentNurseId', uid);
  localStorage.setItem('lcg_nurse_email', email);
  localStorage.setItem('currentNurseEmail', email);
  localStorage.setItem('lcg_user_type', 'nurse');
  localStorage.setItem('currentUserType', 'nurse');
  if(currentGPSName){localStorage.setItem('lcg_nurse_gps_actual_name', currentGPSName);}
  if(currentLat){localStorage.setItem('lcg_nurse_lat', currentLat); localStorage.setItem('lcg_nurse_lng', currentLng);}
  console.log('setSession saved - Nurse:', uid, email, currentGPSName);
}

window.toggleEye=(id,btn)=>{
  const input=document.getElementById(id);
  const open=btn.querySelector('.eye-open');
  const closed=btn.querySelector('.eye-closed');
  if(input.type==='password'){input.type='text'; open.style.display='none'; closed.style.display='block'; btn.style.opacity='1';}
  else{input.type='password'; open.style.display='block'; closed.style.display='none'; btn.style.opacity='.7';}
}

window.getGPS=()=>{
  navigator.geolocation.getCurrentPosition(async pos=>{
    currentLat=pos.coords.latitude; currentLng=pos.coords.longitude;
    document.getElementById('latlng').textContent=`${currentLat.toFixed(6)}, ${currentLng.toFixed(6)}`;
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentLat}&lon=${currentLng}`);
      const d=await r.json();
      currentGPSName=d.display_name||`${currentLat},${currentLng}`;
      document.getElementById('gpsName').textContent=currentGPSName;
    }catch{
      currentGPSName=`${currentLat.toFixed(6)}, ${currentLng.toFixed(6)}`;
      document.getElementById('gpsName').textContent=currentGPSName;
    }
  },()=>{document.getElementById('msg').textContent='Enable GPS - Required for Nurse Login - GPS actual name';},{enableHighAccuracy:true});
}

window.emailLogin=async()=>{
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const msg=document.getElementById('msg');
  if(!email||!password){msg.textContent='Enter email and password - Eye toggle fading with slash line'; return;}
  try{
    msg.textContent='Logging in...';
    const cred=await signInWithEmailAndPassword(auth, email, password);
    const user=cred.user;
    const snap=await getDoc(doc(db,'nurses',user.uid));
    if(!snap.exists()){
      // If Auth exists but Firestore doc missing (your case - email already registered), create it now
      await setDoc(doc(db,'nurses',user.uid),{
        uid:user.uid,
        email:user.email,
        fullName:user.displayName||'Nurse',
        phone:user.phoneNumber||'',
        photoURL:user.photoURL||'',
        gpsActualName:currentGPSName||'',
        actualLocationName:currentGPSName||'',
        lat:currentLat||null,
        lng:currentLng||null,
        isApproved:false,
        isAvailable:false,
        rating:0,
        reviewCount:0,
        createdAt:serverTimestamp(),
        country:'GH',
        loginMethod:'email'
      },{merge:true});
    }
    setSession(user);
    msg.textContent='✅ Login success - Going to Nurse Heart Dashboard';
    setTimeout(()=>{location.href='nurse-dashboard.html';}, 800);
  }catch(e){
    console.log(e);
    if(e.code==='auth/user-not-found'){msg.textContent='User not found - Please register first - Nurse Register';}
    else if(e.code==='auth/wrong-password'){msg.textContent='Wrong password - Use eye toggle fading with slash line to check';}
    else if(e.code==='auth/invalid-credential'){msg.textContent='Invalid email or password - If you registered with Google, click Continue with Google - Not email login';}
    else{msg.textContent='Login failed: '+e.message;}
  }
}

window.googleLogin=async()=>{
  const msg=document.getElementById('msg');
  try{
    msg.textContent='Opening Google login...';
    const provider=new GoogleAuthProvider();
    const cred=await signInWithPopup(auth, provider);
    const user=cred.user;
    // Check if nurse doc exists, if not create - Fixes email already registered case
    const snap=await getDoc(doc(db,'nurses',user.uid));
    if(!snap.exists()){
      await setDoc(doc(db,'nurses',user.uid),{
        uid:user.uid,
        email:user.email,
        fullName:user.displayName||'Nurse',
        phone:user.phoneNumber||'',
        photoURL:user.photoURL||'',
        gpsActualName:currentGPSName||'',
        actualLocationName:currentGPSName||'',
        lat:currentLat||null,
        lng:currentLng||null,
        isApproved:false,
        isAvailable:false,
        rating:0,
        reviewCount:0,
        createdAt:serverTimestamp(),
        country:'GH',
        loginMethod:'google'
      },{merge:true});
    } else {
      // Update GPS actual name if available
      if(currentGPSName){
        await setDoc(doc(db,'nurses',user.uid),{gpsActualName:currentGPSName, actualLocationName:currentGPSName, lat:currentLat, lng:currentLng, lastGPSUpdate:serverTimestamp()},{merge:true});
      }
    }
    // NOW setSession IS DEFINED - FIXES YOUR SCREENSHOT ERROR
    setSession(user);
    msg.textContent='✅ Google login success - Going to Nurse Heart Dashboard - Group icon only here';
    setTimeout(()=>{location.href='nurse-dashboard.html';}, 800);
  }catch(e){
    console.log(e);
    msg.textContent='Google login failed: '+e.message+' - setSession is not defined FIXED now - Try again - Enable popup';
    alert('Google login failed: '+e.message+' - This was because setSession was not defined - Now fixed - Please try again - Allow popup');
  }
}

window.addEventListener('DOMContentLoaded', getGPS);
</script>
</body>
</html>
