<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nurse Login - LOVE CARE GLOBAL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:#0e0a1c;color:#e8e0ff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 380px at 14% 10%, rgba(76,29,149,.22) 0%, transparent 65%),linear-gradient(180deg,#0e0a1c 0%, #120e26 100%)}
.wrap{width:100%;max-width:440px}.card{background:rgba(28,18,56,.92);border:1px solid rgba(168,85,247,.18);border-radius:24px;padding:26px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.logo{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#d8b4fe);display:grid;place-items:center;margin:0 auto 12px;font-weight:900;font-size:18px;color:#1e0a3a}
h1{text-align:center;font-weight:800;font-size:22px;color:#f3e8ff}.sub{text-align:center;font-size:11px;color:#a78bfa;margin:6px 0 18px;letter-spacing:.5px;text-transform:uppercase}
label{font-size:11px;font-weight:800;margin:12px 0 6px;display:block;color:#c4b5fd;text-transform:uppercase;letter-spacing:.8px}
.inputWrap{position:relative;display:flex;align-items:center}
.inputWrap input{width:100%;padding:13px 44px 13px 14px;border-radius:14px;border:1.5px solid rgba(168,85,247,.18);background:rgba(14,10,28,.6);color:#f3e8ff;font-size:13px;outline:none}
input{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid rgba(168,85,247,.18);background:rgba(14,10,28,.6);color:#f3e8ff;font-size:13px;outline:none}
input:focus{border-color:#a855f7;background:rgba(14,10,28,.9);box-shadow:0 0 0 3px rgba(168,85,247,.18)}
.eyeBtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:rgba(76,29,149,.25);border:1px solid rgba(168,85,247,.25);width:36px;height:36px;border-radius:10px;cursor:pointer;display:grid;place-items:center;z-index:10;color:#d8b4fe;font-size:12px}
.btn{width:100%;padding:13px;border-radius:14px;font-weight:800;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;margin-top:12px;text-decoration:none;min-height:48px}
.btnPrimary{background:linear-gradient(135deg,#a855f7,#d8b4fe);color:#1e0a3a;box-shadow:0 8px 20px rgba(168,85,247,.35);font-size:14px}
.btnDark{background:rgba(14,10,28,.8);border:1px solid rgba(168,85,247,.18);color:#e9d5ff}
.btnGoogle{background:#FFFFFF;color:#1F1F1F;border:1px solid #747775;border-radius:20px;height:44px;font-family:Roboto,Inter,sans-serif;font-size:14px;font-weight:500;letter-spacing:0.25px;display:flex;align-items:center;justify-content:center;gap:12px}
.alert{padding:11px;border-radius:10px;font-size:11px;font-weight:700;margin:10px 0;border:1px solid;display:none;line-height:1.5;white-space:pre-wrap}
.alert.show{display:block}.alert-error{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.3);color:#fca5a5}
.alert-success{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.3);color:#86efac}
.alert-info{background:rgba(59,130,246,.14);border-color:rgba(59,130,246,.3);color:#93c5fd}
.divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:#6b5b8a;font-size:11px;font-weight:800;letter-spacing:1px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:rgba(168,85,247,.15)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap"><div class="card">
<div class="logo">N</div>
<h1>Nurse Login</h1>
<p class="sub">LOVE CARE GLOBAL - CEO APPROVAL REQUIRED</p>
<button class="btn btnGoogle" id="googleBtn" type="button">Continue with Google</button>
<div class="divider">OR</div>
<label>Email</label><input id="email" type="email" placeholder="nurse@email.com" autocomplete="email">
<label>Password</label><div class="inputWrap"><input id="password" type="password" placeholder="Enter password" autocomplete="current-password"><button class="eyeBtn" id="eyeBtn" type="button">Show</button></div>
<div id="msg" class="alert"></div>
<button class="btn btnPrimary" id="loginBtn" type="button">Login as Nurse</button>
<a href="nurse-registration.html" class="btn btnDark">No account? Register</a>
<a href="client-login.html" class="btn btnDark" style="font-size:11px">Client Login</a>
<div style="margin-top:12px;text-align:center;font-size:10px;color:#6b7280">CEO must approve in ceo-registration-center before login works</div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs, limit } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const rtdb=getDatabase(app);

function showMsg(t,type='alert-error'){const el=document.getElementById('msg');el.textContent=t;el.className='alert show '+type; el.scrollIntoView({behavior:'smooth', block:'center'});}
function sanitizeEmail(e){return e.toLowerCase().trim().replace(/[.#$@\[\]]/g,'_');}
function extractField(obj, keys){
  if(!obj) return null;
  for(const k of keys){const v=obj[k]; if(v && typeof v==='string' && v.trim().length>3) return v.trim();}
  return null;
}

async function checkNurseCompleteAndApproved(uid, email){
  let merged={}; let found=false;
  const eLower=(email||'').toLowerCase().trim();
  const emailKey=sanitizeEmail(eLower);
  
  function mergeData(newData){
    if(newData && typeof newData==='object'){
      merged={...merged, ...newData};
      found=true;
    }
  }
  
  try{const s=await getDoc(doc(db,'nurses',uid)); if(s.exists()){mergeData(s.data());}}catch{}
  if(eLower){
    try{
      const q=query(collection(db,'nurses'),where('email','==',eLower),limit(1)); 
      const qs=await getDocs(q); 
      if(!qs.empty){mergeData(qs.docs[0].data());}
    }catch{}
  }
  try{const s=await get(ref(rtdb,'nurses/'+uid)); if(s.exists()){mergeData(s.val());}}catch{}
  if(eLower){
    try{const s=await get(ref(rtdb,'allowedNurses/'+emailKey)); if(s.exists()){mergeData(s.val());}}catch{}
  }
  try{const s=await get(ref(rtdb,'allowedNursesByUid/'+uid)); if(s.exists()){mergeData(s.val());}}catch{}
  
  // NEW: Check ALL nurses collection for email match - if ANY nurse with this email is approved, approve
  try{
    const allNursesSnap=await get(ref(rtdb,'nurses'));
    if(allNursesSnap.exists()){
      allNursesSnap.forEach(ch=>{
        const v=ch.val()||{};
        const em=(v.email||'').toLowerCase();
        if(em===eLower){
          // Found a record with same email
          if(v.isApproved===true || v.approved===true || v.status==='approved'){
            mergeData(v);
            console.log('Found APPROVED nurse in nurses/'+ch.key+' with same email '+eLower);
          } else {
            // Even if not approved, merge to know it exists
            if(!found) mergeData(v);
          }
        }
      });
    }
  }catch{}
  
  // Also check ceoRegistrationCenter/nurses for any email match
  try{
    const ceoSnap=await get(ref(rtdb,'ceoRegistrationCenter/nurses'));
    if(ceoSnap.exists()){
      ceoSnap.forEach(ch=>{
        const v=ch.val()||{};
        const em=(v.email||'').toLowerCase();
        if(em===eLower && (v.isApproved===true || v.approved===true || v.status==='approved')){
          mergeData(v);
          console.log('Found APPROVED in ceoRegistrationCenter/nurses/'+ch.key);
        }
      });
    }
  }catch{}
  
  const otherPaths=[
    'pending_nurses/'+uid,
    'pendingNurses/'+uid,
    'allNurses/'+uid,
    'nurse_registrations/'+uid,
    'nurseApplications/'+uid,
    'nurseUsers/'+uid,
    'ceoNurseUpdates/'+uid,
    'ceoRegistrationCenter/nurses/'+uid,
    'verified_nurses/'+uid
  ];
  for(const path of otherPaths){
    try{
      const s=await get(ref(rtdb,path)); 
      if(s.exists()){mergeData(s.val());}
    }catch{}
  }
  
  try{const s=await getDoc(doc(db,'ceoRegistrationCenter/nurses/'+uid)); if(s.exists()){mergeData(s.data());}}catch{}
  
  let photo = extractField(merged, ['photoURL','photoUrl','photo','clientPhotoUrl','profilePhoto','avatar','image','nursePhoto']);
  let video = extractField(merged, ['videoURL','videoUrl','video','introVideo','videoFile','nurseVideo']);
  let phone = extractField(merged, ['phone','phoneNumber','clientPhone','mobile','tel','phoneNo','nursePhone']);
  
  let approved=false;
  let approvalSource='none';
  
  const approvedChecks=[
    {val: merged.isApproved, source: 'isApproved'},
    {val: merged.approved, source: 'approved'},
    {val: merged.canLogin, source: 'canLogin'},
    {val: merged.isVerified, source: 'isVerified'},
    {val: merged.ceoApproved, source: 'ceoApproved'},
    {val: merged.status==='approved', source: 'status=approved'},
    {val: merged.status==='Approved', source: 'status=Approved'},
  ];
  
  for(const check of approvedChecks){
    if(check.val===true){
      approved=true;
      approvalSource=check.source;
      break;
    }
  }
  
  if(!approved){
    try{
      const allowedSnap=await get(ref(rtdb,'allowedNurses/'+emailKey));
      if(allowedSnap.exists()){
        const av=allowedSnap.val()||{};
        if(av.isApproved===true || av.approved===true || av.status==='approved' || true){
          approved=true;
          approvalSource='allowedNurses/'+emailKey+' exists';
          mergeData(av);
        }
      }
    }catch{}
  }
  if(!approved){
    try{
      const allowedUidSnap=await get(ref(rtdb,'allowedNursesByUid/'+uid));
      if(allowedUidSnap.exists()){
        approved=true;
        approvalSource='allowedNursesByUid exists';
      }
    }catch{}
  }
  
  // FINAL FALLBACK: If allowedNurses/emailKey exists at all, consider approved (email whitelist = approved)
  if(!approved){
    try{
      const snap=await get(ref(rtdb,'allowedNurses/'+emailKey));
      if(snap.exists()){
        approved=true;
        approvalSource='allowedNurses email whitelist exists (fallback)';
      }
    }catch{}
  }
  
  const isRegistered = found || !!merged.email || !!merged.fullName || Object.keys(merged).length > 0;
  let missing=[];
  if(!photo) missing.push('photo');
  if(!phone) missing.push('phone');
  if(!video && !approved){ missing.push('video'); }
  
  const complete = missing.length===0 || (approved && photo && phone);
  return {complete, approved, missing, data:merged, photo, video, phone, approvalSource, isRegistered, found};
}

async function handleFailedLogin(user, missing, approved, reason, isRegistered=false){
  const email=user.email||'';
  const uid=user.uid||'';
  
  if(!approved){
    if(isRegistered){
      showMsg(`WAITING FOR CEO APPROVAL\n\nYou have registered as nurse.\nEmail: ${email}\n\nCEO has NOT approved you yet in ceo-registration-center.html\n\nReason: ${reason||'Pending CEO approval'}\n\nYour account is SAFE and saved. Wait for CEO approval, then login again.`, 'alert-error');
      try{ await signOut(auth); }catch{}
      localStorage.setItem('pendingApprovalEmail', email);
      localStorage.setItem('pendingApprovalUid', uid);
    } else {
      showMsg(`NOT A REGISTERED NURSE\n\nEmail ${email} never registered as nurse.\n\nYou must first register at nurse-registration.html with Photo + ID + Licence + Video.\n\nThis login attempt will be removed.\n\nReason: ${reason||'Not registered'}`, 'alert-error');
      try{
        await deleteUser(user);
      }catch(delErr){
        try{await signOut(auth);}catch{}
      }
      setTimeout(()=>{ window.location.href=`nurse-registration.html?error=not_registered&email=${encodeURIComponent(email)}`; }, 2500);
    }
  } else {
    showMsg(`LOGIN BLOCKED - Approved but ${missing.length? 'Missing: '+missing.join(', ')+'. ' : ''}Reason: ${reason||''}`, 'alert-error');
    try{ await signOut(auth); }catch{}
  }
}

function saveNurseSession(user, name){
  localStorage.setItem('lcg_nurse_uid',user.uid); localStorage.setItem('nurseUid',user.uid);
  localStorage.setItem('currentNurseId',user.uid); localStorage.setItem('nurseName',name);
  localStorage.setItem('lcg_nurse_email',user.email||''); localStorage.setItem('nurseEmail',user.email||'');
  localStorage.setItem('lcg_logged_in','true'); localStorage.setItem('lcg_role','nurse');
  localStorage.setItem('lcg_session_expiry',(Date.now()+24*60*60*1000).toString());
}
function redirectToDashboard(){ showMsg('Approved! Redirecting to dashboard...','alert-success'); setTimeout(()=>{window.location.replace('nurses-dashboard.html');}, 800);}

onAuthStateChanged(auth, async (user)=>{
  if(user && (localStorage.getItem('lcg_nurse_uid')||localStorage.getItem('lcg_role')==='nurse')){
    if(localStorage.getItem('lcg_client_uid')) return;
    const check=await checkNurseCompleteAndApproved(user.uid, user.email);
    if(!check.approved){
      if(check.isRegistered){
        showMsg(`Waiting for CEO approval - Your account exists but CEO hasn't approved yet.`, 'alert-info');
      } else {
        showMsg(`Not registered as nurse - Please register first`, 'alert-error');
        try{ await signOut(auth); }catch{}
      }
      return;
    }
    try{localStorage.setItem('nursePhoto',check.photo||''); localStorage.setItem('nurseVideo',check.video||''); localStorage.setItem('nursePhone',check.phone||'');}catch{}
    redirectToDashboard();
  }
});

async function isClientAccount(email){
  const eLower=email.toLowerCase().trim(); const key=sanitizeEmail(eLower);
  try{const s=await get(ref(rtdb,'allowedClients/'+key)); if(s.exists()) return true;}catch{}
  try{const s=await get(ref(rtdb,'clients')); if(s.exists()){let f=false; s.forEach(ch=>{const v=ch.val()||{}; const em=(v.email||'').toLowerCase(); if(em===eLower) f=true;}); if(f) return true;}}catch{}
  return false;
}

async function emailLogin(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  if(!email||!password){showMsg('Enter email and password','alert-error'); return;}
  const btn=document.getElementById('loginBtn');
  if(btn){ btn.disabled=true; btn.textContent='Checking...'; }
  try{
    showMsg('Checking CLIENT block + CEO approval...','alert-info');
    if(await isClientAccount(email)){showMsg('CLIENT email - Use Client Login','alert-error'); if(btn){btn.disabled=false; btn.textContent='Login as Nurse';} return;}
    const cred=await signInWithEmailAndPassword(auth,email,password);
    const user=cred.user;
    if(await isClientAccount(user.email||email)){showMsg('CLIENT account blocked','alert-error'); await signOut(auth); if(btn){btn.disabled=false; btn.textContent='Login as Nurse';} return;}
    
    const check=await checkNurseCompleteAndApproved(user.uid, user.email||email);
    
    if(!check.approved){
      await handleFailedLogin(user, check.missing, false, 'No CEO approval yet - CEO must approve in ceo-registration-center.html', check.isRegistered);
      if(btn){btn.disabled=false; btn.textContent='Login as Nurse';}
      return;
    }
    if(!check.complete){
      if(check.photo && check.phone){
        showMsg(`CEO Approved! Minor missing: ${check.missing.join(', ')}. Logging in anyway...`, 'alert-success');
      } else {
        await handleFailedLogin(user, check.missing, true, `Approved but missing: ${check.missing.join(', ')}`, check.isRegistered);
        if(btn){btn.disabled=false; btn.textContent='Login as Nurse';}
        return;
      }
    }
    let displayName=check.data.fullName||check.data.name||user.displayName||email.split('@')[0];
    saveNurseSession(user, displayName);
    localStorage.setItem('nursePhoto',check.photo||''); localStorage.setItem('nurseVideo',check.video||''); localStorage.setItem('nursePhone',check.phone||'');
    redirectToDashboard();
  }catch(e){
    let m=e.message; if(m.includes('invalid-credential')) m='Wrong email or password';
    if(m.includes('user-not-found')) m='Account not found - Please register';
    showMsg('Login failed: '+m,'alert-error');
    if(btn){btn.disabled=false; btn.textContent='Login as Nurse';}
  }
}

async function googleLogin(){
  const btn=document.getElementById('googleBtn');
  if(btn){ btn.disabled=true; btn.textContent='Opening Google...'; }
  try{
    showMsg('Opening Google...','alert-info');
    const provider=new GoogleAuthProvider();
    const cred=await signInWithPopup(auth,provider);
    const user=cred.user;
    if(await isClientAccount(user.email)){showMsg('CLIENT email - Use Client Login','alert-error'); await handleFailedLogin(user, ['client'], false, 'Client email blocked', false); if(btn){btn.disabled=false; btn.textContent='Continue with Google';} return;}
    
    showMsg('Checking photo, video, phone + CEO approval...','alert-info');
    const check=await checkNurseCompleteAndApproved(user.uid, user.email);
    if(!check.approved){
      await handleFailedLogin(user, check.missing, false, 'CEO approval pending - ceo-registration-center must approve', check.isRegistered);
      if(btn){btn.disabled=false; btn.textContent='Continue with Google';}
      return;
    }
    if(!check.complete && (!check.photo || !check.phone)){
      await handleFailedLogin(user, check.missing, true, 'Approved but missing photo/phone', check.isRegistered);
      if(btn){btn.disabled=false; btn.textContent='Continue with Google';}
      return;
    }
    const displayName=check.data.fullName||user.displayName||user.email.split('@')[0];
    saveNurseSession(user, displayName);
    localStorage.setItem('nursePhoto',check.photo||''); localStorage.setItem('nurseVideo',check.video||''); localStorage.setItem('nursePhone',check.phone||'');
    redirectToDashboard();
  }catch(e){showMsg('Google login failed: '+e.message,'alert-error'); if(btn){btn.disabled=false; btn.textContent='Continue with Google';}}
}

// Attach events - FIX FOR BUTTONS NOT WORKING
document.getElementById('loginBtn').addEventListener('click', emailLogin);
document.getElementById('googleBtn').addEventListener('click', googleLogin);
document.getElementById('eyeBtn').addEventListener('click', ()=>{
  const i=document.getElementById('password');
  const b=document.getElementById('eyeBtn');
  if(i.type==='password'){ i.type='text'; b.textContent='Hide'; }
  else { i.type='password'; b.textContent='Show'; }
});
document.getElementById('password').addEventListener('keypress', (e)=>{ if(e.key==='Enter') emailLogin(); });

// Expose for inline onclick fallback
window.emailLogin=emailLogin;
window.googleLogin=googleLogin;

</script>
</body>
</html>
