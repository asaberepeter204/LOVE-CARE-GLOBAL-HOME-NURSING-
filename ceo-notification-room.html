<!DOCTYPE html><html lang="en"><head><script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script src="onesignal-setup.js" defer></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEO Notification Room - LoveCare</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#0c0a1e;--card:#1a1633;--line:rgba(255,255,255,.08);--text:#ece8ff;--muted:#9a95b8;--gold:#facc15;--green:#22c55e;--red:#ef4444;--purple:#a78bfa;--blue:#60a5fa}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Instrument Sans,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:rgba(12,10,30,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.brand{font-family:Fraunces,serif;font-weight:800;font-size:18px}
.badge{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:11px;font-weight:700}
.list{padding:14px 18px 100px;display:flex;flex-direction:column;gap:10px;max-width:800px;margin:0 auto}
.notifCard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.notifCard.unread{border-left:4px solid var(--gold);background:linear-gradient(135deg,rgba(26,22,51,.9),rgba(45,30,10,.3))}
.btn{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font-size:11px;font-weight:700;cursor:pointer}
.btnGold{background:var(--gold);color:#000;border:0}
.toast{position:fixed;right:16px;bottom:20px;z-index:100;background:#1e1a38;border:1px solid var(--line);padding:12px 16px;border-radius:12px;font-size:12px;display:none}
</style></head><body>
<div class="top"><div><div class="brand">CEO Notification Room - Written Notifications</div><small style="color:var(--muted);font-size:10px">CEO receives all progress: pending, accepted, on the way, close, completed, withdrawals</small></div><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="badge" id="countBadge">0 Notifications</span><button class="badge" onclick="markAllRead()">Mark All Read</button><button class="badge" style="background:rgba(239,68,68,.15);color:#fca5a5" onclick="deleteAll()">Delete All</button><a href="ceo-dashboard.html" class="badge" style="text-decoration:none;color:var(--text)">CEO Dashboard</a><a href="ceo-bookings-progress.html" class="badge" style="text-decoration:none;background:rgba(34,197,94,.15);color:#86efac">Bookings Progress</a><a href="hr-page.html" class="badge" style="text-decoration:none;background:rgba(250,204,21,.15);color:#facc15">HR Withdrawals</a><button class="badge" onclick="location.reload()">Refresh</button></div></div>
<div style="padding:12px 18px;display:flex;gap:8px;overflow-x:auto;max-width:800px;margin:0 auto"><button class="btn" onclick="filterType('all')" id="f-all" style="background:var(--gold);color:#000">All</button><button class="btn" onclick="filterType('booking')" id="f-booking">Bookings</button><button class="btn" onclick="filterType('withdrawal')" id="f-withdrawal">Withdrawals</button><button class="btn" onclick="filterType('completed')" id="f-completed">Completed</button></div>
<div id="list" class="list"><div style="text-align:center;padding:40px;color:var(--muted)">Loading CEO notifications...</div></div>
<div id="toast" class="toast"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
let all=[]; let currentFilter='all';
function toastM(m){const e=document.getElementById('toast'); e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',3000);}
function filterType(t){currentFilter=t; document.querySelectorAll('[id^="f-"]').forEach(el=>{el.style.background='rgba(255,255,255,.06)'; el.style.color='var(--text)';}); document.getElementById('f-'+t).style.background='var(--gold)'; document.getElementById('f-'+t).style.color='#000'; render();}
function loadAll(){db.ref('ceoNotifications').limitToLast(100).on('value', snap=>{if(!snap.exists()){render(); return;} snap.forEach(ch=>{const v=ch.val(); if(!all.find(n=>n.id===ch.key)) all.push({...v,id:ch.key,source:'ceoNotifications'}); else {const idx=all.findIndex(n=>n.id===ch.key); all[idx]={...all[idx],...v};}}); all.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); render();}); db.ref('ceoNotificationRoom').limitToLast(100).on('value', snap=>{if(!snap.exists()){render(); return;} snap.forEach(ch=>{const v=ch.val(); if(!all.find(n=>n.id===ch.key)) all.push({...v,id:ch.key,source:'ceoNotificationRoom'}); else {const idx=all.findIndex(n=>n.id===ch.key); all[idx]={...all[idx],...v};}}); all.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); render();});}
function render(){const list=document.getElementById('list'); let filtered=all; if(currentFilter!=='all'){filtered=all.filter(n=> (n.type||'').toLowerCase().includes(currentFilter) || (n.title||'').toLowerCase().includes(currentFilter));} if(filtered.length===0){list.innerHTML=`<div style="text-align:center;padding:40px;color:var(--muted)">No ${currentFilter} notifications<br><small>CEO will receive written notifications for all booking progress</small></div>`; document.getElementById('countBadge').textContent='0 Notifications'; return;} document.getElementById('countBadge').textContent=filtered.length+' Notifications - '+filtered.filter(n=>!n.read).length+' Unread'; list.innerHTML=filtered.slice(0,100).map(n=>{const isUnread=!n.read; let typeText='BOOKING'; if((n.type||'').includes('withdrawal')) typeText='WITHDRAWAL'; else if((n.type||'').includes('completed')||(n.title||'').includes('Completed')) typeText='COMPLETED'; else if((n.title||'').includes('On The Way')) typeText='ON THE WAY'; else if((n.title||'').includes('Close')) typeText='CLOSE'; else if((n.title||'').includes('Accepted')) typeText='ACCEPTED'; const timeStr=n.createdAt?new Date(n.createdAt).toLocaleString('en-GH'):''; return `<div class="notifCard ${isUnread?'unread':''}"><div style="display:flex;justify-content:space-between;gap:10px"><div><span style="padding:4px 10px;border-radius:999px;font-size:9px;font-weight:800;background:rgba(168,85,247,.15);color:#c4b5fd">${typeText}</span> ${isUnread?'<span style="background:var(--gold);color:#000;padding:2px 8px;border-radius:999px;font-size:8px;font-weight:800">NEW</span>':''}<br><b style="font-size:13px">${n.title||'Notification'}</b><div style="font-size:12px;margin-top:6px;line-height:1.5">${n.message||''}</div><div style="font-size:10px;color:var(--muted);margin-top:8px">${timeStr} - ID: ${n.bookingId||n.withdrawalId||n.id.slice(-8)} ${n.nurseName?`- Nurse: ${n.nurseName}`:''} ${n.amount?`- Amount: GHS ${n.amount}`:''}</div></div><div style="display:flex;flex-direction:column;gap:6px"><button class="btn" onclick="markRead('${n.id}')">Read</button><button class="btn" onclick="deleteOne('${n.id}')" style="background:rgba(239,68,68,.1);color:#fca5a5">Delete</button></div></div></div>`;}).join('');}
async function markRead(id){const n=all.find(x=>x.id===id); if(!n) return; try{if(n.source==='ceoNotifications') await db.ref('ceoNotifications/'+id).update({read:true}); if(n.source==='ceoNotificationRoom') await db.ref('ceoNotificationRoom/'+id).update({read:true}); n.read=true; render(); toastM('Marked read');}catch(e){toastM(e.message);}}
async function markAllRead(){if(!confirm('Mark all as read?')) return; try{for(let n of all){if(!n.read){if(n.source==='ceoNotifications') await db.ref('ceoNotifications/'+n.id).update({read:true}).catch(()=>{}); if(n.source==='ceoNotificationRoom') await db.ref('ceoNotificationRoom/'+n.id).update({read:true}).catch(()=>{}); n.read=true;}} render(); toastM('All marked read');}catch(e){toastM(e.message);}}
async function deleteOne(id){if(!confirm('Delete this notification?')) return; try{await db.ref('ceoNotifications/'+id).remove().catch(()=>{}); await db.ref('ceoNotificationRoom/'+id).remove().catch(()=>{}); all=all.filter(n=>n.id!==id); render(); toastM('Deleted');}catch(e){toastM(e.message);}}
async function deleteAll(){if(!confirm(`Delete ALL ${all.length} notifications?`)) return; const c=prompt('Type DELETE to confirm:'); if(c!=='DELETE') return; try{await db.ref('ceoNotifications').remove(); await db.ref('ceoNotificationRoom').remove(); all=[]; render(); toastM('All deleted');}catch(e){toastM(e.message);}}
window.onload=()=>{loadAll();};
</script></body></html>
